/* ============================================================
   DATE RANGE — one control, used by both Insights and Reports
   ============================================================ */
const PRESETS = [
  {k:'month', label:'This month'},
  {k:'last',  label:'Last month'},
  {k:'3m',    label:'3 months'},
  {k:'6m',    label:'6 months'},
  {k:'12m',   label:'12 months'},
  {k:'fy',    label:'Financial year'},
  {k:'all',   label:'All time'}
];
function monthStart(offset){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth()-offset, 1).toISOString().slice(0,10);
}
function rangeFor(k){
  const d = new Date();
  if(k==='month') return [thisMonth()+'-01', today()];
  if(k==='last'){
    const s = monthStart(1);
    return [s, new Date(d.getFullYear(), d.getMonth(), 0).toISOString().slice(0,10)];
  }
  if(k==='3m')  return [monthStart(2), today()];
  if(k==='6m')  return [monthStart(5), today()];
  if(k==='12m') return [monthStart(11), today()];
  if(k==='fy'){
    const y = d.getMonth()>=3 ? d.getFullYear() : d.getFullYear()-1;
    return [y+'-04-01', today()];
  }
  const dates = DB.trips.map(t=>t.date).concat(DB.expenses.map(e=>e.date)).filter(Boolean).sort();
  return [dates[0] || monthStart(5), today()];
}
function setRange(k, target){
  const [f,t] = rangeFor(k);
  sub.from = f; sub.to = t; sub.preset = k;
  rerun(target);
}
function rerun(target){
  (target==='insights' ? viewInsights : viewReports)();
  animateCounts();
}
function rangeBar(target){
  return '<div class="range">'+
    '<div class="range-dates">'+
      '<label for="r_from">From</label>'+
      '<input id="r_from" type="date" value="'+esc(sub.from)+'" max="'+esc(sub.to)+'" '+
        'onchange="sub.from=this.value;sub.preset=\'\';rerun(\''+target+'\')">'+
      '<label for="r_to">To</label>'+
      '<input id="r_to" type="date" value="'+esc(sub.to)+'" min="'+esc(sub.from)+'" '+
        'onchange="sub.to=this.value;sub.preset=\'\';rerun(\''+target+'\')">'+
    '</div>'+
    '<div class="range-presets">'+PRESETS.map(pr=>
      '<button class="btn btn-sm'+(sub.preset===pr.k?' btn-primary':'')+'" '+
        'onclick="setRange(\''+pr.k+'\',\''+target+'\')">'+pr.label+'</button>').join('')+
    '</div>'+
  '</div>';
}
function defaultRange(k){
  if(!sub.from || !sub.to){ const [f,t]=rangeFor(k); sub.from=f; sub.to=t; sub.preset=k; }
}
function rangeCaption(){ return fdate(sub.from)+' to '+fdate(sub.to); }

/* ============================================================
   CHARTS — hand drawn as SVG so the app stays one offline file
   ============================================================ */
const SERIES = ['#E9A13B','#2C5D7C','#1C7A57','#B3372C','#8A5D12','#4A5568','#7C6A9E','#C97B4A'];

// Indian short form: 1.2L, 85k — keeps axis labels readable
function shortMoney(n){
  const v = Math.abs(Math.round(num(n)));
  const s = v>=10000000 ? (v/10000000).toFixed(v%10000000?1:0)+'Cr'
          : v>=100000   ? (v/100000).toFixed(v%100000?1:0)+'L'
          : v>=1000     ? (v/1000).toFixed(v%1000&&v<10000?1:0)+'k'
          : String(v);
  return (num(n)<0?'-₹':'₹')+s;
}
function monthsBack(n){
  const out=[], d=new Date();
  for(let i=n-1;i>=0;i--){
    const x=new Date(d.getFullYear(), d.getMonth()-i, 1);
    out.push(x.toISOString().slice(0,7));
  }
  return out;
}
function monthLabel(k){
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return M[parseInt(k.slice(5,7),10)-1];
}
function monthlySeries(n){ return seriesFor(monthsBack(n)); }

/* Every month between two dates, so charts follow whatever range is chosen */
function monthsBetween(from, to){
  const out=[];
  let y=parseInt(from.slice(0,4),10), m=parseInt(from.slice(5,7),10);
  const ey=parseInt(to.slice(0,4),10), em=parseInt(to.slice(5,7),10);
  let guard=0;
  while((y<ey || (y===ey && m<=em)) && guard++<400){
    out.push(y+'-'+String(m).padStart(2,'0'));
    m++; if(m>12){ m=1; y++; }
  }
  return out.length? out : [from.slice(0,7)];
}
function seriesFor(keys){
  const multiYear = new Set(keys.map(k=>k.slice(0,4))).size>1;
  return keys.map(k=>{
    const p = pnl(k+'-01', k+'-31');
    return {key:k, label: monthLabel(k)+(multiYear?' '+k.slice(2,4):''),
      freight:p.freight, cost:p.costs, profit:p.profit, trips:p.tripCount};
  });
}
function seriesForRange(from, to){ return seriesFor(monthsBetween(from, to)); }

/* Line chart with two series, drawn left to right on load */
function lineChart(rows, series, opts={}){
  const W=720, H=opts.height||230, L=52, R=14, T=14, B=30;
  const max = Math.max(1, ...rows.map(r=>Math.max(...series.map(s=>num(r[s.key])))));
  const step = rows.length>1 ? (W-L-R)/(rows.length-1) : 0;
  const x = i => L + i*step;
  const y = v => T + (H-T-B) * (1 - num(v)/max);
  const ticks = 4;

  let svg = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img">';
  for(let t=0;t<=ticks;t++){
    const v = max*t/ticks, yy = y(v);
    svg += '<line class="grid-line" x1="'+L+'" y1="'+yy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+yy.toFixed(1)+'"/>'+
           '<text class="axis-text" x="'+(L-8)+'" y="'+(yy+3.5).toFixed(1)+'" text-anchor="end">'+shortMoney(v)+'</text>';
  }
  const every = rows.length>13 ? Math.ceil(rows.length/12) : 1;
  rows.forEach((r,i)=>{
    if(i%every && i!==rows.length-1) return;
    svg += '<text class="axis-text" x="'+x(i).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle">'+esc(r.label)+'</text>';
  });
  series.forEach((s,si)=>{
    const pts = rows.map((r,i)=>x(i).toFixed(1)+','+y(r[s.key]).toFixed(1));
    if(s.fill && rows.length>1){
      svg += '<path d="M'+pts.join(' L')+' L'+x(rows.length-1).toFixed(1)+','+(H-B)+' L'+L+','+(H-B)+' Z" fill="'+s.color+'" opacity=".08"/>';
    }
    svg += '<polyline class="series-line" points="'+pts.join(' ')+'" stroke="'+s.color+'"'+
           (s.dash?' stroke-dasharray="6 5" style="animation:none"':'')+' style="animation-delay:'+(si*0.12)+'s"/>';
    rows.forEach((r,i)=>{
      svg += '<circle class="series-dot" cx="'+x(i).toFixed(1)+'" cy="'+y(r[s.key]).toFixed(1)+'" r="3.4" fill="'+s.color+'">'+
             '<title>'+esc(r.label)+': '+money(r[s.key])+'</title></circle>';
    });
  });
  svg += '</svg>';
  const legend = '<div class="legend">'+series.map(s=>
    '<span class="legend-item"><span class="legend-key" style="background:'+s.color+'"></span>'+esc(s.label)+'</span>').join('')+'</div>';
  return svg + legend;
}

/* Donut with a total in the middle */
function donutChart(items, centreLabel){
  const total = items.reduce((s,i)=>s+num(i.value),0);
  if(!total) return '';
  const S=190, r=68, cx=S/2, cy=S/2, circ=2*Math.PI*r;
  let acc=0;
  let svg='<svg class="chart" viewBox="0 0 '+S+' '+S+'" style="max-width:230px;margin:0 auto" role="img">';
  svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--line-soft)" stroke-width="22"/>';
  items.forEach((it,i)=>{
    const frac = num(it.value)/total;
    const len = frac*circ;
    const off = circ - len;
    svg += '<circle class="donut-seg" cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+(it.color||SERIES[i%SERIES.length])+'"'+
      ' stroke-width="22" stroke-dasharray="'+len.toFixed(2)+' '+(circ-len).toFixed(2)+'"'+
      ' style="--circ:'+circ.toFixed(2)+';--off:'+(-acc).toFixed(2)+';animation-delay:'+(i*0.09)+'s"'+
      ' transform="rotate(-90 '+cx+' '+cy+')">'+
      '<title>'+esc(it.label)+': '+money(it.value)+' ('+Math.round(frac*100)+'%)</title></circle>';
    acc += len;
  });
  svg += '<text class="donut-hole" x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-size="19" font-weight="600" fill="var(--ink)">'+shortMoney(total)+'</text>'+
         '<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--muted)" letter-spacing="1.2">'+esc((centreLabel||'TOTAL').toUpperCase())+'</text>'+
         '</svg>';
  const legend = '<div style="margin-top:14px">'+items.map((it,i)=>{
    const pct = Math.round(num(it.value)/total*100);
    return '<div style="display:flex;align-items:center;gap:9px;font-size:13px;padding:4px 0">'+
      '<span class="legend-key" style="background:'+(it.color||SERIES[i%SERIES.length])+';height:9px;width:9px;border-radius:50%"></span>'+
      '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(it.label)+'</span>'+
      '<span class="num" style="margin-left:auto;color:var(--muted)">'+money(it.value)+'</span>'+
      '<span class="num" style="width:38px;text-align:right;font-weight:600">'+pct+'%</span></div>';
  }).join('')+'</div>';
  return svg + legend;
}

/* Horizontal bars */
function barList(items, opts={}){
  const max = Math.max(1, ...items.map(i=>Math.abs(num(i.value))));
  return items.map((it,i)=>{
    const pct = Math.abs(num(it.value))/max*100;
    const col = it.color || (opts.color || SERIES[0]);
    return '<div class="bar-row">'+
      '<div class="bar-head"><span class="bar-name">'+esc(it.label)+'</span>'+
        '<span class="bar-val">'+(it.display || money(it.value))+'</span></div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+pct.toFixed(1)+'%;background:'+col+';animation-delay:'+(i*0.06)+'s"></div></div>'+
      (it.note?'<div class="hint" style="margin-top:4px">'+esc(it.note)+'</div>':'')+
    '</div>';
  }).join('');
}

/* Tiny sparkline for the KPI tiles */
function spark(values, color){
  const W=88,H=26,max=Math.max(1,...values.map(Math.abs)),min=Math.min(0,...values);
  const span=(max-min)||1;
  const step=values.length>1?W/(values.length-1):0;
  const pts=values.map((v,i)=>(i*step).toFixed(1)+','+(H-((v-min)/span)*H).toFixed(1));
  return '<svg class="kpi-spark" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" aria-hidden="true">'+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/></svg>';
}

/* KPI tile. Numbers count up once the view settles. */
function kpi(label, value, opts={}){
  const fmt = opts.fmt||'money';
  const shown = fmt==='money'? money(0) : fmt==='pct'? '0%' : '0';
  return '<div class="kpi"><div class="kpi-label">'+esc(label)+'</div>'+
    '<div class="kpi-value'+(opts.tone==='pos'?' money-pos':opts.tone==='neg'?' money-neg':'')+
      '" data-count="'+num(value)+'" data-fmt="'+fmt+'">'+shown+'</div>'+
    '<div class="kpi-foot">'+
      (opts.note?'<span>'+esc(opts.note)+'</span>':'')+
      (opts.trend!=null && isFinite(opts.trend)?'<span class="trend '+(opts.trend>=0?'trend-up':'trend-down')+'">'+
        (opts.trend>=0?'▲':'▼')+' '+Math.abs(Math.round(opts.trend))+'%</span>':'')+
      (opts.spark?spark(opts.spark, opts.sparkColor||'var(--amber)'):'')+
    '</div></div>';
}

function fmtBy(mode, v){
  if(mode==='pct')   return Math.round(v)+'%';
  if(mode==='plain') return Math.round(v).toLocaleString('en-IN');
  if(mode==='one')   return (Math.round(v*10)/10).toLocaleString('en-IN');
  return money(v);
}
function animateCounts(){
  const els = document.querySelectorAll('[data-count]');
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  els.forEach(el=>{
    const to = parseFloat(el.dataset.count)||0, mode = el.dataset.fmt||'money';
    if(still || !window.requestAnimationFrame){ el.textContent = fmtBy(mode,to); return; }
    const t0 = performance.now(), dur = 620;
    (function tick(t){
      const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3);
      el.textContent = fmtBy(mode, to*e);
      if(p<1) requestAnimationFrame(tick); else el.textContent = fmtBy(mode,to);
    })(t0);
  });
}
function pctChange(now, before){
  if(!before) return null;
  return (now-before)/Math.abs(before)*100;
}

/* ============================================================
   GOOGLE DRIVE SYNC
   Saves your data as one file inside a "Maa Vandana Logistics"
   folder in your own Google Drive. Uses the drive.file scope,
   which means this app can only ever touch the files it made —
   it cannot see anything else in your Drive.
   ============================================================ */
const FOLDER_NAME = 'Maa Vandana Logistics';
const FILE_NAME   = 'maa-vandana-data.json';
const SCOPE       = 'https://www.googleapis.com/auth/drive.file';

const CLOUD = {
  clientId: localStorage.getItem('mvl_client_id') || '',
  token:'', tokenClient:null, folderId:'', fileId:'',
  state:'off',        // off | ready | connecting | on | syncing | error
  message:'', lastSync: localStorage.getItem('mvl_last_sync') || '', pushTimer:null
};

function cloudSet(state, message){
  CLOUD.state = state; CLOUD.message = message || '';
  const pill = $('#cloudPill'); if(!pill) return;
  if(state==='off'){ pill.hidden = true; return; }
  pill.hidden = false;
  const map = {
    ready:   ['',     'Not connected'],
    connecting:['busy','Connecting…'],
    syncing: ['busy', 'Saving to Drive…'],
    on:      ['on',   CLOUD.lastSync ? 'Saved to Drive' : 'Connected'],
    error:   ['bad',  'Sync problem']
  };
  const [cls, label] = map[state] || ['',''];
  pill.className = 'cloud-pill '+cls;
  pill.innerHTML = '<span class="cloud-dot"></span><span>'+esc(label)+'</span>';
  pill.title = CLOUD.message || label;
  if(route==='settings') viewSettings();
}

function cloudReady(){ return CLOUD.state==='on' || CLOUD.state==='syncing'; }
function isLocalFile(){ return location.protocol === 'file:'; }

/* Load Google's sign-in library, once */
function loadGIS(){
  return new Promise((resolve, reject)=>{
    if(window.google && window.google.accounts) return resolve();
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true;
    s.onload = resolve;
    s.onerror = ()=>reject(new Error('Could not reach Google. Check your internet connection.'));
    document.head.appendChild(s);
  });
}

async function cloudConnect(interactive){
  if(!CLOUD.clientId){ cloudSet('off'); return; }
  if(isLocalFile()){
    cloudSet('error','Google sign-in does not work on a file opened from your computer. The app needs to be on a web address.');
    return;
  }
  try{
    cloudSet('connecting');
    await loadGIS();
    if(!CLOUD.tokenClient){
      CLOUD.tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLOUD.clientId,
        scope: SCOPE,
        callback: (resp)=>{
          if(resp && resp.access_token){ CLOUD.token = resp.access_token; afterSignIn(); }
          else { cloudSet('error','Sign-in was not completed.'); }
        },
        error_callback: (err)=>{
          cloudSet('error', err && err.type==='popup_closed'
            ? 'Sign-in window was closed before finishing.'
            : 'Google refused the sign-in. Check that the web address is listed in your Google Cloud settings.');
        }
      });
    }
    CLOUD.tokenClient.requestAccessToken({prompt: interactive ? 'consent' : ''});
  }catch(e){ cloudSet('error', e.message); }
}

async function afterSignIn(){
  try{
    cloudSet('syncing');
    CLOUD.folderId = await ensureFolder();
    CLOUD.fileId   = await findFile();
    if(CLOUD.fileId){ await cloudPull(true); }
    else { await cloudPush(true); toast('Connected. Your data is now in Google Drive'); }
    cloudSet('on');
  }catch(e){ cloudSet('error', e.message); toast('Could not sync: '+e.message); }
}

/* Every Drive request goes through here, so an expired sign-in retries once */
async function drive(url, opts={}, retried){
  const r = await fetch(url, {...opts, headers:{...(opts.headers||{}), Authorization:'Bearer '+CLOUD.token}});
  if(r.status===401 && !retried){
    await new Promise(res=>{
      CLOUD.tokenClient.callback = resp=>{ CLOUD.token = resp.access_token || ''; res(); };
      CLOUD.tokenClient.requestAccessToken({prompt:''});
    });
    if(!CLOUD.token) throw new Error('Sign-in expired. Connect again from Settings.');
    return drive(url, opts, true);
  }
  if(!r.ok){
    let detail = '';
    try{ detail = (await r.json()).error.message; }catch(e){}
    throw new Error(detail || ('Drive returned error '+r.status));
  }
  return r;
}

async function ensureFolder(){
  const q = encodeURIComponent("name='"+FOLDER_NAME+"' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  const r = await drive('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id)&spaces=drive');
  const j = await r.json();
  if(j.files && j.files.length) return j.files[0].id;
  const c = await drive('https://www.googleapis.com/drive/v3/files?fields=id', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name:FOLDER_NAME, mimeType:'application/vnd.google-apps.folder'})
  });
  return (await c.json()).id;
}

async function findFile(){
  const q = encodeURIComponent("name='"+FILE_NAME+"' and '"+CLOUD.folderId+"' in parents and trashed=false");
  const r = await drive('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,modifiedTime)&spaces=drive');
  const j = await r.json();
  return j.files && j.files.length ? j.files[0].id : '';
}

async function cloudPull(onConnect){
  if(!CLOUD.fileId) return;
  const r = await drive('https://www.googleapis.com/drive/v3/files/'+CLOUD.fileId+'?alt=media');
  const remote = await r.json();
  const rTime = remote.updatedAt || '';
  const lTime = DB.updatedAt || '';
  const localEmpty = DB.trips.length===0 && DB.parties.length===0 && DB.trucks.length===0;

  if(localEmpty || rTime > lTime){
    if(!localEmpty && onConnect){
      return askWhichCopy(remote, rTime, lTime);
    }
    applyRemote(remote);
    toast('Loaded the latest data from Drive');
  } else if(lTime > rTime){
    await cloudPush(true);
  }
}

function applyRemote(remote){
  DB = Object.assign(JSON.parse(JSON.stringify(BLANK)), remote);
  reindex();
  localStorage.setItem(KEY, JSON.stringify(DB));
  applyBrand(); render();
}

let pendingRemote = null;
function askWhichCopy(remote, rTime, lTime){
  pendingRemote = remote;
  const count = o => (o.trips||[]).length+' trips, '+(o.parties||[]).length+' parties, '+(o.expenses||[]).length+' expenses';
  openModal({
    title:'Two copies found',
    body:'<p style="margin:0 0 14px;font-size:14.5px">The copy in Drive and the copy on this device do not match. Which one should be kept?</p>'+
      '<div class="card card-pad" style="margin-bottom:10px"><div class="stat-label">In Google Drive</div>'+
      '<div style="margin-top:5px">'+esc(count(remote))+'</div>'+
      '<div class="hint">Last saved '+(rTime?fdate(rTime.slice(0,10)):'date unknown')+'</div>'+
      '<button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="useDriveCopy()">Use the Drive copy</button></div>'+
      '<div class="card card-pad"><div class="stat-label">On this device</div>'+
      '<div style="margin-top:5px">'+esc(count(DB))+'</div>'+
      '<div class="hint">Last saved '+(lTime?fdate(lTime.slice(0,10)):'date unknown')+'</div>'+
      '<button class="btn btn-sm" style="margin-top:10px" onclick="useDeviceCopy()">Keep this device</button></div>'+
      '<div class="note" style="margin-top:12px">Nothing is overwritten until you choose. If you are unsure, close this and download a backup from Settings first.</div>'
  });
}
function useDriveCopy(){
  if(!pendingRemote) return closeModal();
  applyRemote(pendingRemote); pendingRemote=null; closeModal();
  cloudSet('on'); toast('Now using the Drive copy');
}
function useDeviceCopy(){
  pendingRemote=null; closeModal();
  DB.updatedAt = new Date().toISOString();
  cloudPush(true); toast('Kept this device and sent it to Drive');
}

async function cloudPush(now){
  if(!CLOUD.token || !CLOUD.folderId) return;
  clearTimeout(CLOUD.pushTimer);
  if(!now){ CLOUD.pushTimer = setTimeout(()=>cloudPush(true), 2500); return; }
  try{
    cloudSet('syncing');
    const content = JSON.stringify(DB);
    if(CLOUD.fileId){
      await drive('https://www.googleapis.com/upload/drive/v3/files/'+CLOUD.fileId+'?uploadType=media',
        {method:'PATCH', headers:{'Content-Type':'application/json'}, body:content});
    } else {
      const b = '-------mvl'+Date.now();
      const meta = {name:FILE_NAME, parents:[CLOUD.folderId]};
      const body = '--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+
                   '\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+content+'\r\n--'+b+'--';
      const r = await drive('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
        {method:'POST', headers:{'Content-Type':'multipart/related; boundary='+b}, body});
      CLOUD.fileId = (await r.json()).id;
    }
    CLOUD.lastSync = new Date().toISOString();
    localStorage.setItem('mvl_last_sync', CLOUD.lastSync);
    cloudSet('on');
  }catch(e){
    cloudSet('error', e.message);
  }
}

function cloudDisconnect(){
  confirmAsk('Disconnect Google Drive? Your data stays on this device and in Drive, it just stops syncing.', ()=>{
    if(CLOUD.token && window.google) try{ google.accounts.oauth2.revoke(CLOUD.token); }catch(e){}
    CLOUD.token=''; CLOUD.fileId=''; CLOUD.folderId='';
    cloudSet('ready'); toast('Disconnected from Drive');
  });
}

function saveClientId(){
  const id = val('g_client').trim();
  CLOUD.clientId = id;
  localStorage.setItem('mvl_client_id', id);
  if(id){ cloudSet('ready'); cloudConnect(true); }
  else { cloudSet('off'); toast('Google Drive turned off'); }
}

/* ============================================================
   START
   ============================================================ */
reindex();
if(!DB.seeded && DB.trips.length===0){ seed(); save(); }
applyBrand();
render();
if(CLOUD.clientId){ cloudSet('ready'); cloudConnect(false); }
window.addEventListener('online', ()=>{ if(cloudReady()) cloudPush(true); });
</script>
