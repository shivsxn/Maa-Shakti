<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <div class="brand-badge">MV</div>
        <div>
          <div class="brand-name" id="brandName">Maa Vandana<br>Logistics</div>
        </div>
      </div>
      <div class="brand-sub">Transport management</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="syncFoot">Version 8.35 &middot; 01 Sep 2026</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div>
        <h1 class="page-title" id="pageTitle">Dashboard</h1>
        <div class="page-sub" id="pageSub"></div>
      </div>
      <div class="topbar-right">
        <button class="bell" id="bellBtn" onclick="notifications()" aria-label="Notifications"></button>
        <button class="cloud-pill" id="syncPill" onclick="go('settings')" hidden></button>
        <div class="topbar-actions" id="pageActions"></div>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div class="gate" id="authGate" hidden></div>
<div id="modalRoot"></div>
<div id="toast"></div>
<script>
/* ============================================================
   MAA VANDANA LOGISTICS — transport business manager
   All data is stored in this browser (localStorage). Use
   Settings > Backup regularly to keep a copy of your data.
   ============================================================ */

/* ---------- 1. Storage ---------- */
const KEY = 'mvl_db_v1';
const BLANK = {
  settings:{business:'Maa Vandana Logistics', owner:'', phone:'', address:'', gst:'', editLocked:false},
  trucks:[], parties:[], trips:[], ledger:[], expenses:[], drivers:[], driverTxns:[], places:[],
  shops:[], shopLedger:[], suppliers:[], supplierLedger:[], pods:{}, categories:[], assign:[],
  seeded:false
};
let DB = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return JSON.parse(JSON.stringify(BLANK));
    return Object.assign(JSON.parse(JSON.stringify(BLANK)), JSON.parse(raw));
  }catch(e){ return JSON.parse(JSON.stringify(BLANK)); }
}
function save(){
  reindex();
  DB.updatedAt = new Date().toISOString();
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ toast('Could not save. Your device storage may be full.'); }
  if(typeof syncReady==='function' && syncReady()) syncPush(false);
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ---------- 2. Helpers ---------- */
const $  = s => document.querySelector(s);
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
/* A consonant before the y takes -ies: one party, three parties. The
   plain +'s' had been printing "3 partys" on the dashboard and
   "7 entrys" wherever a list was counted. A vowel before it does not
   — days stays days. */
const plural = (n, word) => n+' '+(n===1 ? word
  : /[^aeiou]y$/i.test(word) ? word.slice(0,-1)+'ies' : word+'s');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function money(n, sign){
  const v = Math.round(num(n));
  const s = Math.abs(v).toLocaleString('en-IN');
  if(sign && v>0) return '+₹'+s;
  return (v<0?'−₹':'₹')+s;
}
/* The device's own date. toISOString() is UTC, which in India reads as
   yesterday until half past five in the morning — an expense entered
   early would have been filed on the wrong day. */
function today(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fdate(d){
  if(!d) return '—';
  const [y,m,dd] = d.split('-');
  const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return dd+' '+M[parseInt(m,10)-1]+' '+y;
}
function monthKey(d){ return (d||'').slice(0,7); }
function thisMonth(){ return today().slice(0,7); }
function monthName(k){
  if(!k) return '';
  const M=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return M[parseInt(k.slice(5,7),10)-1]+' '+k.slice(0,4);
}
const DATE_MIN = '2000-01-01', DATE_MAX = '3000-12-31';
/* Native date fields accept year 0002 if you type into them, which then
   reads as "expired 739186 days ago". Bound every one of them, wherever
   it was created, rather than hunting each field down. */
function clampDates(){
  document.querySelectorAll('input[type="date"]').forEach(el=>{
    if(!el.getAttribute('min')) el.setAttribute('min', DATE_MIN);
    if(!el.getAttribute('max')) el.setAttribute('max', DATE_MAX);
    manageDate(el);
  });
}
function sensibleDate(v){
  if(!v) return true;
  return v >= DATE_MIN && v <= DATE_MAX;
}

/* ============================================================
   DATE PICKER
   The browser's own calendar fights you over a year: half-typed,
   "202" counts as the year 202, and its year list jumps a decade
   at a time. This one owns both ends of that — the year box takes
   four digits and only acts once it has them, and the year list
   glides to wherever you are.
   ============================================================ */
const DP_MONTHS = ['January','February','March','April','May','June',
                   'July','August','September','October','November','December'];
let dpEl = null, dpBox = null, dpView = null;

function dpRoot(){
  if(!dpBox){
    dpBox = document.createElement('div');
    dpBox.className = 'dp';
    dpBox.hidden = true;
    dpBox.addEventListener('mousedown', e=>{
      if(e.target.tagName!=='INPUT' && e.target.tagName!=='SELECT') e.preventDefault();
    });
    document.body.appendChild(dpBox);
  }
  return dpBox;
}
function dpOpen(){ return dpBox && !dpBox.hidden; }
function dpHasFocus(){ return !!(dpBox && dpBox.contains(document.activeElement)); }
function dpLimits(){
  const min = (dpEl && dpEl.getAttribute('min')) || DATE_MIN;
  const max = (dpEl && dpEl.getAttribute('max')) || DATE_MAX;
  return {min, max, minY:parseInt(min.slice(0,4),10), maxY:parseInt(max.slice(0,4),10)};
}
function dpIso(y, m, d){
  return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
function openDatePicker(el){
  if(!el) return;
  dpEl = el;
  const v = /^\d{4}-\d{2}-\d{2}$/.test(el.value) ? el.value : today();
  dpView = {y:parseInt(v.slice(0,4),10), m:parseInt(v.slice(5,7),10)-1, mode:'days'};
  paintDatePicker();
}
function closeDatePicker(){
  if(dpBox) dpBox.hidden = true;
  dpEl = null;
}
function paintDatePicker(){
  const box = dpRoot();
  if(!dpEl){ box.hidden = true; return; }
  const L = dpLimits();
  box.innerHTML =
    '<div class="dp-head">'+
      '<button type="button" class="dp-nav" onclick="dpMove(-1)" title="Previous month">\u2039</button>'+
      '<select class="dp-month" onchange="dpSetMonth(this.value)">'+
        DP_MONTHS.map((n,i)=>'<option value="'+i+'"'+(i===dpView.m?' selected':'')+'>'+n+'</option>').join('')+
      '</select>'+
      '<input class="dp-year" id="dpYear" type="text" inputmode="numeric" maxlength="4" '+
        'autocomplete="off" value="'+dpView.y+'" title="Type a year" '+
        'oninput="dpYearTyped(this)" onkeydown="dpYearKey(event)" onblur="dpYearBlur(this)">'+
      '<button type="button" class="dp-chev'+(dpView.mode==='years'?' on':'')+'" '+
        'onclick="dpToggleYears()" title="Pick a year from the list">\u25BE</button>'+
      '<button type="button" class="dp-nav" onclick="dpMove(1)" title="Next month">\u203A</button>'+
    '</div>'+
    '<div id="dpBody"></div>'+
    '<div class="dp-foot">'+
      '<button type="button" onclick="dpPick(\''+today()+'\')">Today</button>'+
      '<button type="button" onclick="dpClear()">Clear</button>'+
      '<button type="button" class="dp-close" onclick="closeDatePicker()">Close</button>'+
    '</div>'+
    (dpView.mode==='years'
      ? '<div class="dp-hint">Scroll the list, or type the year in the box above.</div>'
      : '<div class="dp-hint">'+fdate(L.min)+' to '+fdate(L.max)+'</div>');
  box.hidden = false;
  dpPaintBody();
  placeDatePicker();
}
function dpPaintBody(){
  const body = document.getElementById('dpBody');
  if(!body || !dpEl) return;
  if(dpView.mode==='years'){ body.innerHTML = dpYearsHtml(); dpCentreYear(false); return; }
  body.innerHTML = dpDaysHtml();
}
function dpDaysHtml(){
  const L = dpLimits(), y = dpView.y, m = dpView.m, now = today();
  const lead = (new Date(y, m, 1).getDay()+6)%7;     /* weeks start on Monday */
  const days = new Date(y, m+1, 0).getDate();
  const cells = [];
  for(let i=0;i<lead;i++) cells.push('<span class="dp-blank"></span>');
  for(let d=1; d<=days; d++){
    const iso = dpIso(y, m, d);
    const off = iso < L.min || iso > L.max;
    cells.push('<button type="button" class="dp-day'+(iso===dpEl.value?' on':'')+(iso===now?' now':'')+'"'+
      (off?' disabled':'')+' onclick="dpPick(\''+iso+'\')">'+d+'</button>');
  }
  return '<div class="dp-dows">'+['Mo','Tu','We','Th','Fr','Sa','Su']
      .map(x=>'<span>'+x+'</span>').join('')+'</div>'+
    '<div class="dp-grid">'+cells.join('')+'</div>';
}
/* A window of years around the one in hand, rather than all thousand
   the field will accept: the list stays quick, and it follows whatever
   year is typed into the box, so nothing is out of reach. */
const DP_YEAR_SPAN = 60;
function dpYearsHtml(){
  const L = dpLimits(), out = [];
  const from = Math.max(L.minY, dpView.y - DP_YEAR_SPAN);
  const to   = Math.min(L.maxY, dpView.y + DP_YEAR_SPAN);
  for(let y=from; y<=to; y++){
    out.push('<button type="button" class="dp-year-btn'+(y===dpView.y?' on':'')+'" '+
      'onclick="dpPickYear('+y+')">'+y+'</button>');
  }
  return '<div class="dp-years" id="dpYears">'+out.join('')+'</div>';
}
/* the list glides to the year in hand instead of snapping to it */
function dpCentreYear(smooth){
  const list = document.getElementById('dpYears');
  if(!list) return;
  const on = list.querySelector('.dp-year-btn.on');
  if(!on) return;
  const top = on.offsetTop - list.clientHeight/2 + on.offsetHeight/2;
  if(smooth){ list.scrollTo({top, behavior:'smooth'}); return; }
  list.style.scrollBehavior = 'auto';
  list.scrollTop = top;
  requestAnimationFrame(()=>{ list.style.scrollBehavior = ''; });
}
function dpToggleYears(){
  dpView.mode = dpView.mode==='years' ? 'days' : 'years';
  paintDatePicker();
}
function dpPickYear(y){
  dpSetYear(y);
  dpView.mode = 'days';
  paintDatePicker();
}
function dpSetYear(y){
  const L = dpLimits();
  dpView.y = Math.min(L.maxY, Math.max(L.minY, y));
  const box = document.getElementById('dpYear');
  if(box && box.value !== String(dpView.y)) box.value = dpView.y;
  dpPaintBody();
}
function dpSetMonth(v){ dpView.m = parseInt(v,10)||0; dpPaintBody(); }
function dpMove(step){
  let m = dpView.m + step, y = dpView.y;
  if(m < 0){ m = 11; y--; }
  if(m > 11){ m = 0; y++; }
  const L = dpLimits();
  if(y < L.minY || y > L.maxY) return;
  dpView.y = y; dpView.m = m;
  paintDatePicker();
}
/* Four digits or nothing: a half-typed "20" must not become year 20 */
function dpYearTyped(inp){
  const clean = inp.value.replace(/[^0-9]/g,'').slice(0,4);
  if(clean !== inp.value) inp.value = clean;
  if(clean.length < 4) return;
  const L = dpLimits();
  const y = Math.min(L.maxY, Math.max(L.minY, parseInt(clean,10)));
  if(y === dpView.y) return;
  dpView.y = y;
  dpPaintBody();
  if(dpView.mode==='years') dpCentreYear(true);
}
function dpYearKey(e){
  if(e.key==='Enter'){ e.preventDefault(); dpYearTyped(e.target); dpView.mode='days'; paintDatePicker(); return; }
  if(e.key==='ArrowUp'){ e.preventDefault(); dpSetYear(dpView.y+1); if(dpView.mode==='years') dpCentreYear(true); return; }
  if(e.key==='ArrowDown'){ e.preventDefault(); dpSetYear(dpView.y-1); if(dpView.mode==='years') dpCentreYear(true); return; }
  if(e.key==='Escape'){ e.preventDefault(); closeDatePicker(); }
}
/* an unfinished year snaps back to the one on show, never to zero */
function dpYearBlur(inp){ if(dpView) inp.value = dpView.y; }
function dpPick(iso){
  const el = dpEl;
  if(!el) return;
  const L = dpLimits();
  if(iso < L.min || iso > L.max){ toast('That date is outside what this field accepts'); return; }
  closeDatePicker();
  el.value = iso;
  el.dataset.good = iso;
  delete el.dataset.pending;
  el.dispatchEvent(new Event('input', {bubbles:true}));
  dpCommitting = true;
  el.dispatchEvent(new Event('change', {bubbles:true}));
  dpCommitting = false;
}
function dpClear(){
  const el = dpEl;
  if(!el) return;
  closeDatePicker();
  el.value = '';
  el.dataset.good = '';
  delete el.dataset.pending;
  el.dispatchEvent(new Event('input', {bubbles:true}));
  dpCommitting = true;
  el.dispatchEvent(new Event('change', {bubbles:true}));
  dpCommitting = false;
}
function placeDatePicker(){
  if(!dpEl || !dpOpen()) return;
  const r = dpEl.getBoundingClientRect();
  const w = dpBox.offsetWidth || 288, h = dpBox.offsetHeight || 330;
  const left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
  let top = r.bottom + 6;
  if(top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
  dpBox.style.left = Math.round(left)+'px';
  dpBox.style.top  = Math.round(top)+'px';
}
/* every date field on the page hands its calendar over to ours */
const dpManaged = new WeakSet();
const DP_ICON_ZONE = 34;   /* the strip on the right that opens the calendar */
function manageDate(el){
  if(dpManaged.has(el)) return;
  dpManaged.add(el);
  el.classList.add('dp-input');
  el.setAttribute('autocomplete','off');
  el.dataset.good = el.value || '';
  /* Typing goes to the field, as it always did in the browser's own date
     box and in the browser's own order. Only the icon opens the calendar. */
  el.addEventListener('mousedown', e=>{
    if(e.offsetX < el.clientWidth - DP_ICON_ZONE) return;   /* typing area */
    e.preventDefault();
    if(dpEl === el && dpOpen()) return closeDatePicker();
    el.focus();
    openDatePicker(el);
  });
  el.addEventListener('keydown', e=>{
    if(e.altKey && e.key==='ArrowDown'){ e.preventDefault(); openDatePicker(el); }
    else if(e.key==='Escape') closeDatePicker();
    /* Enter is how you say you have finished typing a date */
    else if(e.key==='Enter'){ closeDatePicker(); commitDate(el); }
  });
  /* tabbing away shuts it; a click into the year box does not, so the
     check waits a tick for the focus to land where it is going */
  el.addEventListener('blur', ()=>{
    commitDate(el);
    setTimeout(()=>{ if(dpEl === el && !dpHasFocus()) closeDatePicker(); }, 0);
  });
}

/* ------------------------------------------------------------
   A date box fires `change` the moment all three of its segments
   hold something, so a year typed digit by digit arrives as 0002,
   then 0020, then 0202 long before it is ever 2026. Every one of
   those is a change event, and a field whose handler saves and
   redraws — the delivery dates, the list filters, the report range
   — would rebuild the screen underneath the box being typed into,
   taking the half-typed year and the keyboard focus with it.

   So a typed date is held: the event is caught before it reaches
   the field and parked. It is released once, on the way out of the
   field, and only if what is there is a real date inside the
   field's own bounds. Picking from the calendar is a finished
   choice already and goes straight through.
   ------------------------------------------------------------ */
let dpCommitting = false;
function dateUsable(el){
  const v = el.value;
  if(!v) return true;                       /* cleared is a real edit too */
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
  const min = el.getAttribute('min') || DATE_MIN, max = el.getAttribute('max') || DATE_MAX;
  return v >= min && v <= max;
}
function isDateField(el){
  return !!el && el.tagName === 'INPUT' && el.type === 'date';
}
document.addEventListener('change', e=>{
  if(!isDateField(e.target) || dpCommitting) return;
  e.stopPropagation();                      /* held until the field is left */
  e.target.dataset.pending = '1';
}, true);
function commitDate(el){
  if(!el || !el.dataset.pending) return;
  delete el.dataset.pending;
  /* typed back to what it already was: no edit, so nothing to redraw */
  if(el.value === (el.dataset.good || '')) return;
  if(!dateUsable(el)){
    const min = el.getAttribute('min') || DATE_MIN, max = el.getAttribute('max') || DATE_MAX;
    toast('That date is outside '+fdate(min)+' to '+fdate(max));
    el.value = el.dataset.good || '';
    return;
  }
  el.dataset.good = el.value;
  dpCommitting = true;
  el.dispatchEvent(new Event('change', {bubbles:true}));
  dpCommitting = false;
}
/* Replacing markup that has not changed destroys live elements for no
   reason — the button a click is halfway through, most of all. */
function setHtml(el, html){
  if(el && el.innerHTML !== html) el.innerHTML = html;
}
document.addEventListener('mousedown', e=>{
  if(!dpOpen()) return;
  if(dpBox.contains(e.target) || e.target === dpEl) return;
  closeDatePicker();
}, true);
window.addEventListener('resize', placeDatePicker);
window.addEventListener('scroll', e=>{
  if(dpBox && dpBox.contains(e.target)) return;    /* scrolling the year list */
  placeDatePicker();
}, true);

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast ok'; t.textContent = msg;
  $('#toast').appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 2400);
}
function confirmAsk(msg, onYes, danger){
  openModal({
    wide:'ask',

}

/* Debounce: run fn once the person pauses typing, instead of on every keystroke */
let deferTimer;
function defer(fn){ clearTimeout(deferTimer); deferTimer = setTimeout(fn, 90); }

/* lookups — kept in an index so long lists stay fast */
let IDX = {truck:{}, party:{}, driver:{}};
function reindex(){
  IDX = {truck:{}, party:{}, driver:{}};
  DB.trucks.forEach(t=>IDX.truck[t.id]=t);
  DB.parties.forEach(p=>IDX.party[p.id]=p);
  DB.drivers.forEach(d=>IDX.driver[d.id]=d);
  IDX.shop = {}; (DB.shops||[]).forEach(s=>IDX.shop[s.id]=s);
  IDX.supplier = {}; (DB.suppliers||[]).forEach(s=>IDX.supplier[s.id]=s);
  IDX.alloc = allocIndex();
}
// index first, with a safety net in case anything was added without a save
const truckById  = id => IDX.truck[id]  || DB.trucks.find(t=>t.id===id);
const partyById  = id => IDX.party[id]  || DB.parties.find(p=>p.id===id);
const driverById = id => IDX.driver[id] || DB.drivers.find(d=>d.id===id);
const shopById   = id => (IDX.shop||{})[id] || (DB.shops||[]).find(s=>s.id===id);
const shopName   = id => { const s=shopById(id); return s? s.name : '—'; };
const supplierById = id => (IDX.supplier||{})[id] || (DB.suppliers||[]).find(s=>s.id===id);
const supplierName = id => { const s=supplierById(id); return s? s.name : '—'; };
const truckName  = id => { const t=truckById(id); return t? t.number : '—'; };
const partyName  = id => { const p=partyById(id); return p? p.name : '—'; };
const driverName = id => { const d=driverById(id); return d? d.name : '—'; };

/* ---------- 3. Business calculations ---------- */

// Party outstanding = opening + freight billed + extra charges − payments received − advances − discounts
function partyBalance(pid){
  const p = partyById(pid); if(!p) return 0;
  let bal = num(p.opening);
  DB.trips.filter(t=>t.partyId===pid).forEach(t=>{ bal += tripFreightNet(t); bal -= tripDeducted(t); });
  DB.ledger.filter(l=>l.partyId===pid).forEach(l=>{ bal += l.type==='debit' ? num(l.amount) : -num(l.amount); });
  return bal;
}
// All party balances in a single pass — used by lists so they stay quick
function allBalances(){
  const m = {};
  DB.parties.forEach(p=>{ m[p.id] = num(p.opening); });
  DB.trips.forEach(t=>{ if(t.partyId in m) m[t.partyId] += tripFreightNet(t) - tripDeducted(t); });
  DB.ledger.forEach(l=>{ if(l.partyId in m) m[l.partyId] += l.type==='debit' ? num(l.amount) : -num(l.amount); });
  return m;
}
function totalReceivable(){
  const m = allBalances();
  return Object.values(m).reduce((s,b)=>s+Math.max(0,b),0);
}

// Driver payable = salary due entries − everything actually paid out
/* ============================================================
   DRIVER PAY AS A TRUCK COST
   A driver's wages belong to whichever truck they were driving
   at the time. Nothing new is recorded to make that work: the
   pay is the same driver account entry it always was, and the
   share each truck carries is worked out from how many days of
   the pay period the driver spent on it. So a truck's cost and
   the money that actually left the business can never disagree,
   and no figure is ever counted twice.
   ============================================================ */
const DAY_MS = 86400000;
function dayNum(iso){
  return Date.UTC(+iso.slice(0,4), +iso.slice(5,7)-1, +iso.slice(8,10)) / DAY_MS;
}
function addDays(iso, n){
  return new Date((dayNum(iso)+n) * DAY_MS).toISOString().slice(0,10);
}
function prevDay(iso){ return addDays(iso, -1); }
function monthFirst(iso){ return (iso||today()).slice(0,7)+'-01'; }
function monthLast(iso){
  const d = iso || today();
  return new Date(Date.UTC(+d.slice(0,4), +d.slice(5,7), 0)).toISOString().slice(0,10);
}
/* days two closed ranges share, counting both ends */
function overlapDays(aFrom, aTo, bFrom, bTo){
  const lo = Math.max(dayNum(aFrom), dayNum(bFrom));
  const hi = Math.min(dayNum(aTo),   dayNum(bTo));
  return hi < lo ? 0 : hi - lo + 1;
}
function spanDays(from, to){ return overlapDays(from, to, from, to); }

/* ---------- who was driving what, and when ---------- */
function assignments(driverId){
  return (DB.assign||[]).filter(a=>!driverId || a.driverId===driverId);
}
function truckAssignments(truckId){
  return (DB.assign||[]).filter(a=>a.truckId===truckId)
    .sort((x,y)=>(y.from||'').localeCompare(x.from||''));
}
function openAssignment(truckId){
  return (DB.assign||[]).find(a=>a.truckId===truckId && !a.to) || null;
}
/* The truck record still carries its current driver exactly as before;
   this keeps a dated log beside it so history survives a reassignment. */
function setTruckDriver(truckId, driverId, from){
  DB.assign = DB.assign || [];
  const day = from || today();
  const open = openAssignment(truckId);
  if(open && open.driverId === driverId){
    if(from && open.from !== from) open.from = from;     /* correcting the start */
    return;
  }
  if(open) open.to = prevDay(day);
  if(!driverId) return;
  /* a driver cannot be on two trucks at once, so moving them closes the old seat */
  (DB.assign||[]).forEach(a=>{
    if(a.driverId===driverId && !a.to && a.truckId!==truckId) a.to = prevDay(day);
  });
  DB.assign.push({id:uid(), truckId, driverId, from:day, to:''});
}
/* Trucks that already had a driver when this arrived get an open-ended
   seat, so their existing pay is attributed rather than lost. The start
   date can be corrected on the truck. */
function migrateAssignments(){
  DB.assign = DB.assign || [];
  let changed = false;
  DB.trucks.forEach(t=>{
    if(!t.driverId) return;
    if((DB.assign||[]).some(a=>a.truckId===t.id && a.driverId===t.driverId && !a.to)) return;
    DB.assign.push({id:uid(), truckId:t.id, driverId:t.driverId, from:'', to:''});
    changed = true;
  });
  if(changed) save();
}

/* ---------- the period a payment covers ---------- */
function payPeriod(txn){
  const d = txn.date || today();
  return {from: txn.from || monthFirst(d), to: txn.to || monthLast(d)};
}
/* One payment split across the trucks the driver drove during it. Days the
   driver was on no truck stay unallocated — they are a business cost, not
   any vehicle's. */
function paySlices(txn){
  if(!txn || txn.type==='due') return [];
  const total = num(txn.amount);
  if(total <= 0) return [];
  const per = payPeriod(txn);
  if(per.to < per.from) return [];
  const span = spanDays(per.from, per.to);
  if(!span) return [];
  const parts = [];
  assignments(txn.driverId).forEach(a=>{
    const aF = a.from || DATE_MIN, aT = a.to || DATE_MAX;
    const days = overlapDays(per.from, per.to, aF, aT);
    if(!days) return;
    parts.push({truckId:a.truckId, days,
      wFrom: per.from > aF ? per.from : aF,
      wTo:   per.to   < aT ? per.to   : aT});
  });
  if(!parts.length) return [];
  let acc = 0;
  const out = parts.map(x=>{
    const amount = Math.round(total * x.days / span);
    acc += amount;
    return {txnId:txn.id, driverId:txn.driverId, truckId:x.truckId, days:x.days,
            wFrom:x.wFrom, wTo:x.wTo, period:per, amount};
  });
  /* rounding must not leak a rupee, but only when the whole period was
     covered — a partly-assigned period is meant to come up short */
  const covered = parts.reduce((n,x)=>n+x.days, 0);
  if(covered === span && acc !== total){
    out.reduce((a,b)=>b.amount>a.amount?b:a).amount += total - acc;
  }
  return out;
}
let paySliceMemo = null;
function allPaySlices(){
  if(paySliceMemo && paySliceMemo.stamp === DB.updatedAt) return paySliceMemo.list;
  const list = [];
  (DB.driverTxns||[]).forEach(t=>paySlices(t).forEach(x=>list.push(x)));
  paySliceMemo = {stamp: DB.updatedAt, list};
  return list;
}
/* What a truck carried in driver wages, optionally within a date window.
   A window clips a slice by days, the same way the split itself works. */
function truckDriverPay(truckId, from, to){
  return allPaySlices().filter(s=>s.truckId===truckId).reduce((sum, s)=>{
    if(!from && !to) return sum + s.amount;
    const span = spanDays(s.wFrom, s.wTo);
    if(!span) return sum;
    const days = overlapDays(s.wFrom, s.wTo, from || DATE_MIN, to || DATE_MAX);
    return sum + (days ? Math.round(s.amount * days / span) : 0);
  }, 0);
}
/* the same slices a truck's wage total is built from, clipped to a window,
   so a breakdown can show its working rather than just the sum */
function truckPaySlices(truckId, from, to){
  return allPaySlices().filter(s=>s.truckId===truckId).map(s=>{
    const span = spanDays(s.wFrom, s.wTo);
    if(!from && !to) return Object.assign({}, s, {shown:s.amount, days:s.days, cFrom:s.wFrom, cTo:s.wTo});
    const days = span ? overlapDays(s.wFrom, s.wTo, from || DATE_MIN, to || DATE_MAX) : 0;
    /* days and share are clipped to the window asked for, so the dates shown
       beside them have to be the clipped ones or they will not agree */
    return Object.assign({}, s, {
      shown: span && days ? Math.round(s.amount*days/span) : 0, days,
      cFrom: (from && from > s.wFrom) ? from : s.wFrom,
      cTo:   (to   && to   < s.wTo)   ? to   : s.wTo});
  }).filter(s=>s.shown>0).sort((a,b)=>(a.wFrom||'').localeCompare(b.wFrom||''));
}
/* how one payment was divided, for showing on the driver's account */
function paySplitNote(txn){
  const parts = paySlices(txn);
  if(!parts.length) return '';
  return parts.map(x=>truckName(x.truckId)+' '+money(x.amount)+
    (parts.length>1||x.days<spanDays(payPeriod(txn).from,payPeriod(txn).to)
      ? ' ('+plural(x.days,'day')+')' : '')).join(' · ');
}

/* Salary and advance are two different things and are counted as two.
   They are only ever added together to state the total, never folded
   into one another. Anything older than the current entry types is kept
   visible as its own line rather than being quietly parcelled into one
   of them, so the three always reconcile. */
function driverPayBreak(did, from, to){
  const inR = d => (!from || d>=from) && (!to || d<=to);
  const out = {due:0, salary:0, advance:0, other:0, paid:0};
  (DB.driverTxns||[]).forEach(t=>{
    if(did && t.driverId!==did) return;
    if(!inR(t.date)) return;
    const amt = num(t.amount);
    if(t.type==='due'){ out.due += amt; return; }
    if(t.type==='salary') out.salary += amt;
    else if(t.type==='advance') out.advance += amt;
    else out.other += amt;
    out.paid += amt;
  });
  return out;
}

function driverBalance(did){
  let bal = 0;
  DB.driverTxns.filter(t=>t.driverId===did).forEach(t=>{
    bal += t.type==='due' ? num(t.amount) : -num(t.amount);
  });
  return bal;
}
function totalDriverPayable(){ return DB.drivers.reduce((s,d)=>s+Math.max(0,driverBalance(d.id)),0); }

// Profit & loss for a date range
function pnl(from, to){
  const inR = d => (!from || d>=from) && (!to || d<=to);
  const trips = DB.trips.filter(t=>inR(t.date));
  const freightBase = trips.reduce((s,t)=>s+num(t.freight),0);
  const hire    = trips.reduce((s,t)=>s+num(t.hire),0);
  const byCat = {};
  DB.expenses.filter(e=>inR(e.date)).forEach(e=>{ byCat[e.category]=(byCat[e.category]||0)+num(e.amount); });
  const expense = Object.values(byCat).reduce((a,b)=>a+b,0);
  const dp = driverPayBreak('', from, to);
  const driverPaid = dp.paid;      /* unchanged: the same total as before */
  /* Charges add to what you bill, deductions take away. Income is what the
     party is actually billed, so neither belongs in the cost column. */
  const charges    = trips.reduce((s,t)=>s+tripCharges(t),0);
  const deductions = trips.reduce((s,t)=>s+tripDeductions(t),0);
  const costs = hire + expense + driverPaid;

  /* Money actually in hand. Advances taken against a trip plus receipts
     entered in a party ledger. Advances live on the trip and are never
     copied into the ledger, so nothing is counted twice. Discounts and
     adjustments reduce a balance without money arriving, so they are left out. */
  const advances = trips.reduce((s,t)=>s+num(t.advance),0);
  const credits  = DB.ledger.filter(l=>inR(l.date) && l.type==='credit');
  const receipts = credits.filter(l=>l.mode!=='Adjustment').reduce((s,l)=>s+num(l.amount),0);
  const adjusted = credits.filter(l=>l.mode==='Adjustment').reduce((s,l)=>s+num(l.amount),0);
  const collected = advances + receipts;

  const freight = freightBase + charges - deductions;
  return {trips, tripCount:trips.length, freight, freightBase, charges, deductions,
    hire, byCat, expense, driverPaid,
    driverSalary:dp.salary, driverAdvance:dp.advance, driverOther:dp.other, costs,
    profit:freight-costs, advances, receipts, adjusted, collected, actual:collected-costs};
}

let modalOnOk = null;
let modalStack = [];

/* everything typed in the open modal, so it can be put back afterwards */
function snapshotModal(){
  const vals = {};
  document.querySelectorAll('#modalRoot input, #modalRoot select, #modalRoot textarea').forEach(el=>{
    if(!el.id && !el.name) return;
    const key = el.id || (el.name+':'+el.value);
    vals[key] = el.type==='checkbox' || el.type==='radio' ? el.checked : el.value;
  });
  return vals;
}
function restoreModal(vals){
  Object.entries(vals).forEach(([key, v])=>{
    const el = document.getElementById(key);
    if(el){ if(el.type==='checkbox'||el.type==='radio') el.checked = v; else el.value = v; return; }
    const [name, val] = key.split(':');
    const radio = document.querySelector('#modalRoot input[name="'+name+'"][value="'+val+'"]');
    if(radio) radio.checked = v;
  });
}

/* There were four widths — 640, 820, 1000 and 1240 — handed out by
   whoever wrote each form, so two dialogs holding the same kind of thing
   opened at different sizes. Three now, picked by what is inside: a form
   you read down, a form with a grid or a table in it, and the trip. */
function modalSize(wide){
  if(wide === 'ask') return 'ask';
  if(wide === 'full') return 'full';
  if(wide === 'xl' || wide === true || wide === 'lg') return 'lg';
  return 'md';
}
function openModal({title, body, okText='Save', okClass='btn btn-primary', onOk, wide}){
  modalOnOk = onOk;
  $('#modalRoot').innerHTML =
    '<div class="overlay" onclick="if(event.target===this)closeModal()">'+
      '<div class="modal modal-'+modalSize(wide)+'" role="dialog" aria-modal="true">'+
        '<div class="modal-head"><h2 class="modal-title">'+esc(title)+'</h2><button class="x" onclick="closeModal()" aria-label="Close">&times;</button></div>'+
        '<div class="modal-body">'+body+'</div>'+
        (onOk ? '<div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button>'+
        '<button class="'+okClass+'" onclick="modalOk()">'+esc(okText)+'</button></div>' : '')+
      '</div></div>';
  document.body.style.overflow='hidden';
  clampDates();
  if($('#docGrid')) paintDocs();
  if($('#truckDocs')) paintTruckDocs();
  if($('#f_advTotal')) recalcAdvance();
  const f = $('.modal-body input, .modal-body select, .modal-body textarea');
  if(f && window.innerWidth>760) f.focus();
}
function closeModal(){
  closeDatePicker(); comboClose();
  if(modalStack.length){          // step back to the form underneath
    const s = modalStack.pop();
    $('#modalRoot').innerHTML = s.html;
    restoreModal(s.vals);
    modalOnOk = s.onOk;
    clampDates();                 // the restored fields are new elements
    if(s.after) s.after();
    return;
  }
  $('#modalRoot').innerHTML=''; modalOnOk=null; document.body.style.overflow='';
}
function modalOk(){ if(modalOnOk) modalOnOk(); }
function val(id){ const el=document.getElementById(id); return el ? el.value.trim() : ''; }
function checked(name){ const el=document.querySelector('input[name="'+name+'"]:checked'); return el?el.value:''; }

/* ------------------------------------------------------------
   REQUIRED FIELDS
   A toast alone leaves you hunting for which box it meant. The
   field itself is ringed and named, and clears the moment it is
   filled in, so the warning never outstays the mistake.
   ------------------------------------------------------------ */
function fieldBox(id){
  const el = document.getElementById(id);
  return el && el.closest ? el.closest('.field') : null;
}
function markMissing(id, msg){
  const box = fieldBox(id);
  if(!box) return;
  box.classList.remove('field-bad');
  void box.offsetWidth;                       // replay the nudge on a second try
  box.classList.add('field-bad');
  const hint = box.querySelector('.truck-find-note');
  if(hint){ hint.textContent = ''; hint.className = 'hint truck-find-note'; }
  let note = box.querySelector('.field-bad-note');
  if(!note){
    note = document.createElement('span');
    note.className = 'field-bad-note';
    box.appendChild(note);
  }
  note.textContent = msg || 'This one is needed';
}
function clearMissing(id){
  const box = fieldBox(id);
  if(!box) return;
  box.classList.remove('field-bad');
  const note = box.querySelector('.field-bad-note');
  if(note) note.remove();
}
/* put the cursor where the first thing missing is */
function focusField(id){
  const el = document.getElementById(id+'_find') || document.getElementById(id);
  if(el && el.focus) el.focus();
}

/* The headline figures describe a month. Default to this one, but if
   nothing has happened in it yet — a quiet start, or trips entered with
   earlier dates — show the most recent month that does have activity,
   and say which month that is. A dashboard of zeros tells you nothing. */
function dashboardMonth(){
  const now = thisMonth();
  const has = k => DB.trips.some(t=>monthKey(t.date)===k) || DB.expenses.some(e=>monthKey(e.date)===k);
  if(has(now)) return now;
  const keys = [...new Set(DB.trips.map(t=>monthKey(t.date))
    .concat(DB.expenses.map(e=>monthKey(e.date))).filter(Boolean))].sort();
  return keys.length ? keys[keys.length-1] : now;
}

function heroStat(label, value, trend, invert, note, fmt, tone){

/* ============================================================
   INSIGHTS — the numbers behind the numbers
   ============================================================ */
function viewInsights(){
  defaultRange('6m');
  const series = seriesForRange(sub.from, sub.to);
  const inWindow = pnl(sub.from, sub.to);
  const all = pnl('2000-01-01','2099-12-31');
  const trips = DB.trips;
  const bmap = allBalances();
  const outstanding = Object.values(bmap).reduce((s,b)=>s+Math.max(0,b),0);

  const winPerTrip  = inWindow.tripCount ? inWindow.freight/inWindow.tripCount : 0;
  const winCostTrip = inWindow.tripCount ? inWindow.costs/inWindow.tripCount : 0;
  const winMargin   = inWindow.freight ? inWindow.profit/inWindow.freight*100 : 0;
  const billed      = all.freight + DB.parties.reduce((s,p)=>s+Math.max(0,num(p.opening)),0);
  const collected   = billed - outstanding;
  const collRate    = billed ? collected/billed*100 : 0;

  const unpaid = trips.filter(t=>tripStatus(t)!=='paid').sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const oldestDays = unpaid.length ? Math.round((Date.now()-new Date(unpaid[0].date).getTime())/86400000) : 0;

  const from = sub.from, to = sub.to;
  const win = trips.filter(t=>t.date>=from && t.date<=to);

  const perTruck = DB.trucks.map(tr=>{
    const ts = win.filter(t=>t.truckId===tr.id);
    const freight = ts.reduce((s,t)=>s+num(t.freight),0);
    const hire = ts.reduce((s,t)=>s+num(t.hire),0);
    const exp = DB.expenses.filter(e=>e.truckId===tr.id && e.date>=from && e.date<=to)
      .reduce((s,e)=>s+num(e.amount),0);
    const sal = truckDriverPay(tr.id, from, to);
    return {label:tr.number, trips:ts.length, value:freight-hire-exp-sal, freight};
  }).filter(x=>x.trips||x.value).sort((a,b)=>b.value-a.value);

  /* A route is only as good as what it leaves behind. Ranking on freight
     alone put the long hauls first however much they cost to run, so the
     hire and the expenses booked to each trip come off first. Indexed
     once rather than filtered per trip, because this runs over the whole
     book every time the range changes. */
  const expOnTrip = {};
  (DB.expenses||[]).forEach(e=>{
    if(e.tripId) expOnTrip[e.tripId] = (expOnTrip[e.tripId]||0) + num(e.amount);
  });
  const routes = {};
  win.forEach(t=>{
    const k = (t.from||'?')+' → '+(t.to||'?');
    const cost = num(t.hire) + (expOnTrip[t.id]||0);
    const r = routes[k] = routes[k] || {label:k, n:0, freight:0, cost:0, net:0};
    r.n++; r.freight += num(t.freight); r.cost += cost; r.net += num(t.freight) - cost;
  });
  const routeRows = Object.values(routes).sort((a,b)=>b.net-a.net).slice(0,6);

  const partyMix = DB.parties.map(p=>({label:p.name,

/* "Kanpur Nagar (Uttar Pradesh)" is one string in the record but two
   things on screen: the town you say out loud, and the state you only
   need when two towns share a name. */
function splitPlace(v){
  const m = String(v||'').trim().match(/^(.*?)\s*\(([^()]*)\)\s*$/);
  return m ? {name:m[1].trim(), region:m[2].trim()} : {name:String(v||'').trim(), region:''};
}
function routeCell(t){
  const a = splitPlace(t.from), b = splitPlace(t.to);
  const region = a.region && b.region
    ? (a.region === b.region ? a.region : a.region+' \u2192 '+b.region)
    : (a.region || b.region);
  const under = [];
  if(region)    under.push(esc(region));
  if(t.material) under.push(esc(t.material));
  return '<div class="route"><span>'+esc(a.name||'\u2014')+'</span>'+
      '<span class="route-arrow">\u2192</span><span>'+esc(b.name||'\u2014')+'</span></div>'+
    (under.length ? '<div class="route-sub">'+under.join(' \u00b7 ')+'</div>' : '');
}
function stageLine(t){
  const s = stageInfo(tripStage(t));
  return '<span class="stage"><span class="stage-dot '+s.chip.replace('chip-','dot-')+'"></span>'+
    esc(s.label)+'</span>';
}
/* Under the freight, the line that matters is what is still to come in.
   It stays muted grey: the payment chip beside it already carries the
   colour, and a red figure on every unpaid row would put the list back
   where it started. */
function balanceNote(t){
  const b = tripBalance(t);
  if(b > 0) return money(b)+' due';
  if(b < 0) return money(Math.abs(b))+' over';
  return num(t.freight) ? 'settled' : '';
}

function statusChip(s){
  if(s==='paid')    return '<span class="chip chip-green">Paid</span>';
  if(s==='partial') return '<span class="chip chip-amber">Part paid</span>';
  return '<span class="chip chip-red">Pending</span>';
}
function statusStamp(s){
  if(s==='paid')    return '<span class="stamp stamp-paid">Paid</span>';
  if(s==='partial') return '<span class="stamp stamp-part">Part paid</span>';
  return '<span class="stamp stamp-pending">Pending</span>';
}

/* Only this part is rebuilt while you type, so the search box keeps your cursor */
function renderTripList(){
  const box = $('#listBox'); if(!box) return;
  const lr = (sub.lr||'').toLowerCase().trim();
  const og = (sub.origin||'').toLowerCase().trim();
  const de = (sub.dest||'').toLowerCase().trim();
  /* Newest first, and within one date the one entered last comes first —
     after a day of loading you look at what you just typed, not at what
     you typed this morning. An id is Date.now() in base 36 followed by
     noise, and that timestamp is eight characters wide from 1972 to 2059,
     so comparing ids as text compares the moment they were created. That
     survives a restore, a repair and a sync merge, none of which keep the
     order of the array. Only this screen sorts this way. */
  let list = DB.trips.slice().sort((a,b)=>
    (b.date||'').localeCompare(a.date||'') || String(b.id).localeCompare(String(a.id)));
  if(sub.party)  list = list.filter(t=>t.partyId===sub.party);
  if(sub.truck)  list = list.filter(t=>t.truckId===sub.truck);
  if(sub.status) list = list.filter(t=>tripStatus(t)===sub.status);
  if(sub.stage==='podpending') list = list.filter(t=>['delivered','received'].includes(tripStage(t)));
  else if(sub.stage) list = list.filter(t=>tripStage(t)===sub.stage);
  if(sub.dFrom)  list = list.filter(t=>t.date>=sub.dFrom);
  if(sub.dTo)    list = list.filter(t=>t.date<=sub.dTo);
  if(lr) list = list.filter(t=>(t.lr||'').toLowerCase().includes(lr));
  if(og) list = list.filter(t=>(t.from||'').toLowerCase().includes(og));
  if(de) list = list.filter(t=>(t.to||'').toLowerCase().includes(de));
  const tot = list.reduce((s,t)=>s+num(t.freight),0);
  const totHire = list.reduce((s,t)=>s+num(t.hire),0);
  const totDue = list.reduce((s,t)=>s+Math.max(0, tripBalance(t)),0);
  const full = list.length;
  /* the strip above the table describes THIS list, filters and all */
  const running   = list.filter(t=>!t.podSubmittedAt).length;
  const settled   = list.filter(t=>tripCompleted(t)).length;
  const advOut    = list.reduce((s,t)=>s+tripAdvance(t),0);
  const strip = summary([
    {label:'Trips', value:full, fmt:'plain', icon:'trips',
     note: running+' still running \u00b7 '+settled+' settled'},
    {label:'Freight billed', value:tot, icon:'reports',
     note: full ? money(tot/full)+' a trip' : 'Nothing billed'},
    {label:'Advance given', value:advOut, icon:'expenses',
     note: tot ? Math.round(advOut/tot*100)+'% of freight' : 'None given'},
    {label:'Still to collect', value:totDue, icon:'parties',
     tone: totDue>0?'neg':'pos',
     note: totDue>0 ? 'Across '+plural(list.filter(t=>tripBalance(t)>0).length,'trip') : 'All settled'}
  ]);
  list = list.slice(0, pageLimit());
  tripNav = list.map(t=>t.id);

  box.innerHTML =
  (DB.trips.length===0
    ? empty('No trips yet','A trip records one load: which truck, which party, the route and the freight. Everything else in the app flows from here.',
        '<button class="btn btn-amber" onclick="tripForm()">+ Add your first trip</button>')
    : full===0 ? strip+empty('Nothing matches these filters','Widen the dates, or clear the filters to see every trip again.',
        '<button class="btn" onclick="clearTripFilters()">Clear all filters</button>')
    : strip+
      sec('Every load', plural(full,'trip')+(activeTripFilters()?' matching':''))+
      '<div class="card"><div class="tbl-wrap"><table class="trip-tbl">'+
      '<thead><tr><th class="c-date">Date</th><th class="c-route">Route</th>'+
      '<th class="c-party">Party</th><th class="c-truck">Truck</th>'+
      '<th class="c-money t-r">Freight</th><th class="c-pay">Payment</th>'+
      '<th class="c-del">Delivery</th><th class="c-act"></th></tr></thead><tbody>'+
      list.map(t=>{
        const bal = balanceNote(t), pods = podCount(t.id);
        /* The row is the button now, so it has to answer the keyboard too */
        const open = 'tripDetail(\''+t.id+'\')';
        return '<tr tabindex="0" style="cursor:pointer" onclick="'+open+'" '+
          'onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();'+open+'}">'+
          '<td data-label="Date" class="c-date cell-date">'+fdate(t.date)+
            (t.lr?'<div class="cell-lr">LR '+esc(t.lr)+'</div>':'')+'</td>'+
          '<td data-label="Route" class="c-route">'+routeCell(t)+'</td>'+
          '<td data-label="Party" class="c-party">'+esc(partyName(t.partyId))+'</td>'+
          '<td data-label="Truck" class="c-truck"><span class="num t-strong">'+esc(truckName(t.truckId))+'</span>'+
            (t.hire?'<div class="t-sub">Hire '+money(t.hire)+'</div>':'')+'</td>'+
          '<td data-label="Freight" class="c-money t-r">'+
            '<div class="money-main num">'+money(t.freight)+'</div>'+
            (bal?'<div class="money-sub num">'+bal+'</div>':'')+'</td>'+
          '<td data-label="Payment" class="c-pay">'+(tripCompleted(t)
            ? '<span class="chip chip-green">Completed</span>'+
              (tripLocked(t)?'<div class="t-sub lock-note">\u2713 Locked</div>':'')
            : statusChip(tripStatus(t)))+
            '<div class="stage-inline">'+stageLine(t)+'</div></td>'+
          '<td data-label="Delivery" class="c-del">'+stageLine(t)+
            (pods?'<div class="t-sub">'+plural(pods,'page')+' on file</div>':'')+'</td>'+
          '<td class="c-act t-r"><div class="row-actions">'+
            (tripLocked(t) ? ''
              : '<button class="icon-btn" title="Delete this trip" aria-label="Delete this trip" '+
                'onclick="event.stopPropagation();delTrip(\''+t.id+'\')">'+ICON_TRASH+'</button>')+
          '</div></td>'+
        '</tr>';}).join('')+
      '</tbody><tfoot><tr><th colspan="4">'+plural(full,'trip')+
        (activeTripFilters()?' matching':'')+' \u00b7 total freight</th>'+
      '<th class="t-r num" style="font-size:14px;color:var(--ink)">'+money(tot)+'</th>'+
      '<th colspan="3"><span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:12px">'+
        [totDue?money(totDue)+' still to collect':'', totHire?'Hire paid '+money(totHire):'']
          .filter(Boolean).join(' \u00b7 ')+'</span></th></tr></tfoot>'+
      '</table></div>'+moreBar(list.length, full, 'renderTripList')+'</div>');
}

let fuelDirty = false;
function fuelEdited(){ fuelDirty = true; recalcAdvance(); }
function recalcAdvance(){
  const amtEl = document.getElementById('f_fuelAmt');
  if(!amtEl){
    /* the details tab has freight but no advance boxes — still worth a total */
    const fr = document.getElementById('f_freight');
    if(fr && tripDraft) tripDraft.freight = num(fr.value);
    paintTripTotals();
    return;
  }
  const q = num(val('f_fuelQty')), r = num(val('f_fuelRate'));
  if(!fuelDirty && q>0 && r>0) amtEl.value = Math.round(q*r*100)/100;
  const hint = document.getElementById('fuelHint');
  if(hint){
    hint.innerHTML = fuelDirty
      ? 'Entered by hand. <a href="#" onclick="event.preventDefault();fuelDirty=false;recalcAdvance()">Use quantity × rate</a>'
      : (q>0 && r>0 ? 'Calculated as '+q+' × ₹'+r : 'Fill quantity and rate, or type the amount directly');
  }
  const total = num(val('f_advCash')) + num(amtEl.value);
  const tot = document.getElementById('f_advTotal');
  if(tot) tot.textContent = money(total);

  const lines = (tripDraft && tripDraft.lines) || [];
  const charges = lines.filter(x=>x.type==='charge').reduce((s,x)=>s+num(x.amount),0);
  const deducts = lines.filter(x=>x.type==='deduction').reduce((s,x)=>s+num(x.amount),0);
  const chgRow = document.getElementById('f_chgRow');
  const dedRow = document.getElementById('f_dedRow');
  const netRow = document.getElementById('f_netRow');
  if(chgRow) chgRow.hidden = !charges;
  if(dedRow) dedRow.hidden = !deducts;
  if(netRow) netRow.hidden = !(charges || deducts);
  const chgEl = document.getElementById('f_chgOut');
  const dedEl = document.getElementById('f_dedOut');
  if(chgEl) chgEl.textContent = '+ '+money(charges);
  if(dedEl) dedEl.textContent = '\u2212 '+money(deducts);

  const freight = document.getElementById('f_freight')
    ? num(val('f_freight'))
    : num(tripDraft && tripDraft.freight);
  const echo = document.getElementById('f_freightEcho');
  if(echo) echo.textContent = money(freight);
  const alloc = tripDraft && tripDraft.id ? allocatedTo(tripDraft.id) : 0;
  const allocRow = document.getElementById('f_allocRow');
  const allocOut = document.getElementById('f_allocOut');
  if(allocRow) allocRow.hidden = !alloc;
  if(allocOut) allocOut.textContent = money(alloc);
  const hireEl = document.getElementById('f_hire2');
  const hireDue = document.getElementById('f_hireDue');
  if(hireDue){
    const due = num(hireEl?hireEl.value:(tripDraft&&tripDraft.hire)) - num(val('f_hireAdvance'));
    hireDue.textContent = money(due);
    hireDue.className = 'num adv-total-value'+(due>0?' money-neg':'');
  }
  const billed = freight + charges - deducts;
  const billedEl = document.getElementById('f_freightNet');
  if(billedEl) billedEl.textContent = money(billed);
  const bal = billed - total - alloc;
  const balEl = document.getElementById('f_balance');
  const labEl = document.getElementById('f_balanceLabel');
  if(balEl){
    balEl.textContent = money(Math.abs(bal));
    balEl.className = 'num adv-total-value '+(bal>0?'money-neg':bal<0?'money-amber':'money-pos');
    if(labEl) labEl.textContent = bal<0 ? 'Advance exceeds freight by'
                                : bal===0 && freight ? 'Fully paid in advance'
                                : 'Balance pending';
  }
  const prev = document.getElementById('f_statusPreview');
  if(prev) prev.innerHTML = statusChip(tripStatus({id:(tripDraft&&tripDraft.id)||'',
    advCash:total, fuelAmt:0, freight:freight, lines:lines}));
  if(tripDraft){
    tripDraft.advCash = num(val('f_advCash'));
    tripDraft.fuelAmt = num(amtEl.value);
    tripDraft.freight = freight;
  }
  paintTripTotals();
  const warn = document.getElementById('brokWarn');
  if(warn){
    const over = billed > 0 && total > billed;
    warn.hidden = !over;
    warn.textContent = over
      ? 'The advance of '+money(total)+' is more than the '+money(billed)+' billed to the party.'
      : '';
  }
}

   TRIP SCREEN
   One screen for a trip, new or existing. Tab one holds the trip
   itself, tab two the money, tab three the paperwork. Values you
   have typed are carried across tab switches, so nothing is lost
   moving between them.
   ============================================================ */
let tripTab = 'details';
let tripDraft = null;
let tripNav = [];   // the ids the previous/next arrows step through

/* Shown when the trip runs on a market truck: who supplied it,
   what you owe them and what you have already paid at loading. */
function supplierBlock(t){
  const truck = truckById(t.truckId);
  const isMarket = truck && truck.type==='market';
  if(!isMarket && !num(t.hire) && !t.supplierId) return '';
  const sid = tripSupplier(t);
  const due = num(t.hire) - num(t.hireAdvance);
  return '<div class="adv-block" style="margin-top:16px">'+
    '<div class="adv-head">Market truck supplier</div>'+
    '<div class="form-grid three">'+
      qSelect('f_supplier','Supplier', 'supplier', sid)+
      fText('f_hire2','Hire to supplier (₹)', t.hire||'','number','min="0" step="1" oninput="syncHire()"')+
      fText('f_hireAdvance','Advance paid at loading (₹)', t.hireAdvance||'','number','min="0" step="1" oninput="recalcAdvance()"')+
    '</div>'+
    '<div class="adv-total adv-balance"><span>Balance due to supplier</span>'+
      '<span class="num adv-total-value'+(due>0?' money-neg':'')+'" id="f_hireDue">'+money(due)+'</span></div>'+
    (!sid && (isMarket||num(t.hire))
      ? '<div class="hint" style="margin-top:8px">Link a supplier and this hire lands in their ledger. '+
        'Add one under <b>Suppliers</b>.</div>' : '')+
    (sid ? '<div style="margin-top:12px"><button class="btn btn-sm" data-keep onclick="closeModal();supplierLedger(\''+sid+'\')">'+
      'Open '+esc(supplierName(sid))+'\u2019s ledger</button></div>' : '')+
  '</div>';
}
/* the hire box appears on both tabs — keep the two in step */
function syncHire(){
  const a = document.getElementById('f_hire'), b = document.getElementById('f_hire2');
  if(b && tripDraft) tripDraft.hire = num(b.value);
  if(a && b) a.value = b.value;
  recalcAdvance();
}

/* ------------------------------------------------------------
   TRIP EXPENSES
   Diesel bought on the road, a toll, loading labour. They are kept
   nowhere new: each line is an ordinary record in Expenses carrying
   the trip it belongs to, so the Expenses tab, the truck's net and
   the P&L all see it without anything being copied.
   ------------------------------------------------------------ */
let tripExpDraft = [];
function loadTripExpenses(tripId){
  tripExpDraft = tripId
    ? (DB.expenses||[]).filter(e=>e.tripId===tripId)
        .sort((a,b)=>(a.date||'').localeCompare(b.date||''))
        .map(e=>({id:e.id, date:e.date, category:e.category, note:e.note||'', amount:num(e.amount),
                  mode:e.mode||'Cash', shopId:e.shopId||''}))
    : [];
}
function tripExpenseTotal(){ return tripExpDraft.reduce((s,x)=>s+num(x.amount),0); }
function tripExpensesOf(tripId){
  return (DB.expenses||[]).filter(e=>e.tripId===tripId).reduce((s,e)=>s+num(e.amount),0);
}
function paintTripExpenses(){
  const box = document.getElementById('tripExpRows');
  if(!box) return;
  buildExpCatList();
  box.innerHTML = tripExpDraft.length
    ? tripExpDraft.map(tripExpenseRow).join('')
    : '<div class="hint exp-empty">Nothing booked yet \u2014 diesel bought on the road, tolls, loading '+
      'labour, a roadside repair. Each line is saved into the main <b>Expenses</b> tab against this trip '+
      'and this truck, so it is counted once and your profit stays right.</div>';
  clampDates();
  recalcTripExpenses();
}
/* One line of the trip's expenses. Taken on credit, it grows a shop
   picker underneath, exactly as the Expenses form does — and lands in
   that shop's ledger for the same reason: it is an ordinary expense. */
/* The row reads the way the line is spoken: what it was for, how much,
   how it was paid. Date and any detail sit on a quieter second line,
   because on nearly every line they are the trip's own date and nothing
   at all. The column header strip is gone with them \u2014 six shouted
   captions over one row of boxes was most of what made this cluttered. */
function tripExpenseRow(x, i){
  const credit = (x.mode||'Cash') === 'Credit';
  return '<div class="exp-entry'+(credit?' on-credit':'')+'" id="txrow'+i+'">'+
    '<div class="exp-row">'+
      '<input id="tx_c'+i+'" class="exp-what" list="expCatList" value="'+esc(x.category||'')+'" '+
        'placeholder="What for" oninput="readTripExpenses()">'+
      '<div class="exp-amt"><span class="exp-cur">\u20b9</span>'+
        '<input id="tx_a'+i+'" type="number" min="0" step="1" value="'+(num(x.amount)||'')+'" '+
          'placeholder="0" oninput="readTripExpenses()"></div>'+
      '<select id="tx_m'+i+'" class="exp-mode" onchange="tripExpMode('+i+')">'+
        EXP_MODES.map(m=>'<option value="'+m.v+'"'+(m.v===(x.mode||'Cash')?' selected':'')+'>'+
          esc(m.t)+'</option>').join('')+
      '</select>'+
      /* Credit needs a shop, so the picker rides in the same row rather
         than opening a block of its own underneath. A flex child that is
         hidden takes no room at all, which a grid track would. */
      '<div class="field exp-shop" id="txshop'+i+'"'+(credit?'':' hidden')+'>'+
        '<select id="tx_s'+i+'" aria-label="Shop this credit is with" '+
          'title="Taken on credit, so this goes into the shop\u2019s ledger as money you owe" '+
          'onchange="quickPick(\'tx_s'+i+'\',\'shop\')">'+
          quickOptions('shop').map(o=>'<option value="'+esc(o.v)+'"'+
            (String(o.v)===String(x.shopId||'')?' selected':'')+'>'+esc(o.t)+'</option>').join('')+
        '</select>'+
      '</div>'+
      '<button type="button" class="icon-btn" title="Remove this expense" '+
        'aria-label="Remove this expense" onclick="removeTripExpense('+i+')">'+ICON_TRASH+'</button>'+
    '</div>'+
    '<div class="exp-more">'+
      '<input id="tx_d'+i+'" type="date" value="'+esc(x.date||'')+'" onchange="readTripExpenses()">'+
      '<input id="tx_n'+i+'" value="'+esc(x.note||'')+'" placeholder="Any detail worth keeping" '+
        'oninput="readTripExpenses()">'+
    '</div>'+
  '</div>';
}
/* the shop picker appears and disappears in place, so nothing typed is lost */
function tripExpMode(i){
  readTripExpenses();
  const credit = (tripExpDraft[i]||{}).mode === 'Credit';
  const wrap = document.getElementById('txrow'+i);
  const shop = document.getElementById('txshop'+i);
  if(wrap) wrap.classList.toggle('on-credit', credit);
  if(shop) shop.hidden = !credit;
  if(!credit) clearMissing('tx_s'+i);
  else { const el = document.getElementById('tx_s'+i); if(el) el.focus(); }
}

function readTripExpenses(){
  const before = tripExpenseTotal();
  tripExpDraft = tripExpDraft.map((x,i)=>{
    const d=document.getElementById('tx_d'+i), c=document.getElementById('tx_c'+i),
          n=document.getElementById('tx_n'+i), a=document.getElementById('tx_a'+i),
          m=document.getElementById('tx_m'+i), sh=document.getElementById('tx_s'+i);
    const mode = m ? m.value : (x.mode || 'Cash');
    const shopId = sh && sh.value !== '__new' ? sh.value : (x.shopId || '');
    return {id:x.id||uid(), date:d?d.value:x.date, category:c?c.value.trim():x.category,
      note:n?n.value.trim():x.note, amount:a?num(a.value):num(x.amount),
      mode: mode, shopId: mode==='Credit' ? shopId : ''};
  });
  if(tripExpenseTotal() !== before) recalcTripExpenses();
  return tripExpDraft;
}
function addTripExpense(category){
  readTripExpenses();
  tripExpDraft.push({id:uid(), date:(tripDraft&&tripDraft.date)||today(), category:category||'',
    note:'', amount:0, mode:'Cash', shopId:''});
  paintTripExpenses();
  /* With the what-for already answered the only thing left is the
     figure, so that is where the cursor goes. */
  const i = tripExpDraft.length - 1;
  const el = document.getElementById(category ? 'tx_a'+i : 'tx_c'+i);
  if(el) el.focus();
}
function removeTripExpense(i){
  readTripExpenses();
  tripExpDraft.splice(i,1);
  paintTripExpenses();
}
function recalcTripExpenses(){
  const out = document.getElementById('f_expTotal');
  if(out) out.textContent = money(tripExpenseTotal());
  const adv = document.getElementById('f_expAdvEcho');
  if(adv && tripDraft) adv.textContent = money(tripAdvance(tripDraft));
  paintTripTotals();
}
/* the draft becomes real Expenses records the moment the trip is saved */
function syncTripExpenses(tripId, truckId){
  DB.expenses = DB.expenses || [];
  const keep = tripExpDraft.filter(x=>num(x.amount) > 0);
  const ids  = new Set(keep.map(x=>x.id));
  DB.expenses = DB.expenses.filter(e=>e.tripId!==tripId || ids.has(e.id));
  keep.forEach(x=>{
    const cur = DB.expenses.find(e=>e.id===x.id);
    const mode = x.mode || 'Cash';
    const row = {id:x.id, date:x.date||today(), amount:num(x.amount),
      category:(x.category||'').trim() || 'Trip expense', truckId:truckId||'', tripId:tripId,
      paidTo:(cur&&cur.paidTo)||'', mode:mode,
      shopId: mode==='Credit' ? (x.shopId||'') : '',
      note:x.note||''};
    if(cur) Object.assign(cur, row); else DB.expenses.push(row);
  });
  buildExpCatList();
}

let lineDraft = [];
function paintTripLines(){
  setTimeout(clampDates, 0);

    '<div class="line-row">'+

        '<option value="deduction"'+(x.type==='deduction'?' selected':'')+'>Deduction (\u2212)</option>'+
      '</select>'+
      '<input id="ln_l'+i+'" value="'+esc(x.label||'')+'" placeholder="What is it for" '+
        'list="lineLabels" oninput="readTripLines()">'+

    : '<div class="hint">Nothing added \u2014 the party is billed the freight as it stands. '+
      'A charge adds to what they owe (detention, loading, an extra point); '+

function readTripLines(){
  lineDraft = lineDraft.map((x,i)=>{
    const ty=document.getElementById('ln_t'+i), la=document.getElementById('ln_l'+i), am=document.getElementById('ln_a'+i);
    return {id:x.id||uid(), type:ty?ty.value:x.type, label:la?la.value.trim():x.label, amount:am?num(am.value):num(x.amount)};
  });
  if(tripDraft) tripDraft.lines = lineDraft;
  return lineDraft;
}
function addTripLine(type){
  readTripLines();

function buildLineLabels(){
  let dl = document.getElementById('lineLabels');
  if(!dl){ dl=document.createElement('datalist'); dl.id='lineLabels'; document.body.appendChild(dl); }
  const common = ['Brokerage','Detention','Loading charge','Unloading charge','Extra point','Halting',
    'Shortage','Damage','Discount','Late delivery penalty'];
  const used = [];
  DB.trips.forEach(t=>tripLines(t).forEach(x=>{
    if(x.label && !common.includes(x.label) && !used.includes(x.label)) used.push(x.label);
  }));
  dl.innerHTML = used.concat(common).map(v=>'<option value="'+esc(v)+'"></option>').join('');
}

function blankTrip(){
  return {id:'', date:today(), lr:'', from:'', to:'', partyId:'', truckId:'', driverId:'',
    material:'', weight:'', freight:0, hire:0, hireAdvance:0, supplierId:'',

}
/* pull whatever fields are on screen into the draft */
function readTripForm(){
  if(!tripDraft) return;
  const g = id => document.getElementById(id);
  const map = {f_date:'date', f_lr:'lr', f_from:'from', f_to:'to', f_party:'partyId',
    f_truck:'truckId', f_driver:'driverId', f_material:'material', f_weight:'weight', f_notes:'notes',
    f_fuelQty:'fuelQty', f_fuelRate:'fuelRate'};
  Object.entries(map).forEach(([el,key])=>{ if(g(el)) tripDraft[key] = g(el).value.trim(); });
  if(document.getElementById('lineRows')) readTripLines();
  if(document.getElementById('tripExpRows')) readTripExpenses();
  ['freight','hire','advCash','fuelAmt','hireAdvance'].forEach(key=>{
    const el = g('f_'+key); if(el) tripDraft[key] = num(el.value);
  });
  if(g('f_hire2')) tripDraft.hire = num(g('f_hire2').value);
  if(g('f_supplier')) tripDraft.supplierId = g('f_supplier').value;
}
function switchTripTab(tab){

/* rebuild the panel and the tab strip in place; returns false if the
   trip screen is not actually open */
function repaintTripPane(){
  const pane = document.querySelector('.overlay .trip-pane');
  const strip = document.querySelector('.overlay .trip-tabs');
  if(!pane || !strip || !tripDraft) return false;
  const existing = tripDraft.id ? DB.trips.find(x=>x.id===tripDraft.id) : null;
  if(existing) tripDraft = Object.assign(tripDraft, {
    deliveredAt: existing.deliveredAt, podReceivedAt: existing.podReceivedAt,
    podSubmittedAt: existing.podSubmittedAt
  });
  pane.innerHTML = tripPaneHtml(tripDraft, existing, tripTab);
  setHtml(strip, tabStripHtml(tripDraft, existing));
  pane.classList.remove('pane-in'); void pane.offsetWidth; pane.classList.add('pane-in');
  fuelDirty = !!(num(tripDraft.fuelAmt) && !(num(tripDraft.fuelQty)>0 && num(tripDraft.fuelRate)>0
    && Math.abs(num(tripDraft.fuelQty)*num(tripDraft.fuelRate) - num(tripDraft.fuelAmt)) < 0.5));
  lineDraft = JSON.parse(JSON.stringify((tripDraft && tripDraft.lines) || []));
  if(document.getElementById('lineRows')) paintTripLines();
  if(document.getElementById('tripExpRows')) paintTripExpenses();
  if(document.getElementById('f_advTotal')) recalcAdvance();
  clampDates();
  paintTripTotals();
  applyTripLock();
  return true;
}

/* What a lorry actually spends money on, most used first. The list is
   learned from the book rather than fixed, so after a month it is your
   five, not a guess at everybody's. */
function quickExpCats(){
  const count = {};
  (DB.expenses||[]).forEach(e=>{
    const c = String(e.category||'').trim();
    if(c) count[c] = (count[c]||0) + 1;
  });
  const used = Object.keys(count).sort((a,b)=>count[b]-count[a]).slice(0,5);
  const fill = ['Fuel / Diesel','Toll & Parking','Loading / unloading','Repairs','Miscellaneous'];
  fill.forEach(c=>{ if(used.length < 5 && !used.includes(c)) used.push(c); });
  return used.slice(0,5);
}

/* Enforcement is at the source, in the functions that write; this only
   makes the screen say so, by greying what can no longer be touched. */
function applyTripLock(){
  const pane = document.querySelector('.overlay .trip-pane');
  if(!pane || !tripDraft || !tripDraft.id) return;
  const t = DB.trips.find(x=>x.id===tripDraft.id);
  if(!t || !tripLocked(t)) return;
  pane.classList.add('pane-locked');
  pane.querySelectorAll('input, select, textarea').forEach(el=>{ el.disabled = true; });
  pane.querySelectorAll('button').forEach(b=>{ if(!b.hasAttribute('data-keep')) b.disabled = true; });
}

function tripScreen(id, tab){
  if(tab) tripTab = tab;
  const existing = id ? DB.trips.find(x=>x.id===id) : null;
  if(existing && (!tripDraft || tripDraft.id !== existing.id)){
    tripDraft = Object.assign(blankTrip(), existing);
    loadTripExpenses(existing.id);
  }
  if(!existing && (!tripDraft || tripDraft.id)){
    tripDraft = blankTrip();
    loadTripExpenses('');
  }
  const t = tripDraft;

  if(!existing && (!DB.parties.length || !DB.trucks.length)){
    openModal({title:'Add a truck and a party first',
      body:'<p style="margin:0 0 10px">A trip needs a truck and a party to link to.</p>'+
        '<p style="margin:0;color:var(--muted);font-size:13.5px">Go to <b>Trucks</b> to add your vehicle, and '+
        '<b>Parties &amp; Ledger</b> to add the customer who pays the freight.</p>'});
    return;
  }

  const pos  = existing ? tripNav.indexOf(id) : -1;
  const prev = pos > 0 ? tripNav[pos-1] : null;
  const next = pos > -1 && pos < tripNav.length-1 ? tripNav[pos+1] : null;
  const stage = stageInfo(tripStage(existing || t));
  const bal = tripBalance(t);

  const TABS = tripTabList(t, existing);

  const locked = !!existing && tripLocked(existing);

  openModal({
    title: existing ? ((t.from||'—')+' → '+(t.to||'—')) : 'New trip',
    wide:'full',
    okText: existing ? 'Save changes' : 'Save trip',
    onOk: locked ? null : function(){ saveTripScreen(existing); },
    body:
    tripLockBanner(existing)+
    '<div class="trip-top">'+
      '<div class="slip-lr">'+(existing
        ? 'LR '+esc(t.lr||'—')+' · '+fdate(t.date)+' · '+esc(partyName(t.partyId))
        : 'Fill the details, then save')+'</div>'+
      '<div class="trip-totals" id="tripTotals">'+tripTotalsHtml(t)+'</div>'+
      (existing && tripNav.length > 1 && pos > -1
        ? '<div class="trip-nav">'+
            '<button class="btn btn-sm"'+(prev?' onclick="gotoTrip(\''+prev+'\')"':' disabled')+'>← Prev</button>'+
            '<span class="hint">'+(pos+1)+' of '+tripNav.length+'</span>'+
            '<button class="btn btn-sm"'+(next?' onclick="gotoTrip(\''+next+'\')"':' disabled')+'>Next →</button>'+
          '</div>' : '')+
    '</div>'+
    '<div class="tabs trip-tabs">'+tabStripHtml(t, existing)+'</div>'+
    '<div class="trip-pane pane-in">'+tripPaneHtml(t, existing, tripTab)+'</div>'+
    (existing && !locked ? '<div class="trip-actions"><button class="btn btn-danger" '+
      'onclick="closeModal();delTrip(\''+existing.id+'\')">Delete this trip</button></div>' : '')
  });

  fuelDirty = !!(num(t.fuelAmt) && !(num(t.fuelQty)>0 && num(t.fuelRate)>0
    && Math.abs(num(t.fuelQty)*num(t.fuelRate) - num(t.fuelAmt)) < 0.5));
  lineDraft = JSON.parse(JSON.stringify(t.lines || []));
  if($('#lineRows')) paintTripLines();
  if($('#tripExpRows')) paintTripExpenses();
  if($('#f_advTotal')) recalcAdvance();
  paintTripTotals();
  applyTripLock();
}

/* moving to another trip keeps whatever you typed */
function gotoTrip(id){
  const had = tripDraft && tripDraft.id;
  readTripForm();
  if(had) saveTripScreen(DB.trips.find(x=>x.id===had), true);
  tripDraft = null;
  tripScreen(id);
}

function saveTripScreen(existing, quiet){
  if(lockedStop(existing)) return false;
  readTripForm();
  const t = tripDraft;
  /* Both are checked together, so one trip back to the details tab shows
     everything that is missing rather than one thing at a time. */
  const missing = [];
  if(!t.partyId) missing.push(['f_party','Choose the party who pays the freight']);
  if(!t.truckId) missing.push(['f_truck','Choose the truck that ran this trip']);
  /* on credit means someone is owed — the shop cannot be left out */
  const noShop = tripExpDraft.findIndex(x=>num(x.amount)>0 && x.mode==='Credit' && !x.shopId);
  if(noShop >= 0 && !missing.length){
    if(tripTab !== 'expenses') switchTripTab('expenses');
    markMissing('tx_s'+noShop, 'Choose the shop this credit is with');
    focusField('tx_s'+noShop);
    toast('An expense taken on credit needs the shop it came from');
    return false;
  }
  if(missing.length){
    if(tripTab !== 'details') switchTripTab('details');
    missing.forEach(([id, msg])=>markMissing(id, msg));
    focusField(missing[0][0]);
    toast(missing.length > 1
      ? 'This trip needs a party and a truck'
      : missing[0][1]);
    return false;
  }
  const settled = num(t.advCash) + num(t.fuelAmt);
  if(tripFreightNet(t) > 0 && settled > tripFreightNet(t)){
    toast('The advance is more than the amount billed to the party.');
    if(!quiet) switchTripTab('money');
    return false;
  }
  const rec = Object.assign(blankTrip(), existing || {}, t);
  rec.id = existing ? existing.id : uid();
  rec.date = rec.date || today();
  rec.advance = tripAdvance(rec);
  rec.status  = tripStatus(rec);
  if(!rec.supplierId){
    const tr = truckById(rec.truckId);
    if(tr && tr.type==='market' && tr.supplierId) rec.supplierId = tr.supplierId;
  }
  rememberPlace(rec.from); rememberPlace(rec.to);
  stampCompletion(rec);
  if(existing) DB.trips[DB.trips.findIndex(x=>x.id===existing.id)] = rec;
  else DB.trips.push(rec);
  syncTripExpenses(rec.id, rec.truckId);
  save();
  if(quiet) return true;
  tripDraft = null;
  closeModal(); render();
  toast(existing ? 'Trip updated' : 'Trip saved');
  return true;
}

function podTracker(t){
  const cur = tripStage(t);
  const idx = STAGES.findIndex(s=>s.k===cur);
  return '<div class="pod-track">'+
    '<div class="pod-head">Delivery and paperwork</div>'+
    STAGES.map((s,i)=>{
      if(!s.field) return '';
      const done = i <= idx;
      const date = t[s.field] || '';
      return '<div class="pod-step'+(done?' done':'')+'">'+
        '<span class="pod-dot"></span>'+
        '<span class="pod-label">'+esc(s.label)+'</span>'+
        (done
          ? '<input type="date" class="pod-date" value="'+esc(date)+'" '+
              'onchange="setStage(\''+t.id+'\',\''+s.field+'\',this.value)">'+
            '<button class="btn btn-sm" onclick="setStage(\''+t.id+'\',\''+s.field+'\','+"''"+')">Undo</button>'
          : '<button class="btn btn-sm btn-primary pod-go" onclick="markStage(\''+t.id+'\',\''+s.field+'\')">'+
              esc(s.action)+'</button>')+
      '</div>';
    }).join('')+
    (cur!=='submitted' && tripBalance(t)>0
      ? '<div class="hint" style="margin-top:8px">'+money(tripBalance(t))+
        ' is waiting on this paperwork before you can chase it.</div>' : '')+
  '</div>';
}

function fv(label,value){ return '<div><div class="field-label">'+esc(label)+'</div><div class="field-value">'+value+'</div></div>'; }

/* Everything that hangs off a trip, removed with it. Written once because
   a trip can go three ways — deleted on its own, taken with its party, or
   swept up by a repair — and each of those leaving a different tail behind
   is exactly how records end up pointing at things that do not exist. */
function removeTripData(ids){
  const gone = new Set([].concat(ids));
  if(!gone.size) return;
  DB.trips = DB.trips.filter(t=>!gone.has(t.id));
  DB.expenses = (DB.expenses||[]).filter(e=>!(e.tripId && gone.has(e.tripId)));
  gone.forEach(id=>{
    /* the photos, and the untouched originals they point at */
    podImages(id).forEach(p=>dropOriginal(p.origKey));
    if(DB.pods) delete DB.pods[id];
  });
  /* a payment allocated to a trip that no longer exists */
  (DB.ledger||[]).forEach(l=>{
    if(!(l.alloc||[]).length) return;
    l.alloc = l.alloc.filter(a=>!gone.has(a.tripId));
  });
  if(tripDraft && gone.has(tripDraft.id)){ tripDraft = null; tripExpDraft = []; }
}
function delTrip(id){
  if(lockedStop(DB.trips.find(x=>x.id===id))) return;
  const exp = tripExpensesOf(id);
  const pods = podCount(id);
  confirmAsk('Delete this trip? The freight will also be removed from the party ledger.'+
    (exp ? ' The '+money(exp)+' of expenses booked to it go too.' : '')+
    (pods ? ' So do its '+plural(pods,'POD page')+'.' : ''), ()=>{
    removeTripData(id);
    save(); render(); toast('Trip deleted');
  }, true);
}

  const box = $('#listBox'); if(!box) return;

/* ------------------------------------------------------------
   LEDGER VIEW
   Every ledger can be narrowed to one side of the account. The
   running balance belongs to the whole ledger, so it is worked
   out over every line first and only then are the lines you did
   not ask for dropped — the balance column still reads true, and
   the print and the CSV show exactly what the screen shows.
   ------------------------------------------------------------ */
const LEDGER_VIEWS = [
  {k:'',       label:'Debit and credit', short:'debit and credit'},
  {k:'debit',  label:'Debit only',       short:'debit entries only'},
  {k:'credit', label:'Credit only',      short:'credit entries only'}
];
/* the driver account runs on the same two sides under other names */
const DRIVER_VIEWS = [
  {k:'',       label:'Everything',       short:'salary due and payments'},
  {k:'debit',  label:'Salary due only',  short:'salary due only'},
  {k:'credit', label:'Payments only',    short:'payments only'}
];
function ledgerView(){ return sub.led || ''; }
function ledgerFilter(rows, view){
  const k = view == null ? ledgerView() : (view || '');
  if(k==='debit')  return rows.filter(r=>num(r.debit) > 0);
  if(k==='credit') return rows.filter(r=>num(r.credit) > 0);
  return rows;
}
function ledgerViewInfo(view, list){
  const k = view == null ? ledgerView() : (view || '');
  const set = list || LEDGER_VIEWS;
  return set.find(v=>v.k===k) || set[0];
}
/* the picker, plus the line that says what is being left out */
function ledgerViewPicker(after, list){
  const set = list || LEDGER_VIEWS;
  return '<select class="led-view" aria-label="Which entries to show" '+
    'onchange="sub.led=this.value;'+after+'">'+
    set.map(v=>'<option value="'+v.k+'"'+(v.k===ledgerView()?' selected':'')+'>'+esc(v.label)+'</option>').join('')+
  '</select>';
}
function ledgerViewNote(shown, total, after, list){
  if(!ledgerView()) return '';
  return '<div class="led-note">Showing '+shown+' of '+total+' entries \u2014 '+
    esc(ledgerViewInfo(null, list).short)+'. The balance column and the totals below are '+
    'for the whole account. <a href="#" onclick="event.preventDefault();sub.led=\'\';'+after+'">Show everything</a></div>';
}

function ledgerRows(pid){
  const rows = [];
  const p = partyById(pid);
  if(num(p.opening)) rows.push({date:'', label:'Opening balance', ref:'', debit:num(p.opening)>0?num(p.opening):0, credit:num(p.opening)<0?-num(p.opening):0, kind:'open'});
  DB.trips.filter(t=>t.partyId===pid).forEach(t=>{
    rows.push({date:t.date, label:'Freight — '+(t.from||'?')+' to '+(t.to||'?'), ref:t.lr?('LR '+t.lr):truckName(t.truckId),
      debit:num(t.freight), credit:0, kind:'trip', tripId:t.id});
    if(num(t.advCash)) rows.push({date:t.date, label:'Advance received in cash', ref:t.lr?('LR '+t.lr):'',
      debit:0, credit:num(t.advCash), kind:'trip', tripId:t.id});
    if(num(t.fuelAmt)) rows.push({date:t.date, label:'Advance given as fuel',
      ref:[fuelNote(t), t.lr?('LR '+t.lr):''].filter(Boolean).join(' · '),
      debit:0, credit:num(t.fuelAmt), kind:'trip', tripId:t.id});
    tripLines(t).forEach(x=>{
      if(!num(x.amount)) return;
      rows.push({date:t.date,
        label:(x.label||(x.type==='charge'?'Extra charge':'Deduction'))+(x.type==='charge'?' (charge)':' (deduction)'),
        ref:t.lr?('LR '+t.lr):'',
        debit: x.type==='charge' ? num(x.amount) : 0,
        credit: x.type==='deduction' ? num(x.amount) : 0,
        kind:'trip', tripId:t.id});
    });
  });
  DB.ledger.filter(l=>l.partyId===pid).forEach(l=>{
    const spread = (l.alloc||[]).length
      ? 'allocated to '+(l.alloc||[]).map(a=>{
          const tp = DB.trips.find(x=>x.id===a.tripId);
          return (tp && tp.lr ? 'LR '+tp.lr : 'a trip')+' '+money(a.amount);
        }).join(', ')
      : '';
    rows.push({date:l.date, label:l.note||(l.type==='credit'?'Payment received':'Charge added'),
      ref:[l.mode,l.ref,spread].filter(Boolean).join(' · '), debit:l.type==='debit'?num(l.amount):0,
      credit:l.type==='credit'?num(l.amount):0, kind:'entry', entryId:l.id});
  });
  rows.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  let run = 0;
  rows.forEach(r=>{ run += r.debit - r.credit; r.running = run; });
  return rows;
}

          (r.kind==='entry'?'<button class="btn btn-sm" onclick="ledgerForm(\''+pid+'\',\''+r.entryId+'\')">Edit</button>'+
            '<button class="btn btn-sm btn-danger" onclick="delLedger(\''+r.entryId+'\')">Delete</button>':'')+
        '</div></td></tr>').join('')+
      '</tbody></table></div></div>'+
