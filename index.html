<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151A21">
<title>Maa Vandana Logistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --asphalt:#151A21; --asphalt-2:#1E2530; --asphalt-3:#2A323E;
  --paper:#F6F4EF; --card:#FFFFFF; --line:#E4E0D6; --line-soft:#EFECE4;
  --ink:#1B1F24; --muted:#6E6A62;
  --amber:#E9A13B; --amber-soft:#FBF0DC;
  --red:#B3372C; --red-soft:#FAEAE8;
  --green:#1C7A57; --green-soft:#E6F2EC;
  --blue:#2C5D7C; --blue-soft:#E8F0F5;
  --r:10px; --shadow:0 1px 2px rgba(21,26,33,.06),0 8px 24px rgba(21,26,33,.05);
  --sans:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'Courier New',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- App frame ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:238px;flex:none;background:var(--asphalt);color:#fff;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-mark{display:flex;align-items:center;gap:10px}
.brand-badge{
  width:34px;height:34px;border-radius:8px;background:var(--amber);color:var(--asphalt);
  display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:-.02em;flex:none;
}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.2}
.brand-tag{font-size:11px;color:rgba(255,255,255,.45);margin-top:9px;letter-spacing:.06em;text-transform:uppercase}
.nav{padding:12px 10px;overflow-y:auto;flex:1}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;margin-bottom:2px;
  background:none;border:0;border-radius:8px;color:rgba(255,255,255,.68);
  font-size:14px;font-weight:500;cursor:pointer;text-align:left;transition:background .12s,color .12s;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.on{background:var(--asphalt-3);color:#fff}
.nav-item.on .ic{color:var(--amber)}
.ic{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side-foot{padding:14px 20px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:rgba(255,255,255,.35)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:14px;padding:18px 26px;
  background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
}
.page-title{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:0}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.content{padding:22px 26px 60px;max-width:1240px;width:100%}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:8px;
  border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13.5px;
  cursor:pointer;transition:.12s;white-space:nowrap;
}
.btn:hover{border-color:#CFC9BB;background:#FCFBF8}
.btn-primary{background:var(--asphalt);border-color:var(--asphalt);color:#fff}
.btn-primary:hover{background:#232B36;border-color:#232B36}
.btn-amber{background:var(--amber);border-color:var(--amber);color:var(--asphalt)}
.btn-amber:hover{background:#F0AC4C;border-color:#F0AC4C}
.btn-danger{color:var(--red);border-color:#E8CFCB}
.btn-danger:hover{background:var(--red-soft)}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px}
.btn-icon{padding:7px;border-radius:7px}
.btn:focus-visible,.nav-item:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- Cards & grid ---------- */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:16px 18px}
.card-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-soft)}
.card-title{font-size:14.5px;font-weight:700;letter-spacing:-.01em;margin:0}
.card-head .btn{margin-left:auto}

.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;box-shadow:var(--shadow)}
.stat-label{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stat-value{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.03em;margin-top:7px;font-variant-numeric:tabular-nums}
.stat-note{font-size:12px;color:var(--muted);margin-top:5px}
.stat.accent{border-left:3px solid var(--amber)}
.stat.pos .stat-value{color:var(--green)}
.stat.neg .stat-value{color:var(--red)}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{
  text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FCFBF8;
}
td{padding:12px 14px;border-bottom:1px solid var(--line-soft);font-size:14px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FCFBF8}
.t-r{text-align:right}
.t-c{text-align:center}
.t-strong{font-weight:600}
.t-sub{font-size:12px;color:var(--muted);margin-top:2px}
.row-actions{display:flex;gap:5px;justify-content:flex-end}

/* ---------- Chips & the stamp ---------- */
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  font-size:11.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap;
}
.chip-grey{background:#F0EEE8;color:var(--muted)}
.chip-amber{background:var(--amber-soft);color:#8A5D12}
.chip-red{background:var(--red-soft);color:var(--red)}
.chip-green{background:var(--green-soft);color:var(--green)}
.chip-blue{background:var(--blue-soft);color:var(--blue)}

/* signature element: rubber-stamp status on the LR slip */
.stamp{
  display:inline-block;padding:5px 12px 4px;border:2.5px solid currentColor;border-radius:4px;
  font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  transform:rotate(-6deg);opacity:.82;font-family:var(--sans);
}
.stamp-paid{color:var(--green)}
.stamp-pending{color:var(--red)}
.stamp-part{color:#8A5D12}

/* LR slip */
.slip{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.slip-top{display:flex;align-items:flex-start;gap:14px;padding:15px 18px;background:#FCFBF8;border-bottom:1px dashed var(--line)}
.slip-lr{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.slip-route{font-size:17px;font-weight:700;letter-spacing:-.02em;margin-top:3px}
.slip-body{padding:15px 18px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.field-label{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.field-value{font-size:14px;font-weight:500;margin-top:3px;word-break:break-word}

/* ---------- Forms ---------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
label{font-size:12px;font-weight:600;color:#3C4048;letter-spacing:.01em}
input,select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;
  font-size:14.5px;transition:border-color .12s;
}
input:focus,select:focus,textarea:focus{border-color:var(--asphalt-3);outline-offset:1px}
input[type=number]{font-family:var(--mono)}
textarea{resize:vertical;min-height:62px}
.hint{font-size:11.5px;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg input{display:none}
.seg label{
  padding:8px 13px;border:1px solid var(--line);border-radius:8px;cursor:pointer;
  font-size:13.5px;font-weight:600;background:#fff;
}
.seg input:checked+label{background:var(--asphalt);border-color:var(--asphalt);color:#fff}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(21,26,33,.5);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;
  animation:fade .15s ease-out;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--card);border-radius:14px;width:100%;max-width:640px;margin:auto;
  box-shadow:0 24px 60px rgba(21,26,33,.28);animation:pop .18s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes pop{from{transform:translateY(10px) scale(.99);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line-soft)}
.modal-title{font-size:16.5px;font-weight:700;letter-spacing:-.01em;margin:0}
.modal-body{padding:18px 20px;max-height:65vh;overflow-y:auto}
.modal-foot{display:flex;gap:9px;justify-content:flex-end;padding:15px 20px;border-top:1px solid var(--line-soft);background:#FCFBF8;border-radius:0 0 14px 14px}
.x{margin-left:auto;background:none;border:0;font-size:24px;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px}

/* ---------- Misc ---------- */
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{width:auto;min-width:150px}
.search{flex:1;min-width:180px;max-width:320px}
.empty{padding:44px 22px;text-align:center}
.empty-title{font-weight:700;font-size:15px;margin-bottom:5px}
.empty-text{font-size:13.5px;color:var(--muted);max-width:380px;margin:0 auto 16px}
.money-pos{color:var(--green);font-weight:600}
.money-neg{color:var(--red);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{
  padding:9px 14px;background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;
  font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;
}
.tab.on{color:var(--ink);border-bottom-color:var(--amber)}
.sec-title{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px}
.divide{height:1px;background:var(--line-soft);margin:16px 0}
.note{background:var(--amber-soft);border:1px solid #EBDCBD;border-radius:8px;padding:12px 14px;font-size:13px}
.pl-line{display:flex;align-items:baseline;padding:10px 0;border-bottom:1px dotted var(--line)}
.pl-line span:first-child{flex:1}
.pl-line .num{font-size:15px}
.pl-total{border-top:2px solid var(--asphalt);border-bottom:0;margin-top:6px;padding-top:13px;font-weight:700;font-size:16px}

.cloud-pill{
  margin-left:auto;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;
  border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:600;cursor:pointer;
  color:var(--muted);white-space:nowrap;
}
.cloud-pill:hover{border-color:#CFC9BB}
.cloud-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.cloud-pill.on{color:var(--green);border-color:#C8E2D6;background:var(--green-soft)}
.cloud-pill.on .cloud-dot{background:var(--green)}
.cloud-pill.busy{color:#8A5D12;border-color:#EBDCBD;background:var(--amber-soft)}
.cloud-pill.busy .cloud-dot{background:var(--amber);animation:pulse 1s infinite}
.cloud-pill.bad{color:var(--red);border-color:#E8CFCB;background:var(--red-soft)}
.cloud-pill.bad .cloud-dot{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (max-width:760px){.cloud-pill span{display:none}.cloud-pill{padding:7px 9px}}
.step{display:flex;gap:12px;padding:11px 0;border-bottom:1px dotted var(--line)}
.step-n{width:22px;height:22px;border-radius:50%;background:var(--asphalt);color:#fff;font-size:11px;
  font-weight:700;display:grid;place-items:center;flex:none;margin-top:2px}
.step p{margin:0;font-size:13.5px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:var(--asphalt);color:#fff;padding:11px 18px;border-radius:9px;font-size:13.5px;font-weight:500;
  box-shadow:0 10px 30px rgba(21,26,33,.3);animation:up .22s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.toast.ok{border-left:3px solid var(--amber)}

.mobile-nav{display:none}
@media (max-width:900px){
  .g4{grid-template-columns:1fr 1fr}
  .g3,.g2{grid-template-columns:1fr}
  .slip-body{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .sidebar{display:none}
  .content{padding:16px 14px 92px}
  .topbar{padding:14px 16px}
  .page-title{font-size:18px}
  .form-grid{grid-template-columns:1fr}
  .g4{grid-template-columns:1fr 1fr}
  .stat-value{font-size:21px}
  .modal{max-width:none}
  .modal-body{max-height:none}
  .overlay{padding:0}
  .modal{border-radius:14px 14px 0 0;margin:auto auto 0}
  .mobile-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--asphalt);z-index:50;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.1);
  }
  .mnav{
    flex:1;background:none;border:0;color:rgba(255,255,255,.6);display:flex;flex-direction:column;
    align-items:center;gap:3px;padding:5px 2px;font-size:10px;font-weight:600;cursor:pointer;border-radius:8px;
  }
  .mnav.on{color:var(--amber)}
  th,td{padding:10px 11px;font-size:13.5px}
  .topbar-actions .btn span{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  .sidebar,.topbar,.mobile-nav,.toolbar,.btn,.row-actions{display:none!important}
  .content{padding:0;max-width:none}
  .card{box-shadow:none;break-inside:avoid}
  body{background:#fff}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <div class="brand-badge">MV</div>
        <div>
          <div class="brand-name" id="brandName">Maa Vandana<br>Logistics</div>
        </div>
      </div>
      <div class="brand-tag">Blessed by Maa Vandana</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="syncFoot">Version 1.4 &middot; 18 Aug 2026</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div>
        <h1 class="page-title" id="pageTitle">Dashboard</h1>
        <div class="page-sub" id="pageSub"></div>
      </div>
      <button class="cloud-pill" id="cloudPill" onclick="go('settings')" hidden></button>
      <div class="topbar-actions" id="pageActions"></div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<nav class="mobile-nav" id="mnav"></nav>
<div id="modalRoot"></div>
<div id="toast"></div>
<script>
/* ============================================================
   MAA VANDANA LOGISTICS — transport business manager
   All data is stored in this browser (localStorage). Use
   Settings > Backup regularly to keep a copy of your data.
   ============================================================ */

/* ---------- 1. Storage ---------- */
const KEY = 'mvl_db_v1';
const BLANK = {
  settings:{business:'Maa Vandana Logistics', owner:'', phone:'', address:'', gst:''},
  trucks:[], parties:[], trips:[], ledger:[], expenses:[], drivers:[], driverTxns:[],
  seeded:false
};
let DB = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return JSON.parse(JSON.stringify(BLANK));
    return Object.assign(JSON.parse(JSON.stringify(BLANK)), JSON.parse(raw));
  }catch(e){ return JSON.parse(JSON.stringify(BLANK)); }
}
function save(){
  reindex();
  DB.updatedAt = new Date().toISOString();
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ toast('Could not save. Your device storage may be full.'); }
  if(typeof cloudReady==='function' && cloudReady()) cloudPush(false);
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ---------- 2. Helpers ---------- */
const $  = s => document.querySelector(s);
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function money(n, sign){
  const v = Math.round(num(n));
  const s = Math.abs(v).toLocaleString('en-IN');
  if(sign && v>0) return '+₹'+s;
  return (v<0?'−₹':'₹')+s;
}
function today(){ return new Date().toISOString().slice(0,10); }
function fdate(d){
  if(!d) return '—';
  const [y,m,dd] = d.split('-');
  const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return dd+' '+M[parseInt(m,10)-1]+' '+y;
}
function monthKey(d){ return (d||'').slice(0,7); }
function thisMonth(){ return today().slice(0,7); }
function monthName(k){
  if(!k) return '';
  const M=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return M[parseInt(k.slice(5,7),10)-1]+' '+k.slice(0,4);
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast ok'; t.textContent = msg;
  $('#toast').appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 2400);
}
function confirmAsk(msg, onYes, danger){
  openModal({
    title:'Please confirm',
    body:'<p style="margin:0;font-size:14.5px">'+esc(msg)+'</p>',
    okText: danger?'Delete':'Yes, continue',
    okClass: danger?'btn btn-danger':'btn btn-primary',
    onOk(){ closeModal(); onYes(); }
  });
}

/* Debounce: run fn once the person pauses typing, instead of on every keystroke */
let deferTimer;
function defer(fn){ clearTimeout(deferTimer); deferTimer = setTimeout(fn, 90); }

/* lookups — kept in an index so long lists stay fast */
let IDX = {truck:{}, party:{}, driver:{}};
function reindex(){
  IDX = {truck:{}, party:{}, driver:{}};
  DB.trucks.forEach(t=>IDX.truck[t.id]=t);
  DB.parties.forEach(p=>IDX.party[p.id]=p);
  DB.drivers.forEach(d=>IDX.driver[d.id]=d);
}
// index first, with a safety net in case anything was added without a save
const truckById  = id => IDX.truck[id]  || DB.trucks.find(t=>t.id===id);
const partyById  = id => IDX.party[id]  || DB.parties.find(p=>p.id===id);
const driverById = id => IDX.driver[id] || DB.drivers.find(d=>d.id===id);
const truckName  = id => { const t=truckById(id); return t? t.number : '—'; };
const partyName  = id => { const p=partyById(id); return p? p.name : '—'; };
const driverName = id => { const d=driverById(id); return d? d.name : '—'; };

/* ---------- 3. Business calculations ---------- */

// Party outstanding = opening + freight billed + extra charges − payments received − advances − discounts
function partyBalance(pid){
  const p = partyById(pid); if(!p) return 0;
  let bal = num(p.opening);
  DB.trips.filter(t=>t.partyId===pid).forEach(t=>{ bal += num(t.freight); bal -= num(t.advance); });
  DB.ledger.filter(l=>l.partyId===pid).forEach(l=>{ bal += l.type==='debit' ? num(l.amount) : -num(l.amount); });
  return bal;
}
// All party balances in a single pass — used by lists so they stay quick
function allBalances(){
  const m = {};
  DB.parties.forEach(p=>{ m[p.id] = num(p.opening); });
  DB.trips.forEach(t=>{ if(t.partyId in m) m[t.partyId] += num(t.freight) - num(t.advance); });
  DB.ledger.forEach(l=>{ if(l.partyId in m) m[l.partyId] += l.type==='debit' ? num(l.amount) : -num(l.amount); });
  return m;
}
function totalReceivable(){
  const m = allBalances();
  return Object.values(m).reduce((s,b)=>s+Math.max(0,b),0);
}

// Driver payable = salary due entries − everything actually paid out
function driverBalance(did){
  let bal = 0;
  DB.driverTxns.filter(t=>t.driverId===did).forEach(t=>{
    bal += t.type==='due' ? num(t.amount) : -num(t.amount);
  });
  return bal;
}
function totalDriverPayable(){ return DB.drivers.reduce((s,d)=>s+Math.max(0,driverBalance(d.id)),0); }

// Profit & loss for a date range
function pnl(from, to){
  const inR = d => (!from || d>=from) && (!to || d<=to);
  const trips = DB.trips.filter(t=>inR(t.date));
  const freight = trips.reduce((s,t)=>s+num(t.freight),0);
  const hire    = trips.reduce((s,t)=>s+num(t.hire),0);
  const byCat = {};
  DB.expenses.filter(e=>inR(e.date)).forEach(e=>{ byCat[e.category]=(byCat[e.category]||0)+num(e.amount); });
  const expense = Object.values(byCat).reduce((a,b)=>a+b,0);
  const driverPaid = DB.driverTxns.filter(t=>inR(t.date) && t.type!=='due').reduce((s,t)=>s+num(t.amount),0);
  const costs = hire + expense + driverPaid;
  return {trips, tripCount:trips.length, freight, hire, byCat, expense, driverPaid, costs, profit:freight-costs};
}

  if(q) list = list.filter(t=>
    ((t.lr||'')+' '+(t.from||'')+' '+(t.to||'')+' '+(t.material||'')+' '+
     truckName(t.truckId)+' '+partyName(t.partyId)).toLowerCase().includes(q));

            (t.material?'<div class="t-sub">'+esc(t.material)+'</div>':'')+'</td>'+
          '<td onclick="tripDetail(\''+t.id+'\')">'+esc(partyName(t.partyId))+'</td>'+

function ledgerRows(pid){
  const rows = [];
  const p = partyById(pid);
  if(num(p.opening)) rows.push({date:'', label:'Opening balance', ref:'', debit:num(p.opening)>0?num(p.opening):0, credit:num(p.opening)<0?-num(p.opening):0, kind:'open'});
  DB.trips.filter(t=>t.partyId===pid).forEach(t=>{
    rows.push({date:t.date, label:'Freight — '+(t.from||'?')+' to '+(t.to||'?'), ref:t.lr?('LR '+t.lr):truckName(t.truckId),
      debit:num(t.freight), credit:0, kind:'trip', tripId:t.id});
    if(num(t.advance)) rows.push({date:t.date, label:'Advance received against trip', ref:t.lr?('LR '+t.lr):'',
      debit:0, credit:num(t.advance), kind:'trip', tripId:t.id});
  });
  DB.ledger.filter(l=>l.partyId===pid).forEach(l=>{
    rows.push({date:l.date, label:l.note||(l.type==='credit'?'Payment received':'Charge added'),
      ref:[l.mode,l.ref].filter(Boolean).join(' · '), debit:l.type==='debit'?num(l.amount):0,
      credit:l.type==='credit'?num(l.amount):0, kind:'entry', entryId:l.id});
  });
  rows.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  let run = 0;
  rows.forEach(r=>{ run += r.debit - r.credit; r.running = run; });
  return rows;
}

function renderLedger(pid){
  const p = partyById(pid);
  if(!p){ sub={}; return viewParties(); }
  const rows = ledgerRows(pid);
  const bal = partyBalance(pid);
  const billed = rows.reduce((s,r)=>s+r.debit,0);
  const paid   = rows.reduce((s,r)=>s+r.credit,0);
  $('#pageTitle').textContent = p.name;
  $('#pageSub').textContent = [p.city,p.phone].filter(Boolean).join(' · ') || 'Party ledger';
  $('#pageActions').innerHTML =
    '<button class="btn" onclick="sub={};render()">← <span>All parties</span></button>'+
    '<button class="btn btn-amber" onclick="ledgerForm(\''+pid+'\')">+ <span>Add entry</span></button>';

  $('#view').innerHTML =
  '<div class="grid g3" style="margin-bottom:16px">'+
    '<div class="stat"><div class="stat-label">Total billed</div><div class="stat-value">'+money(billed)+'</div></div>'+
    '<div class="stat"><div class="stat-label">Total received</div><div class="stat-value">'+money(paid)+'</div></div>'+
    '<div class="stat accent '+(bal>0?'neg':'pos')+'"><div class="stat-label">'+(bal>=0?'Balance to collect':'Advance held')+'</div>'+

  '</div>'+
  '<div class="toolbar"><button class="btn btn-sm" onclick="window.print()">Print ledger</button>'+

    '<button class="btn btn-sm btn-danger" style="margin-left:auto" onclick="delParty(\''+pid+'\')">Delete party</button></div>'+
  (rows.length===0
    ? empty('Ledger is empty','Record a trip for this party, or add a direct payment, advance or adjustment entry here.',
        '<button class="btn btn-amber" onclick="ledgerForm(\''+pid+'\')">+ Add entry</button>')
    : '<div class="card"><div class="tbl-wrap"><table>'+
      '<thead><tr><th>Date</th><th>Particulars</th><th class="t-r">Debit</th><th class="t-r">Credit</th><th class="t-r">Balance</th><th></th></tr></thead><tbody>'+
      rows.map(r=>
        '<tr><td style="white-space:nowrap">'+(r.date?fdate(r.date):'—')+'</td>'+
        '<td><div class="t-strong">'+esc(r.label)+'</div>'+(r.ref?'<div class="t-sub">'+esc(r.ref)+'</div>':'')+'</td>'+
        '<td class="t-r num">'+(r.debit?money(r.debit):'')+'</td>'+
        '<td class="t-r num" style="color:var(--green)">'+(r.credit?money(r.credit):'')+'</td>'+
        '<td class="t-r num t-strong">'+money(r.running)+'</td>'+
        '<td><div class="row-actions">'+
          (r.kind==='trip'?'<button class="btn btn-sm" onclick="tripDetail(\''+r.tripId+'\')">View</button>':'')+
          (r.kind==='entry'?'<button class="btn btn-sm" onclick="ledgerForm(\''+pid+'\',\''+r.entryId+'\')">Edit</button>'+
            '<button class="btn btn-sm btn-danger" onclick="delLedger(\''+r.entryId+'\')">Delete</button>':'')+
        '</div></td></tr>').join('')+
      '</tbody></table></div></div>'+
      '<div class="note" style="margin-top:14px">Debit increases what the party owes you. Credit reduces it — payments, advances and discounts all go in the credit column.</div>');

  let list = DB.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(fm) list = list.filter(e=>monthKey(e.date)===fm);
  if(fc) list = list.filter(e=>e.category===fc);
  if(ft) list = list.filter(e=>e.truckId===ft);
  const total = list.reduce((s,e)=>s+num(e.amount),0);
  const byCat = {}; list.forEach(e=>{ byCat[e.category]=(byCat[e.category]||0)+num(e.amount); });
  const top = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const full = list.length;
  list = list.slice(0, pageLimit());

  box.innerHTML =
  (list.length && total ? '<div class="grid g4" style="margin-bottom:16px">'+

      '<div class="stat-note">'+list.length+' entries</div></div>'+
    top.map(([c,v])=>'<div class="stat"><div class="stat-label">'+esc(c)+'</div>'+
      '<div class="stat-value">'+money(v)+'</div><div class="stat-note">'+Math.round(v/total*100)+'% of total</div></div>').join('')+
  '</div>':'')+
  (DB.expenses.length===0
    ? empty('No expenses yet','Record diesel, tolls, repairs, EMI and office costs here. Link an expense to a truck to see that truck\u2019s real profit.',

    : '<div class="card"><div class="tbl-wrap"><table>'+
      '<thead><tr><th>Date</th><th>Category</th><th>Details</th><th>Truck</th><th class="t-r">Amount</th><th></th></tr></thead><tbody>'+
      list.map(e=>
        '<tr><td style="white-space:nowrap">'+fdate(e.date)+'</td>'+
        '<td><span class="chip chip-grey">'+esc(e.category)+'</span></td>'+
        '<td>'+esc(e.note||'\u2014')+(e.paidTo?'<div class="t-sub">Paid to '+esc(e.paidTo)+'</div>':'')+'</td>'+
        '<td class="num">'+esc(e.truckId?truckName(e.truckId):'\u2014')+'</td>'+
        '<td class="t-r num t-strong">'+money(e.amount)+'</td>'+
        '<td><div class="row-actions">'+
          '<button class="btn btn-sm" onclick="expenseForm(\''+e.id+'\')">Edit</button>'+
          '<button class="btn btn-sm btn-danger" onclick="delExpense(\''+e.id+'\')">Delete</button>'+
        '</div></td></tr>').join('')+
      '</tbody><tfoot><tr><th colspan="4">Total of '+full+' entries</th><th class="t-r num" style="font-size:14px;color:var(--ink)">'+money(total)+'</th><th></th></tr></tfoot>'+
      '</table></div>'+moreBar(list.length, full, 'renderExpenseList')+'</div>');
}

function viewReports(){
  const m = thisMonth();
  if(!sub.from) sub.from = m+'-01';
  if(!sub.to)   sub.to   = today();
  if(!sub.tab)  sub.tab  = 'pnl';
  const p = pnl(sub.from, sub.to);
  $('#pageActions').innerHTML = '<button class="btn" onclick="window.print()">Print</button>';

  const filters =
  '<div class="toolbar">'+
    '<div class="field" style="flex-direction:row;align-items:center;gap:8px"><label for="r_from">From</label>'+
      '<input id="r_from" type="date" value="'+sub.from+'" onchange="sub.from=this.value;viewReports()"></div>'+
    '<div class="field" style="flex-direction:row;align-items:center;gap:8px"><label for="r_to">To</label>'+
      '<input id="r_to" type="date" value="'+sub.to+'" onchange="sub.to=this.value;viewReports()"></div>'+
    '<button class="btn btn-sm" onclick="quickRange(\'month\')">This month</button>'+
    '<button class="btn btn-sm" onclick="quickRange(\'last\')">Last month</button>'+
    '<button class="btn btn-sm" onclick="quickRange(\'fy\')">This financial year</button>'+
    '<button class="btn btn-sm" onclick="quickRange(\'all\')">All time</button>'+
  '</div>';

  const tabs = '<div class="tabs">'+
    [['pnl','Profit & Loss'],['party','Party dues'],['truck','Truck-wise'],['expense','Expense split']]
    .map(([id,l])=>'<button class="tab'+(sub.tab===id?' on':'')+'" onclick="sub.tab=\''+id+'\';viewReports()">'+l+'</button>').join('')+'</div>';

  let body = '';
  if(sub.tab==='pnl'){
    const exps = Object.entries(p.byCat).sort((a,b)=>b[1]-a[1]);
    body =
    '<div class="grid g4" style="margin-bottom:16px">'+
      '<div class="stat"><div class="stat-label">Freight income</div><div class="stat-value">'+money(p.freight)+'</div>'+
        '<div class="stat-note">'+p.tripCount+' trips</div></div>'+
      '<div class="stat"><div class="stat-label">Total costs</div><div class="stat-value">'+money(p.costs)+'</div></div>'+
      '<div class="stat '+(p.profit>=0?'pos':'neg')+' accent"><div class="stat-label">Net profit</div>'+
        '<div class="stat-value">'+money(p.profit)+'</div></div>'+
      '<div class="stat"><div class="stat-label">Margin</div><div class="stat-value">'+(p.freight?Math.round(p.profit/p.freight*100):0)+'%</div>'+
        '<div class="stat-note">Profit ÷ freight</div></div>'+
    '</div>'+
    '<div class="card card-pad">'+
      '<h3 class="card-title" style="margin-bottom:6px">Profit &amp; Loss statement</h3>'+
      '<div class="hint" style="margin-bottom:10px">'+fdate(sub.from)+' to '+fdate(sub.to)+'</div>'+
      '<div class="sec-title">Income</div>'+
      pl('Freight billed on trips', p.freight)+
      '<div class="sec-title">Costs</div>'+
      (p.hire? pl('Hire paid to market trucks', p.hire):'')+
      exps.map(([c,v])=>pl(c, v)).join('')+
      (p.driverPaid? pl('Driver salary &amp; advances paid', p.driverPaid):'')+
      (p.costs===0? '<div class="pl-line"><span>No costs recorded in this period</span><span class="num">'+money(0)+'</span></div>':'')+
      pl('Total costs', p.costs)+
      '<div class="pl-line pl-total"><span>'+(p.profit>=0?'Net profit':'Net loss')+'</span>'+
        '<span class="num '+(p.profit>=0?'money-pos':'money-neg')+'">'+money(Math.abs(p.profit))+'</span></div>'+
    '</div>'+
    '<div class="note" style="margin-top:14px">Freight is counted when the trip is recorded, whether or not the party has paid yet. Pending collection sits in <b>Party dues</b>.</div>';
  }
  if(sub.tab==='party'){
    const bmap = allBalances(); const tc = {};
    DB.trips.forEach(t=>{ tc[t.partyId] = (tc[t.partyId]||0)+1; });
    const rows = DB.parties.map(x=>({name:x.name, id:x.id, bal:bmap[x.id]||0,
      trips:tc[x.id]||0})).filter(x=>x.bal!==0).sort((a,b)=>b.bal-a.bal);
    const tot = rows.reduce((s,r)=>s+Math.max(0,r.bal),0);
    body = rows.length? '<div class="card"><div class="tbl-wrap"><table>'+
      '<thead><tr><th>Party</th><th class="t-r">Trips</th><th class="t-r">Balance</th><th></th></tr></thead><tbody>'+
      rows.map(r=>'<tr><td class="t-strong">'+esc(r.name)+'</td><td class="t-r num">'+r.trips+'</td>'+
        '<td class="t-r num '+(r.bal>0?'money-neg':'money-pos')+'">'+money(Math.abs(r.bal))+'</td>'+
        '<td class="t-sub">'+(r.bal>0?'to collect':'advance held')+'</td></tr>').join('')+
      '</tbody><tfoot><tr><th>Total receivable</th><th></th>'+
      '<th class="t-r num" style="font-size:14px;color:var(--red)">'+money(tot)+'</th><th></th></tr></tfoot></table></div></div>'
      : empty('Nothing outstanding','Every party is settled up, or you have not recorded any trips yet.','');
  }
  if(sub.tab==='truck'){
    const inR = d => (!sub.from||d>=sub.from) && (!sub.to||d<=sub.to);
    const rows = DB.trucks.map(t=>{
      const trips = DB.trips.filter(x=>x.truckId===t.id && inR(x.date));
      const freight = trips.reduce((s,x)=>s+num(x.freight),0);
      const hire = trips.reduce((s,x)=>s+num(x.hire),0);
      const exp = DB.expenses.filter(e=>e.truckId===t.id && inR(e.date)).reduce((s,e)=>s+num(e.amount),0);
      return {t, n:trips.length, freight, hire, exp, net:freight-hire-exp};
    }).filter(r=>r.n||r.exp).sort((a,b)=>b.net-a.net);
    body = rows.length? '<div class="card"><div class="tbl-wrap"><table>'+
      '<thead><tr><th>Truck</th><th class="t-r">Trips</th><th class="t-r">Freight</th><th class="t-r">Hire</th>'+
      '<th class="t-r">Expenses</th><th class="t-r">Net</th></tr></thead><tbody>'+
      rows.map(r=>'<tr><td><span class="t-strong num">'+esc(r.t.number)+'</span> '+
        (r.t.type==='market'?'<span class="chip chip-grey">Market</span>':'')+'</td>'+
        '<td class="t-r num">'+r.n+'</td><td class="t-r num">'+money(r.freight)+'</td>'+
        '<td class="t-r num">'+(r.hire?money(r.hire):'—')+'</td><td class="t-r num">'+money(r.exp)+'</td>'+
        '<td class="t-r num '+(r.net>=0?'money-pos':'money-neg')+'">'+money(r.net)+'</td></tr>').join('')+
      '</tbody></table></div></div>'
      : empty('No truck activity','No trips or expenses recorded for your trucks in this period.','');
  }
  if(sub.tab==='expense'){
    const entries = Object.entries(p.byCat).sort((a,b)=>b[1]-a[1]);
    const tot = p.expense;
    body = entries.length? '<div class="card card-pad">'+entries.map(([c,v])=>{
      const pct = Math.round(v/tot*100);
      return '<div style="margin-bottom:13px"><div style="display:flex;font-size:13.5px;margin-bottom:5px">'+
        '<span class="t-strong">'+esc(c)+'</span><span class="num" style="margin-left:auto">'+money(v)+' · '+pct+'%</span></div>'+
        '<div style="height:8px;background:var(--line-soft);border-radius:4px;overflow:hidden">'+
        '<div style="height:100%;width:'+pct+'%;background:var(--amber)"></div></div></div>';
    }).join('')+'<div class="divide"></div><div class="pl-line pl-total"><span>Total expenses</span>'+
      '<span class="num">'+money(tot)+'</span></div></div>'
      : empty('No expenses in this period','Change the date range, or record expenses to see the split.','');
  }
  $('#view').innerHTML = filters + tabs + body;
}
function pl(label, v){ return '<div class="pl-line"><span>'+label+'</span><span class="num">'+money(v)+'</span></div>'; }
function quickRange(k){
  const d = new Date();
  if(k==='month'){ sub.from = thisMonth()+'-01'; sub.to = today(); }
  if(k==='last'){
    const l = new Date(d.getFullYear(), d.getMonth()-1, 1);
    const key = l.toISOString().slice(0,7);
    sub.from = key+'-01';
    sub.to = new Date(d.getFullYear(), d.getMonth(), 0).toISOString().slice(0,10);
  }
  if(k==='fy'){
    const y = d.getMonth()>=3 ? d.getFullYear() : d.getFullYear()-1;
    sub.from = y+'-04-01'; sub.to = today();
  }
  if(k==='all'){ sub.from = '2000-01-01'; sub.to = '2099-12-31'; }
  viewReports();
}

function cloudPanel(){
  const onFile = isLocalFile();
  const s = CLOUD.state;
  const statusLine = {
    off:'<span class="chip chip-grey">Not set up</span>',
    ready:'<span class="chip chip-amber">Not connected</span>',
    connecting:'<span class="chip chip-amber">Connecting…</span>',
    syncing:'<span class="chip chip-amber">Saving…</span>',
    on:'<span class="chip chip-green">Connected</span>',
    error:'<span class="chip chip-red">Problem</span>'
  }[s] || '';

  return '<div class="card card-pad" style="margin-bottom:16px">'+
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">'+
      '<h3 class="card-title" style="margin:0">Google Drive sync</h3>'+statusLine+'</div>'+
    '<p class="hint" style="margin:0 0 14px;max-width:600px">Keeps one data file inside a folder called '+
      '\u201cMaa Vandana Logistics\u201d in your own Drive, so your phone and laptop stay in step. '+
      'This app can only touch the file it creates \u2014 it cannot see anything else in your Drive.</p>'+
    (onFile
      ? '<div class="note" style="border-color:#E8CFCB;background:var(--red-soft)">'+
        '<b>This file is open from your computer, not a web address.</b><br>'+
        'Google will not allow sign-in this way. Put the app online first \u2014 the steps below explain how.</div>'
      : '')+
    (CLOUD.message ? '<div class="note" style="margin-bottom:12px">'+esc(CLOUD.message)+'</div>' : '')+
    '<div class="form-grid" style="margin-top:12px">'+
      fText('g_client','Google Client ID', CLOUD.clientId,'text','placeholder="1234567890-abcdef.apps.googleusercontent.com"')+
      '<div class="field"><label>&nbsp;</label><span class="hint">Created once in Google Cloud, then pasted here. Steps are below.</span></div>'+
    '</div>'+
    '<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:14px">'+
      '<button class="btn btn-primary" onclick="saveClientId()">'+(CLOUD.clientId?'Save and connect':'Connect Google Drive')+'</button>'+
      (cloudReady()
        ? '<button class="btn" onclick="cloudPush(true);toast(\'Sending to Drive\')">Sync now</button>'+
          '<button class="btn btn-danger" onclick="cloudDisconnect()">Disconnect</button>'
        : '')+
    '</div>'+
    (CLOUD.lastSync? '<div class="hint" style="margin-top:10px">Last saved to Drive on '+
      fdate(CLOUD.lastSync.slice(0,10))+' at '+CLOUD.lastSync.slice(11,16)+'</div>':'')+
    '<div class="divide"></div>'+
    '<div class="sec-title" style="margin-top:0">One-time setup</div>'+
    [ 'Put the app online. On GitHub, create a repository, upload this file renamed to <b>index.html</b> (all lowercase \u2014 this matters), then under <b>Settings \u2192 Pages</b> set the source to the main branch and save.',
      'Open <b>console.cloud.google.com</b> and create a new project. Name it anything.',
      'In that project, open <b>APIs &amp; Services \u2192 Library</b>, search for <b>Google Drive API</b> and press Enable.',
      'Open <b>APIs &amp; Services \u2192 OAuth consent screen</b>. Choose External, fill in the app name and your email, and add yourself as a test user.',
      'Open <b>Credentials \u2192 Create credentials \u2192 OAuth client ID</b>. Pick <b>Web application</b>. Under Authorised JavaScript origins, add only the domain part of your address \u2014 for example <b>https://yourname.github.io</b> \u2014 with no folder name and no slash at the end. Google rejects anything longer.',
      'Copy the Client ID it shows you, paste it in the box above, and press Connect.'
    ].map((t,i)=>'<div class="step"><div class="step-n">'+(i+1)+'</div><p>'+t+'</p></div>').join('')+
  '</div>';
}

function backup(){
  const blob = new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'maa-vandana-backup-'+today()+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Backup downloaded');
}
function restore(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d.trips || !d.parties) throw new Error('bad file');
      confirmAsk('Replace everything currently in the app with this backup?', ()=>{
        DB = Object.assign(JSON.parse(JSON.stringify(BLANK)), d);
        save(); applyBrand(); go('dashboard'); toast('Backup restored');
      });
    }catch(e){ toast('That file is not a Maa Vandana backup'); }
    input.value='';
  };
  r.readAsText(f);
}

function csvCell(v){ const s = String(v==null?'':v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function download(name, rows){
  const csv = rows.map(r=>r.map(csvCell).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click(); URL.revokeObjectURL(a.href);
  toast('CSV downloaded');
}
function exportCSV(what){
  if(what==='trips'){
    download('trips-'+today()+'.csv', [['Date','LR','From','To','Party','Truck','Driver','Material','Weight','Freight','Advance','Hire','Status','Notes']]
      .concat(DB.trips.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>
        [t.date,t.lr,t.from,t.to,partyName(t.partyId),truckName(t.truckId),t.driverId?driverName(t.driverId):'',t.material,t.weight,num(t.freight),num(t.advance),num(t.hire),t.status,t.notes])));
  }
  if(what==='parties'){
    const bal = allBalances();
    const tc = {}; DB.trips.forEach(t=>{ tc[t.partyId]=(tc[t.partyId]||0)+1; });
    download('parties-'+today()+'.csv', [['Party','Phone','City','GST','Opening','Trips','Balance']]
      .concat(DB.parties.map(p=>[p.name,p.phone,p.city,p.gst,num(p.opening),tc[p.id]||0,bal[p.id]||0])));
  }
  if(what==='expenses'){
    download('expenses-'+today()+'.csv', [['Date','Category','Amount','Truck','Paid to','Mode','Details']]
      .concat(DB.expenses.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>
        [e.date,e.category,num(e.amount),e.truckId?truckName(e.truckId):'',e.paidTo,e.mode,e.note])));
  }
}
function exportLedger(pid){
  const p = partyById(pid);
  download('ledger-'+p.name.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'-'+today()+'.csv',
    [['Date','Particulars','Reference','Debit','Credit','Balance']].concat(
      ledgerRows(pid).map(r=>[r.date,r.label,r.ref,r.debit||'',r.credit||'',r.running])));

/* ============================================================
   GOOGLE DRIVE SYNC
   Saves your data as one file inside a "Maa Vandana Logistics"
   folder in your own Google Drive. Uses the drive.file scope,
   which means this app can only ever touch the files it made —
   it cannot see anything else in your Drive.
   ============================================================ */
const FOLDER_NAME = 'Maa Vandana Logistics';
const FILE_NAME   = 'maa-vandana-data.json';
const SCOPE       = 'https://www.googleapis.com/auth/drive.file';

const CLOUD = {
  clientId: localStorage.getItem('mvl_client_id') || '',
  token:'', tokenClient:null, folderId:'', fileId:'',
  state:'off',        // off | ready | connecting | on | syncing | error
  message:'', lastSync: localStorage.getItem('mvl_last_sync') || '', pushTimer:null
};

function cloudSet(state, message){
  CLOUD.state = state; CLOUD.message = message || '';
  const pill = $('#cloudPill'); if(!pill) return;
  if(state==='off'){ pill.hidden = true; return; }
  pill.hidden = false;
  const map = {
    ready:   ['',     'Not connected'],
    connecting:['busy','Connecting…'],
    syncing: ['busy', 'Saving to Drive…'],
    on:      ['on',   CLOUD.lastSync ? 'Saved to Drive' : 'Connected'],
    error:   ['bad',  'Sync problem']
  };
  const [cls, label] = map[state] || ['',''];
  pill.className = 'cloud-pill '+cls;
  pill.innerHTML = '<span class="cloud-dot"></span><span>'+esc(label)+'</span>';
  pill.title = CLOUD.message || label;
  if(route==='settings') viewSettings();
}

function cloudReady(){ return CLOUD.state==='on' || CLOUD.state==='syncing'; }
function isLocalFile(){ return location.protocol === 'file:'; }

/* Load Google's sign-in library, once */
function loadGIS(){
  return new Promise((resolve, reject)=>{
    if(window.google && window.google.accounts) return resolve();
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true;
    s.onload = resolve;
    s.onerror = ()=>reject(new Error('Could not reach Google. Check your internet connection.'));
    document.head.appendChild(s);
  });
}

async function cloudConnect(interactive){
  if(!CLOUD.clientId){ cloudSet('off'); return; }
  if(isLocalFile()){
    cloudSet('error','Google sign-in does not work on a file opened from your computer. The app needs to be on a web address.');
    return;
  }
  try{
    cloudSet('connecting');
    await loadGIS();
    if(!CLOUD.tokenClient){
      CLOUD.tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLOUD.clientId,
        scope: SCOPE,
        callback: (resp)=>{
          if(resp && resp.access_token){ CLOUD.token = resp.access_token; afterSignIn(); }
          else { cloudSet('error','Sign-in was not completed.'); }
        },
        error_callback: (err)=>{
          cloudSet('error', err && err.type==='popup_closed'
            ? 'Sign-in window was closed before finishing.'
            : 'Google refused the sign-in. Check that the web address is listed in your Google Cloud settings.');
        }
      });
    }
    CLOUD.tokenClient.requestAccessToken({prompt: interactive ? 'consent' : ''});
  }catch(e){ cloudSet('error', e.message); }
}

async function afterSignIn(){
  try{
    cloudSet('syncing');
    CLOUD.folderId = await ensureFolder();
    CLOUD.fileId   = await findFile();
    if(CLOUD.fileId){ await cloudPull(true); }
    else { await cloudPush(true); toast('Connected. Your data is now in Google Drive'); }
    cloudSet('on');
  }catch(e){ cloudSet('error', e.message); toast('Could not sync: '+e.message); }
}

/* Every Drive request goes through here, so an expired sign-in retries once */
async function drive(url, opts={}, retried){
  const r = await fetch(url, {...opts, headers:{...(opts.headers||{}), Authorization:'Bearer '+CLOUD.token}});
  if(r.status===401 && !retried){
    await new Promise(res=>{
      CLOUD.tokenClient.callback = resp=>{ CLOUD.token = resp.access_token || ''; res(); };
      CLOUD.tokenClient.requestAccessToken({prompt:''});
    });
    if(!CLOUD.token) throw new Error('Sign-in expired. Connect again from Settings.');
    return drive(url, opts, true);
  }
  if(!r.ok){
    let detail = '';
    try{ detail = (await r.json()).error.message; }catch(e){}
    throw new Error(detail || ('Drive returned error '+r.status));
  }
  return r;
}

async function ensureFolder(){
  const q = encodeURIComponent("name='"+FOLDER_NAME+"' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  const r = await drive('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id)&spaces=drive');
  const j = await r.json();
  if(j.files && j.files.length) return j.files[0].id;
  const c = await drive('https://www.googleapis.com/drive/v3/files?fields=id', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name:FOLDER_NAME, mimeType:'application/vnd.google-apps.folder'})
  });
  return (await c.json()).id;
}

async function findFile(){
  const q = encodeURIComponent("name='"+FILE_NAME+"' and '"+CLOUD.folderId+"' in parents and trashed=false");
  const r = await drive('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,modifiedTime)&spaces=drive');
  const j = await r.json();
  return j.files && j.files.length ? j.files[0].id : '';
}

async function cloudPull(onConnect){
  if(!CLOUD.fileId) return;
  const r = await drive('https://www.googleapis.com/drive/v3/files/'+CLOUD.fileId+'?alt=media');
  const remote = await r.json();
  const rTime = remote.updatedAt || '';
  const lTime = DB.updatedAt || '';
  const localEmpty = DB.trips.length===0 && DB.parties.length===0 && DB.trucks.length===0;

  if(localEmpty || rTime > lTime){
    if(!localEmpty && onConnect){
      return askWhichCopy(remote, rTime, lTime);
    }
    applyRemote(remote);
    toast('Loaded the latest data from Drive');
  } else if(lTime > rTime){
    await cloudPush(true);
  }
}

function applyRemote(remote){
  DB = Object.assign(JSON.parse(JSON.stringify(BLANK)), remote);
  reindex();
  localStorage.setItem(KEY, JSON.stringify(DB));
  applyBrand(); render();
}

let pendingRemote = null;
function askWhichCopy(remote, rTime, lTime){
  pendingRemote = remote;
  const count = o => (o.trips||[]).length+' trips, '+(o.parties||[]).length+' parties, '+(o.expenses||[]).length+' expenses';
  openModal({
    title:'Two copies found',
    body:'<p style="margin:0 0 14px;font-size:14.5px">The copy in Drive and the copy on this device do not match. Which one should be kept?</p>'+
      '<div class="card card-pad" style="margin-bottom:10px"><div class="stat-label">In Google Drive</div>'+
      '<div style="margin-top:5px">'+esc(count(remote))+'</div>'+
      '<div class="hint">Last saved '+(rTime?fdate(rTime.slice(0,10)):'date unknown')+'</div>'+
      '<button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="useDriveCopy()">Use the Drive copy</button></div>'+
      '<div class="card card-pad"><div class="stat-label">On this device</div>'+
      '<div style="margin-top:5px">'+esc(count(DB))+'</div>'+
      '<div class="hint">Last saved '+(lTime?fdate(lTime.slice(0,10)):'date unknown')+'</div>'+
      '<button class="btn btn-sm" style="margin-top:10px" onclick="useDeviceCopy()">Keep this device</button></div>'+
      '<div class="note" style="margin-top:12px">Nothing is overwritten until you choose. If you are unsure, close this and download a backup from Settings first.</div>'
  });
}
function useDriveCopy(){
  if(!pendingRemote) return closeModal();
  applyRemote(pendingRemote); pendingRemote=null; closeModal();
  cloudSet('on'); toast('Now using the Drive copy');
}
function useDeviceCopy(){
  pendingRemote=null; closeModal();
  DB.updatedAt = new Date().toISOString();
  cloudPush(true); toast('Kept this device and sent it to Drive');
}

async function cloudPush(now){
  if(!CLOUD.token || !CLOUD.folderId) return;
  clearTimeout(CLOUD.pushTimer);
  if(!now){ CLOUD.pushTimer = setTimeout(()=>cloudPush(true), 2500); return; }
  try{
    cloudSet('syncing');
    const content = JSON.stringify(DB);
    if(CLOUD.fileId){
      await drive('https://www.googleapis.com/upload/drive/v3/files/'+CLOUD.fileId+'?uploadType=media',
        {method:'PATCH', headers:{'Content-Type':'application/json'}, body:content});
    } else {
      const b = '-------mvl'+Date.now();
      const meta = {name:FILE_NAME, parents:[CLOUD.folderId]};
      const body = '--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+
                   '\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+content+'\r\n--'+b+'--';
      const r = await drive('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
        {method:'POST', headers:{'Content-Type':'multipart/related; boundary='+b}, body});
      CLOUD.fileId = (await r.json()).id;
    }
    CLOUD.lastSync = new Date().toISOString();
    localStorage.setItem('mvl_last_sync', CLOUD.lastSync);
    cloudSet('on');
  }catch(e){
    cloudSet('error', e.message);
  }
}

function cloudDisconnect(){
  confirmAsk('Disconnect Google Drive? Your data stays on this device and in Drive, it just stops syncing.', ()=>{
    if(CLOUD.token && window.google) try{ google.accounts.oauth2.revoke(CLOUD.token); }catch(e){}
    CLOUD.token=''; CLOUD.fileId=''; CLOUD.folderId='';
    cloudSet('ready'); toast('Disconnected from Drive');
  });
}

function saveClientId(){
  const id = val('g_client').trim();
  CLOUD.clientId = id;
  localStorage.setItem('mvl_client_id', id);
  if(id){ cloudSet('ready'); cloudConnect(true); }
  else { cloudSet('off'); toast('Google Drive turned off'); }
}

/* ============================================================
   START
   ============================================================ */
reindex();
if(!DB.seeded && DB.trips.length===0){ seed(); save(); }
applyBrand();
render();
if(CLOUD.clientId){ cloudSet('ready'); cloudConnect(false); }
window.addEventListener('online', ()=>{ if(cloudReady()) cloudPush(true); });
</script>
