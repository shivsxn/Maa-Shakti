<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151A21">
<title>Maa Vandana Logistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Surfaces: warm paper against asphalt — the two materials of the trade */
  /* retained as aliases of the theme tokens */
  --asphalt: var(--side);
  --asphalt-2: var(--side-2);
  --asphalt-3: rgba(255,255,255,.14);
  --asphalt-line: var(--side-line);
  --paper: #F4F2EC;
  --paper-2: #EEECE4;
  --card: #FFFFFF;
  --line: #E2DED4;
  --line-soft: #EEEBE3;
  --line-strong: #D4CFC2;
  --ink: #14181E;
  --ink-2: #39404A;
  --muted: #6C6860;
  --muted-2: #8B867C;

  /* One accent, used sparingly: highway gold */
  --amber: #C9902A;
  --amber-deep: #A8761A;
  --amber-soft: #FAF0DB;
  --amber-line: #E9D6A8;
  --red: #A83227;
  --red-soft: #FAEAE8;
  --red-line: #E9CDC8;
  --green: #1A6A4E;
  --green-soft: #E6F0EB;
  --green-line: #C6DFD3;
  --blue: #27536F;
  --blue-soft: #E8EFF4;
  --blue-line: #CDDCE8;

  /* Elevation stays shallow — this is a working tool, not a toy */
  --sh-1: 0 1px 2px rgba(18,22,28,.05);
  --sh-2: 0 1px 2px rgba(18,22,28,.05), 0 6px 16px -10px rgba(18,22,28,.16);
  --sh-3: 0 2px 4px rgba(18,22,28,.06), 0 18px 40px -18px rgba(18,22,28,.24);
  --sh-4: 0 30px 70px -24px rgba(18,22,28,.38);
  --shadow: var(--sh-2);

  --r-sm: 8px;
  --r: 11px;
  --r-lg: 14px;
  --r-pill: 999px;

  /* A type scale with real steps in it. Everything used to sit between
     11 and 16px, which is why no screen had a shape you could read from
     across the room. */
  --fs-display: 40px;
  --fs-h1: 23px;
  --fs-h2: 15.5px;
  --fs-body: 13.5px;
  --fs-sm: 12.5px;
  --fs-xs: 11px;
  --fs-micro: 10.5px;
  --ring: 0 0 0 3px rgba(201,144,42,.26);
  --sans: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'Courier New', monospace;
  --topbar-h: 60px;
  --side-w: 246px;
}

/* This is a desktop application now. Below the floor the window scrolls
   rather than the layout rearranging itself — one set of proportions to
   reason about instead of three. */
body{min-width:1180px}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(120% 90% at 100% 0%, rgba(224,154,46,.055) 0%, transparent 55%), radial-gradient(90% 70% at 0% 100%, rgba(40,87,122,.04) 0%, transparent 60%);
  background-attachment: fixed;
  letter-spacing: -.005em;
  -moz-osx-font-smoothing: grayscale;
}

button,
input,
select,
textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

.num {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em;
}

/* ---------- App frame ---------- */

.app {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 246px;
  flex: none;
  background: var(--side);
  color: var(--side-ink);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  border-right: 1px solid var(--side-line);
}

.brand {
  padding: 22px 20px 20px;
  border-bottom: 1px solid var(--side-line);
}

.brand-mark {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-badge {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--accent);
  color: var(--on-accent);
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 14.5px;
  letter-spacing: -.02em;
  flex: none;
  box-shadow: 0 2px 10px rgba(224,154,46,.30);
}

.brand-name {
  font-weight: 700;
  font-size: 15.5px;
  letter-spacing: -.02em;
  line-height: 1.25;
}

.brand-tag {
  font-size: 11px;
  color: var(--side-ink-2);
  margin-top: 9px;
  letter-spacing: .06em;
  text-transform: uppercase;
}

.nav {
  padding: 14px 12px 18px;
  overflow-y: auto;
  flex: 1;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 9px 12px;
  margin-bottom: 1px;
  background: none;
  border: 0;
  border-radius: 9px;
  color: var(--side-ink-2);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  text-align: left;
  transition: background .14s, color .14s;
  position: relative;
}

.nav-item:hover {
  background: var(--side-hover);
  color: var(--side-ink);
}

.nav-item.on {
  background: var(--side-on);
  color: var(--side-ink);
  font-weight: 600;
}

.nav-item.on .ic {
  color: var(--amber);
}

.ic {
  width: 19px;
  height: 19px;
  flex: none;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.side-foot {
  padding: 14px 20px 18px;
  border-top: 1px solid var(--side-line);
  font-size: 10.5px;
  color: var(--side-ink-2);
  opacity: .7;
  letter-spacing: .03em;
}

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 26px;
  background: rgba(245,244,241,.86);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: saturate(1.4) blur(10px);
  -webkit-backdrop-filter: saturate(1.4) blur(10px);
}

.page-title {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -.028em;
  margin: 0;
}

.page-sub {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 2px;
}

.topbar-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}

.content {
  padding: 20px 26px 24px;
  max-width: 1320px;
  width: 100%;
}

/* ---------- Buttons ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 0 15px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--card);
  font-weight: 600;
  font-size: 13.5px;
  cursor: pointer;
  transition: background .14s, border-color .14s, box-shadow .14s, transform .1s;
  white-space: nowrap;
  height: 38px;
  box-shadow: var(--sh-1);
}

.btn:hover {
  border-color: var(--line-strong);
  background: #FCFBF9;
  box-shadow: var(--sh-2);
}

.btn-primary {
  background: var(--side);
  border-color: var(--side);
  color: #fff;
}

.btn-primary:hover {
  background: var(--side-2);
  border-color: var(--side-2);
}

.btn-amber {
  background: var(--amber);
  border-color: var(--amber);
  color: var(--side);
  box-shadow: 0 1px 2px rgba(224,154,46,.35), 0 6px 16px rgba(224,154,46,.22);
}

.btn-amber:hover {
  background: var(--accent-2);
  border-color: var(--accent-2);
}

.btn-danger {
  color: var(--red);
  border-color: var(--red-line);
}

.btn-danger:hover {
  background: var(--red-soft);
}

.btn-sm {
  padding: 0 11px;
  font-size: 12.5px;
  border-radius: 7px;
  height: 32px;
}

.btn-icon {
  padding: 0;
  border-radius: 7px;
  width: 38px;
}

.btn:focus-visible,
.nav-item:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
.tab:focus-visible {
  outline: 2px solid var(--amber);
  outline-offset: 2px;
}

/* ---------- Cards & grid ---------- */

.grid {
  display: grid;
  gap: 11px;
}

.g5 {
  grid-template-columns: repeat(5,1fr);
}

.g4 {
  grid-template-columns: repeat(4,1fr);
}

.g3 {
  grid-template-columns: repeat(3,1fr);
}

.g2 {
  grid-template-columns: repeat(2,1fr);
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--sh-2);
}

.card-pad {
  padding: 13px 16px;
}

.card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 15px 18px;
  border-bottom: 1px solid var(--line-soft);
}

.card-title {
  font-size: 14.5px;
  font-weight: 700;
  letter-spacing: -.015em;
  margin: 0;
}

.card-head .btn {
  margin-left: auto;
}

.stat {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 12px 15px;
  box-shadow: var(--sh-2);
}

.stat-label {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
}

.stat-value {
  font-family: var(--mono);
  font-size: 23px;
  font-weight: 600;
  letter-spacing: -.035em;
  margin-top: 7px;
  font-variant-numeric: tabular-nums;
}

.stat-note {
  font-size: 12px;
  color: var(--muted);
  margin-top: 5px;
}

.stat.accent {
  border-left: 3px solid var(--amber);
}

.stat.pos .stat-value {
  color: var(--green);
}

.stat.neg .stat-value {
  color: var(--red);
}

/* ---------- Tables ---------- */

.tbl-wrap {
  overflow-x: auto;
  overflow: auto;
  border-radius: var(--r);
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  text-align: left;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 8px 13px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
  background: var(--paper-2);
  position: sticky;
  top: 0;
  z-index: 2;
}

td {
  padding: 9px 13px;
  border-bottom: 1px solid var(--line-soft);
  font-size: 14px;
  vertical-align: middle;
}

tr:last-child td {
  border-bottom: 0;
}

tbody tr:hover {
  background: #FBFAF7;
}

.t-r {
  text-align: right;
}

.t-c {
  text-align: center;
}

.t-strong {
  font-weight: 600;
}

.t-sub {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}

.row-actions {
  display: flex;
  gap: 5px;
  justify-content: flex-end;
}

/* ---------- Chips & the stamp ---------- */

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .01em;
  white-space: nowrap;
}

.chip-grey {
  background: #F0EEE8;
  color: var(--muted);
}

.chip-amber {
  background: var(--amber-soft);
  color: var(--amber);
}

.chip-red {
  background: var(--red-soft);
  color: var(--red);
}

.chip-green {
  background: var(--green-soft);
  color: var(--green);
}

.chip-blue {
  background: var(--blue-soft);
  color: var(--blue);
}

/* signature element: rubber-stamp status on the LR slip */

.stamp {
  display: inline-block;
  padding: 5px 12px 4px;
  border: 2.5px solid currentColor;
  border-radius: 4px;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: .16em;
  text-transform: uppercase;
  transform: rotate(-6deg);
  opacity: .82;
  font-family: var(--sans);
}

.stamp-paid {
  color: var(--green);
}

.stamp-pending {
  color: var(--red);
}

.stamp-part {
  color: var(--amber);
}

/* LR slip */

.slip {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.slip-top {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 15px 18px;
  background: var(--card-2);
  border-bottom: 1px dashed var(--line);
}

.slip-lr {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .04em;
  color: var(--muted);
}

.slip-route {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -.02em;
  margin-top: 3px;
}

.slip-body {
  padding: 15px 18px;
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 14px;
}

.field-label {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--muted);
}

.field-value {
  font-size: 14px;
  font-weight: 500;
  margin-top: 3px;
  word-break: break-word;
}

/* ---------- Forms ---------- */

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 12px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.field.full {
  grid-column: 1/-1;
}

label {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-2);
  letter-spacing: .01em;
}

input,
select,
textarea {
  width: 100%;
  padding: 9px 11px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--card);
  font-size: 14px;
  transition: border-color .14s, box-shadow .14s;
  height: 36px;
}

input:focus,
select:focus,
textarea:focus {
  border-color: rgba(255,255,255,.14);
  outline-offset: 1px;
  box-shadow: 0 0 0 3px rgba(40,49,63,.10);
  outline: none;
}

input[type=number] {
  font-family: var(--mono);
}

textarea {
  resize: vertical;
  min-height: 60px;
  height: auto;
  padding: 11px 12px;
  line-height: 1.5;
}

.hint {
  font-size: 11.5px;
  color: var(--muted);
}

.seg {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.seg input {
  display: none;
}

.seg label {
  padding: 8px 13px;
  border: 1px solid var(--line);
  border-radius: 8px;
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 600;
  background: #fff;
}

.seg input:checked+label {
  background: var(--side);
  border-color: var(--side);
  color: #fff;
}

/* ---------- Modal ---------- */

/* A dialog fills the room to the right of the rail rather than floating
   in the middle of it — there is no second screen size to design for now,
   so the work gets all the space there is. */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(17,22,33,.40);
  z-index: 100;
  overflow: hidden;
  animation: fade .15s ease-out;
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}

@keyframes fade {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

.modal {
  position: absolute;
  left: var(--side-w);
  right: 0;
  top: 0;
  bottom: 0;
  width: auto;
  max-width: none;
  margin: 0;
  background: var(--card);
  border-radius: 0;
  border-left: 1px solid var(--line);
  box-shadow: -24px 0 60px -30px rgba(17,22,33,.34);
  display: flex;
  flex-direction: column;
  animation: panelIn .26s var(--ease-out);
}

@keyframes panelIn{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}

/* A yes-or-no question is not a workspace, so it keeps a dialog's shape */
.modal-ask {
  position: static;
  margin: 10vh auto 0;
  width: 100%;
  max-width: 470px;
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  box-shadow: 0 30px 70px -20px rgba(17,22,33,.40);
  animation: pop .18s cubic-bezier(.2,.9,.3,1.1);
}
.overlay:has(> .modal-ask){overflow-y:auto}

@keyframes pop {
  from {
    transform: translateY(10px) scale(.99);
    opacity: 0;
  }

  to {
    transform: none;
    opacity: 1;
  }
}

.modal-head {
  display: flex;
  align-items: center;
  padding: 18px 22px;
  border-bottom: 1px solid var(--line-soft);
  position: sticky;
  top: 0;
  background: var(--card);
  z-index: 3;
  border-radius: var(--r-lg) var(--r-lg) 0 0;
}

.modal-title {
  font-size: 16.5px;
  font-weight: 700;
  letter-spacing: -.01em;
  margin: 0;
}

.modal-body {
  padding: 18px 22px 22px;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}

.modal-foot {
  display: flex;
  gap: 9px;
  justify-content: flex-end;
  padding: 14px 22px;
  border-top: 1px solid var(--line-soft);
  background: var(--card);
  border-radius: 0 0 14px 14px;
  position: sticky;
  bottom: 0;
  z-index: 3;
}

.x {
  margin-left: auto;
  flex: 0 0 auto;
  background: none;
  border: 0;
  font-size: 24px;
  line-height: 1;
  color: var(--muted);
  cursor: pointer;
  padding: 0 4px;
}

/* ---------- Misc ---------- */

.toolbar {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 10px;
}

.filters {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--sh-1);
  padding: 9px 12px;
  margin-bottom: 11px;
}

.filter-row {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  align-items: center;
}

.filter-row select,
.filter-row input {
  width: auto;
  min-width: 150px;
  padding: 8px 11px;
  font-size: 13.5px;
}

.filter-row .search {
  flex: 1;
  min-width: 190px;
  max-width: 340px;
}

.filter-row.adv {
  margin-top: 11px;
  padding-top: 11px;
  border-top: 1px solid var(--line-soft);
}

.adv-block {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 11px 14px;
  background: var(--card-2);
}

.adv-head {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}

.adv-total {
  display: flex;
  align-items: center;
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1.5px solid var(--side);
  font-weight: 700;
  font-size: 14px;
}

.adv-balance {
  margin-top: 5px;
  padding-top: 5px;
  border-top: 1px dotted var(--line);
}

.adv-status {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 8px;
  font-size: 12.5px;
  color: var(--muted);
}

.adv-status span:last-child {
  margin-left: auto;
}

.money-amber {
  color: var(--amber);
  font-weight: 600;
}

.adv-total-value {
  margin-left: auto;
  font-size: 16px;
  letter-spacing: -.02em;
}

.doc-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
}

.doc {
  border: 1.5px dashed var(--line);
  border-radius: 10px;
  background: var(--card-2);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 132px;
  position: relative;
}

.doc.filled {
  border-style: solid;
  background: var(--card);
}

.doc-label {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 9px 10px 0;
  text-align: center;
}

.doc-drop {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  padding: 10px;
  text-align: center;
}

.doc-drop:hover {
  background: #F7F5F0;
}

.doc-plus {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--line-soft);

.fpair {

.fpair label {

.toolbar input,

.search {

}

.empty {

}

.empty-title {

}

.empty-text {

.money-pos {

.money-neg {

.tabs {

.divide {

.note {

}

.pl-line {

}

.pl-line span:first-child {

}

.pl-line .num {

}

.pl-total {

.pl-sub {

  font-weight: 400;

/* ---------- Motion ---------- */

@keyframes riseIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes drawLine {
  to {
    stroke-dashoffset: 0;
  }
}

@keyframes growBar {
  from {
    transform: scaleX(0);
  }

  to {
    transform: scaleX(1);
  }
}

@keyframes sweep {
  from {
    stroke-dashoffset: var(--circ);
  }

  to {
    stroke-dashoffset: var(--off);
  }
}

/* ---------- Charts ---------- */

@keyframes fadeSeries {
  to {
    opacity: 1;
  }
}

/* ---------- KPI tiles ---------- */




.gate {
  position: fixed;
  inset: 0;
  z-index: 150;

}

.gate-card {

}

.gate-brand {

}

.gate-name {

.gate-tag {

}

.gate-title {
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -.02em;
  margin: 0 0 6px;
}

.gate-sub {

  margin: 0 0 20px;
  line-height: 1.5;
}

.gate-error {
  background: var(--red-soft);
  border: 1px solid var(--red-line);

  border-radius: 8px;

}

.gate-go {

  margin-top: 16px;

}

.gate-google {
  width: 100%;

}

.gate-foot {

.gate-foot a {

.rules {

}


.cloud-pill {

}

.cloud-pill:hover {

}

/* A class that sets display will override the hidden attribute, so every
   element we hide this way needs an explicit rule. */

.cloud-pill[hidden],
.bell[hidden],
.gate[hidden],
[hidden] {
  display: none!important;
}

.cloud-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--muted);
  flex: none;
}

.cloud-pill.on {

  background: var(--green-soft);
}

.cloud-pill.on .cloud-dot {
  background: var(--green);
}

.cloud-pill.busy {
  color: var(--amber);
  border-color: var(--amber-line);
  background: var(--amber-soft);
}

.cloud-pill.busy .cloud-dot {
  background: var(--amber);
  animation: pulse 1s infinite;
}

.cloud-pill.bad {
  color: var(--red);
  border-color: var(--red-line);
  background: var(--red-soft);
}

.cloud-pill.bad .cloud-dot {
  background: var(--red);
}

@keyframes pulse {
  0%, 100% {
    opacity: 1;
  }

  50% {
    opacity: .35;
  }
}


/* ---------- Motion ---------- */

@keyframes riseIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes drawLine {
  to {
    stroke-dashoffset: 0;
  }
}

@keyframes growBar {
  from {
    transform: scaleX(0);
  }

  to {
    transform: scaleX(1);
  }
}

@keyframes sweep {
  from {
    stroke-dashoffset: var(--circ);
  }

  to {
    stroke-dashoffset: var(--off);
  }
}

.rise > * {
  animation: riseIn .34s cubic-bezier(.2,.8,.3,1) backwards;
}

.rise > *:nth-child(1) {
  animation-delay: .02s;
}

.rise > *:nth-child(2) {
  animation-delay: .06s;
}

.rise > *:nth-child(3) {
  animation-delay: .10s;
}

.rise > *:nth-child(4) {
  animation-delay: .14s;
}

.rise > *:nth-child(5) {
  animation-delay: .18s;
}

.rise > *:nth-child(6) {
  animation-delay: .22s;
}

.rise > *:nth-child(7) {
  animation-delay: .26s;
}

.rise > *:nth-child(8) {
  animation-delay: .30s;
}

.view-in {
  animation: riseIn .26s cubic-bezier(.2,.8,.3,1);
}

.btn:active {
  transform: translateY(1px);
}

tbody tr {
  transition: background .12s;
}

/* ---------- Charts ---------- */

.chart {
  width: 100%;
  height: auto;
  display: block;
}

.chart .grid-line {
  stroke: var(--line-soft);
  stroke-width: 1;
}

.chart .axis-text {
  fill: var(--muted);
  font-family: var(--mono);
  font-size: 10px;
}

.chart .series-line {
  fill: none;
  stroke-width: 2.25;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 4000;
  stroke-dashoffset: 4000;
  animation: drawLine 1.1s cubic-bezier(.3,.8,.4,1) forwards;
}

.chart .series-dashed {
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 6 5;
  stroke-dashoffset: 0;
  opacity: 0;
  animation: fadeSeries .5s .5s forwards;
}

@keyframes fadeSeries {
  to {
    opacity: 1;
  }
}

.chart .series-dot {
  stroke: var(--card);
  stroke-width: 2;
}

.legend {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 2px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
}

.legend-key {
  width: 11px;
  height: 3px;
  border-radius: 2px;
  flex: none;
}

.donut-hole {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
}

.donut-seg {
  --circ: 0;
  --off: 0;
  stroke-dashoffset: var(--circ);
  animation: sweep .95s cubic-bezier(.3,.8,.4,1) forwards;
}

.bar-row {
  margin-bottom: 12px;
}

.bar-head {
  display: flex;
  align-items: baseline;
  font-size: 13px;
  margin-bottom: 5px;
  gap: 10px;
}

.bar-head .bar-name {
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.bar-head .bar-val {
  margin-left: auto;
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  white-space: nowrap;
}

.bar-track {
  height: 9px;
  background: var(--line-soft);
  border-radius: 5px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  border-radius: 5px;
  transform-origin: left center;
  animation: growBar .8s cubic-bezier(.3,.8,.4,1) backwards;
}

/* ---------- Responsive ---------- */



@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }

  .chart .series-line {
    stroke-dashoffset: 0;
  }

  .chart .series-dashed {
    opacity: 1;
  }

  .donut-seg {
    stroke-dashoffset: var(--off);
  }

  .bar-fill {
    transform: none;
  }
}

@media print {
  .sidebar,
  .topbar,
  .mobile-nav,
  .toolbar,
  .filters,
  .range,
  .btn,
  .row-actions,
  .bell {
    display: none !important;
  }

  .content {
    padding: 0;
    max-width: none;

  .card {
    box-shadow: none;
    break-inside: avoid;

    background: #fff;

  margin-bottom: 7px;
}

/* inside the header it is a strip, not a full-width panel */
.trip-top .trip-totals {
  margin: 0;
  padding: 4px 11px;
  gap: 4px 16px;
}

.trip-tabs {
  margin-bottom: 9px;
}

/* the route alone does not say which vehicle you are editing */
.title-truck {
  display: inline-block;
  margin-left: 10px;
  padding: 2px 9px;
  border-radius: 6px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .02em;
  color: var(--ink);
  vertical-align: middle;
  white-space: nowrap;
}

.trip-pane {
  min-height: 140px;
}

.trip-tabs .tab {
  display: inline-flex;
  align-items: center;
  font-size: 14px;
  padding: 10px 16px;
  transition: color .12s,border-color .12s;
}

@keyframes paneIn {
  from {
    opacity: 0;
    transform: translateY(4px);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

.pane-in {
  animation: paneIn .16s ease-out;
}

.form-grid.three {
  grid-template-columns: repeat(3,1fr);
}

.form-grid.four {
  grid-template-columns: repeat(4, minmax(150px, 210px));
  justify-content: start;
}

/* a note that belongs to the grid above it, not a cell of its own */
.grid-hint {
  display: block;
  margin: 5px 0 0;
}


@media (max-width:1100px) { .grid.g5{grid-template-columns:repeat(3,1fr)} }
/* the pass above tightened the controls for a mouse; a phone keeps a
   full-size target and a little more room between rows */


.trip-cols {
  display: grid;
  grid-template-columns: 1.1fr .9fr;
  gap: 16px;
  align-items: start;
}

.trip-nav {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}

.trip-nav .hint {
  margin: 0 6px;
}

.trip-nav .btn[disabled] {
  opacity: .4;
  cursor: default;
}

.trip-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 14px;
}

.trip-actions .btn {
  justify-content: center;
}


.pod-files {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 13px 15px;
  background: var(--card-2);
  margin-top: 14px;
  position: relative;
}

.pod-thumbs {

  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.pod-thumb {
  position: relative;
  width: 104px;
  height: 104px;
  border-radius: 9px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--card);

.pod-thumb img {
  width: 100%;
  height: 100%;

  display: block;
}

.pod-page {

  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}


h1,
h2,
h3 {
  letter-spacing: -.022em;
}

::-webkit-scrollbar {

  height: 10px;
}

::-webkit-scrollbar-track {

.toast {

.kpi:hover {

.empty-icon {

.row-actions .btn {

tbody tr:last-child td {

.hero-chip.amber .dot {

.hero-chip .go {

.hero-side {

/* ============================================================
   DESIGN SYSTEM
   Cool neutral surfaces, one restrained accent, and colour used
   only to mean something: green settled, amber waiting, red owed.
   Three themes; the one in use is set on <html data-theme>.
   ============================================================ */

/* ---------- palette ----------
   Every surface, every line and every piece of text is a token, so a
   theme is a list of colours and nothing else has to know. Three of
   them: a light room, a light room with a dark rail, and night.

   The names say what a thing IS, not what colour it happens to be —
   --card, --side-ink, --on-accent — which is the only reason a real
   dark theme is possible here at all. */
:root, [data-theme="daylight"]{
  /* surfaces */
  --bg:#F6F7F9; --bg-2:#EFF2F6; --card:#FFFFFF; --card-2:#F8FAFC;
  --side:#FFFFFF; --side-2:#F6F7F9; --side-line:#E5E9EF;
  --side-ink:#0B1220; --side-ink-2:#64748B; --side-hover:#F1F4F8; --side-on:#E9EEF6;
  /* lines and text */
  --line:#E5E9EF; --line-soft:#F0F3F7; --line-strong:#CDD5E0;
  --ink:#0B1220; --ink-2:#334155; --muted:#64748B; --muted-2:#94A3B8;
  /* the one accent */
  --accent:#3557F0; --accent-2:#2743C4; --accent-soft:#EEF3FF; --accent-line:#CBD9FE;
  --on-accent:#FFFFFF;
  /* the solid button */
  --btn-bg:#0B1220; --btn-bg-2:#000000; --btn-ink:#FFFFFF;
  /* the headline panel */
  --hero-bg:#FFFFFF; --hero-ink:#0B1220; --hero-ink-2:#64748B;
  --hero-line:#E5E9EF; --hero-chip:#F6F7F9; --hero-chip-line:#E5E9EF;
  --hero-sh:var(--sh-2);
  /* meaning, never decoration */
  --amber:#B0741A; --amber-soft:#FDF4E4; --amber-line:#EEDCB6;
  --red:#B42318; --red-soft:#FDECEA; --red-line:#F2CFCB;
  --green:#0F6B4C; --green-soft:#E7F3EE; --green-line:#C2E0D3;
  --blue:#1E5A86; --blue-soft:#E9F1F7; --blue-line:#CBDFEC;
  --pos-dark:#0F6B4C; --neg-dark:#B42318;
  /* Chart hues, in a fixed order that is never cycled. Both sets were run
     through the six checks — lightness band, chroma floor, colourblind
     separation on every adjacent pair, the normal-vision floor and
     contrast against their own surface — and both pass. The dark row is
     not the light row lightened; it is stepped for a dark ground, which
     is a different band (L .48–.67 rather than .43–.77). */
  --c1:#3B6FE0; --c2:#C4841F; --c3:#0E8F82; --c4:#D4544A;
  --c5:#7C68D9; --c6:#2F8F4E; --c7:#B04E9A; --c8:#6F7D1C;
  --topbar-h:58px;
}

[data-theme="midnight"]{
  --bg:#F5F7FA; --bg-2:#EDF1F6; --card:#FFFFFF; --card-2:#F8FAFC;
  --side:#0F1520; --side-2:#0A0F18; --side-line:rgba(255,255,255,.08);
  --side-ink:#FFFFFF; --side-ink-2:rgba(255,255,255,.52);
  --side-hover:rgba(255,255,255,.06); --side-on:rgba(255,255,255,.11);
  --line:#E2E8F0; --line-soft:#EEF2F7; --line-strong:#C7D0DC;
  --ink:#0D1526; --ink-2:#31415A; --muted:#617289; --muted-2:#93A1B5;
  --accent:#2563EB; --accent-2:#1A4CC4; --accent-soft:#EAF1FE; --accent-line:#C4D8FC;
  --on-accent:#FFFFFF;
  --btn-bg:#0D1526; --btn-bg-2:#000000; --btn-ink:#FFFFFF;
  --hero-bg:linear-gradient(135deg,#0F1520 0%,#16202F 100%);
  --hero-ink:#FFFFFF; --hero-ink-2:rgba(255,255,255,.62);
  --hero-line:rgba(255,255,255,.10); --hero-chip:rgba(255,255,255,.06);
  --hero-chip-line:rgba(255,255,255,.11);
  --hero-sh:0 2px 4px rgba(13,21,38,.10), 0 20px 44px -20px rgba(13,21,38,.35);
  --amber:#B0741A; --amber-soft:#FDF4E4; --amber-line:#EEDCB6;
  --red:#B42318; --red-soft:#FDECEA; --red-line:#F2CFCB;
  --green:#0F6B4C; --green-soft:#E7F3EE; --green-line:#C2E0D3;
  --blue:#1E5A86; --blue-soft:#E9F1F7; --blue-line:#CBDFEC;
  --pos-dark:#5BE0A8; --neg-dark:#FF9B8D;
  --c1:#3B6FE0; --c2:#C4841F; --c3:#0E8F82; --c4:#D4544A;
  --c5:#7C68D9; --c6:#2F8F4E; --c7:#B04E9A; --c8:#6F7D1C;
  --topbar-h:58px;
}

[data-theme="carbon"]{
  --bg:#0B0F15; --bg-2:#111721; --card:#141B25; --card-2:#111823;
  --side:#0B0F15; --side-2:#070A0F; --side-line:rgba(255,255,255,.07);
  --side-ink:#EAEEF5; --side-ink-2:rgba(234,238,245,.48);
  --side-hover:rgba(255,255,255,.05); --side-on:rgba(255,255,255,.10);
  --line:#222B38; --line-soft:#1A2129; --line-strong:#33404F;
  --ink:#E9EEF5; --ink-2:#B7C2D0; --muted:#8593A5; --muted-2:#68768A;
  --accent:#6493F5; --accent-2:#85AAF8; --accent-soft:#16233C; --accent-line:#274069;
  --on-accent:#08111F;
  --btn-bg:#E9EEF5; --btn-bg-2:#FFFFFF; --btn-ink:#0B0F15;
  --hero-bg:linear-gradient(135deg,#151D28 0%,#1A2432 100%);
  --hero-ink:#F2F5FA; --hero-ink-2:rgba(242,245,250,.60);
  --hero-line:rgba(255,255,255,.09); --hero-chip:rgba(255,255,255,.05);
  --hero-chip-line:rgba(255,255,255,.10);
  --hero-sh:0 2px 4px rgba(0,0,0,.30), 0 18px 40px -20px rgba(0,0,0,.55);
  /* on a dark ground the same hues have to come up in lightness to keep
     their contrast, and their soft fills go down instead of up */
  --amber:#E4A44A; --amber-soft:#2A1F0D; --amber-line:#493516;
  --red:#F0796B; --red-soft:#2B1512; --red-line:#4C2521;
  --green:#43C495; --green-soft:#0F2620; --green-line:#1D4436;
  --blue:#6FB0E4; --blue-soft:#10202C; --blue-line:#1F3B52;
  --pos-dark:#43C495; --neg-dark:#F0796B;
  --c1:#5A87ED; --c2:#BC8A2A; --c3:#22A092; --c4:#E4685C;
  --c5:#8F7DE4; --c6:#43A464; --c7:#C466AE; --c8:#869723;
  --topbar-h:58px;
}

/* ---------- page ---------- */
body{
  background:var(--bg);
  background-image:none;
  color:var(--ink);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3{letter-spacing:-.021em}

/* ---------- scrollbars ---------- */
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:999px;
  border:3.5px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted-2);background-clip:content-box}
.sidebar *{scrollbar-color:var(--line-strong) transparent}
.sidebar ::-webkit-scrollbar-thumb{background:var(--line-strong);background-clip:content-box}

/* ---------- sidebar ---------- */
.sidebar{background:linear-gradient(180deg,var(--side) 0%,var(--side-2) 100%);
  border-right:1px solid var(--side-line)}
.brand{padding:20px 18px 16px;border-bottom:1px solid var(--side-line)}
.brand-badge{background:var(--accent);color:var(--on-accent);border-radius:10px;box-shadow:none;font-weight:700}
.brand-name{font-size:14.5px;line-height:1.25;color:var(--side-ink)}
.brand-tag{font-size:10px;color:var(--side-ink-2);letter-spacing:.14em;margin-top:8px}
.nav{padding:10px 10px}
.nav-item{
  border-radius:8px;padding:9px 11px;gap:11px;font-size:13.5px;font-weight:500;
  color:var(--side-ink-2);transition:background .13s,color .13s;
}
.nav-item:hover{background:var(--side-hover);color:var(--side-ink)}
.nav-item.on{background:var(--side-on);color:var(--side-ink);font-weight:600}
.nav-item.on .ic{color:var(--accent)}
.nav-item .ic{opacity:.9}
.side-foot{color:var(--side-ink-2);opacity:.72;font-size:10.5px;border-top:1px solid var(--side-line)}

/* ---------- top bar ---------- */
.topbar{
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(8px);
  -webkit-backdrop-filter:saturate(1.4) blur(8px);
  border-bottom:1px solid var(--line);
  padding:14px 26px;
}
.page-title{font-size:var(--fs-h1);font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:1px}

/* ---------- surfaces ---------- */
.card,.stat,.kpi,.filters,.range{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 1px 2px rgba(17,24,39,.04);
}
.card{overflow:visible}
.card-head{padding:14px 18px;border-bottom:1px solid var(--line-soft);background:transparent}

/* ---------- KPI: one primary number, the rest subordinate ---------- */
.kpi{padding:13px 15px;transition:box-shadow .16s,border-color .16s}
.kpi:hover{box-shadow:0 4px 14px -6px rgba(17,24,39,.18);border-color:var(--line-strong)}
.kpi-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi-value{font-size:26px;letter-spacing:-.035em;margin-top:8px;color:var(--ink)}
.kpi-foot{font-size:11.5px;color:var(--muted-2);padding-top:9px}

/* ---------- buttons ---------- */
.btn{
  border-radius:8px;font-weight:600;min-height:38px;border:1px solid var(--line);
  background:var(--card);color:var(--ink-2);
  transition:background .13s,border-color .13s,color .13s;
}
.btn:hover{background:var(--bg-2);border-color:var(--line-strong);color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-ink)}
.btn-primary:hover{background:var(--btn-bg-2);border-color:var(--btn-bg-2);color:var(--btn-ink)}
.btn-amber{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-amber:hover{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.btn-danger{color:var(--red);border-color:var(--red-line);background:var(--card)}
.btn-danger:hover{background:var(--red-soft);border-color:var(--red)}
.btn:focus-visible,.nav-item:focus-visible,.tab:focus-visible,
input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:none;box-shadow:0 0 0 3px var(--accent-soft),0 0 0 1px var(--accent);
}

/* ---------- fields ---------- */
input,select,textarea{
  border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  transition:border-color .13s,box-shadow .13s;
}
input:hover,select:hover,textarea:hover{border-color:var(--line-strong)}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
}
label{color:var(--ink-2);font-size:12px;font-weight:600}
.hint{color:var(--muted-2)}

/* ---------- tables ---------- */
.card > .tbl-wrap{border-radius:0 0 12px 12px;overflow-x:auto;overflow-y:visible}
th{
  background:var(--card);color:var(--muted);font-size:10.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  border-bottom:1px solid var(--line);
  /* The wrapper is the scroll container, so the offset is measured from
     the top of the card — not from the top bar. Anything else pushes the
     header down over the first row. */
  position:sticky;top:0;z-index:10;
}
td{border-bottom:1px solid var(--line-soft);padding:9px 13px;font-size:13.5px;color:var(--ink-2)}
td.t-strong,.t-strong{color:var(--ink)}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--bg-2)}
tfoot th{position:static;background:var(--bg-2);border-top:1px solid var(--line);border-bottom:0}
.t-sub{color:var(--muted-2);font-size:11.5px;margin-top:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- the trips table ----------
   Eleven columns of equal weight is a spreadsheet, not a screen. What a
   transport office actually asks of this list is four questions: when,
   where, whose lorry, and where the money stands. Everything below serves
   that order. */
.trip-tbl td{vertical-align:middle}
.trip-tbl .c-date{width:110px}
.trip-tbl .c-route{min-width:180px}
.trip-tbl .c-party{width:17%;min-width:132px}
.trip-tbl .c-truck{width:132px;white-space:nowrap}
.trip-tbl .c-money{width:134px}
.trip-tbl .c-pay{width:110px}
.trip-tbl .c-del{width:130px}
.trip-tbl .c-act{width:56px}

/* Opening a trip is a click on the row, so the row is what the keyboard
   lands on — without this, tabbing through the page would skip the list
   entirely now that the Edit button is gone. */
.trip-tbl tbody tr:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.trip-tbl tbody tr:focus:not(:focus-visible){outline:none}

/* Below a wide monitor, eight columns of real data stop fitting side by
   side. Rather than push the last one off the edge and make people scroll
   sideways to see whether a load has been delivered, delivery folds up
   under the payment chip: both facts stay on screen, one column narrower. */
/* Kept on one line: a table lays its columns out from the widest thing
   inside them, so nowrap here is what actually reserves the room, and it
   is what keeps every row exactly two lines tall. */
.stage-inline{display:none;margin-top:5px}
.stage-inline .stage{font-size:11.5px}
@media (max-width:1330px){
  .trip-tbl .c-del{display:none}
  .trip-tbl .stage-inline{display:block}
}
.cell-date{white-space:nowrap;color:var(--ink-2);font-weight:600}
.cell-lr{font-family:var(--mono);font-size:11px;color:var(--muted-2);
  margin-top:2px;letter-spacing:.02em;text-transform:uppercase}

/* From and To are one idea. Splitting them over two columns made every
   long place name wrap twice and pushed the money off the edge. */
.route{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;
  color:var(--ink);font-weight:600;line-height:1.35}
.route-arrow{color:var(--muted-2);font-weight:400;font-size:12.5px}
.route-sub{color:var(--muted-2);font-size:11.5px;margin-top:2px;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.money-main{font-weight:700;color:var(--ink);font-size:13.5px;white-space:nowrap}
.money-sub{color:var(--muted-2);font-size:11.5px;margin-top:2px;white-space:nowrap}

/* Delivery is a place on a journey; payment is money. Different shapes —
   a dot for one, a chip for the other — so the eye can tell the two
   columns apart without reading either of them. */
.stage{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  font-size:12.5px;color:var(--ink-2)}
.stage-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;
  box-shadow:0 0 0 3px var(--card)}
.dot-grey{background:#B4AEA0}
.dot-blue{background:var(--blue)}
.dot-amber{background:var(--amber)}
.dot-green{background:var(--green)}

/* Eight red Delete buttons were the loudest thing on the page. A quiet
   icon that only turns red under the cursor keeps the destructive action
   available without letting it dominate the screen. */
.icon-btn{width:30px;height:30px;display:inline-grid;place-items:center;
  border-radius:8px;border:1px solid var(--line);background:var(--card);
  color:var(--muted-2);cursor:pointer;padding:0;
  transition:color .12s,border-color .12s,background .12s}
.icon-btn:hover{color:var(--red);border-color:var(--red-line);background:var(--red-soft)}
.icon-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ============================================================
   MOTION
   Movement here has one job: to say where a thing came from. Cards
   arrive in the order you would read them, a panel slides from the
   edge it belongs to, a number counts to its value so you notice it
   changed. Nothing loops, nothing bounces, nothing waits to be
   watched — the longest thing on this page is 420ms.
   ============================================================ */
:root{
  --ease: cubic-bezier(.22,.61,.36,1);
  --ease-out: cubic-bezier(.16,1,.3,1);
  --t-fast: .14s;
  --t: .22s;
  --t-slow: .38s;
}

@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes shimmer{from{background-position:-360px 0}to{background-position:360px 0}}
@keyframes drawIn{from{stroke-dashoffset:var(--len,600)}to{stroke-dashoffset:0}}

/* A screen arrives as a whole, then its cards land one after another.
   The stagger is capped so a long list never feels like a queue. */
.view-in{animation:fadeIn var(--t) var(--ease) both}
.rise > *{animation:riseIn var(--t-slow) var(--ease-out) both}
.rise > *:nth-child(1){animation-delay:.02s}
.rise > *:nth-child(2){animation-delay:.06s}
.rise > *:nth-child(3){animation-delay:.10s}
.rise > *:nth-child(4){animation-delay:.14s}
.rise > *:nth-child(5){animation-delay:.17s}
.rise > *:nth-child(6){animation-delay:.20s}
.rise > *:nth-child(n+7){animation-delay:.22s}

/* the line a chart draws in, once */
.chart .ln{stroke-dasharray:var(--len,600);animation:drawIn .9s var(--ease-out) both}

.skeleton{background:linear-gradient(90deg,var(--bg-2) 0%,var(--line-soft) 40%,var(--bg-2) 80%);
  background-size:360px 100%;animation:shimmer 1.2s linear infinite;border-radius:8px;color:transparent}

/* Anyone who has asked their machine to stop moving things gets a
   screen that does not move. Not reduced — stopped. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ---------- the data check ---------- */
.gap-dot{display:block;width:9px;height:9px;border-radius:50%;margin:0 2px}
.gap-high{background:var(--red)}
.gap-med{background:var(--amber)}
.gap-low{background:#B4AEA0}
.check-done{margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft);
  display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--muted-2);font-size:12px}

/* ---------- chips: colour means state, nothing else ---------- */
.chip{border-radius:999px;font-size:11px;font-weight:600;padding:3.5px 10px;letter-spacing:.01em}
.chip-grey{background:var(--bg-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.chip-amber{background:var(--amber-soft);color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber-line)}
.chip-red{background:var(--red-soft);color:var(--red);box-shadow:inset 0 0 0 1px var(--red-line)}
.chip-green{background:var(--green-soft);color:var(--green);box-shadow:inset 0 0 0 1px var(--green-line)}
.chip-blue{background:var(--blue-soft);color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue-line)}

/* ---------- modals ---------- */
.overlay{background:rgba(17,24,39,.45);backdrop-filter:blur(2px)}
.modal{border-radius:14px;box-shadow:0 24px 60px -16px rgba(17,24,39,.35);border:1px solid var(--line)}
/* The panel is the right-hand pane whatever it holds, so what these
   classes carry now is how wide the CONTENT column inside it runs —
   a six-field form should not become six very wide fields just because
   there is room. */
.modal-md .modal-body{max-width:820px}
.modal-lg .modal-body{max-width:1120px}
.modal-head{border-bottom:1px solid var(--line-soft);background:var(--card);position:sticky;top:0;z-index:12}
.modal-foot{background:var(--bg);border-top:1px solid var(--line-soft)}

/* ---------- tabs ---------- */
.tabs{border-bottom:1px solid var(--line)}
.tab{color:var(--muted);font-weight:600;transition:color .13s,border-color .13s}
.tab:hover{color:var(--ink-2)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}

/* ---------- empty states ---------- */
.empty{padding:30px 20px}
.empty-title{font-size:15.5px;font-weight:700;margin-bottom:6px;color:var(--ink)}
.empty-text{color:var(--muted);font-size:13.5px;line-height:1.6}

/* ---------- misc ---------- */
.bell,.cloud-pill{border-radius:8px;border:1px solid var(--line);background:var(--card)}
.cloud-pill{border-radius:999px}
.bell.has{background:var(--red-soft);border-color:var(--red-line);color:var(--red)}
.note{background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--ink-2);border-radius:10px}
.money-pos{color:var(--green)}
.money-neg{color:var(--red)}

/* ---------- the same two meanings, on the dark hero panel ----------
   --green and --red are mixed for white cards; against the hero's
   near-black gradient they fall to about 2.5:1 and the figure fades
   into its own tile. These are the same two colours re-mixed for that
   background, and they read at roughly 9:1. */
:root{ --pos-dark:#5FE3AE; --neg-dark:#FF9B8D; }
.hero .money-pos{color:var(--pos-dark);font-weight:700}
.hero .money-neg{color:var(--neg-dark);font-weight:700}
.hero-stat-foot .trend-up{color:var(--pos-dark)}
.hero-stat-foot .trend-down{color:var(--neg-dark)}
.legend-item{color:var(--muted)}
.fleet-line{color:var(--muted-2)}
.theme-picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.theme-pick{
  display:flex;flex-direction:column;align-items:flex-start;gap:4px;
  padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);
  cursor:pointer;text-align:left;transition:border-color .13s,box-shadow .13s;
}
.theme-pick:hover{border-color:var(--line-strong)}
.theme-pick.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.theme-swatch{display:flex;gap:4px;margin-bottom:6px}
.theme-swatch i{width:18px;height:18px;border-radius:5px;display:block}
.theme-pick[data-theme="daylight"] .s1{background:#FFFFFF;box-shadow:inset 0 0 0 1px #E5E9EF}
.theme-pick[data-theme="daylight"] .s2{background:#3557F0}
.theme-pick[data-theme="daylight"] .s3{background:#EFF2F6}
.theme-pick[data-theme="midnight"] .s1{background:#0F1520}
.theme-pick[data-theme="midnight"] .s2{background:#2563EB}
.theme-pick[data-theme="midnight"] .s3{background:#EDF1F6}
.theme-pick[data-theme="carbon"] .s1{background:#0B0F15}
.theme-pick[data-theme="carbon"] .s2{background:#6493F5}
.theme-pick[data-theme="carbon"] .s3{background:#222B38}
.theme-name{font-weight:700;font-size:14px;color:var(--ink)}
.theme-note{font-size:11.5px;color:var(--muted-2)}
.kpi{position:relative;overflow:hidden;transition:border-color var(--t-fast),box-shadow var(--t-fast),transform var(--t-fast)}
/* a hairline of the accent that arrives on hover, from the left */
.kpi::after{content:'';position:absolute;inset:auto 0 0 0;height:2px;background:var(--accent);
  transform:scaleX(0);transform-origin:left;transition:transform var(--t) var(--ease)}
.kpi-link:hover::after{transform:scaleX(1)}
.kpi-link{cursor:pointer}
.kpi-link:hover{border-color:var(--line-strong);box-shadow:var(--sh-2);transform:translateY(-2px)}
.kpi-link:active{transform:translateY(0)}

/* the icon sits behind the label, quiet, so the card reads as a thing
   about trucks or about money without a caption saying so */
.kpi-ic{width:15px;height:15px;flex:none;color:var(--muted-2);opacity:.85}
.kpi-ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.kpi-tone-pos .kpi-ic{color:var(--green)}
.kpi-tone-neg .kpi-ic{color:var(--red)}

/* a summary strip is the same object everywhere it appears */
/* However many cards a screen has, they share the row evenly rather
   than wrapping one lonely card onto a second line. */
.summary{margin-bottom:16px;grid-template-columns:repeat(auto-fit,minmax(212px,1fr))}
.sec{display:flex;align-items:baseline;gap:10px;margin:22px 0 11px}
.sec:first-child{margin-top:0}
.sec-h{font-size:var(--fs-h2);font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.sec-n{font-size:var(--fs-sm);color:var(--muted-2)}
.sec-a{margin-left:auto}
.kpi-link:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accent-soft),0 0 0 1px var(--accent)}
.kpi-label{display:flex;align-items:center;gap:8px}
.kpi-go{
  margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:none;
  color:var(--accent);opacity:0;transition:opacity .13s;
}
.kpi-go::after{content:' →'}
.kpi-link:hover .kpi-go,.kpi-link:focus-visible .kpi-go{opacity:1}
@media print{ body{background:#fff!important} }


/* ---------- stacking order, stated once ----------
   cards 1 · table headers 10 · top bar 20 · bottom bar 50
   modals 100 · login 150 · messages 300                      */
#toast{position:fixed;z-index:300}
.toast{border-radius:10px;box-shadow:0 12px 34px rgba(17,22,33,.3);padding:12px 18px}
.overlay{z-index:100}
.gate{z-index:150}
.topbar{z-index:20}

th{z-index:10}

/* rounded cards must clip what sits inside them, or the table
   corners square off against the border */
.card{overflow:hidden}
.card > .tbl-wrap{border-radius:0}

/* ---------- date picker ----------
   Ours, not the browser's: a year you can type into and a year
   list that glides instead of jumping.                          */
/* The field itself is typed into as normal. The calendar opens from the
   icon on its right, which sits where the browser's own button used to. */
input.dp-input{padding-right:36px;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='5' width='18' height='16' rx='2'/%3E%3Cpath d='M3 10h18M8 3v4M16 3v4'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;background-size:16px 16px}
input.dp-input:hover{background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23111827' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='5' width='18' height='16' rx='2'/%3E%3Cpath d='M3 10h18M8 3v4M16 3v4'/%3E%3C/svg%3E")}
input.dp-input::-webkit-calendar-picker-indicator{display:none}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input.dp-input::-webkit-inner-spin-button,
input.dp-input::-webkit-clear-button{display:none}
.dp{position:fixed;z-index:400;width:288px;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 44px rgba(17,22,33,.22);
  padding:10px;font-size:13.5px}
.dp[hidden]{display:none}
.dp-head{display:flex;align-items:center;gap:5px;margin-bottom:8px}
.dp-nav,.dp-chev{flex:0 0 auto;width:28px;height:28px;border:1px solid var(--line);background:var(--bg);
  color:var(--ink);border-radius:8px;cursor:pointer;font-size:15px;line-height:1;padding:0}
.dp-nav:hover,.dp-chev:hover{background:var(--bg-2);border-color:var(--line-strong)}
.dp-chev.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-2)}
.dp-month{flex:1 1 auto;min-width:0;height:28px;padding:0 4px;border:1px solid var(--line);
  border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.dp-year{flex:0 0 58px;width:58px;height:28px;text-align:center;border:1px solid var(--line);
  border-radius:8px;background:var(--card);color:var(--ink);font:inherit;
  font-family:var(--mono);letter-spacing:.02em}
.dp-year:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dp-dows{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px}
.dp-dows span{text-align:center;font-size:11px;color:var(--muted);font-weight:600}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-day{height:32px;border:1px solid transparent;background:none;color:var(--ink);
  border-radius:8px;cursor:pointer;font:inherit;font-variant-numeric:tabular-nums;padding:0}
.dp-day:hover:not(:disabled){background:var(--bg-2)}
.dp-day:disabled{color:var(--muted-2);cursor:default;opacity:.45}
.dp-day.now{border-color:var(--line-strong);font-weight:700}
.dp-day.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.dp-blank{height:32px}
.dp-years{max-height:216px;overflow-y:auto;scroll-behavior:smooth;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  padding:2px;scrollbar-width:thin}
.dp-years::-webkit-scrollbar{width:8px}
.dp-years::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px}
.dp-year-btn{height:30px;border:1px solid transparent;background:none;color:var(--ink);
  border-radius:8px;cursor:pointer;font:inherit;font-family:var(--mono);font-size:12.5px;padding:0}
.dp-year-btn:hover{background:var(--bg-2)}
.dp-year-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.dp-foot{display:flex;gap:6px;align-items:center;margin-top:9px;padding-top:8px;
  border-top:1px solid var(--line-soft)}
.dp-foot button{border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:8px;cursor:pointer;font:inherit;font-size:12.5px;padding:5px 10px}
.dp-foot button:hover{background:var(--bg-2)}
.dp-foot .dp-close{margin-left:auto}
.dp-hint{font-size:11.5px;color:var(--muted);margin-top:7px;text-align:center}
.dp-year{padding:0}
.dp-month{padding:0 4px}

/* ---------- remove buttons on editable rows ---------- */
.rmdoc{padding:9px 11px;border:1px solid var(--red-line);background:var(--card);color:var(--red);
  border-radius:8px;cursor:pointer;font-weight:600;font-size:12.5px}

/* ---------- type a truck number and it picks itself ---------- */
/* one box for the truck: type into it, or open the list from the chevron */
.combo{position:relative}
.combo-input{padding-right:38px;text-transform:uppercase;font-family:var(--mono);letter-spacing:.02em}
.combo-input::placeholder{text-transform:none;font-family:var(--sans,inherit);letter-spacing:0}
.combo-chev{position:absolute;right:1px;top:1px;bottom:1px;width:36px;display:flex;align-items:center;
  justify-content:center;border:0;background:none;color:var(--muted);cursor:pointer;padding:0}
.combo-chev svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.combo-chev:hover{color:var(--ink)}
.combo-list{position:fixed;z-index:420;max-height:250px;overflow-y:auto;background:var(--card);
  border:1px solid var(--line);border-radius:11px;box-shadow:0 16px 40px rgba(17,22,33,.2);
  padding:4px;scroll-behavior:smooth;overscroll-behavior:contain}
.combo-list[hidden]{display:none}
.combo-item{display:flex;align-items:center;gap:9px;width:100%;height:auto;padding:8px 10px;border:0;
  background:none;text-align:left;cursor:pointer;border-radius:8px;font:inherit;font-size:13.5px;
  color:var(--ink)}
.combo-item.on{background:var(--bg-2)}
.combo-item.sel .combo-plate{font-weight:700}
.combo-plate{font-family:var(--mono);letter-spacing:.02em;white-space:nowrap}
.combo-tag{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  border:1px solid var(--line);border-radius:6px;padding:1px 5px}
.combo-sub{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.combo-add{color:var(--accent);font-weight:600;border-top:1px solid var(--line-soft);
  border-radius:0;margin-top:3px;padding-top:10px}
.combo-clear{color:var(--muted)}
.combo-empty{padding:9px 10px;color:var(--muted);font-size:12.5px}
.truck-find-note.miss{color:var(--amber)}

/* ---------- a required field left empty when Save was pressed ---------- */
.field.field-bad > label{color:var(--red)}
.field.field-bad > input,
.field.field-bad > select,
.field.field-bad > textarea,
.field.field-bad > .combo > .combo-input{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.field.field-bad > .combo > .combo-input:focus,
.field.field-bad > input:focus,
.field.field-bad > select:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.field.field-bad > .combo > .combo-chev{color:var(--red)}
.field-bad-note{font-size:11.5px;font-weight:600;color:var(--red)}

/* ---------- narrowing a ledger to one side of the account ---------- */
.led-view{min-width:170px}
.led-note{margin:-4px 0 13px;padding:9px 13px;border:1px solid var(--accent-line);
  border-radius:10px;background:var(--accent-soft);color:var(--ink-2);font-size:12.5px}
.led-note a{color:var(--accent-2);font-weight:600}
@keyframes fieldNudge{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-3px)}
  75%{transform:translateX(3px)}
}
.field.field-bad{animation:fieldNudge .2s ease-in-out 2}

/* ---------- money at the head of a trip ---------- */
.trip-totals{display:flex;flex-wrap:wrap;gap:7px 20px;align-items:center;margin:0 0 10px;
  padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg-2);
  font-size:12.5px;color:var(--muted)}
.trip-totals b{color:var(--ink);font-size:14.5px;margin-left:6px;font-family:var(--mono);
  font-variant-numeric:tabular-nums}

/* ---------- expenses booked straight onto a trip ---------- */
/* One tap to say what the money went on */
.exp-quick{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 12px}
.exp-quick-label{font-size:var(--fs-xs);font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted-2);margin-right:2px}
.exp-chip{border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  border-radius:999px;padding:5px 12px;font-size:12.5px;font-family:inherit;cursor:pointer;
  transition:border-color .13s,color .13s,background .13s}
.exp-chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.exp-chip:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accent-soft),0 0 0 1px var(--accent)}

.exp-entry{border:1px solid var(--line);border-radius:10px;background:var(--card);
  padding:11px 12px 10px;margin-bottom:9px}
.exp-entry.on-credit{border-color:var(--amber-line);background:var(--amber-soft)}
.exp-empty{display:block;padding:2px 0 6px}

/* What it was for, how much, how it was paid — in that order, and each
   box only as wide as the thing it holds. A box sized to the column
   rather than to its content is what made a nineteen-character category
   sit in seven hundred pixels, and left the rupee mark stranded at one
   end of the amount with the digits at the other. 200px takes the
   longest built-in category, 118 takes ₹1,20,000 in tabular figures,
   132 takes "Bank transfer". The row is packed from the left and stops
   where the content stops. */
.exp-row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.exp-row input,.exp-row select{padding:8px 10px;font-size:13.5px}
.exp-row .exp-what{flex:0 0 200px}
.exp-row .exp-amt{flex:0 0 118px}
.exp-row .exp-mode{flex:0 0 132px}
.exp-row .icon-btn{flex:0 0 30px}

/* the amount is the number being entered, so it is the one that looks
   like money */
.exp-amt{position:relative}
.exp-amt input{width:100%;font-family:var(--mono);font-weight:600;text-align:right;
  padding-right:10px;padding-left:21px}
.exp-cur{position:absolute;left:9px;top:50%;transform:translateY(-50%);
  color:var(--muted-2);font-size:13px;pointer-events:none}

/* the date and the note are almost always the trip's own date and
   nothing at all, so they sit quieter and lower. The note is the one
   field here that can genuinely run long, so it may grow — to a point. */
.exp-more{display:grid;grid-template-columns:132px minmax(220px,360px);gap:9px;
  margin-top:8px;justify-content:start}
.exp-more input{padding:6px 10px;font-size:12.5px;height:32px;
  background:var(--bg-2);border-color:transparent;color:var(--muted)}
.exp-more input:focus{background:var(--card);border-color:var(--accent);color:var(--ink)}
.exp-row .exp-shop{flex:0 0 196px;margin:0;gap:4px}
.exp-row .exp-shop[hidden]{display:none}
/* if it is left empty on save, the reason appears under it and the row
   grows by one line — which is the one time it should */
.exp-row .exp-shop .field-bad-note{white-space:normal}

/* ---------- a trip that has finished and locked itself ---------- */
.trip-lock{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;margin:0 0 14px;
  padding:11px 14px;border:1px solid var(--green-line);border-radius:10px;
  background:var(--green-soft);color:var(--ink-2);font-size:12.8px;line-height:1.55}
.trip-lock b{color:var(--green);font-weight:700}
.trip-lock.open{border-color:var(--amber-line);background:var(--amber-soft)}
.trip-lock.open b{color:var(--amber)}
.trip-lock a{color:var(--accent-2);font-weight:600}
.pane-locked{opacity:.72}
.pane-locked input:disabled,.pane-locked select:disabled,.pane-locked textarea:disabled{
  background:var(--bg-2);cursor:not-allowed}
.pane-locked button:disabled{opacity:.5;cursor:not-allowed}
.lock-note{font-size:11.5px;color:var(--green);font-weight:600}

/* ---------- renewing a document ---------- */
.renew-now{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 20px;margin-bottom:18px;
  padding:13px 15px;border:1px solid var(--line);border-radius:11px;background:var(--bg-2)}
.renew-now span{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.renew-now b{font-size:14.5px;color:var(--ink);font-weight:700}
.renew-past{margin-top:18px;padding-top:14px;border-top:1px solid var(--line-soft)}
.renew-past-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:13px;color:var(--muted)}
.renew-past-row:last-child{border-bottom:0}
.renew-past-row b{color:var(--ink)}

/* ---------- who drove which truck, and when ---------- */
.assign-log{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.assign-row{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:13px;
  border-bottom:1px solid var(--line-soft)}
.assign-row:last-child{border-bottom:0}
.assign-who{font-weight:600;color:var(--ink)}
.assign-when{color:var(--muted);font-family:var(--mono);font-size:12px;margin-left:auto}

/* ---------- records left pointing at nothing ---------- */
.health-list{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.health-row{display:flex;align-items:center;gap:12px;padding:9px 13px;font-size:13px;
  border-bottom:1px solid var(--line-soft)}
.health-row:last-child{border-bottom:0}
.health-row b{margin-left:auto;font-family:var(--mono);color:var(--red);font-size:14px}

/* ---------- opening one truck out of the report ---------- */
.bar-link{cursor:pointer;border-radius:9px;padding:7px 9px;margin:0 -9px 6px;
  transition:background .12s}
.bar-link:hover{background:var(--bg-2)}
.bar-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
tr.row-link{cursor:pointer}
tr.row-link:hover td{background:var(--bg-2)}
.tr-sum{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 18px;
  padding:14px 16px;border:1px solid var(--line);border-radius:11px;background:var(--bg-2)}
.tr-sum span{display:block;font-size:10.5px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.tr-sum b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.field.exp-credit select{padding:8px 10px;font-size:13.5px;height:auto}

</style>
