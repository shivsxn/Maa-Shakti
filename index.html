/* ============================================================
   CHARTS — hand drawn as SVG so the app stays one offline file
   ============================================================ */
const SERIES = ['#E9A13B','#2C5D7C','#1C7A57','#B3372C','#8A5D12','#4A5568','#7C6A9E','#C97B4A'];

// Indian short form: 1.2L, 85k — keeps axis labels readable
function shortMoney(n){
  const v = Math.abs(Math.round(num(n)));
  const s = v>=10000000 ? (v/10000000).toFixed(v%10000000?1:0)+'Cr'
          : v>=100000   ? (v/100000).toFixed(v%100000?1:0)+'L'
          : v>=1000     ? (v/1000).toFixed(v%1000&&v<10000?1:0)+'k'
          : String(v);
  return (num(n)<0?'-₹':'₹')+s;
}
function monthsBack(n){
  const out=[], d=new Date();
  for(let i=n-1;i>=0;i--){
    const x=new Date(d.getFullYear(), d.getMonth()-i, 1);
    out.push(x.toISOString().slice(0,7));
  }
  return out;
}
function monthLabel(k){
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return M[parseInt(k.slice(5,7),10)-1];
}
function monthlySeries(n){ return seriesFor(monthsBack(n)); }

/* Every month between two dates, so charts follow whatever range is chosen */
function monthsBetween(from, to){
  const out=[];
  let y=parseInt(from.slice(0,4),10), m=parseInt(from.slice(5,7),10);
  const ey=parseInt(to.slice(0,4),10), em=parseInt(to.slice(5,7),10);
  let guard=0;
  while((y<ey || (y===ey && m<=em)) && guard++<400){
    out.push(y+'-'+String(m).padStart(2,'0'));
    m++; if(m>12){ m=1; y++; }
  }
  return out.length? out : [from.slice(0,7)];
}
function seriesFor(keys){
  const multiYear = new Set(keys.map(k=>k.slice(0,4))).size>1;
  return keys.map(k=>{
    const p = pnl(k+'-01', k+'-31');
    return {key:k, label: monthLabel(k)+(multiYear?' '+k.slice(2,4):''),
      freight:p.freight, cost:p.costs, profit:p.profit, trips:p.tripCount};
  });
}
function seriesForRange(from, to){ return seriesFor(monthsBetween(from, to)); }

/* Line chart with two series, drawn left to right on load */
function lineChart(rows, series, opts={}){
  const W=720, H=opts.height||230, L=52, R=14, T=14, B=30;
  const max = Math.max(1, ...rows.map(r=>Math.max(...series.map(s=>num(r[s.key])))));
  const step = rows.length>1 ? (W-L-R)/(rows.length-1) : 0;
  const x = i => L + i*step;
  const y = v => T + (H-T-B) * (1 - num(v)/max);
  const ticks = 4;

  let svg = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img">';
  for(let t=0;t<=ticks;t++){
    const v = max*t/ticks, yy = y(v);
    svg += '<line class="grid-line" x1="'+L+'" y1="'+yy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+yy.toFixed(1)+'"/>'+
           '<text class="axis-text" x="'+(L-8)+'" y="'+(yy+3.5).toFixed(1)+'" text-anchor="end">'+shortMoney(v)+'</text>';
  }
  const every = rows.length>13 ? Math.ceil(rows.length/12) : 1;
  rows.forEach((r,i)=>{
    if(i%every && i!==rows.length-1) return;
    svg += '<text class="axis-text" x="'+x(i).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle">'+esc(r.label)+'</text>';
  });
  series.forEach((s,si)=>{
    const pts = rows.map((r,i)=>x(i).toFixed(1)+','+y(r[s.key]).toFixed(1));
    if(s.fill && rows.length>1){
      svg += '<path d="M'+pts.join(' L')+' L'+x(rows.length-1).toFixed(1)+','+(H-B)+' L'+L+','+(H-B)+' Z" fill="'+s.color+'" opacity=".08"/>';
    }
    svg += '<polyline class="'+(s.dash?'series-dashed':'series-line')+'" points="'+pts.join(' ')+
           '" stroke="'+s.color+'" style="animation-delay:'+(si*0.12)+'s"/>';
    rows.forEach((r,i)=>{
      svg += '<circle class="series-dot" cx="'+x(i).toFixed(1)+'" cy="'+y(r[s.key]).toFixed(1)+'" r="3.4" fill="'+s.color+'">'+
             '<title>'+esc(r.label)+': '+money(r[s.key])+'</title></circle>';
    });
  });
  svg += '</svg>';
  const legend = '<div class="legend">'+series.map(s=>
    '<span class="legend-item"><span class="legend-key" style="background:'+s.color+'"></span>'+esc(s.label)+'</span>').join('')+'</div>';
  return svg + legend;
}

/* Donut with a total in the middle */
function donutChart(items, centreLabel){
  const total = items.reduce((s,i)=>s+num(i.value),0);
  if(!total) return '';
  const S=190, r=68, cx=S/2, cy=S/2, circ=2*Math.PI*r;
  let acc=0;
  let svg='<svg class="chart" viewBox="0 0 '+S+' '+S+'" style="max-width:230px;margin:0 auto" role="img">';
  svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--line-soft)" stroke-width="22"/>';
  svg += '<g transform="rotate(-90 '+cx+' '+cy+')">';
  items.forEach((it,i)=>{
    const frac = num(it.value)/total;
    const len = frac*circ;
    const off = circ - len;
    svg += '<circle class="donut-seg" cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+(it.color||SERIES[i%SERIES.length])+'"'+
      ' stroke-width="22" stroke-dasharray="'+len.toFixed(2)+' '+(circ-len).toFixed(2)+'"'+
      ' style="--circ:'+circ.toFixed(2)+';--off:'+(-acc).toFixed(2)+';animation-delay:'+(i*0.09)+'s">'+
      '<title>'+esc(it.label)+': '+money(it.value)+' ('+Math.round(frac*100)+'%)</title></circle>';
    acc += len;
  });
  svg += '</g>';
  svg += '<text class="donut-hole" x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-size="19" font-weight="600" fill="var(--ink)">'+shortMoney(total)+'</text>'+
         '<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--muted)" letter-spacing="1.2">'+esc((centreLabel||'TOTAL').toUpperCase())+'</text>'+
         '</svg>';
  const legend = '<div style="margin-top:14px">'+items.map((it,i)=>{
    const pct = Math.round(num(it.value)/total*100);
    return '<div style="display:flex;align-items:center;gap:9px;font-size:13px;padding:4px 0">'+
      '<span class="legend-key" style="background:'+(it.color||SERIES[i%SERIES.length])+';height:9px;width:9px;border-radius:50%"></span>'+
      '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(it.label)+'</span>'+
      '<span class="num" style="margin-left:auto;color:var(--muted)">'+money(it.value)+'</span>'+
      '<span class="num" style="width:38px;text-align:right;font-weight:600">'+pct+'%</span></div>';
  }).join('')+'</div>';
  return svg + legend;
}

/* Horizontal bars */
function barList(items, opts={}){
  const max = Math.max(1, ...items.map(i=>Math.abs(num(i.value))));
  return items.map((it,i)=>{
    const pct = Math.abs(num(it.value))/max*100;
    const col = it.color || (opts.color || SERIES[0]);
    return '<div class="bar-row">'+
      '<div class="bar-head"><span class="bar-name">'+esc(it.label)+'</span>'+
        '<span class="bar-val">'+(it.display || money(it.value))+'</span></div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+pct.toFixed(1)+'%;background:'+col+';animation-delay:'+(i*0.06)+'s"></div></div>'+
      (it.note?'<div class="hint" style="margin-top:4px">'+esc(it.note)+'</div>':'')+
    '</div>';
  }).join('');
}

/* Tiny sparkline for the KPI tiles */
function spark(values, color){
  const W=88,H=26,max=Math.max(1,...values.map(Math.abs)),min=Math.min(0,...values);
  const span=(max-min)||1;
  const step=values.length>1?W/(values.length-1):0;
  const pts=values.map((v,i)=>(i*step).toFixed(1)+','+(H-((v-min)/span)*H).toFixed(1));
  return '<svg class="kpi-spark" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" aria-hidden="true">'+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/></svg>';
}

/* KPI tile. Numbers count up once the view settles. */
function kpi(label, value, opts={}){
  const fmt = opts.fmt||'money';
  const shown = fmt==='money'? money(0) : fmt==='pct'? '0%' : '0';
  return '<div class="kpi"><div class="kpi-label">'+esc(label)+'</div>'+
    '<div class="kpi-value'+(opts.tone==='pos'?' money-pos':opts.tone==='neg'?' money-neg':'')+
      '" data-count="'+num(value)+'" data-fmt="'+fmt+'">'+shown+'</div>'+
    '<div class="kpi-foot">'+
      (opts.note?'<span>'+esc(opts.note)+'</span>':'')+
      (opts.trend!=null && isFinite(opts.trend)?'<span class="trend '+(opts.trend>=0?'trend-up':'trend-down')+'">'+
        (opts.trend>=0?'▲':'▼')+' '+Math.abs(Math.round(opts.trend))+'%</span>':'')+
      (opts.spark?spark(opts.spark, opts.sparkColor||'var(--amber)'):'')+
    '</div></div>';
}

function fmtBy(mode, v){
  if(mode==='pct')   return Math.round(v)+'%';
  if(mode==='plain') return Math.round(v).toLocaleString('en-IN');
  if(mode==='one')   return (Math.round(v*10)/10).toLocaleString('en-IN');
  return money(v);
}
function animateCounts(){
  const els = document.querySelectorAll('[data-count]');
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  els.forEach(el=>{
    const to = parseFloat(el.dataset.count)||0, mode = el.dataset.fmt||'money';
    if(still || !window.requestAnimationFrame){ el.textContent = fmtBy(mode,to); return; }
    const t0 = performance.now(), dur = 620;
    (function tick(t){
      const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3);
      el.textContent = fmtBy(mode, to*e);
      if(p<1) requestAnimationFrame(tick); else el.textContent = fmtBy(mode,to);
    })(t0);
  });
}
function pctChange(now, before){
  if(!before) return null;
  return (now-before)/Math.abs(before)*100;
}


/* ============================================================
   FIREBASE — email login and cloud storage
   Data lives under users/{uid} in your own Firebase project.
   Driver photos are written to separate documents so the main
   record stays well under Firestore's 1 MB per-document limit.
   Until a project is configured the app runs exactly as before,
   saving on this device only.
   ============================================================ */
const SDK_VER = '10.12.0';
const FB = {
  cfg: (()=>{ try{ return JSON.parse(localStorage.getItem('mvl_fb_cfg')||'null'); }catch(e){ return null; } })(),
  app:null, auth:null, db:null, api:null, user:null,
  state:'off',            // off | loading | signedout | syncing | on | error
  message:'', unsub:null, pushTimer:null, lastPhoto:{}, applying:false,
  lastSync: localStorage.getItem('mvl_last_sync') || ''
};

function syncReady(){ return FB.state==='on' || FB.state==='syncing'; }
function syncSet(state, message){
  FB.state = state; FB.message = message || '';
  const pill = $('#syncPill'); if(!pill) return;
  if(state==='off'){ pill.hidden = true; return; }
  pill.hidden = false;
  const map = {
    loading:   ['busy', 'Connecting…'],
    signedout: ['',     'Not signed in'],
    syncing:   ['busy', 'Saving…'],
    on:        ['on',   FB.user ? 'Synced' : 'Connected'],
    error:     ['bad',  'Sync problem']
  };
  const [cls, label] = map[state] || ['',''];
  pill.className = 'cloud-pill '+cls;
  pill.innerHTML = '<span class="cloud-dot"></span><span>'+esc(label)+'</span>';
  pill.title = FB.message || label;
  if(route==='settings') viewSettings();
}

async function loadSDK(){
  if(FB.api) return FB.api;
  if(window.__fbSdk){ FB.api = window.__fbSdk; return FB.api; }
  const base = 'https://www.gstatic.com/firebasejs/'+SDK_VER+'/';
  const [app, auth, store] = await Promise.all([
    import(base+'firebase-app.js'),
    import(base+'firebase-auth.js'),
    import(base+'firebase-firestore.js')
  ]);
  FB.api = {...app, ...auth, ...store};
  return FB.api;
}

async function startAuth(){
  if(!FB.cfg){ syncSet('off'); return; }
  try{
    syncSet('loading');
    const api = await loadSDK();
    FB.app  = api.initializeApp(FB.cfg);
    FB.auth = api.getAuth(FB.app);
    try{
      FB.db = api.initializeFirestore(FB.app, {localCache: api.persistentLocalCache
        ? api.persistentLocalCache({tabManager: api.persistentMultipleTabManager && api.persistentMultipleTabManager()})
        : undefined});
    }catch(e){ FB.db = api.getFirestore(FB.app); }
    api.onAuthStateChanged(FB.auth, u=>{
      FB.user = u || null;
      if(u){ hideGate(); afterSignIn(); }
      else { syncSet('signedout'); showGate(); }
    });
  }catch(e){
    syncSet('error', 'Could not reach Firebase. '+(e.message||''));
    showGate();
  }
}

/* ---------- the login screen ---------- */
function showGate(){
  if(!FB.cfg) return;
  const g = $('#authGate'); if(!g) return;
  g.hidden = false;
  paintGate('in');
}
function hideGate(){ const g = $('#authGate'); if(g) g.hidden = true; }
let gateMode = 'in';
function paintGate(mode){
  gateMode = mode || gateMode;
  const g = $('#authGate'); if(!g) return;
  const signup = gateMode==='up';
  g.innerHTML =
  '<div class="gate-card">'+
    '<div class="gate-brand"><div class="brand-badge">MV</div>'+
      '<div><div class="gate-name">'+esc(DB.settings.business||'Maa Vandana Logistics')+'</div>'+
      '<div class="gate-tag">Transport management</div></div></div>'+
    '<h2 class="gate-title">'+(signup?'Create your account':'Sign in to continue')+'</h2>'+
    '<p class="gate-sub">'+(signup
      ? 'Your records are kept in your own Firebase project and reach every device you sign in on.'
      : 'Use the email and password for this business.')+'</p>'+
    '<div class="field"><label for="au_email">Email address</label>'+
      '<input id="au_email" type="email" autocomplete="username" placeholder="you@example.com"></div>'+
    '<div class="field" style="margin-top:11px"><label for="au_pass">Password</label>'+
      '<input id="au_pass" type="password" autocomplete="'+(signup?'new-password':'current-password')+'" '+
      'placeholder="'+(signup?'At least 6 characters':'Your password')+'" onkeydown="if(event.key===\'Enter\')gateSubmit()"></div>'+
    '<div id="gateError" class="gate-error" hidden></div>'+
    '<button class="btn btn-primary gate-go" onclick="gateSubmit()">'+(signup?'Create account':'Sign in')+'</button>'+
    '<button class="btn gate-google" onclick="gateGoogle()">Continue with Google</button>'+
    '<div class="gate-foot">'+
      (signup
        ? 'Already have an account? <a href="#" onclick="event.preventDefault();paintGate(\'in\')">Sign in</a>'
        : 'First time here? <a href="#" onclick="event.preventDefault();paintGate(\'up\')">Create an account</a>'+
          ' · <a href="#" onclick="event.preventDefault();gateReset()">Forgot password</a>')+
    '</div>'+
  '</div>';
  const f = $('#au_email'); if(f && window.innerWidth>760) f.focus();
}
function gateError(msg){
  const e = $('#gateError'); if(!e) return;
  e.hidden = !msg; e.textContent = msg || '';
}
function friendlyAuth(code, fallback){
  return ({
    'auth/invalid-email':'That email address does not look right.',
    'auth/missing-password':'Enter your password.',
    'auth/weak-password':'Choose a password of at least 6 characters.',
    'auth/email-already-in-use':'That email already has an account. Try signing in instead.',
    'auth/invalid-credential':'Email or password is not correct.',
    'auth/wrong-password':'That password is not correct.',
    'auth/user-not-found':'No account found for that email.',
    'auth/too-many-requests':'Too many attempts. Wait a few minutes and try again.',
    'auth/network-request-failed':'No internet connection. You can keep working offline.',
    'auth/popup-closed-by-user':'The Google window was closed before finishing.',
    'auth/operation-not-allowed':'This sign-in method is switched off in your Firebase project.'
  })[code] || fallback || 'Something went wrong. Please try again.';
}
async function gateSubmit(){
  const email = (val('au_email')||'').trim(), pass = val('au_pass')||'';
  if(!email){ gateError('Enter your email address.'); return; }
  if(!pass){ gateError('Enter your password.'); return; }
  gateError('');
  const btn = $('.gate-go'); if(btn){ btn.disabled = true; btn.textContent = 'Please wait…'; }
  try{
    const api = await loadSDK();
    if(gateMode==='up') await api.createUserWithEmailAndPassword(FB.auth, email, pass);
    else await api.signInWithEmailAndPassword(FB.auth, email, pass);
  }catch(e){
    gateError(friendlyAuth(e.code, e.message));
    if(btn){ btn.disabled = false; btn.textContent = gateMode==='up'?'Create account':'Sign in'; }
  }
}
async function gateGoogle(){
  gateError('');
  try{
    const api = await loadSDK();
    await api.signInWithPopup(FB.auth, new api.GoogleAuthProvider());
  }catch(e){ gateError(friendlyAuth(e.code, e.message)); }
}
async function gateReset(){
  const email = (val('au_email')||'').trim();
  if(!email){ gateError('Type your email above, then press Forgot password.'); return; }
  try{
    const api = await loadSDK();
    await api.sendPasswordResetEmail(FB.auth, email);
    gateError('');
    toast('Password reset link sent to '+email);
  }catch(e){ gateError(friendlyAuth(e.code, e.message)); }
}
async function signOutNow(){
  confirmAsk('Sign out? Your records stay in the cloud and come back when you sign in again.', async()=>{
    try{
      if(FB.unsub){ FB.unsub(); FB.unsub = null; }
      const api = await loadSDK();
      await api.signOut(FB.auth);
      toast('Signed out');
    }catch(e){ toast('Could not sign out: '+e.message); }
  });
}

/* ---------- reading and writing the cloud copy ---------- */
function mainDocRef(){ return FB.api.doc(FB.db, 'users', FB.user.uid, 'app', 'main'); }
function photoDocRef(id){ return FB.api.doc(FB.db, 'users', FB.user.uid, 'photos', id); }

function mainPayload(){
  const copy = JSON.parse(JSON.stringify(DB));
  copy.drivers = (copy.drivers||[]).map(d=>{ const c = {...d}; delete c.docs; return c; });
  copy.updatedAt = DB.updatedAt || new Date().toISOString();
  return copy;
}

async function afterSignIn(){
  try{
    syncSet('syncing');
    const api = FB.api;
    const snap = await api.getDoc(mainDocRef());
    if(snap.exists()){
      const remote = snap.data();
      const localEmpty = DB.trips.length===0 && DB.parties.length===0 && DB.trucks.length===0;
      if(localEmpty || (remote.updatedAt||'') > (DB.updatedAt||'')){
        if(!localEmpty) return askWhichCopy(remote);
        await applyRemote(remote);
      } else if((DB.updatedAt||'') > (remote.updatedAt||'')){
        await syncPush(true);
      }
    } else {
      await syncPush(true);
      toast('Your records are now in the cloud');
    }
    watchRemote();
    syncSet('on');
  }catch(e){
    syncSet('error', e.message);
    toast('Could not sync: '+e.message);
  }
}

/* live updates from your other device */
function watchRemote(){
  if(FB.unsub) FB.unsub();
  FB.unsub = FB.api.onSnapshot(mainDocRef(), snap=>{
    if(!snap.exists() || FB.applying) return;
    if(snap.metadata && snap.metadata.hasPendingWrites) return;
    const remote = snap.data();
    if((remote.updatedAt||'') > (DB.updatedAt||'')) applyRemote(remote, true);
  }, err=>syncSet('error', err.message));
}

async function loadPhotos(){
  const out = {};
  try{
    const snaps = await FB.api.getDocs(FB.api.collection(FB.db, 'users', FB.user.uid, 'photos'));
    snaps.forEach(s=>{ out[s.id] = s.data().docs || {}; });
  }catch(e){}
  return out;
}

async function applyRemote(remote, quiet){
  FB.applying = true;
  const photos = await loadPhotos();
  const merged = Object.assign(JSON.parse(JSON.stringify(BLANK)), remote);
  merged.drivers = (merged.drivers||[]).map(d=>({...d, docs: photos[d.id] || {}}));
  DB = merged;
  reindex(); buildPlaceList(); buildDocTypeList();
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){}
  applyBrand(); render();
  FB.applying = false;
  if(quiet) toast('Updated from your other device');
}

let pendingRemote = null;
function askWhichCopy(remote){
  pendingRemote = remote;
  const count = o => (o.trips||[]).length+' trips, '+(o.parties||[]).length+' parties';
  syncSet('on');
  openModal({
    title:'Two copies found',
    body:'<p style="margin:0 0 14px;font-size:14.5px">The cloud copy and this device do not match. Which should be kept?</p>'+
      '<div class="card card-pad" style="margin-bottom:10px"><div class="stat-label">In the cloud</div>'+
      '<div style="margin-top:5px">'+esc(count(remote))+'</div>'+
      '<div class="hint">Last saved '+(remote.updatedAt?fdate(remote.updatedAt.slice(0,10)):'date unknown')+'</div>'+
      '<button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="useCloudCopy()">Use the cloud copy</button></div>'+
      '<div class="card card-pad"><div class="stat-label">On this device</div>'+
      '<div style="margin-top:5px">'+esc(count(DB))+'</div>'+
      '<div class="hint">Last saved '+(DB.updatedAt?fdate(DB.updatedAt.slice(0,10)):'date unknown')+'</div>'+
      '<button class="btn btn-sm" style="margin-top:10px" onclick="useDeviceCopy()">Keep this device</button></div>'+
      '<div class="note" style="margin-top:12px">Nothing is overwritten until you choose. Download a backup from Settings if you are unsure.</div>'
  });
}
async function useCloudCopy(){
  if(!pendingRemote) return closeModal();
  const r = pendingRemote; pendingRemote = null; closeModal();
  await applyRemote(r); watchRemote(); syncSet('on'); toast('Now using the cloud copy');
}
async function useDeviceCopy(){
  pendingRemote = null; closeModal();
  DB.updatedAt = new Date().toISOString();
  await syncPush(true); watchRemote(); toast('Kept this device and sent it up');
}

async function syncPush(now){
  if(!FB.user || !FB.db) return;
  clearTimeout(FB.pushTimer);
  if(!now){ FB.pushTimer = setTimeout(()=>syncPush(true), 2500); return; }
  try{
    syncSet('syncing');
    const api = FB.api;
    await api.setDoc(mainDocRef(), mainPayload());
    for(const d of (DB.drivers||[])){
      const docs = d.docs || {};
      const stamp = JSON.stringify(Object.keys(docs).sort())+':'+Object.values(docs).reduce((n,v)=>n+(v?v.length:0),0);
      if(FB.lastPhoto[d.id] === stamp) continue;
      await api.setDoc(photoDocRef(d.id), {docs});
      FB.lastPhoto[d.id] = stamp;
    }
    FB.lastSync = new Date().toISOString();
    localStorage.setItem('mvl_last_sync', FB.lastSync);
    syncSet('on');
  }catch(e){
    syncSet('error', e.message);
  }
}

/* ---------- settings ---------- */

      'Inside the project open <b>Build \u2192 Authentication \u2192 Get started</b>, and switch on <b>Email/Password</b>. Switch on <b>Google</b> too if you want that button to work.',

      'Open the <b>Rules</b> tab of Firestore, replace everything with the rules shown below, and press Publish. This is what stops anyone else reading your data.',
      'Open <b>Project settings</b> (the gear icon), scroll to <b>Your apps</b>, add a <b>Web app</b>, and copy the firebaseConfig block it shows you.',
      'Paste that config in the box above and press Connect. Then create your account with your email and a password.'
    ].map((t,i)=>'<div class="step"><div class="step-n">'+(i+1)+'</div><p>'+t+'</p></div>').join('')+
    '<div class="sec-title">Security rules to paste</div>'+
    '<pre class="rules">'+esc(RULES)+'</pre>'+
    '<button class="btn btn-sm" onclick="copyRules()">Copy rules</button>'+
  '</div>';
}
function saveFbConfig(){
  const raw = (val('fb_cfg')||'').trim();
  if(!raw){ toast('Paste the config from Firebase first'); return; }
  let cfg = null;
  try{
    const cleaned = raw.replace(/^[\s\S]*?firebaseConfig\s*=\s*/,'').replace(/;\s*$/,'')
      .replace(/([{,]\s*)([A-Za-z0-9_]+)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,(\s*[}\]])/g,'$1');
    cfg = JSON.parse(cleaned);
  }catch(e){ toast('That does not look like a Firebase config. Copy the whole block including the braces.'); return; }
  if(!cfg.apiKey || !cfg.projectId){ toast('The config needs at least apiKey and projectId'); return; }
  FB.cfg = cfg;
  localStorage.setItem('mvl_fb_cfg', JSON.stringify(cfg));
  toast('Saved. Connecting to Firebase…');
  location.reload();
}
function clearFbConfig(){
  confirmAsk('Disconnect this Firebase project? Your records stay on this device and in the cloud, they simply stop syncing.', ()=>{
    localStorage.removeItem('mvl_fb_cfg');
    localStorage.removeItem('mvl_last_sync');
    location.reload();
  }, true);
}
function copyRules(){
  if(navigator.clipboard) navigator.clipboard.writeText(RULES).then(()=>toast('Rules copied'), ()=>toast('Select the text and copy it'));
  else toast('Select the text above and copy it');
}
