<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151A21">
<title>Maa Vandana Logistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --asphalt: #151A21;
  --asphalt-2: #1E2530;
  --asphalt-3: #2A323E;
  --paper: #F6F4EF;
  --card: #FFFFFF;
  --line: #E4E0D6;
  --line-soft: #EFECE4;
  --ink: #1B1F24;
  --muted: #6E6A62;
  --amber: #E9A13B;
  --amber-soft: #FBF0DC;
  --red: #B3372C;
  --red-soft: #FAEAE8;
  --green: #1C7A57;
  --green-soft: #E6F2EC;
  --blue: #2C5D7C;
  --blue-soft: #E8F0F5;
  --r: 10px;
  --shadow: 0 1px 2px rgba(21,26,33,.06),0 8px 24px rgba(21,26,33,.05);
  --sans: 'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono: 'IBM Plex Mono',ui-monospace,'Courier New',monospace;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button,
input,
select,
textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

.num {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em;
}

/* ---------- App frame ---------- */

.app {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 238px;
  flex: none;
  background: var(--asphalt);
  color: #fff;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
}

.brand {
  padding: 22px 20px 18px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.brand-mark {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-badge {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: var(--amber);
  color: var(--asphalt);
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: -.02em;
  flex: none;
}

.brand-name {
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -.01em;
  line-height: 1.2;
}

.brand-tag {
  font-size: 11px;
  color: rgba(255,255,255,.45);
  margin-top: 9px;
  letter-spacing: .06em;
  text-transform: uppercase;
}

.nav {
  padding: 12px 10px;
  overflow-y: auto;
  flex: 1;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 9px 11px;
  margin-bottom: 2px;
  background: none;
  border: 0;
  border-radius: 8px;
  color: rgba(255,255,255,.68);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  text-align: left;
  transition: background .12s,color .12s;
}

.nav-item:hover {
  background: rgba(255,255,255,.06);
  color: #fff;
}

.nav-item.on {
  background: var(--asphalt-3);
  color: #fff;
}

.nav-item.on .ic {
  color: var(--amber);
}

.ic {
  width: 19px;
  height: 19px;
  flex: none;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.side-foot {
  padding: 14px 20px 18px;
  border-top: 1px solid rgba(255,255,255,.08);
  font-size: 11px;
  color: rgba(255,255,255,.35);
}

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px 26px;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 20;
}

.page-title {
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -.02em;
  margin: 0;
}

.page-sub {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 1px;
}

.topbar-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}

.content {
  padding: 22px 26px 60px;
  max-width: 1240px;
  width: 100%;
}

/* ---------- Buttons ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 15px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--card);
  font-weight: 600;
  font-size: 13.5px;
  cursor: pointer;
  transition: .12s;
  white-space: nowrap;
}

.btn:hover {
  border-color: #CFC9BB;
  background: #FCFBF8;
}

.btn-primary {
  background: var(--asphalt);
  border-color: var(--asphalt);
  color: #fff;
}

.btn-primary:hover {
  background: #232B36;
  border-color: #232B36;
}

.btn-amber {
  background: var(--amber);
  border-color: var(--amber);
  color: var(--asphalt);
}

.btn-amber:hover {
  background: #F0AC4C;
  border-color: #F0AC4C;
}

.btn-danger {
  color: var(--red);
  border-color: #E8CFCB;
}

.btn-danger:hover {
  background: var(--red-soft);
}

.btn-sm {
  padding: 6px 11px;
  font-size: 12.5px;
  border-radius: 7px;
}

.btn-icon {
  padding: 7px;
  border-radius: 7px;
}

.btn:focus-visible,
.nav-item:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
.tab:focus-visible {
  outline: 2px solid var(--amber);
  outline-offset: 2px;
}

/* ---------- Cards & grid ---------- */

.grid {
  display: grid;
  gap: 14px;
}

.g4 {
  grid-template-columns: repeat(4,1fr);
}

.g3 {
  grid-template-columns: repeat(3,1fr);
}

.g2 {
  grid-template-columns: repeat(2,1fr);
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
}

.card-pad {
  padding: 16px 18px;
}

.card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line-soft);
}

.card-title {
  font-size: 14.5px;
  font-weight: 700;
  letter-spacing: -.01em;
  margin: 0;
}

.card-head .btn {
  margin-left: auto;
}

.stat {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 15px 17px;
  box-shadow: var(--shadow);
}

.stat-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--muted);
}

.stat-value {
  font-family: var(--mono);
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -.03em;
  margin-top: 7px;
  font-variant-numeric: tabular-nums;
}

.stat-note {
  font-size: 12px;
  color: var(--muted);
  margin-top: 5px;
}

.stat.accent {
  border-left: 3px solid var(--amber);
}

.stat.pos .stat-value {
  color: var(--green);
}

.stat.neg .stat-value {
  color: var(--red);
}

/* ---------- Tables ---------- */

.tbl-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  text-align: left;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
  background: #FCFBF8;
}

td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line-soft);
  font-size: 14px;
  vertical-align: middle;
}

tr:last-child td {
  border-bottom: 0;
}

tbody tr:hover {
  background: #FCFBF8;
}

.t-r {
  text-align: right;
}

.t-c {
  text-align: center;
}

.t-strong {
  font-weight: 600;
}

.t-sub {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}

.row-actions {
  display: flex;
  gap: 5px;
  justify-content: flex-end;
}

/* ---------- Chips & the stamp ---------- */

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 20px;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .01em;
  white-space: nowrap;
}

.chip-grey {
  background: #F0EEE8;
  color: var(--muted);
}

.chip-amber {
  background: var(--amber-soft);
  color: #8A5D12;
}

.chip-red {
  background: var(--red-soft);
  color: var(--red);
}

.chip-green {
  background: var(--green-soft);
  color: var(--green);
}

.chip-blue {
  background: var(--blue-soft);
  color: var(--blue);
}

/* signature element: rubber-stamp status on the LR slip */

.stamp {
  display: inline-block;
  padding: 5px 12px 4px;
  border: 2.5px solid currentColor;
  border-radius: 4px;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: .16em;
  text-transform: uppercase;
  transform: rotate(-6deg);
  opacity: .82;
  font-family: var(--sans);
}

.stamp-paid {
  color: var(--green);
}

.stamp-pending {
  color: var(--red);
}

.stamp-part {
  color: #8A5D12;
}

/* LR slip */

.slip {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.slip-top {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 15px 18px;
  background: #FCFBF8;
  border-bottom: 1px dashed var(--line);
}

.slip-lr {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .04em;
  color: var(--muted);
}

.slip-route {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -.02em;
  margin-top: 3px;
}

.slip-body {
  padding: 15px 18px;
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 14px;
}

.field-label {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--muted);
}

.field-value {
  font-size: 14px;
  font-weight: 500;
  margin-top: 3px;
  word-break: break-word;
}

/* ---------- Forms ---------- */

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 13px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.field.full {
  grid-column: 1/-1;
}

label {
  font-size: 12px;
  font-weight: 600;
  color: #3C4048;
  letter-spacing: .01em;
}

input,
select,
textarea {
  width: 100%;
  padding: 9px 11px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  font-size: 14.5px;
  transition: border-color .12s;
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--asphalt-3);
  outline-offset: 1px;
}

input[type=number] {
  font-family: var(--mono);
}

textarea {
  resize: vertical;
  min-height: 62px;
}

.hint {
  font-size: 11.5px;
  color: var(--muted);
}

.seg {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.seg input {
  display: none;
}

.seg label {
  padding: 8px 13px;
  border: 1px solid var(--line);
  border-radius: 8px;
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 600;
  background: #fff;
}

.seg input:checked+label {
  background: var(--asphalt);
  border-color: var(--asphalt);
  color: #fff;
}

/* ---------- Modal ---------- */

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(21,26,33,.5);
  z-index: 100;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 24px 16px;
  overflow-y: auto;
  animation: fade .15s ease-out;
}

@keyframes fade {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

.modal {
  background: var(--card);
  border-radius: 14px;
  width: 100%;
  max-width: 640px;
  margin: auto;
  box-shadow: 0 24px 60px rgba(21,26,33,.28);
  animation: pop .18s cubic-bezier(.2,.9,.3,1.1);
}

@keyframes pop {
  from {
    transform: translateY(10px) scale(.99);
    opacity: 0;
  }

  to {
    transform: none;
    opacity: 1;
  }
}

.modal-head {
  display: flex;
  align-items: center;
  padding: 17px 20px;
  border-bottom: 1px solid var(--line-soft);
}

.modal-title {
  font-size: 16.5px;
  font-weight: 700;
  letter-spacing: -.01em;
  margin: 0;
}

.modal-body {
  padding: 18px 20px;
  max-height: 65vh;
  overflow-y: auto;
}

.modal-foot {
  display: flex;
  gap: 9px;
  justify-content: flex-end;
  padding: 15px 20px;
  border-top: 1px solid var(--line-soft);
  background: #FCFBF8;
  border-radius: 0 0 14px 14px;
}

.x {
  margin-left: auto;
  background: none;
  border: 0;
  font-size: 24px;
  line-height: 1;
  color: var(--muted);
  cursor: pointer;
  padding: 0 4px;
}

/* ---------- Misc ---------- */

.toolbar {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 14px;
}

.filters {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  padding: 12px 14px;
  margin-bottom: 14px;
}

.filter-row {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  align-items: center;
}

.filter-row select,
.filter-row input {
  width: auto;
  min-width: 150px;
  padding: 8px 11px;
  font-size: 13.5px;
}

.filter-row .search {
  flex: 1;
  min-width: 190px;
  max-width: 340px;
}

.filter-row.adv {
  margin-top: 11px;
  padding-top: 11px;
  border-top: 1px solid var(--line-soft);
}

.adv-block {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 16px;
  background: #FCFBF8;
}

.adv-head {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
}

.adv-total {
  display: flex;
  align-items: center;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1.5px solid var(--asphalt);
  font-weight: 700;
  font-size: 14.5px;
}

.adv-balance {
  margin-top: 9px;
  padding-top: 9px;
  border-top: 1px dotted var(--line);
}

.adv-status {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 11px;
  font-size: 12.5px;
  color: var(--muted);
}

.adv-status span:last-child {
  margin-left: auto;
}

.money-amber {
  color: #8A5D12;
  font-weight: 600;
}

.adv-total-value {
  margin-left: auto;
  font-size: 18px;
  letter-spacing: -.02em;
}

.doc-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
}

.doc {
  border: 1.5px dashed var(--line);
  border-radius: 10px;
  background: #FCFBF8;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 132px;
  position: relative;
}

.doc.filled {
  border-style: solid;
  background: var(--card);
}

.doc-label {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 9px 10px 0;
  text-align: center;
}

.doc-drop {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  padding: 10px;
  text-align: center;
}

.doc-drop:hover {
  background: #F7F5F0;
}

.doc-plus {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--line-soft);
  color: var(--muted);
  display: grid;
  place-items: center;
  font-size: 17px;
  line-height: 1;
}

.doc-hint {
  font-size: 11px;
  color: var(--muted);
}

.doc-thumb {
  flex: 1;
  width: 100%;
  object-fit: cover;
  cursor: zoom-in;
  display: block;
  min-height: 0;
}

.doc-bar {
  display: flex;
  gap: 6px;
  padding: 7px;
  border-top: 1px solid var(--line-soft);
  background: #FCFBF8;
}

.doc-bar button {
  flex: 1;
  padding: 5px;
  font-size: 11.5px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--card);
  cursor: pointer;
  font-weight: 600;
}

.doc-bar button:hover {
  background: #F7F5F0;
}

.doc-bar .rm {
  color: var(--red);
  border-color: #E8CFCB;
}

.doc-size {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(21,26,33,.72);
  color: #fff;
  font-size: 10px;
  font-family: var(--mono);
  padding: 2px 6px;
  border-radius: 4px;
}

.doc-busy {
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,.86);
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
}

.meter {
  height: 9px;
  background: var(--line-soft);
  border-radius: 5px;
  overflow: hidden;
  margin: 8px 0 6px;
}

.meter-fill {
  height: 100%;
  border-radius: 5px;
  background: var(--green);
  transition: width .3s;
}

.meter-fill.warn {
  background: var(--amber);
}

.meter-fill.full {
  background: var(--red);
}

@media (max-width:760px) {
  .doc-grid {
    grid-template-columns: 1fr 1fr;
  }
}

.fpair {
  display: flex;
  align-items: center;
  gap: 7px;
}

.fpair label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}

.fpair input {
  min-width: 0;
}

@media (max-width:760px) {
  .filter-row select,
  .filter-row input {
    min-width: 0;
    flex: 1 1 46%;
  }

  .filter-row .search {
    flex: 1 1 100%;
    max-width: none;
  }

  .fpair {
    flex: 1 1 100%;
  }

  .fpair input {
    flex: 1;
  }
}

.toolbar input,
.toolbar select {
  width: auto;
  min-width: 150px;
}

.search {
  flex: 1;
  min-width: 180px;
  max-width: 320px;
}

.empty {
  padding: 44px 22px;
  text-align: center;
}

.empty-title {
  font-weight: 700;
  font-size: 15px;
  margin-bottom: 5px;
}

.empty-text {
  font-size: 13.5px;
  color: var(--muted);
  max-width: 380px;
  margin: 0 auto 16px;
}

.money-pos {
  color: var(--green);
  font-weight: 600;
}

.money-neg {
  color: var(--red);
  font-weight: 600;
}

.tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 16px;
  overflow-x: auto;
}

.tab {
  padding: 9px 14px;
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--muted);
  white-space: nowrap;
}

.tab.on {
  color: var(--ink);
  border-bottom-color: var(--amber);
}

.sec-title {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 24px 0 10px;
}

.divide {
  height: 1px;
  background: var(--line-soft);
  margin: 16px 0;

<script>
/* ============================================================
   MAA VANDANA LOGISTICS — transport business manager
   All data is stored in this browser (localStorage). Use
   Settings > Backup regularly to keep a copy of your data.
   ============================================================ */

/* ---------- 1. Storage ---------- */
const KEY = 'mvl_db_v1';
const BLANK = {
  settings:{business:'Maa Vandana Logistics', owner:'', phone:'', address:'', gst:''},
  trucks:[], parties:[], trips:[], ledger:[], expenses:[], drivers:[], driverTxns:[], places:[],
  shops:[], shopLedger:[],
  seeded:false
};
let DB = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return JSON.parse(JSON.stringify(BLANK));
    return Object.assign(JSON.parse(JSON.stringify(BLANK)), JSON.parse(raw));
  }catch(e){ return JSON.parse(JSON.stringify(BLANK)); }
}
function save(){
  reindex();
  DB.updatedAt = new Date().toISOString();
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ toast('Could not save. Your device storage may be full.'); }
  if(typeof syncReady==='function' && syncReady()) syncPush(false);
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ---------- 2. Helpers ---------- */
const $  = s => document.querySelector(s);
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const plural = (n, word) => n+' '+word+(n===1?'':'s');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function money(n, sign){
  const v = Math.round(num(n));
  const s = Math.abs(v).toLocaleString('en-IN');
  if(sign && v>0) return '+₹'+s;
  return (v<0?'−₹':'₹')+s;
}
function today(){ return new Date().toISOString().slice(0,10); }
function fdate(d){
  if(!d) return '—';
  const [y,m,dd] = d.split('-');
  const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return dd+' '+M[parseInt(m,10)-1]+' '+y;
}
function monthKey(d){ return (d||'').slice(0,7); }
function thisMonth(){ return today().slice(0,7); }
function monthName(k){
  if(!k) return '';
  const M=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return M[parseInt(k.slice(5,7),10)-1]+' '+k.slice(0,4);
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast ok'; t.textContent = msg;
  $('#toast').appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 2400);
}
function confirmAsk(msg, onYes, danger){
  openModal({
    title:'Please confirm',
    body:'<p style="margin:0;font-size:14.5px">'+esc(msg)+'</p>',
    okText: danger?'Delete':'Yes, continue',
    okClass: danger?'btn btn-danger':'btn btn-primary',
    onOk(){ closeModal(); onYes(); }
  });
}

/* Debounce: run fn once the person pauses typing, instead of on every keystroke */
let deferTimer;
function defer(fn){ clearTimeout(deferTimer); deferTimer = setTimeout(fn, 90); }

/* lookups — kept in an index so long lists stay fast */
let IDX = {truck:{}, party:{}, driver:{}};
function reindex(){
  IDX = {truck:{}, party:{}, driver:{}};
  DB.trucks.forEach(t=>IDX.truck[t.id]=t);
  DB.parties.forEach(p=>IDX.party[p.id]=p);
  DB.drivers.forEach(d=>IDX.driver[d.id]=d);
  IDX.shop = {}; (DB.shops||[]).forEach(s=>IDX.shop[s.id]=s);
}
// index first, with a safety net in case anything was added without a save
const truckById  = id => IDX.truck[id]  || DB.trucks.find(t=>t.id===id);
const partyById  = id => IDX.party[id]  || DB.parties.find(p=>p.id===id);
const driverById = id => IDX.driver[id] || DB.drivers.find(d=>d.id===id);
const shopById   = id => (IDX.shop||{})[id] || (DB.shops||[]).find(s=>s.id===id);
const shopName   = id => { const s=shopById(id); return s? s.name : '—'; };
const truckName  = id => { const t=truckById(id); return t? t.number : '—'; };
const partyName  = id => { const p=partyById(id); return p? p.name : '—'; };
const driverName = id => { const d=driverById(id); return d? d.name : '—'; };

/* ---------- 3. Business calculations ---------- */

// Party outstanding = opening + freight billed + extra charges − payments received − advances − discounts
function partyBalance(pid){
  const p = partyById(pid); if(!p) return 0;
  let bal = num(p.opening);
  DB.trips.filter(t=>t.partyId===pid).forEach(t=>{ bal += num(t.freight); bal -= num(t.advance); });
  DB.ledger.filter(l=>l.partyId===pid).forEach(l=>{ bal += l.type==='debit' ? num(l.amount) : -num(l.amount); });
  return bal;
}
// All party balances in a single pass — used by lists so they stay quick
function allBalances(){
  const m = {};
  DB.parties.forEach(p=>{ m[p.id] = num(p.opening); });
  DB.trips.forEach(t=>{ if(t.partyId in m) m[t.partyId] += num(t.freight) - num(t.advance); });
  DB.ledger.forEach(l=>{ if(l.partyId in m) m[l.partyId] += l.type==='debit' ? num(l.amount) : -num(l.amount); });
  return m;
}
function totalReceivable(){
  const m = allBalances();
  return Object.values(m).reduce((s,b)=>s+Math.max(0,b),0);
}

// Driver payable = salary due entries − everything actually paid out
function driverBalance(did){
  let bal = 0;
  DB.driverTxns.filter(t=>t.driverId===did).forEach(t=>{
    bal += t.type==='due' ? num(t.amount) : -num(t.amount);
  });
  return bal;
}
function totalDriverPayable(){ return DB.drivers.reduce((s,d)=>s+Math.max(0,driverBalance(d.id)),0); }

// Profit & loss for a date range
function pnl(from, to){
  const inR = d => (!from || d>=from) && (!to || d<=to);
  const trips = DB.trips.filter(t=>inR(t.date));
  const freight = trips.reduce((s,t)=>s+num(t.freight),0);
  const hire    = trips.reduce((s,t)=>s+num(t.hire),0);
  const byCat = {};
  DB.expenses.filter(e=>inR(e.date)).forEach(e=>{ byCat[e.category]=(byCat[e.category]||0)+num(e.amount); });
  const expense = Object.values(byCat).reduce((a,b)=>a+b,0);
  const driverPaid = DB.driverTxns.filter(t=>inR(t.date) && t.type!=='due').reduce((s,t)=>s+num(t.amount),0);
  const costs = hire + expense + driverPaid;

  /* Money actually in hand. Advances taken against a trip plus receipts
     entered in a party ledger. Advances live on the trip and are never
     copied into the ledger, so nothing is counted twice. Discounts and
     adjustments reduce a balance without money arriving, so they are left out. */
  const advances = trips.reduce((s,t)=>s+num(t.advance),0);
  const credits  = DB.ledger.filter(l=>inR(l.date) && l.type==='credit');
  const receipts = credits.filter(l=>l.mode!=='Adjustment').reduce((s,l)=>s+num(l.amount),0);
  const adjusted = credits.filter(l=>l.mode==='Adjustment').reduce((s,l)=>s+num(l.amount),0);
  const collected = advances + receipts;

  return {trips, tripCount:trips.length, freight, hire, byCat, expense, driverPaid, costs,
    profit:freight-costs, advances, receipts, adjusted, collected, actual:collected-costs};
}

   ============================================================ */
function viewInsights(){
  defaultRange('6m');
  const series = seriesForRange(sub.from, sub.to);
  const inWindow = pnl(sub.from, sub.to);
  const all = pnl('2000-01-01','2099-12-31');
  const trips = DB.trips;
  const bmap = allBalances();
  const outstanding = Object.values(bmap).reduce((s,b)=>s+Math.max(0,b),0);

  const winPerTrip  = inWindow.tripCount ? inWindow.freight/inWindow.tripCount : 0;
  const winCostTrip = inWindow.tripCount ? inWindow.costs/inWindow.tripCount : 0;
  const winMargin   = inWindow.freight ? inWindow.profit/inWindow.freight*100 : 0;
  const billed    = all.freight + DB.parties.reduce((s,p)=>s+Math.max(0,num(p.opening)),0);
  const collected = billed - outstanding;
  const collRate  = billed ? collected/billed*100 : 0;

  // how long the oldest unpaid trip has been sitting
  const unpaid = trips.filter(t=>t.status!=='paid').sort((a,b)=>a.date.localeCompare(b.date));
  const oldestDays = unpaid.length ? Math.round((Date.now()-new Date(unpaid[0].date).getTime())/86400000) : 0;

  const from = sub.from, to = sub.to;
  const win = trips.filter(t=>t.date>=from && t.date<=to);
  const perTruck = DB.trucks.map(tr=>{
    const ts = win.filter(t=>t.truckId===tr.id);
    const freight = ts.reduce((s,t)=>s+num(t.freight),0);
    const hire = ts.reduce((s,t)=>s+num(t.hire),0);
    const exp = DB.expenses.filter(e=>e.truckId===tr.id && e.date>=from && e.date<=to).reduce((s,e)=>s+num(e.amount),0);
    return {label:tr.number, trips:ts.length, value:freight-hire-exp, freight};
  }).filter(x=>x.trips||x.value).sort((a,b)=>b.value-a.value);

  // routes ranked by what they actually leave behind
  const routes = {};
  win.forEach(t=>{
    const k = (t.from||'?')+' → '+(t.to||'?');
    routes[k] = routes[k] || {label:k, n:0, freight:0, margin:0};
    routes[k].n++; routes[k].freight += num(t.freight); routes[k].margin += num(t.freight)-num(t.hire);
  });
  const routeRows = Object.values(routes).sort((a,b)=>b.margin-a.margin).slice(0,6);

  // which parties bring the work in
  const partyMix = DB.parties.map(p=>({label:p.name,
    value: win.filter(t=>t.partyId===p.id).reduce((s,t)=>s+num(t.freight),0)}))
    .filter(x=>x.value>0).sort((a,b)=>b.value-a.value).slice(0,6);

  $('#pageSub').textContent = rangeCaption();
  $('#pageActions').innerHTML = '<button class="btn" onclick="window.print()">Print</button>';

  $('#view').innerHTML =
  rangeBar('insights')+
  '<div class="grid g4 rise">'+
    kpi('Freight per trip', winPerTrip, {note:inWindow.tripCount+' trips in this period'})+
    kpi('Cost per trip', winCostTrip, {note:'Hire, expenses, driver pay'})+
    kpi('Net margin', winMargin, {fmt:'pct', tone:winMargin>=0?'pos':'neg', note:'Profit as share of freight'})+
    kpi('Collection rate', collRate, {fmt:'pct', note:money(outstanding)+' outstanding, all time'})+
  '</div>'+

  '<div class="card chart-card" style="margin-top:14px">'+
    '<h3 class="chart-title">Profit trend</h3>'+
    '<div class="chart-sub">Month by month across '+rangeCaption()+'</div>'+
    lineChart(series, [
      {key:'freight', label:'Freight', color:'#E9A13B', fill:true},
      {key:'cost',    label:'Costs',   color:'#4A5568', dash:true},
      {key:'profit',  label:'Profit',  color:'#1C7A57'}
    ], {height:250})+
  '</div>'+

  '<div class="g-wide" style="margin-top:14px">'+
    '<div class="card chart-card">'+
      '<h3 class="chart-title">Which truck earns most</h3>'+
      '<div class="chart-sub">Freight minus hire and expenses booked to it</div>'+
      (perTruck.length? barList(perTruck.map(t=>({label:t.label, value:t.value,
        color:t.value>=0?'#2C5D7C':'#B3372C', note:plural(t.trips,'trip')+' · '+money(t.freight)+' freight'})))
        : '<div class="empty" style="padding:26px 10px"><div class="empty-text">No truck activity in this period.</div></div>')+
    '</div>'+
    '<div class="card chart-card">'+
      '<h3 class="chart-title">Who your work comes from</h3>'+
      '<div class="chart-sub">Share of freight by party</div>'+
      (partyMix.length? donutChart(partyMix,'freight')
        : '<div class="empty" style="padding:26px 10px"><div class="empty-text">No freight recorded in this period.</div></div>')+
    '</div>'+
  '</div>'+

  '<div class="card" style="margin-top:14px">'+
    '<div class="card-head"><h3 class="card-title">Best routes</h3></div>'+
    (routeRows.length? '<div class="tbl-wrap"><table>'+
      '<thead><tr><th>Route</th><th class="t-r">Trips</th><th class="t-r">Freight</th>'+
      '<th class="t-r">After hire</th><th class="t-r">Per trip</th></tr></thead><tbody>'+
      routeRows.map(r=>'<tr><td class="t-strong">'+esc(r.label)+'</td>'+
        '<td class="t-r num">'+r.n+'</td>'+
        '<td class="t-r num">'+money(r.freight)+'</td>'+
        '<td class="t-r num '+(r.margin>=0?'money-pos':'money-neg')+'">'+money(r.margin)+'</td>'+
        '<td class="t-r num">'+money(r.margin/r.n)+'</td></tr>').join('')+
      '</tbody></table></div>'
      : '<div class="empty"><div class="empty-text">Record a few trips and your strongest routes will show up here.</div></div>')+
  '</div>'+

  (oldestDays>0? '<div class="note" style="margin-top:14px">Your oldest unpaid trip has been outstanding for <b>'+
    oldestDays+' days</b>. '+money(outstanding)+' is sitting with parties right now.</div>':'');
}

  const og = (sub.origin||'').toLowerCase().trim();
  const de = (sub.dest||'').toLowerCase().trim();
  let list = DB.trips.slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(sub.party)  list = list.filter(t=>t.partyId===sub.party);
  if(sub.truck)  list = list.filter(t=>t.truckId===sub.truck);
  if(sub.status) list = list.filter(t=>tripStatus(t)===sub.status);

      '<th class="t-r">Freight</th><th class="t-r">Advance</th><th>Status</th><th></th></tr></thead><tbody>'+
      list.map(t=>{

          '<td style="white-space:nowrap"'+go+'>'+fdate(t.date)+'</td>'+
          '<td class="num" style="white-space:nowrap"'+go+'>'+esc(t.lr||'\u2014')+'</td>'+
          '<td class="t-strong"'+go+'>'+esc(t.from||'\u2014')+'</td>'+
          '<td class="t-strong"'+go+'>'+esc(t.to||'\u2014')+
            (t.material?'<div class="t-sub">'+esc(t.material)+'</div>':'')+'</td>'+
          '<td'+go+'>'+esc(partyName(t.partyId))+'</td>'+
          '<td'+go+'>'+esc(truckName(t.truckId))+
            (t.hire?'<div class="t-sub">Hire '+money(t.hire)+'</div>':'')+'</td>'+
          '<td class="t-r num t-strong">'+money(t.freight)+'</td>'+
          '<td class="t-r num">'+(num(t.advance)?money(t.advance):'\u2014')+
            (num(t.fuelAmt)?'<div class="t-sub">cash '+money(t.advCash)+' + fuel '+money(t.fuelAmt)+'</div>':'')+'</td>'+
          '<td>'+statusChip(tripStatus(t))+'</td>'+

let fuelDirty = false;
function fuelEdited(){ fuelDirty = true; recalcAdvance(); }
function recalcAdvance(){
  const amtEl = document.getElementById('f_fuelAmt');
  if(!amtEl) return;
  const q = num(val('f_fuelQty')), r = num(val('f_fuelRate'));
  if(!fuelDirty && q>0 && r>0) amtEl.value = Math.round(q*r*100)/100;
  const hint = document.getElementById('fuelHint');
  if(hint){
    hint.innerHTML = fuelDirty
      ? 'Entered by hand. <a href="#" onclick="event.preventDefault();fuelDirty=false;recalcAdvance()">Use quantity × rate</a>'
      : (q>0 && r>0 ? 'Calculated as '+q+' × ₹'+r : 'Fill quantity and rate, or type the amount directly');
  }
  const total = num(val('f_advCash')) + num(amtEl.value);
  const tot = document.getElementById('f_advTotal');
  if(tot) tot.textContent = money(total);

  const freight = num(val('f_freight'));
  const bal = freight - total;
  const balEl = document.getElementById('f_balance');
  const labEl = document.getElementById('f_balanceLabel');
  if(balEl){
    balEl.textContent = money(Math.abs(bal));
    balEl.className = 'num adv-total-value '+(bal>0?'money-neg':bal<0?'money-amber':'money-pos');
    if(labEl) labEl.textContent = bal<0 ? 'Advance exceeds freight by'
                                : bal===0 && freight ? 'Fully paid in advance'
                                : 'Balance pending';
  }
  const prev = document.getElementById('f_statusPreview');
  if(prev) prev.innerHTML = statusChip(tripStatus({advance:total, freight:freight}));
}

function ledgerRows(pid){
  const rows = [];
  const p = partyById(pid);
  if(num(p.opening)) rows.push({date:'', label:'Opening balance', ref:'', debit:num(p.opening)>0?num(p.opening):0, credit:num(p.opening)<0?-num(p.opening):0, kind:'open'});
  DB.trips.filter(t=>t.partyId===pid).forEach(t=>{
    rows.push({date:t.date, label:'Freight — '+(t.from||'?')+' to '+(t.to||'?'), ref:t.lr?('LR '+t.lr):truckName(t.truckId),
      debit:num(t.freight), credit:0, kind:'trip', tripId:t.id});
    if(num(t.advCash)) rows.push({date:t.date, label:'Advance received in cash', ref:t.lr?('LR '+t.lr):'',
      debit:0, credit:num(t.advCash), kind:'trip', tripId:t.id});
    if(num(t.fuelAmt)) rows.push({date:t.date, label:'Advance given as fuel',
      ref:[fuelNote(t), t.lr?('LR '+t.lr):''].filter(Boolean).join(' · '),
      debit:0, credit:num(t.fuelAmt), kind:'trip', tripId:t.id});
  });
  DB.ledger.filter(l=>l.partyId===pid).forEach(l=>{
    rows.push({date:l.date, label:l.note||(l.type==='credit'?'Payment received':'Charge added'),
      ref:[l.mode,l.ref].filter(Boolean).join(' · '), debit:l.type==='debit'?num(l.amount):0,
      credit:l.type==='credit'?num(l.amount):0, kind:'entry', entryId:l.id});
  });
  rows.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  let run = 0;
  rows.forEach(r=>{ run += r.debit - r.credit; r.running = run; });
  return rows;
}

function renderLedger(pid){
  const p = partyById(pid);
  if(!p){ sub={}; return viewParties(); }
  const rows = ledgerRows(pid);
  const bal = partyBalance(pid);
  const billed = rows.reduce((s,r)=>s+r.debit,0);
  const paid   = rows.reduce((s,r)=>s+r.credit,0);
  $('#pageTitle').textContent = p.name;
  $('#pageSub').textContent = [p.city,p.phone].filter(Boolean).join(' · ') || 'Party ledger';
  $('#pageActions').innerHTML =

function delLedger(eid){

}
function delParty(pid){
  const n = DB.trips.filter(t=>t.partyId===pid).length;
  confirmAsk('Delete this party'+(n?' along with its '+n+' trip'+(n===1?'':'s'):'')+' and all ledger entries? This cannot be undone.', ()=>{

    DB.ledger  = DB.ledger.filter(x=>x.partyId!==pid);

function docHealth(t){
  const docs = t.docs||[];
  if(!docs.length) return '<div class="t-sub">No papers on file</div>';
  const bad  = docs.filter(d=>docStatus(d.expiry).key==='expired').length;
  const soon = docs.filter(d=>docStatus(d.expiry).key==='soon').length;
  if(bad)  return '<div class="t-sub"><span class="chip chip-red">'+plural(bad,'paper')+' expired</span></div>';
  if(soon) return '<div class="t-sub"><span class="chip chip-amber">'+soon+' expiring soon</span></div>';
  return '<div class="t-sub"><span class="chip chip-green">'+plural(docs.length,'paper')+' valid</span></div>';
}

function truckTabs(){
  const n = alertCount();
  return '<div class="tabs">'+
    '<button class="tab'+(sub.tab==='fleet'?' on':'')+'" onclick="sub={tab:\'fleet\'};render()">Fleet</button>'+
    '<button class="tab'+(sub.tab==='docs'?' on':'')+'" onclick="sub={tab:\'docs\'};render()">Documents'+
      (n?' <span class="chip chip-red" style="margin-left:6px">'+n+'</span>':'')+'</button>'+
  '</div>';
}

function viewTruckDocs(){
  $('#pageActions').innerHTML = '<button class="btn btn-amber" onclick="truckDocForm()">+ <span>Add document</span></button>';
  const rows = [];
  DB.trucks.forEach(t=>(t.docs||[]).forEach(d=>rows.push({t, d, st:docStatus(d.expiry)})));
  rows.sort((a,b)=>{
    const rank = {expired:0, soon:1, active:2, none:3};
    if(rank[a.st.key]!==rank[b.st.key]) return rank[a.st.key]-rank[b.st.key];
    return (a.d.expiry||'').localeCompare(b.d.expiry||'');
  });
  const filt = sub.status||'';
  const shown = filt ? rows.filter(r=>r.st.key===filt) : rows;

  $('#view').innerHTML =
  truckTabs()+

    kpi('Expired', count('expired'), {fmt:'plain', tone:count('expired')?'neg':'', note:'Needs renewing now'})+
    kpi('Expiring within '+SOON_DAYS+' days', count('soon'), {fmt:'plain', note:'Plan these'})+
    kpi('Valid', count('active'), {fmt:'plain', tone:'pos', note:'Nothing due soon'})+
  '</div>'+
  '<div class="filters"><div class="filter-row">'+
    '<select onchange="sub.status=this.value;render()"><option value="">All documents</option>'+
      [['expired','Expired'],['soon','Expiring soon'],['active','Active']].map(([v,l])=>
        '<option value="'+v+'"'+(v===filt?' selected':'')+'>'+l+'</option>').join('')+'</select>'+
    (sub.truck? '<button class="btn btn-sm" onclick="sub={tab:\'docs\'};render()">Showing one truck · show all</button>':'')+
  '</div></div>'+
  (rows.length===0
    ? empty('No documents yet','Record insurance, PUC, fitness, permit and road tax dates here, and the bell will warn you before each one runs out.',
        '<button class="btn btn-amber" onclick="truckDocForm()">+ Add your first document</button>')
    : shown.length===0 ? empty('Nothing in this group','Try a different status.','')
    : '<div class="card"><div class="tbl-wrap"><table>'+
      '<thead><tr><th>Truck</th><th>Document</th><th>Expiry date</th><th>Status</th><th>Notes</th><th></th></tr></thead><tbody>'+
      shown.map(r=>
        '<tr'+(sub.truck===r.t.id?' style="background:var(--amber-soft)"':'')+'>'+
        '<td class="num t-strong">'+esc(r.t.number)+'</td>'+
        '<td class="t-strong">'+esc(r.d.header)+'</td>'+
        '<td style="white-space:nowrap">'+fdate(r.d.expiry)+'</td>'+
        '<td><span class="chip '+r.st.chip+'">'+r.st.label+'</span>'+
          '<div class="t-sub">'+esc(docWhen(r.st.days))+'</div></td>'+
        '<td class="t-sub">'+esc(r.d.notes||'—')+'</td>'+
        '<td><div class="row-actions">'+

        '</div></td></tr>').join('')+
      '</tbody></table></div></div>');
}

function truckDocForm(truckId, docId){
  if(!DB.trucks.length){
    openModal({title:'Add a truck first', body:'<p style="margin:0">Documents belong to a vehicle, so add a truck before recording its papers.</p>'});
    return;
  }
  const t = truckId ? truckById(truckId) : null;
  const doc = t && docId ? (t.docs||[]).find(x=>x.id===docId) : null;
  openModal({
    title: doc?'Edit document':'Add document', okText: doc?'Save changes':'Save document',
    body:'<div class="form-grid">'+
      fSelect('dc_truck','Truck', truckOptions(), t?t.id:(sub.truck||''))+
      '<div class="field"><label for="dc_header">Document <span style="color:var(--red)">*</span></label>'+
        '<input id="dc_header" list="docTypeList" autocomplete="off" value="'+esc(doc?doc.header:'')+'" placeholder="Insurance, PUC, permit…"></div>'+
      fText('dc_expiry','Expiry date', doc?doc.expiry:'','date')+
      fText('dc_notes','Notes', doc?doc.notes:'','text','placeholder="Optional"')+
      '<div class="field full"><span class="hint">Renewed it? Just change the date here — the old warning disappears and a fresh one is worked out from the new date.</span></div>'+
    '</div>',
    onOk(){
      const tid = val('dc_truck'), header = val('dc_header'), expiry = val('dc_expiry');
      if(!tid){ toast('Choose the truck this document belongs to'); return; }
      if(!header){ toast('Enter the document name'); return; }
      if(!expiry){ toast('Enter the expiry date'); return; }
      const target = truckById(tid);
      target.docs = target.docs || [];
      if(doc && t && t.id===tid){
        Object.assign(doc, {header, expiry, notes:val('dc_notes')});
      } else {
        if(doc && t) t.docs = t.docs.filter(x=>x.id!==doc.id);   // moved to another truck
        target.docs.push({id:doc?doc.id:uid(), header, expiry, notes:val('dc_notes')});
      }
      save(); buildDocTypeList(); closeModal(); render(); toast(doc?'Document updated':'Document saved');
    }
  });
}
function delTruckDoc(truckId, docId){
  const t = truckById(truckId); if(!t) return;
  confirmAsk('Delete this document and its expiry reminder?', ()=>{
    t.docs = (t.docs||[]).filter(x=>x.id!==docId);
    save(); render(); toast('Document deleted');
  }, true);
}

function renderTruckList(){
  const box = $('#listBox'); if(!box) return;
  const q = (sub.q||'').toLowerCase().trim();
  let stats = DB.trucks.map(t=>{
    const trips = DB.trips.filter(x=>x.truckId===t.id);
    const freight = trips.reduce((s,x)=>s+num(x.freight),0);
    const hire = trips.reduce((s,x)=>s+num(x.hire),0);
    const exp = DB.expenses.filter(e=>e.truckId===t.id).reduce((s,e)=>s+num(e.amount),0);
    return {...t, tripCount:trips.length, freight, hire, exp, net:freight-hire-exp};
  });
  if(sub.type) stats = stats.filter(t=>t.type===sub.type);
  if(q) stats = stats.filter(t=>
    ((t.number||'')+' '+(t.model||'')+' '+(t.owner||'')+' '+(t.ownerPhone||'')+' '+
     (t.driverId?driverName(t.driverId):'')).toLowerCase().includes(q));

  box.innerHTML =
  (DB.trucks.length===0
    ? empty('No trucks yet','Add the vehicles you run. Mark a truck as "market" when it belongs to someone else and you pay hire for it.',
        '<button class="btn btn-amber" onclick="truckForm()">+ Add your first truck</button>')
    : stats.length===0 ? empty('No truck matches','Try a different word, or switch back to owned and market.','')
    : '<div class="card"><div class="tbl-wrap"><table>'+
      '<thead><tr><th>Truck</th><th>Type</th><th>Driver</th><th class="t-r">Trips</th>'+
      '<th class="t-r">Freight earned</th><th class="t-r">Hire + expenses</th><th class="t-r">Net</th><th></th></tr></thead><tbody>'+
      stats.map(t=>
        '<tr><td><div class="t-strong num">'+esc(t.number)+'</div>'+
          (t.model?'<div class="t-sub">'+esc(t.model)+'</div>':'')+'</td>'+
        '<td>'+(t.type==='owned'?'<span class="chip chip-blue">Owned</span>':'<span class="chip chip-grey">Market</span>')+
          (t.owner?'<div class="t-sub">'+esc(t.owner)+'</div>':'')+'</td>'+
        '<td>'+esc(t.driverId?driverName(t.driverId):'—')+
          docHealth(t)+'</td>'+
        '<td class="t-r num">'+t.tripCount+'</td>'+
        '<td class="t-r num">'+money(t.freight)+'</td>'+
        '<td class="t-r num">'+money(t.hire+t.exp)+'</td>'+
        '<td class="t-r num '+(t.net>=0?'money-pos':'money-neg')+'">'+money(t.net)+'</td>'+
        '<td><div class="row-actions">'+
          '<button class="btn btn-sm" onclick="truckForm(\''+t.id+'\')">Edit</button>'+
          '<button class="btn btn-sm btn-danger" onclick="delTruck(\''+t.id+'\')">Delete</button>'+
        '</div></td></tr>').join('')+'</tbody></table></div></div>'+
      '<div class="note" style="margin-top:14px">Net is freight earned minus hire paid and expenses booked to that truck. Driver salary is not included here — see Reports for the full profit picture.</div>');
}

let pendingTruckDocs = [];
function addDocRow(header, expiry, notes){
  pendingTruckDocs.push({id:uid(), header:header||'', expiry:expiry||'', notes:notes||''});
  paintTruckDocs();
}
function removeDocRow(i){ pendingTruckDocs.splice(i,1); paintTruckDocs(); }
function readDocRows(){
  pendingTruckDocs.forEach((d,i)=>{
    const hEl=document.getElementById('td_h'+i), eEl=document.getElementById('td_e'+i), nEl=document.getElementById('td_n'+i);
    if(hEl) d.header = hEl.value.trim();
    if(eEl) d.expiry = eEl.value;
    if(nEl) d.notes  = nEl.value.trim();
  });
}
function paintTruckDocs(){
  const box = document.getElementById('truckDocs'); if(!box) return;
  box.innerHTML = pendingTruckDocs.map((d,i)=>{
    const st = docStatus(d.expiry);
    return '<div class="docrow">'+
      '<div class="field"><label for="td_h'+i+'">Document</label>'+
        '<input id="td_h'+i+'" list="docTypeList" value="'+esc(d.header)+'" placeholder="Insurance" onchange="readDocRows()"></div>'+
      '<div class="field"><label for="td_e'+i+'">Expires</label>'+
        '<input id="td_e'+i+'" type="date" value="'+esc(d.expiry)+'" onchange="readDocRows();paintTruckDocs()"></div>'+
      '<div class="field"><label for="td_n'+i+'">Notes</label>'+
        '<input id="td_n'+i+'" value="'+esc(d.notes)+'" placeholder="Optional" onchange="readDocRows()"></div>'+
      '<button type="button" class="rmdoc" onclick="readDocRows();removeDocRow('+i+')">Remove</button>'+
      (d.expiry?'<div style="grid-column:1/-1;margin-top:-4px"><span class="chip '+st.chip+'">'+st.label+'</span>'+
        '<span class="hint" style="margin-left:8px">'+esc(docWhen(st.days))+'</span></div>':'')+

function delTruck(id){
  const n = DB.trips.filter(t=>t.truckId===id).length;

  confirmAsk('Delete this truck?', ()=>{ DB.trucks = DB.trucks.filter(x=>x.id!==id); save(); render(); toast('Truck deleted'); }, true);
}

function renderExpenseList(){
  const box = $('#listBox'); if(!box) return;
  const fm = sub.month||'', fc = sub.cat||'', ft = sub.truck||'';
  let list = DB.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(fm) list = list.filter(e=>monthKey(e.date)===fm);
  if(fc) list = list.filter(e=>e.category===fc);
  if(ft) list = list.filter(e=>e.truckId===ft);
  const total = list.reduce((s,e)=>s+num(e.amount),0);
  const byCat = {}; list.forEach(e=>{ byCat[e.category]=(byCat[e.category]||0)+num(e.amount); });
  const top = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const full = list.length;
  list = list.slice(0, pageLimit());

  box.innerHTML =
  (list.length && total ? '<div class="grid g4" style="margin-bottom:16px">'+
    '<div class="stat accent"><div class="stat-label">Total shown</div><div class="stat-value">'+money(total)+'</div>'+
      '<div class="stat-note">'+list.length+' entries</div></div>'+
    top.map(([c,v])=>'<div class="stat"><div class="stat-label">'+esc(c)+'</div>'+
      '<div class="stat-value">'+money(v)+'</div><div class="stat-note">'+Math.round(v/total*100)+'% of total</div></div>').join('')+
  '</div>':'')+
  (DB.expenses.length===0

let expenseDraft = null;
function expenseForm(id, preselectShop){
  let e = id ? DB.expenses.find(x=>x.id===id) : null;
  if(!e && expenseDraft){ e = expenseDraft; expenseDraft = null; }
  const shops = DB.shops || [];
  const chosenShop = preselectShop || (e?e.shopId:'') || '';
  const isCredit = (e && e.mode==='Credit') || !!preselectShop;
  openModal({
    title: e?'Edit expense':'New expense', okText: e?'Save changes':'Save expense',
    body:'<div class="form-grid">'+
      fText('e_date','Date', e?e.date:today(),'date')+
      fText('e_amount','Amount (₹)', e?e.amount:'','number','min="0" step="1"')+
      fSelect('e_cat','Category', CATEGORIES.map(c=>({v:c,t:c})), e?e.category:'Fuel / Diesel')+
      fSelect('e_truck','Truck (optional)', truckOptions(), e?e.truckId:'')+
      fText('e_paidTo','Paid to', e?e.paidTo:'','text','placeholder="Pump, mechanic, bank…"')+
      fSelect('e_mode','Mode',[{v:'Cash',t:'Cash'},{v:'Bank',t:'Bank transfer'},{v:'UPI',t:'UPI'},{v:'Card',t:'Card'},{v:'Credit',t:'On credit'}],
        isCredit?'Credit':(e?e.mode:'Cash'), 'onchange="toggleShopField()"')+
      '<div class="field full" id="shopField"'+(isCredit?'':' hidden')+'>'+
        '<label for="e_shop">Shop <span style="color:var(--red)">*</span></label>'+
        '<select id="e_shop" onchange="shopPicked()">'+
          '<option value="">— select the shop —</option>'+
          shops.map(s=>'<option value="'+s.id+'"'+(s.id===chosenShop?' selected':'')+'>'+esc(s.name)+
            (shopBalance(s.id)>0?' · '+money(shopBalance(s.id))+' owed':'')+'</option>').join('')+
          '<option value="__new">+ Add a new shop</option>'+
        '</select>'+
        '<span class="hint">Taken on credit, so this goes into the shop\u2019s ledger as money you owe'+
          '<span id="shopTruckHint"></span>.</span>'+
      '</div>'+
      fArea('e_note','Details', e?e.note:'')+
    '</div>',
    onOk(){
      const amt = num(val('e_amount'));
      if(amt<=0){ toast('Enter an amount greater than zero'); return; }
      const mode = val('e_mode');
      const shopId = mode==='Credit' ? val('e_shop') : '';
      if(mode==='Credit' && (!shopId || shopId==='__new')){
        toast('Please select a shop for this credit expense.');
        const el = document.getElementById('e_shop');
        if(el){ el.focus(); el.style.borderColor = 'var(--red)'; }
        return;
      }
      const existing = e && e.id ? DB.expenses.findIndex(x=>x.id===e.id) : -1;
      const rec = {id: existing>=0 ? e.id : uid(), date:val('e_date')||today(), amount:amt, category:val('e_cat'),
        truckId:val('e_truck'), paidTo:val('e_paidTo'), mode:mode, shopId:shopId, note:val('e_note')};
      if(existing>=0) DB.expenses[existing] = rec; else DB.expenses.push(rec);
      save(); closeModal();
      if(route==='shops' && sub.open) renderShopLedger(sub.open); else render();
      toast(e?'Expense updated':'Expense saved');
    }
  });
  toggleShopField();
}

function toggleShopField(){
  const f = document.getElementById('shopField');
  if(!f) return;
  const credit = val('e_mode')==='Credit';
  f.hidden = !credit;
  const hint = document.getElementById('shopTruckHint');
  if(hint){
    const t = val('e_truck');
    hint.textContent = t ? ', against ' + truckName(t) : ', with the truck shown as N/A';
  }
}
/* "+ Add a new shop" without losing what has been typed so far */
function shopPicked(){
  const el = document.getElementById('e_shop');
  if(!el) return;
  el.style.borderColor = '';
  if(el.value!=='__new') return;
  const draft = {id:null, date:val('e_date'), amount:val('e_amount'), category:val('e_cat'),
    truckId:val('e_truck'), paidTo:val('e_paidTo'), mode:'Credit', note:val('e_note')};
  closeModal();
  shopForm(null, draft);
}
function delExpense(id){
  confirmAsk('Delete this expense?', ()=>{ DB.expenses = DB.expenses.filter(x=>x.id!==id); save(); render(); toast('Expense deleted'); }, true);
}

function renderShopList(){
  const box = $('#listBox'); if(!box) return;
  const q = (sub.q||'').toLowerCase().trim();
  const bal = allShopBalances();
  const counts = {};
  DB.expenses.forEach(e=>{ if(e.mode==='Credit' && e.shopId) counts[e.shopId]=(counts[e.shopId]||0)+1; });
  let list = (DB.shops||[]).map(s=>({...s, bal:bal[s.id]||0, bills:counts[s.id]||0}));
  if(q) list = list.filter(s=>((s.name||'')+' '+(s.person||'')+' '+(s.phone||'')+' '+(s.city||'')).toLowerCase().includes(q));
  if(sub.due==='due') list = list.filter(s=>s.bal>0);
  list.sort((a,b)=>b.bal-a.bal);

  box.innerHTML =
  ((DB.shops||[]).length===0
    ? empty('No shops yet','A shop is anyone you buy from on credit — the diesel pump, the tyre dealer, the mechanic. Add one, then mark an expense as "On credit" against it.',

    : list.length===0 ? empty('No shop matches','Try a different word, or switch back to all shops.','')
    : '<div class="card"><div class="tbl-wrap"><table>'+
      '<thead><tr><th>Shop</th><th>Contact</th><th class="t-r">Credit bills</th>'+

        '<td class="t-r num '+(s.bal>0?'money-neg':s.bal<0?'money-pos':'')+'">'+money(Math.abs(s.bal))+

function shopEntryForm(sid, eid){
  const e = eid ? (DB.shopLedger||[]).find(x=>x.id===eid) : null;
  openModal({
    title: e? 'Edit ledger entry':'Shop ledger entry', okText: e?'Save changes':'Save entry',
    body:'<div class="form-grid">'+
      fSeg('sl_type','Entry type',[
        {v:'credit',t:'Payment made to shop'},
        {v:'debit', t:'Charge added by shop'}], e?e.type:'credit')+
      fText('sl_date','Date', e?e.date:today(),'date')+
      fText('sl_amount','Amount (₹)', e?e.amount:'','number','min="0" step="1"')+
      fSelect('sl_truck','Truck (optional)', truckOptions(), e?e.truckId:'')+
      fSelect('sl_mode','Mode',[{v:'Cash',t:'Cash'},{v:'Bank',t:'Bank transfer'},{v:'UPI',t:'UPI'},{v:'Cheque',t:'Cheque'},{v:'Adjustment',t:'Adjustment'}], e?e.mode:'Cash')+
      fText('sl_note','Description', e?e.note:'','text','placeholder="e.g. Part payment for August bills"')+
    '</div>',
    onOk(){
      const amt = num(val('sl_amount'));
      if(amt<=0){ toast('Enter an amount greater than zero'); return; }
      const rec = {id:e?e.id:uid(), shopId:sid, date:val('sl_date')||today(), type:checked('sl_type')||'credit',
        amount:amt, truckId:val('sl_truck'), mode:val('sl_mode'), note:val('sl_note')};
      DB.shopLedger = DB.shopLedger || [];
      if(e) DB.shopLedger[DB.shopLedger.findIndex(x=>x.id===e.id)] = rec; else DB.shopLedger.push(rec);
      save(); closeModal(); renderShopLedger(sid); toast(e?'Entry updated':'Entry saved');
    }
  });
}
function delShopEntry(eid){
  const e = (DB.shopLedger||[]).find(x=>x.id===eid); if(!e) return;
  confirmAsk('Delete this ledger entry?', ()=>{
    DB.shopLedger = DB.shopLedger.filter(x=>x.id!==eid); save(); renderShopLedger(e.shopId); toast('Entry deleted');
  }, true);
}
function delShop(sid){
  const n = creditExpenses(sid).length;
  if(n){
    openModal({title:'Shop is in use', body:'<p style="margin:0">'+n+' credit expense'+(n===1?' is':'s are')+
      ' booked against this shop. Change those expenses first, so your records stay correct.</p>'});
    return;
  }
  confirmAsk('Delete this shop and its manual ledger entries?', ()=>{
    DB.shops = DB.shops.filter(x=>x.id!==sid);
    DB.shopLedger = (DB.shopLedger||[]).filter(x=>x.shopId!==sid);
    save(); sub={}; render(); toast('Shop deleted');
  }, true);
}
function exportShopLedger(sid){
  const s = shopById(sid);
  download('shop-'+s.name.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'-'+today()+'.csv',
    [['Date','Description','Truck','Debit','Credit','Balance']].concat(
      shopLedgerRows(sid).map(r=>[r.date, r.label.replace(/<[^>]+>/g,''), r.truck, r.debit||'', r.credit||'', r.running])));
}

function saveSettings(){
  DB.settings = {business:val('s_business')||'Maa Vandana Logistics', owner:val('s_owner'),
    phone:val('s_phone'), gst:val('s_gst'), address:val('s_address')};
  save(); applyBrand(); toast('Details saved');
}
function applyBrand(){
  const n = DB.settings.business || 'Maa Vandana Logistics';
  document.title = n;
  $('#brandName').textContent = n;
  const parts = n.trim().split(/\s+/);
  $('.brand-badge').textContent = ((parts[0]||'M')[0] + (parts[1]||parts[0]||'V')[0]).toUpperCase();
}
function backup(){
  const blob = new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'maa-vandana-backup-'+today()+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Backup downloaded');
}
function restore(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d.trips || !d.parties) throw new Error('bad file');
      confirmAsk('Replace everything currently in the app with this backup?', ()=>{
        DB = Object.assign(JSON.parse(JSON.stringify(BLANK)), d);
        save(); applyBrand(); go('dashboard'); toast('Backup restored');
      });
    }catch(e){ toast('That file is not a Maa Vandana backup'); }
    input.value='';
  };
  r.readAsText(f);
}
function wipe(){
  confirmAsk('Delete every truck, party, trip, expense and driver record? Download a backup first if you are not sure.', ()=>{
    DB = JSON.parse(JSON.stringify(BLANK)); DB.seeded = true; save(); applyBrand(); go('dashboard'); toast('All data deleted');
  }, true);
}

function csvCell(v){ const s = String(v==null?'':v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function download(name, rows){
  const csv = rows.map(r=>r.map(csvCell).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click(); URL.revokeObjectURL(a.href);
  toast('CSV downloaded');
}

const DOC_TYPES = ['Insurance','Pollution Certificate (PUC)','Fitness Certificate','Permit',
  'National Permit','State Permit','Road Tax','Registration Certificate (RC)','Fastag KYC','Other'];
const SOON_DAYS = 30;

function upperTruck(v){ return String(v||'').toUpperCase().replace(/\s+/g,' ').trim(); }

/* Standard Indian plate laid out as UP83 AT 2470.
   Anything that does not fit the pattern is left as typed, just uppercased,
   so BH series, older plates and trailer numbers are never mangled. */
function formatPlate(v){
  const raw = String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const m = raw.match(/^([A-Z]{2})(\d{1,2})([A-Z]{0,3})(\d{1,4})$/);
  if(!m) return upperTruck(v);
  return m[1] + m[2] + (m[3] ? ' ' + m[3] : '') + ' ' + m[4];
}

function migrateTrucks(){
  let changed = false;
  DB.trucks.forEach(t=>{
    const up = formatPlate(t.number);
    if(t.number!==up){ t.number = up; changed = true; }
    if(!t.docs){
      t.docs = [];
      if(t.insurance) t.docs.push({id:uid(), header:'Insurance', expiry:t.insurance, notes:''});
      if(t.fitness)   t.docs.push({id:uid(), header:'Fitness Certificate', expiry:t.fitness, notes:''});
      changed = true;
    }
  });
  if(changed){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const t = new Date(today()+'T00:00:00').getTime();
  const e = new Date(dateStr+'T00:00:00').getTime();
  return Math.round((e-t)/86400000);
}
function docStatus(expiry){
  const d = daysUntil(expiry);
  if(d===null) return {key:'none', label:'No date', chip:'chip-grey', days:null};
  if(d < 0)   return {key:'expired', label:'Expired', chip:'chip-red', days:d};
  if(d <= SOON_DAYS) return {key:'soon', label:'Expiring soon', chip:'chip-amber', days:d};
  return {key:'active', label:'Active', chip:'chip-green', days:d};
}
function docWhen(d){
  if(d===null) return '';
  if(d < 0)  return Math.abs(d)===1 ? 'expired yesterday' : 'expired '+Math.abs(d)+' days ago';
  if(d === 0) return 'expires today';
  if(d === 1) return 'expires tomorrow';
  return 'expires in '+d+' days';
}
/* Alerts are read from the documents themselves, so a renewed date
   simply changes the alert and nothing stale can linger. */
function truckAlerts(){
  const out = [];
  DB.trucks.forEach(t=>(t.docs||[]).forEach(doc=>{
    const st = docStatus(doc.expiry);
    if(st.key==='expired' || st.key==='soon')
      out.push({truckId:t.id, truck:t.number, docId:doc.id, header:doc.header, expiry:doc.expiry, st});
  }));
  return out.sort((a,b)=>(a.st.days||0)-(b.st.days||0));
}
function alertCount(){ return truckAlerts().length; }
function urgency(st){
  if(st.key==='expired') return 'Document expired';
  if(st.days<=1)  return 'Final reminder';
  if(st.days<=7)  return 'Urgent';
  if(st.days<=15) return 'Reminder';
  return 'Expiry alert';
}

/* ============================================================
   SHOPS
   A shop's debits are read straight from the expenses marked
   "On credit", never copied. So editing, deleting, switching to
   cash or moving an expense to another shop corrects the ledger
   on its own — there is no second copy to fall out of step.
   ============================================================ */
function creditExpenses(shopId){
  return DB.expenses.filter(e=>e.mode==='Credit' && e.shopId===shopId);
}
function shopBalance(id){
  let bal = 0;
  creditExpenses(id).forEach(e=>{ bal += num(e.amount); });
  (DB.shopLedger||[]).filter(l=>l.shopId===id).forEach(l=>{
    bal += l.type==='debit' ? num(l.amount) : -num(l.amount);
  });
  return bal;
}
function allShopBalances(){
  const m = {};
  (DB.shops||[]).forEach(s=>{ m[s.id] = 0; });
  DB.expenses.forEach(e=>{ if(e.mode==='Credit' && e.shopId in m) m[e.shopId] += num(e.amount); });
  (DB.shopLedger||[]).forEach(l=>{
    if(l.shopId in m) m[l.shopId] += l.type==='debit' ? num(l.amount) : -num(l.amount);
  });
  return m;
}
function totalShopPayable(){
  return Object.values(allShopBalances()).reduce((s,b)=>s+Math.max(0,b),0);
}
function shopLedgerRows(id){
  const rows = [];
  creditExpenses(id).forEach(e=>{
    rows.push({date:e.date, label:esc(e.category)+' taken on credit',
      truck: e.truckId ? truckName(e.truckId) : 'N/A',
      ref: [e.paidTo, e.note].filter(Boolean).join(' · '),
      debit:num(e.amount), credit:0, kind:'expense', expenseId:e.id});
  });
  (DB.shopLedger||[]).filter(l=>l.shopId===id).forEach(l=>{
    rows.push({date:l.date,
      label: l.note || (l.type==='credit' ? 'Payment made to shop' : 'Charge added by shop'),
      truck: l.truckId ? truckName(l.truckId) : 'N/A',
      ref: l.mode || '',
      debit: l.type==='debit' ? num(l.amount) : 0,
      credit: l.type==='credit' ? num(l.amount) : 0,
      kind:'entry', entryId:l.id});
  });
  rows.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  let run = 0;
  rows.forEach(r=>{ run += r.debit - r.credit; r.running = run; });
  return rows;
}

/* ============================================================
   ADVANCES — cash plus fuel
   A trip's `advance` field stays the single total that the ledger,
   dues, profit and reports all read, so nothing downstream had to
   change. The parts are kept alongside it.
   ============================================================ */
function tripAdvance(t){ return num(t.advCash) + num(t.fuelAmt); }
function tripBalance(t){ return num(t.freight) - num(t.advance); }
/* No advance = pending. Some advance = part paid. Nothing left = paid. */
function tripStatus(t){
  const adv = num(t.advance), fr = num(t.freight);
  if(adv <= 0) return 'pending';
  if(adv >= fr) return 'paid';
  return 'partial';
}
function tripBalanceLabel(t){
  const b = tripBalance(t);
  if(b > 0) return '<span class="money-neg">'+money(b)+'</span>';
  if(b < 0) return '<span class="money-amber">'+money(Math.abs(b))+' over</span>';
  return '<span class="money-pos">Nil</span>';
}
function fuelNote(t){
  if(!num(t.fuelAmt)) return '';
  return num(t.fuelQty) && num(t.fuelRate)
    ? num(t.fuelQty)+' L @ ₹'+num(t.fuelRate)+'/L'
    : 'fuel advance';
}
function migrateAdvances(){
  let changed = false;
  DB.trips.forEach(t=>{
    if(t.advCash===undefined){ t.advCash = num(t.advance); changed = true; }
    if(t.fuelAmt===undefined){ t.fuelAmt = 0; changed = true; }
    const total = tripAdvance(t);
    if(num(t.advance)!==total){ t.advance = total; changed = true; }
    const st = tripStatus(t);
    if(t.status!==st){ t.status = st; changed = true; }
  });
  if(changed){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
}

/* ============================================================
   DRIVER DOCUMENTS
   Photos are shrunk before saving, because a browser only gives
   this app a few megabytes in total. They stay on this device
   (and in your own Drive if sync is on) and go nowhere else.
   ============================================================ */
const DOC_SLOTS = [
  {k:'aadhaarFront', label:'Aadhaar front'},
  {k:'aadhaarBack',  label:'Aadhaar back'},
  {k:'licenceFront', label:'Licence front'}
];
const DOC_MAX_DIM = 1400;      // long edge, keeps printed text readable
const DOC_TARGET  = 115*1024;  // aim per photo, before base64 padding
const STORE_LIMIT = 4.6*1024*1024;

let pendingDocs = {};

function docTotal(){
  let n=0;
  DB.drivers.forEach(d=>DOC_SLOTS.forEach(s=>{ if(d.docs && d.docs[s.k]) n += d.docs[s.k].length*0.75; }));
  return n;
}
function storeUsed(){ try{ return (localStorage.getItem(KEY)||'').length; }catch(e){ return 0; } }
function storePct(){ return Math.min(100, Math.round(storeUsed()/STORE_LIMIT*100)); }
function kb(n){ return Math.round(n/1024)+' KB'; }

/* Shrink on a canvas, stepping quality down until it fits */
function shrinkImage(file){
  return new Promise((resolve, reject)=>{
    if(!/^image\//.test(file.type)) return reject(new Error('That file is not a photo. Use a JPG or PNG.'));
    const fr = new FileReader();
    fr.onerror = ()=>reject(new Error('Could not read that file.'));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('That photo could not be opened.'));
      img.onload = ()=>{
        try{
          const scale = Math.min(1, DOC_MAX_DIM/Math.max(img.width, img.height));
          const cv = document.createElement('canvas');
          cv.width  = Math.round(img.width*scale);
          cv.height = Math.round(img.height*scale);
          const cx = cv.getContext('2d');
          if(!cx || !cv.toDataURL) return resolve(fr.result);   // very old browser: keep as is
          cx.fillStyle = '#fff'; cx.fillRect(0,0,cv.width,cv.height);
          cx.drawImage(img, 0, 0, cv.width, cv.height);
          let q = 0.72, out = cv.toDataURL('image/jpeg', q);
          while(out.length > DOC_TARGET*1.37 && q > 0.32){
            q -= 0.1; out = cv.toDataURL('image/jpeg', q);
          }
          resolve(out);
        }catch(e){ resolve(fr.result); }
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function pickDoc(slot, input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  const tile = document.getElementById('doc_'+slot);
  if(tile) tile.insertAdjacentHTML('beforeend','<div class="doc-busy" id="busy_'+slot+'">Shrinking photo…</div>');
  try{
    const data = await shrinkImage(file);
    const projected = storeUsed() + data.length;
    if(projected > STORE_LIMIT){
      toast('Storage is nearly full. Remove an old photo first.');
    } else {
      pendingDocs[slot] = data;
    }
  }catch(e){
    toast(e.message);
  }
  const b = document.getElementById('busy_'+slot); if(b) b.remove();
  paintDocs();
}
function removeDoc(slot){ pendingDocs[slot] = null; paintDocs(); }

function docTile(slot, label){
  const v = pendingDocs[slot];
  if(v){
    return '<div class="doc filled" id="doc_'+slot+'">'+
      '<div class="doc-label">'+esc(label)+'</div>'+
      '<img class="doc-thumb" src="'+v+'" alt="'+esc(label)+'" onclick="viewDoc(\''+slot+'\',\''+esc(label)+'\')">'+
      '<div class="doc-size">'+kb(v.length*0.75)+'</div>'+
      '<div class="doc-bar">'+
        '<button type="button" onclick="document.getElementById(\'file_'+slot+'\').click()">Replace</button>'+
        '<button type="button" class="rm" onclick="removeDoc(\''+slot+'\')">Remove</button>'+
      '</div>'+
      '<input type="file" id="file_'+slot+'" accept="image/*" style="display:none" onchange="pickDoc(\''+slot+'\',this)">'+
    '</div>';
  }
  return '<div class="doc" id="doc_'+slot+'">'+
    '<div class="doc-label">'+esc(label)+'</div>'+
    '<div class="doc-drop" onclick="document.getElementById(\'file_'+slot+'\').click()">'+
      '<div class="doc-plus">+</div><div class="doc-hint">Add photo</div></div>'+
    '<input type="file" id="file_'+slot+'" accept="image/*" style="display:none" onchange="pickDoc(\''+slot+'\',this)">'+
  '</div>';
}
function paintDocs(){
  const wrap = document.getElementById('docGrid');
  if(wrap) wrap.innerHTML = DOC_SLOTS.map(s=>docTile(s.k, s.label)).join('');
  const note = document.getElementById('docNote');
  if(note) note.textContent = docCount(pendingDocs)+' of 3 added · '+storePct()+'% of storage used';
}
function docCount(d){ return DOC_SLOTS.filter(s=>d && d[s.k]).length; }

function viewDoc(slot, label){
  const v = pendingDocs[slot] || '';
  if(!v) return;
  openModal({
    title: label || 'Document', wide:true,
    body:'<img src="'+v+'" alt="'+esc(label||'')+'" style="width:100%;border-radius:8px;display:block">'+
      '<div style="display:flex;gap:8px;margin-top:12px">'+
        '<a class="btn" href="'+v+'" download="'+esc((label||'document').replace(/\s+/g,'-').toLowerCase())+'.jpg">Download</a>'+
      '</div>'
  });
}

function allPlaces(){
  const mine = (DB.places||[]);
  const seen = new Set(PLACES.map(x=>x.toLowerCase()));
  const extra = mine.filter(x=>{
    const k=x.toLowerCase();
    if(seen.has(k)) return false;
    seen.add(k); return true;
  });
  return extra.concat(PLACES);   // your own first, then the standard list
}
function buildDocTypeList(){
  let dl = document.getElementById('docTypeList');
  if(!dl){ dl = document.createElement('datalist'); dl.id='docTypeList'; document.body.appendChild(dl); }
  const custom = [];
  DB.trucks.forEach(t=>(t.docs||[]).forEach(d=>{
    if(d.header && !DOC_TYPES.includes(d.header) && !custom.includes(d.header)) custom.push(d.header);
  }));
  dl.innerHTML = custom.concat(DOC_TYPES).map(v=>'<option value="'+esc(v)+'"></option>').join('');
}
function buildPlaceList(){
  let dl = document.getElementById('placeList');
  if(!dl){ dl = document.createElement('datalist'); dl.id='placeList'; document.body.appendChild(dl); }
  dl.innerHTML = allPlaces().map(v=>'<option value="'+esc(v)+'"></option>').join('');
}
/* Anything typed that is not on the list gets kept for next time */
function rememberPlace(v){
  v = (v||'').trim();
  if(!v) return;
  DB.places = DB.places || [];
  const k = v.toLowerCase();
  if(PLACES.some(x=>x.toLowerCase()===k)) return;
  if(DB.places.some(x=>x.toLowerCase()===k)) return;
  DB.places.push(v);
  if(DB.places.length>300) DB.places = DB.places.slice(-300);
  buildPlaceList();
}
function fPlace(id, label, v, placeholder){
  return '<div class="field"><label for="'+id+'">'+label+'</label>'+
    '<input id="'+id+'" list="placeList" autocomplete="off" value="'+esc(v||'')+'" placeholder="'+esc(placeholder)+'">'+
    '</div>';
}

/* ============================================================
   DATE RANGE — one control, used by both Insights and Reports
   ============================================================ */
const PRESETS = [
  {k:'month', label:'This month'},
  {k:'last',  label:'Last month'},
  {k:'3m',    label:'3 months'},
  {k:'6m',    label:'6 months'},
  {k:'12m',   label:'12 months'},
  {k:'fy',    label:'Financial year'},
  {k:'all',   label:'All time'}
];
function monthStart(offset){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth()-offset, 1).toISOString().slice(0,10);
}
function rangeFor(k){
  const d = new Date();
  if(k==='month') return [thisMonth()+'-01', today()];
  if(k==='last'){
    const s = monthStart(1);
    return [s, new Date(d.getFullYear(), d.getMonth(), 0).toISOString().slice(0,10)];
  }
  if(k==='3m')  return [monthStart(2), today()];
  if(k==='6m')  return [monthStart(5), today()];
  if(k==='12m') return [monthStart(11), today()];
  if(k==='fy'){
    const y = d.getMonth()>=3 ? d.getFullYear() : d.getFullYear()-1;
    return [y+'-04-01', today()];
  }
  const dates = DB.trips.map(t=>t.date).concat(DB.expenses.map(e=>e.date)).filter(Boolean).sort();
  return [dates[0] || monthStart(5), today()];
}
function setRange(k, target){
  const [f,t] = rangeFor(k);
  sub.from = f; sub.to = t; sub.preset = k;
  rerun(target);
}
function rerun(target){
  (target==='insights' ? viewInsights : viewReports)();
  animateCounts();
}
function rangeBar(target){
  return '<div class="range">'+
    '<div class="range-dates">'+
      '<label for="r_from">From</label>'+
      '<input id="r_from" type="date" value="'+esc(sub.from)+'" max="'+esc(sub.to)+'" '+
        'onchange="sub.from=this.value;sub.preset=\'\';rerun(\''+target+'\')">'+
      '<label for="r_to">To</label>'+
      '<input id="r_to" type="date" value="'+esc(sub.to)+'" min="'+esc(sub.from)+'" '+
        'onchange="sub.to=this.value;sub.preset=\'\';rerun(\''+target+'\')">'+
    '</div>'+
    '<div class="range-presets">'+PRESETS.map(pr=>
      '<button class="btn btn-sm'+(sub.preset===pr.k?' btn-primary':'')+'" '+
        'onclick="setRange(\''+pr.k+'\',\''+target+'\')">'+pr.label+'</button>').join('')+
    '</div>'+
  '</div>';
}
function defaultRange(k){
  if(!sub.from || !sub.to){ const [f,t]=rangeFor(k); sub.from=f; sub.to=t; sub.preset=k; }
}
