let allocDraft = {};

/* trips of this party that still owe something, plus any this payment
   is already spread across, so editing shows the full picture */
function allocTrips(pid, eid){
  return DB.trips.filter(t=>t.partyId===pid)
    .filter(t=>{
      const mine = eid ? (allocDraft[t.id]||0) : 0;
      return tripFreightNet(t) - tripDeducted(t) - allocatedTo(t.id, eid) > 0 || mine > 0;
    })
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
}
function allocOpen(pid, eid){
  const rows = allocTrips(pid, eid);
  if(!rows.length) return '<div class="hint">No trip of this party has anything outstanding, so this stays a general payment.</div>';
  return '<div class="alloc-list">'+rows.map(t=>{
    const owed = tripFreightNet(t) - tripDeducted(t) - allocatedTo(t.id, eid);
    return '<div class="alloc-row">'+
      '<div class="alloc-what">'+
        '<div class="t-strong">'+esc(t.from||'—')+' → '+esc(t.to||'—')+'</div>'+
        '<div class="t-sub">'+(t.lr?'LR '+esc(t.lr)+' · ':'')+fdate(t.date)+' · '+money(owed)+' outstanding</div>'+
      '</div>'+
      '<input type="number" min="0" step="1" class="alloc-amt" id="al_'+t.id+'" '+
        'data-owed="'+owed+'" value="'+(allocDraft[t.id]||'')+'" placeholder="0" oninput="recalcAlloc()">'+
      '<button type="button" class="btn btn-sm" onclick="fillAlloc(\''+t.id+'\')">Fill</button>'+
    '</div>';
  }).join('')+'</div>'+
  '<div class="alloc-foot">'+
    '<span>Left to allocate</span><span class="num" id="allocLeft">₹0</span>'+
  '</div>'+
  '<div class="gate-error" id="allocWarn" hidden style="margin-top:10px"></div>';
}
function readAlloc(){
  const out = {};
  document.querySelectorAll('.alloc-amt').forEach(el=>{
    const v = num(el.value);
    if(v > 0) out[el.id.slice(3)] = v;
  });
  return out;
}
function recalcAlloc(){
  allocDraft = readAlloc();
  const total = Object.values(allocDraft).reduce((s,v)=>s+v,0);
  const amount = num(val('l_amount'));
  const left = amount - total;
  const leftEl = document.getElementById('allocLeft');
  if(leftEl){
    leftEl.textContent = money(Math.abs(left));
    leftEl.className = 'num '+(left<0?'money-neg':left>0?'':'money-pos');
  }
  const warn = document.getElementById('allocWarn');
  if(warn){
    let msg = '';
    if(left < 0) msg = 'You have allocated '+money(total)+', which is more than the '+money(amount)+' payment.';
    document.querySelectorAll('.alloc-amt').forEach(el=>{
      const owed = num(el.dataset.owed);
      if(num(el.value) > owed) msg = 'A trip cannot take more than its outstanding '+money(owed)+'.';
    });
    warn.hidden = !msg; warn.textContent = msg;
  }
}
function fillAlloc(tripId){
  const el = document.getElementById('al_'+tripId);
  if(!el) return;
  const owed = num(el.dataset.owed);
  const amount = num(val('l_amount'));
  const others = Object.entries(readAlloc()).reduce((s,[k,v])=>k===tripId?s:s+v,0);
  el.value = Math.max(0, Math.min(owed, amount - others));
  recalcAlloc();
}
function toggleAlloc(){
  const box = document.getElementById('allocBox');
  const on = document.getElementById('l_allocate').checked;
  if(box) box.hidden = !on;
  if(!on) allocDraft = {};
  recalcAlloc();
}

function ledgerForm(pid, eid){
  const e = eid ? DB.ledger.find(x=>x.id===eid) : null;
  allocDraft = {};
  ((e && e.alloc) || []).forEach(a=>{ allocDraft[a.tripId] = num(a.amount); });
  const hasAlloc = Object.keys(allocDraft).length > 0;
  openModal({
    title: e? 'Edit ledger entry':'Add ledger entry', okText: e?'Save changes':'Save entry',
    body:'<div class="form-grid">'+
      fSeg('l_type','Entry type',[
        {v:'credit',t:'Payment / advance received'},
        {v:'debit', t:'Charge added to party'}], e?e.type:'credit')+
      fText('l_date','Date', e?e.date:today(),'date')+
      fText('l_amount','Amount (₹)', e?e.amount:'','number','min="0" step="1"')+
      fSelect('l_mode','Mode',[{v:'Cash',t:'Cash'},{v:'Bank',t:'Bank transfer'},{v:'UPI',t:'UPI'},{v:'Cheque',t:'Cheque'},{v:'Adjustment',t:'Adjustment / discount'}], e?e.mode:'Cash')+
      fText('l_ref','Reference', e?e.ref:'','text','placeholder="Cheque no., UTR, remark"')+
      fText('l_note','Description', e?e.note:'','text','placeholder="e.g. Part payment for Nov trips"')+
      '<div class="field full" id="allocField">'+
        '<label class="check-line"><input type="checkbox" id="l_allocate"'+(hasAlloc?' checked':'')+
          ' onchange="toggleAlloc()"> Allocate this payment to specific trips</label>'+
        '<span class="hint">Optional. Anything you do not allocate stays as a general payment against the party.</span>'+
        '<div id="allocBox"'+(hasAlloc?'':' hidden')+' style="margin-top:12px">'+allocOpen(pid, eid)+'</div>'+
      '</div>'+
    '</div>',
    onOk(){
      const amt = num(val('l_amount'));
      if(amt<=0){ toast('Enter an amount greater than zero'); return; }
      const type = checked('l_type')||'credit';
      const box = document.getElementById('l_allocate');
      const wants = type==='credit' && box && box.checked;
      const alloc = wants ? Object.entries(readAlloc()).map(([tripId, amount])=>({tripId, amount})) : [];
      const spread = alloc.reduce((s,a)=>s+num(a.amount),0);
      if(spread > amt){ toast('You have allocated more than the payment amount.'); return; }
      for(const a of alloc){
        const t = DB.trips.find(x=>x.id===a.tripId);
        const owed = t ? tripFreightNet(t) - tripDeducted(t) - allocatedTo(t.id, e?e.id:null) : 0;
        if(num(a.amount) > owed){ toast('A trip cannot take more than its outstanding amount.'); return; }
      }
      const rec = {id:e?e.id:uid(), partyId:pid, date:val('l_date')||today(), type:type,
        amount:amt, mode:val('l_mode'), ref:val('l_ref'), note:val('l_note'), alloc:alloc};
      if(e) DB.ledger[DB.ledger.findIndex(x=>x.id===e.id)] = rec; else DB.ledger.push(rec);
      save(); allocDraft = {}; closeModal(); renderLedger(pid); afterDirectRender();
      const paid = rec.alloc.filter(a=>{
        const t = DB.trips.find(x=>x.id===a.tripId);
        return t && tripStatus(t)==='paid';
      }).length;
      toast((e?'Entry updated':'Entry saved') + (rec.alloc.length
        ? ' · '+plural(rec.alloc.length,'trip')+' updated'+(paid? ', '+paid+' now paid':'') : ''));
    }
  });
}
function delLedger(eid){
  const e = DB.ledger.find(x=>x.id===eid); if(!e) return;
  confirmAsk('Delete this ledger entry?', ()=>{
    DB.ledger = DB.ledger.filter(x=>x.id!==eid); save(); renderLedger(e.partyId); toast('Entry deleted');

function delParty(pid){
  const mine = DB.trips.filter(t=>t.partyId===pid);
  const n = mine.length;
  const exp = mine.reduce((s,t)=>s+tripExpensesOf(t.id), 0);
  confirmAsk('Delete this party'+(n?' along with its '+n+' trip'+(n===1?'':'s'):'')+' and all ledger entries?'+

    ' This cannot be undone.', ()=>{

/* Renewing is deliberately its own screen. Editing corrects the term you
   are in; renewing starts the next one, and the two must not be reachable
   by the same button or the history quietly rewrites itself. */
function truckDocRenew(truckId, docId){
  const t = truckById(truckId);
  const doc = t && (t.docs||[]).find(x=>x.id===docId);
  if(!doc) return;
  const cur = docExpense(docId);
  const st = docStatus(doc.expiry);
  openModal({
    title:'Renew '+doc.header, okText:'Save renewal', wide:true,
    body:
    '<div class="renew-now">'+
      '<div><span>Truck</span><b class="num">'+esc(t.number)+'</b></div>'+
      '<div><span>Document</span><b>'+esc(doc.header)+'</b></div>'+
      '<div><span>Expires now</span><b>'+fdate(doc.expiry)+' <span class="chip '+st.chip+'">'+st.label+'</span></b></div>'+
      '<div><span>Cost of this term</span><b class="num">'+(num(doc.expense)?money(doc.expense):'\u2014')+'</b></div>'+
    '</div>'+
    '<div class="form-grid">'+
      fText('rn_expiry','New expiry date','','date')+
      fText('rn_cost','Renewal cost (₹)','','number','min="0" step="1" placeholder="What you paid this time"')+
      fText('rn_paid','Paid on', today(),'date')+
      fText('rn_notes','Notes', doc.notes||'','text','placeholder="Optional"')+
      '<div class="field full"><span class="hint">The '+
        (cur ? money(cur.amount)+' already booked on '+fdate(cur.date) : 'earlier cost')+
        ' stays exactly as it is. A renewal cost is written as a <b>new</b> expense under '+
        esc(doc.header)+', so both terms show up in your books. Leave the cost blank if this renewal was free.</span></div>'+
    '</div>'+
    ((doc.history||[]).length
      ? '<div class="renew-past"><div class="sec-title">Earlier terms</div>'+
        (doc.history||[]).slice().reverse().map(h=>
          '<div class="renew-past-row"><span>Expired '+fdate(h.expiry)+'</span>'+
          '<b class="num">'+(num(h.expense)?money(h.expense):'\u2014')+'</b></div>').join('')+
        '</div>' : ''),
    onOk(){
      const expiry = val('rn_expiry');
      if(!expiry){ markMissing('rn_expiry','Enter the new expiry date'); focusField('rn_expiry');
        toast('Enter the new expiry date'); return; }
      if(!sensibleDate(expiry)){ toast('Check the new expiry date — the year looks wrong.'); return; }
      if(doc.expiry && expiry <= doc.expiry){
        markMissing('rn_expiry','A renewal must run past '+fdate(doc.expiry));
        focusField('rn_expiry');
        toast('The new expiry must be later than '+fdate(doc.expiry));
        return;
      }
      renewDoc(doc, t.id, {expiry, cost:num(val('rn_cost')), paidOn:val('rn_paid')||today(), notes:val('rn_notes')});
      save(); buildDocTypeList(); buildExpCatList(); closeModal(); render();
      toast(num(val('rn_cost'))
        ? doc.header+' renewed \u2014 a new expense of '+money(val('rn_cost'))+' was added'
        : doc.header+' renewed');
    }
  });
}

function delTruck(id){
  const n = DB.trips.filter(t=>t.truckId===id).length;
  if(n){ openModal({title:'Truck is in use', body:'<p style="margin:0">This truck is linked to '+n+' trip'+(n===1?'':'s')+'. Delete or move those trips first, so your records stay correct.</p>'}); return; }
  const t = truckById(id);
  const docs = (t && t.docs) || [];
  const docCost = docs.reduce((s,d)=>s+docExpenseHistory(d.id).reduce((n2,e)=>n2+num(e.amount),0), 0);
  const booked = (DB.expenses||[]).filter(e=>e.truckId===id && !e.docId).length;
  confirmAsk('Delete this truck?'+
    (docs.length ? ' Its '+plural(docs.length,'document')+
      (docCost?' and the '+money(docCost)+' recorded on them':'')+' go too.' : '')+
    (booked ? ' '+plural(booked,'expense')+' booked to it will stay in Expenses, no longer tied to a vehicle.' : ''), ()=>{
    docs.forEach(d=>dropDocExpense(d.id));
    DB.trucks = DB.trucks.filter(x=>x.id!==id);
    /* the seats it held, and every remaining pointer at a vehicle that has gone */
    DB.assign = (DB.assign||[]).filter(a=>a.truckId!==id);
    (DB.expenses||[]).forEach(e=>{ if(e.truckId===id) e.truckId=''; });
    (DB.shopLedger||[]).forEach(l=>{ if(l.truckId===id) l.truckId=''; });
    (DB.supplierLedger||[]).forEach(l=>{ if(l.truckId===id) l.truckId=''; });
    save(); render(); toast('Truck deleted');
  }, true);
}

/* How money left your hands. One list, used by the Expenses form and by
   the expense rows on a trip, so both behave the same way. */
const EXP_MODES = [
  {v:'Cash',   t:'Cash'},
  {v:'Bank',   t:'Bank transfer'},
  {v:'UPI',    t:'UPI'},
  {v:'Card',   t:'Card'},
  {v:'Credit', t:'On credit'}
];
const BASE_CATEGORIES = ['Fuel / Diesel','Toll & Parking','Truck maintenance','Repairs','Tyres','EMI payment',
  'Insurance & permits','Office expense','Loading / unloading','Commission','Fine / challan','Miscellaneous'];

/* Built-in types plus any you have added. One list, no duplicates,
   and anything already used on an expense is kept even if it was
   added before this feature existed. */
function allCategories(){
  const seen = new Set(), out = [];
  const add = v => {
    const k = String(v||'').trim().toLowerCase();
    if(!k || seen.has(k)) return;
    seen.add(k); out.push(String(v).trim());
  };
  BASE_CATEGORIES.forEach(add);
  (DB.categories||[]).forEach(add);
  (DB.expenses||[]).forEach(e=>add(e.category));
  return out;
}

/* a datalist of every expense type, for the boxes that are typed into */
function buildExpCatList(){
  let dl = document.getElementById('expCatList');
  if(!dl){ dl = document.createElement('datalist'); dl.id = 'expCatList'; document.body.appendChild(dl); }
  dl.innerHTML = allCategories().map(c=>'<option value="'+esc(c)+'"></option>').join('');
  return dl;
}

/* ------------------------------------------------------------
   DOCUMENT EXPENSES
   A document can carry what it cost — the insurance premium, the
   permit fee. That amount is not kept apart: it is written into
   the ordinary Expenses list under the document's own name, so it
   counts once, in the P&L, against the right truck.
   ------------------------------------------------------------ */
/* which truck a document sits on, and the document itself */
function truckOfDoc(docId){
  return (DB.trucks||[]).find(t=>(t.docs||[]).some(d=>d.id===docId)) || null;
}
function docById(docId){
  const t = truckOfDoc(docId);
  return t ? (t.docs||[]).find(d=>d.id===docId) : null;
}
/* Every expense ever booked against a document, oldest first. A renewal
   adds to this list; it never rewrites what is already in it. */
function docExpenseHistory(docId){
  return docId
    ? (DB.expenses||[]).filter(e=>e.docId===docId).sort((a,b)=>(a.date||'').localeCompare(b.date||''))
    : [];
}
/* The one the document's own cost box maps to — the current term. The
   pointer is on the document, so correcting a cost edits this one and
   leaves earlier terms alone. Documents saved before renewals existed
   fall back to their newest line. */
function docExpense(docId){
  const d = docId ? docById(docId) : null;
  const list = docExpenseHistory(docId);
  if(d && d.expenseId){
    const hit = list.find(e=>e.id===d.expenseId);
    if(hit) return hit;
  }
  return list.length ? list[list.length-1] : null;
}
function docExpenseAmount(docId){ return num((docExpense(docId)||{}).amount); }
/* Keeps the current term's expense in step with the document. It only
   ever touches that one line, so editing a document corrects the term it
   belongs to instead of rewriting an earlier one. */
function syncDocExpense(doc, truckId){
  DB.expenses = DB.expenses || [];
  const cur = docExpense(doc.id);
  const amt = num(doc.expense);
  if(amt <= 0){
    if(cur){
      DB.expenses = DB.expenses.filter(e=>e.id!==cur.id);
      if(doc.expenseId === cur.id) doc.expenseId = '';
    }
    return;
  }
  const head = (doc.header || 'Document').trim();
  if(cur){
    cur.amount = amt;
    cur.category = head;
    cur.truckId = truckId || '';
    if(doc.expenseDate) cur.date = doc.expenseDate;
    doc.expenseId = cur.id;
  } else {
    const rec = {id:uid(), date: doc.expenseDate || today(), amount:amt, category:head,
      truckId: truckId||'', paidTo:'', mode:'Cash', shopId:'', docId:doc.id,
      note: head + (truckId ? ' \u2014 ' + truckName(truckId) : '')};
    DB.expenses.push(rec);
    doc.expenseId = rec.id;
  }
}

/* ------------------------------------------------------------
   RENEWING A DOCUMENT
   A renewal is a fresh transaction, not a correction: the premium
   paid last year stays on the books at what it was. So the term
   that is ending is filed into the document's history, the new
   dates and cost take its place, and a brand new expense is
   written and pointed at. Nothing already recorded is touched.
   ------------------------------------------------------------ */
function renewDoc(doc, truckId, next){
  doc.history = (doc.history||[]).concat([{
    expiry: doc.expiry, expense: num(doc.expense),
    expenseDate: doc.expenseDate || '', expenseId: doc.expenseId || '',
    renewedOn: today()
  }]);
  doc.expiry = next.expiry;
  doc.notes = next.notes;
  doc.expense = num(next.cost);
  doc.expenseDate = next.paidOn || today();
  doc.expenseId = '';                       // the old line is history now
  if(num(next.cost) > 0){
    const head = (doc.header || 'Document').trim();
    const rec = {id:uid(), date: doc.expenseDate, amount:num(next.cost), category:head,
      truckId: truckId||'', paidTo:'', mode:'Cash', shopId:'', docId:doc.id,
      note: head+' renewal to '+fdate(next.expiry)+(truckId ? ' \u2014 '+truckName(truckId) : '')};
    DB.expenses.push(rec);
    doc.expenseId = rec.id;
  }
  return doc;
}
function dropDocExpense(docId){
  DB.expenses = (DB.expenses||[]).filter(e=>e.docId!==docId);
}
/* the other direction: an amount changed in the Expenses tab goes
   back onto the document it came from, so the two never disagree */
function pushExpenseToDoc(rec){
  if(!rec.docId) return;
  (DB.trucks||[]).forEach(t=>(t.docs||[]).forEach(d=>{
    if(d.id !== rec.docId) return;
    /* only the current term follows the amount; an older renewal that is
       being corrected must not drag the document's cost back with it */
    const cur = docExpense(d.id);
    if(cur && cur.id !== rec.id) return;
    d.expense = num(rec.amount);
    d.expenseDate = rec.date;
    d.expenseId = rec.id;
  }));
}

  if(fc) list = list.filter(e=>e.category===fc);
  if(ft) list = list.filter(e=>e.truckId===ft);
  const total = list.reduce((s,e)=>s+num(e.amount),0);
  const byCat = {}; list.forEach(e=>{ byCat[e.category]=(byCat[e.category]||0)+num(e.amount); });
  const top = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const full = list.length;
  list = list.slice(0, pageLimit());

  const onCredit = list.filter(e=>(e.mode||'')==='Credit').reduce((s,e)=>s+num(e.amount),0);
  const onTruck  = new Set(list.filter(e=>e.truckId).map(e=>e.truckId)).size;

                    .map(([c,v])=>({label:c, value:v}));
  const strip = total ? summary([
      {label:'Total shown', value:total, icon:'expenses',
       note: plural(full,'entry')+(full>list.length?' \u00b7 '+list.length+' on screen':'')},
      {label:'Biggest line', value:top.length?top[0][1]:0, icon:'reports',
       note: top.length ? top[0][0]+' \u00b7 '+Math.round(top[0][1]/total*100)+'% of it' : '\u2014'},
      {label:'Taken on credit', value:onCredit, icon:'shops',
       tone: onCredit>0?'neg':'', go:"go('shops')",
       note: onCredit>0 ? 'Owed to shops' : 'Nothing on credit'},
      {label:'Trucks covered', value:onTruck, fmt:'plain', icon:'trucks',
       note: list.filter(e=>!e.truckId).length+' booked to no truck'}
    ]) : '';

  box.innerHTML =
  strip+
  /* Where the money went, as a shape rather than a column of figures —
     the whole reason this screen existed was to answer that. */
  (split.length>1 ? '<div class="card chart-card" style="margin-bottom:16px">'+
      '<h3 class="chart-title">Where it went</h3>'+
      '<div class="chart-sub">'+plural(split.length,'category')+' in this view</div>'+

function expenseForm(id, preselectShop){

      fText('e_date','Date', e?e.date:today(),'date')+
      fText('e_amount','Amount (₹)', e?e.amount:'','number','min="0" step="1"')+
      qSelect('e_cat','Category', 'category', e?e.category:'Fuel / Diesel')+
      (e && e.tripId ? '<div class="field full"><span class="hint">Booked to the trip '+
          esc(tripLabel(e.tripId))+'. Editing it here changes it there too.</span></div>' : '')+
      (e && e.docId ? '<div class="field full"><span class="hint">Recorded on the document '+
          esc(e.category)+'. The amount you set here goes back onto that document.</span></div>' : '')+
      qTruck('e_truck','Truck (optional)', e?e.truckId:'')+
      fText('e_paidTo','Paid to', e?e.paidTo:'','text','placeholder="Pump, mechanic, bank…"')+
      fSelect('e_mode','Mode', EXP_MODES, isCredit?'Credit':(e?e.mode:'Cash'), 'onchange="toggleShopField()"')+
      '<div class="field full" id="shopField"'+(isCredit?'':' hidden')+'>'+
        qSelect('e_shop','Shop *', 'shop', chosenShop)+
        '<span class="hint">Taken on credit, so this goes into the shop\u2019s ledger as money you owe'+
          '<span id="shopTruckHint"></span>.</span>'+
      '</div>'+
      fArea('e_note','Details', e?e.note:'')+
    '</div>'+
    (e ? '<div class="trip-actions"><button class="btn btn-danger" '+
      'onclick="closeModal();delExpense(\''+e.id+'\')">Delete this expense</button></div>' : ''),
    onOk(){
      const amt = num(val('e_amount'));
      if(amt<=0){ toast('Enter an amount greater than zero'); return; }
      if(!val('e_cat')){ toast('Choose a category for this expense'); return; }
      const mode = val('e_mode');
      const shopId = mode==='Credit' ? val('e_shop') : '';
      if(mode==='Credit' && (!shopId || shopId==='__new')){
        markMissing('e_shop', 'Please select a Shop for credit expenses.');
        focusField('e_shop');
        toast('Please select a Shop for credit expenses.');
        return;
      }
      const existing = e && e.id ? DB.expenses.findIndex(x=>x.id===e.id) : -1;
      const rec = {id: existing>=0 ? e.id : uid(), date:val('e_date')||today(), amount:amt, category:val('e_cat'),
        truckId:val('e_truck'), paidTo:val('e_paidTo'), mode:mode, shopId:shopId, note:val('e_note')};
      /* a linked expense stays linked, and the change travels back */
      if(e && e.tripId) rec.tripId = e.tripId;
      if(e && e.docId)  rec.docId  = e.docId;
      if(existing>=0) DB.expenses[existing] = rec; else DB.expenses.push(rec);
      pushExpenseToDoc(rec);
      if(rec.tripId && tripDraft && tripDraft.id===rec.tripId) loadTripExpenses(rec.tripId);
      save(); closeModal();
      if(route==='shops' && sub.open) renderShopLedger(sub.open); else render();
      toast(e?'Expense updated':'Expense saved');
    }
  });
  toggleShopField();
}

function toggleShopField(){
  const f = document.getElementById('shopField');
  if(!f) return;
  const credit = val('e_mode')==='Credit';
  f.hidden = !credit;
  if(!credit) clearMissing('e_shop');
  const hint = document.getElementById('shopTruckHint');
  if(hint){
    const t = val('e_truck');
    hint.textContent = t ? ', against ' + truckName(t) : ', with the truck shown as N/A';
  }
}

function delExpense(id){
  const e = DB.expenses.find(x=>x.id===id);
  const where = e && e.tripId ? ' It is booked to the trip '+tripLabel(e.tripId)+', and goes from there too.'
              : e && e.docId  ? ' It was recorded on a truck document, and the cost is cleared from it.' : '';
  confirmAsk('Delete this expense?'+where, ()=>{
    if(e && e.docId){
      (DB.trucks||[]).forEach(t=>(t.docs||[]).forEach(d=>{ if(d.id===e.docId) d.expense = 0; }));
    }
    DB.expenses = DB.expenses.filter(x=>x.id!==id);
    if(e && e.tripId && tripDraft && tripDraft.id===e.tripId) loadTripExpenses(e.tripId);
    save(); render(); toast('Expense deleted');
  }, true);
}

/* short, readable name for a trip, used wherever an expense points at one */
function tripLabel(tripId){
  const t = DB.trips.find(x=>x.id===tripId);
  if(!t) return 'a deleted trip';
  return (t.lr ? 'LR '+t.lr+' · ' : '') + (t.from||'?') + ' \u2192 ' + (t.to||'?');
}

      if(nest){ closeModal(); onSaved(rec.id); toast('Driver added'); return; }

    DB.driverTxns = DB.driverTxns.filter(x=>x.driverId!==did);
    /* their documents, wherever the originals were filed */
    Object.values((d && d.origs) || {}).forEach(dropOriginal);
    /* seats and pointers, so no wage is charged to a driver who is gone */
    DB.assign = (DB.assign||[]).filter(a=>a.driverId!==did);
    DB.trips.forEach(t=>{ if(t.driverId===did) t.driverId=''; });
    DB.trucks.forEach(t=>{ if(t.driverId===did) t.driverId=''; });
    save(); sub={}; render(); toast('Driver deleted');
  }, true);
}

function viewPod(){
  const all = DB.trips.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  /* so Previous/Next inside the trip card walks the queue you are clearing */
  tripNav = all.filter(t=>['delivered','received'].includes(tripStage(t))).map(t=>t.id);
  const by = k => all.filter(t=>tripStage(t)===k);
  const transit = by('transit'), delivered = by('delivered'), received = by('received');
  const done = by('submitted');
  const locked = lockedByPod();
  const chase = podAlerts().length;

  $('#pageActions').innerHTML = '<button class="btn" onclick="printPodList()">Print statement</button>';
  $('#pageSub').textContent = (delivered.length+received.length)+' waiting on paperwork';

  const row = (t, field, action) => {
    const since = daysSince(t.podReceivedAt || t.deliveredAt);
    const bal = tripBalance(t);
    return '<div class="pod-row">'+
      '<div class="who">'+
        '<div class="t-strong">'+esc(t.from||'—')+' → '+esc(t.to||'—')+'</div>'+
        '<div class="t-sub">'+(t.lr?'LR '+esc(t.lr)+' · ':'')+esc(partyName(t.partyId))+
          ' · '+fdate(t.date)+'</div>'+
      '</div>'+
      (since!==null? '<span class="pod-age'+(since>=POD_CHASE_DAYS?' old':'')+'">'+
        plural(since,'day')+'</span>':'')+
      '<span class="amt'+(bal>0?' money-neg':'')+'">'+(bal>0?money(bal):'settled')+'</span>'+
      (podCount(t.id)
        ? '<button class="btn btn-sm" onclick="downloadPod(\''+t.id+'\')">POD ('+podCount(t.id)+')</button>'
        : '')+
      '<button class="btn btn-sm" onclick="tripDetail(\''+t.id+'\',\'delivery\')">Open trip</button>'+
      (field? '<button class="btn btn-sm btn-primary" onclick="markStage(\''+t.id+'\',\''+field+'\')">'+
        esc(action)+'</button>':'')+
    '</div>';
  };

  const group = (title, chip, list, field, action, empty) =>
    '<div class="pod-group">'+
      '<div class="pod-group-head"><h3>'+esc(title)+'</h3>'+
        '<span class="chip '+chip+'">'+list.length+'</span></div>'+
      (list.length ? list.map(t=>row(t, field, action)).join('')
        : '<div class="hint" style="padding:4px 2px 0">'+esc(empty)+'</div>')+
    '</div>';

  $('#view').innerHTML =
  '<div class="grid g4 rise" style="margin-bottom:18px">'+
    kpi('Waiting on paperwork', delivered.length+received.length, {fmt:'plain',
      go:"route='trips';sub={stage:'podpending',adv:true};render()",
      note:'Delivered, POD not submitted'})+
    kpi('Money held up', locked, {tone:locked>0?'neg':'pos',
      note:'Cannot be chased until POD goes in'})+
    kpi('Older than '+POD_CHASE_DAYS+' days', chase, {fmt:'plain', tone:chase?'neg':'',
      note:'Worth a phone call'})+
    kpi('Still on the road', transit.length, {fmt:'plain', note:'Not marked delivered',
      go:"route='trips';sub={stage:'transit',adv:true};render()"})+
  '</div>'+

  group('Delivered — POD not received from driver', 'chip-blue', delivered,
    'podReceivedAt', 'POD received', 'Nothing waiting on a driver.')+
  group('POD received — not submitted to party', 'chip-amber', received,
    'podSubmittedAt', 'POD submitted', 'Nothing waiting to go to a party.')+
  group('Still on the road', 'chip-grey', transit,
    'deliveredAt', 'Mark delivered', 'Every trip has been marked delivered.')+

  '<div class="pod-group">'+
    '<div class="pod-group-head"><h3>Completed</h3>'+
      '<span class="chip chip-green">'+done.length+'</span></div>'+
    (done.length
      ? '<div class="hint">'+plural(done.length,'trip')+' with POD submitted. '+
        'They still appear in Trips and in your ledgers as normal.</div>'
      : '<div class="hint">No POD has been submitted yet.</div>')+
  '</div>'+

  (locked>0 ? '<div class="note" style="margin-top:6px"><b>'+money(locked)+'</b> of freight is sitting behind '+
    'paperwork. Submitting those PODs is usually the quickest way to unlock a collection.</div>' : '');
}

function delSupplierEntry(eid){
  const e = (DB.supplierLedger||[]).find(x=>x.id===eid); if(!e) return;

function delSupplier(sid){
  const n = DB.trips.filter(t=>t.supplierId===sid).length;
  if(n){
    openModal({title:'Supplier is in use', body:'<p style="margin:0">'+plural(n,'trip')+
      ' still points at this supplier. Change those trips first, so your records stay correct.</p>'});
    return;
  }
  confirmAsk('Delete this supplier and their manual ledger entries?', ()=>{
    DB.suppliers = DB.suppliers.filter(x=>x.id!==sid);
    DB.supplierLedger = (DB.supplierLedger||[]).filter(x=>x.supplierId!==sid);
    DB.trucks.forEach(t=>{ if(t.supplierId===sid) t.supplierId=''; });
    save(); sub={}; render(); toast('Supplier deleted');
  }, true);
}
function exportSupplierLedger(sid){

function delShop(sid){

/* ============================================================
   REPORTS & P&L
   ============================================================ */
/* ============================================================
   DATA CHECK
   Data health, over in Settings, asks whether anything points at
   something that no longer exists. This asks a different question:
   is what IS here complete enough for the numbers to be true?

   A trip with no expenses booked against it does not look broken. It
   looks profitable. That is the whole problem — the gaps in a freshly
   entered month all flatter you, so they have to be counted out loud
   rather than waited for. Every check below names the number it
   quietly breaks.
   ============================================================ */
const GAP_SEV = {high:'Wrong numbers', med:'Missing detail', low:'Nice to have'};

function completeness(from, to){
  const inRange = t => (t.date||'') >= from && (t.date||'') <= to;
  const trips = DB.trips.filter(inRange);
  const exps  = (DB.expenses||[]).filter(inRange);

  const expTrips = new Set();
  (DB.expenses||[]).forEach(e=>{ if(e.tripId) expTrips.add(e.tripId); });

  const docRows = [];
  DB.trucks.forEach(t=>(t.docs||[]).forEach(d=>docRows.push({truck:t, doc:d})));

  const bal = allBalances();

  const checks = [
    {k:'noExpense', sev:'high', kind:'trip',
     label:'Trips with nothing spent recorded',
     why:'Profit for the truck and for the route counts only what you booked, so a trip with no diesel, no toll and no labour on it reads as pure profit.',
     items: trips.filter(t=>!expTrips.has(t.id))},

    {k:'noFreight', sev:'high', kind:'trip',
     label:'Trips with no freight amount',
     why:'Earnings are understated and the party is never billed for the load.',
     items: trips.filter(t=>!num(t.freight))},

    {k:'podPending', sev:'high', kind:'trip',
     label:'Delivered, paperwork not submitted',
     why:'Payment usually waits on the POD, so this is money sitting still for a reason you control.',
     items: trips.filter(t=>t.deliveredAt && !t.podSubmittedAt)},

    {k:'expNoTruck', sev:'high', kind:'expense',
     label:'Expenses not attached to a truck',
     why:'They never appear in that truck\u2019s profit, so the fleet looks cheaper to run than it is.',
     items: exps.filter(e=>!e.truckId)},

    {k:'noDriver', sev:'med', kind:'trip',
     label:'Trips with no driver',
     why:'Wages cannot be traced to the loads they were earned on.',
     items: trips.filter(t=>!t.driverId)},

    {k:'expNoTrip', sev:'med', kind:'expense',
     label:'Expenses on a truck but not on a trip',
     why:'They cannot be traced to a route, so Best routes reads better than the truth. Some of these are genuinely fleet costs \u2014 insurance, a service \u2014 and belong here.',
     items: exps.filter(e=>e.truckId && !e.tripId)},

    {k:'driverNoSalary', sev:'med', kind:'driver',
     label:'Drivers with no monthly salary set',
     why:'Salary due cannot be worked out, so their balance and the truck\u2019s wage share are both blank.',
     items: DB.drivers.filter(d=>!num(d.salary))},

    {k:'truckNoDocs', sev:'med', kind:'truck',
     label:'Trucks with no papers on record',
     why:'No expiry warning will ever fire for these vehicles.',
     items: DB.trucks.filter(t=>!(t.docs||[]).length)},

    {k:'docNoExpiry', sev:'med', kind:'doc',
     label:'Papers with no expiry date',
     why:'They sit in the list but can never warn you.',
     items: docRows.filter(r=>!r.doc.expiry)},

    {k:'noLr', sev:'low', kind:'trip',
     label:'Trips with no LR number',
     why:'Nothing to quote back when a party queries the bill.',
     items: trips.filter(t=>!String(t.lr||'').trim())},

    {k:'partyNoPhone', sev:'low', kind:'party',
     label:'Parties who owe money with no phone number',
     why:'No number to call when you are chasing it.',
     items: DB.parties.filter(p=>num(bal[p.id]) > 0 && !String(p.phone||'').trim())}
  ];

  /* A trip counts as fully recorded when nothing in the first tier is
     wrong with it — the tier that changes the money. */
  const bad = new Set();
  checks.filter(c=>c.sev==='high' && c.kind==='trip')
        .forEach(c=>c.items.forEach(t=>bad.add(t.id)));
  return {trips: trips.length, clean: trips.filter(t=>!bad.has(t.id)).length, checks};
}

/* one place that knows how to name and how to open each kind of record */
function gapRow(kind, x){
  if(kind==='trip')    return {text: fdate(x.date)+' \u00b7 '+esc(x.from||'?')+' \u2192 '+esc(x.to||'?')+
                                     ' \u00b7 '+esc(truckName(x.truckId)),
                               note: money(x.freight), go:'tripDetail(\''+x.id+'\')'};
  if(kind==='expense') return {text: fdate(x.date)+' \u00b7 '+esc(x.category||'Expense')+
                                     (x.note?' \u00b7 '+esc(x.note):''),
                               note: money(x.amount), go:'expenseForm(\''+x.id+'\')'};
  if(kind==='driver')  return {text: esc(x.name), note:'', go:'driverForm(\''+x.id+'\')'};
  if(kind==='truck')   return {text: esc(x.number), note: esc(x.model||''), go:'truckForm(\''+x.id+'\')'};
  if(kind==='doc')     return {text: esc(x.truck.number)+' \u00b7 '+esc(x.doc.header||'Paper'),
                               note:'', go:'truckForm(\''+x.truck.id+'\')'};
  if(kind==='party')   return {text: esc(x.name), note: money(partyBalance(x.id)),
                               go:'partyLedger(\''+x.id+'\')'};
  return {text:'\u2014', note:'', go:''};
}

function showGap(key){
  const c = completeness(sub.from, sub.to).checks.find(x=>x.k===key);
  if(!c || !c.items.length) return;
  openModal({
    title: c.label,
    wide: true,
    body: '<p class="hint" style="margin:0 0 12px;max-width:640px">'+c.why+'</p>'+
      '<div class="tbl-wrap"><table><tbody>'+
      c.items.slice(0,200).map(x=>{
        const r = gapRow(c.kind, x);
        return '<tr onclick="closeModal();'+r.go+'" style="cursor:pointer">'+
          '<td>'+r.text+'</td><td class="t-r num">'+r.note+'</td></tr>';
      }).join('')+
      '</tbody></table></div>'+
      (c.items.length > 200
        ? '<div class="hint" style="margin-top:10px">Showing the first 200 of '+c.items.length+'.</div>'
        : '')
  });
}

function checkPanel(){
  const c = completeness(sub.from, sub.to);
  const open = c.checks.filter(x=>x.items.length);
  const done = c.checks.filter(x=>!x.items.length);
  const pct  = c.trips ? Math.round(c.clean / c.trips * 100) : 100;
  const tone = !c.trips ? '' : pct >= 95 ? 'pos' : pct >= 75 ? '' : 'neg';

  return '<div class="grid g3 rise" style="margin-bottom:16px">'+
      kpi('Trips fully recorded', c.clean, {fmt:'plain', tone:tone,
        note: c.trips ? 'of '+plural(c.trips,'trip')+' in this range \u00b7 '+pct+'%'
                      : 'No trips in this range'})+
      kpi('Gaps that change the money', open.filter(x=>x.sev==='high')
            .reduce((s,x)=>s+x.items.length,0), {fmt:'plain', tone:'neg',
        note:'Freight, spending and paperwork'})+
      kpi('Everything else', open.filter(x=>x.sev!=='high')
            .reduce((s,x)=>s+x.items.length,0), {fmt:'plain',
        note:'Detail worth filling in when you can'})+
    '</div>'+

    '<div class="card card-pad">'+
      '<h3 class="card-title" style="margin-bottom:6px">What is missing</h3>'+
      '<p class="hint" style="margin:0 0 14px;max-width:660px">A trip with no expenses booked against it does not look '+
        'broken \u2014 it looks profitable. Gaps in a freshly entered month nearly all flatter you, so each one below '+
        'names the number it quietly breaks. Click a row to see the records and fix them.</p>'+
      (open.length
        ? '<div class="tbl-wrap"><table><tbody>'+open.map(x=>
            '<tr onclick="showGap(\''+x.k+'\')" style="cursor:pointer">'+
              '<td style="width:1px"><span class="gap-dot gap-'+x.sev+'" title="'+GAP_SEV[x.sev]+'"></span></td>'+
              '<td><div class="t-strong">'+esc(x.label)+'</div>'+
                '<div class="t-sub" style="max-width:620px">'+x.why+'</div></td>'+
              '<td class="t-r num t-strong" style="width:70px">'+x.items.length+'</td>'+
            '</tr>').join('')+'</tbody></table></div>'
        : '<div class="hint" style="color:var(--green);font-weight:600">\u2713 Nothing missing in this range. '+
          'Every number on the other tabs is standing on complete data.</div>')+
      (done.length
        ? '<div class="check-done">'+done.map(x=>
            '<div>\u2713 '+esc(x.label.charAt(0).toLowerCase()+x.label.slice(1))+' \u2014 none</div>').join('')+'</div>'
        : '')+
    '</div>';
}

      const trips = DB.trips.filter(x=>x.truckId===t.id && inR(x.date));

      const hire = trips.reduce((s,x)=>s+num(x.hire),0);
      const exp = DB.expenses.filter(e=>e.truckId===t.id && inR(e.date)).reduce((s,e)=>s+num(e.amount),0);
      const sal = truckDriverPay(t.id, sub.from, sub.to);
      return {t, n:trips.length, freight, hire, exp, sal, net:freight-hire-exp-sal};
    }).filter(r=>r.n||r.exp||r.sal).sort((a,b)=>b.net-a.net);
    body = rows.length? '<div class="card chart-card" style="margin-bottom:16px">'+
      '<h3 class="chart-title">Net earnings by truck</h3>'+
      '<div class="chart-sub">After hire, expenses and driver wages. Open one to see every line behind it.</div>'+
      barList(rows.map(r=>({label:r.t.number, value:r.net, color:r.net>=0?'var(--c1)':'var(--red)',
        note:plural(r.n,'trip')+' · '+money(r.freight)+' freight'+(r.sal?' · '+money(r.sal)+' wages':''),
        go:"truckReport('"+r.t.id+"')"})))+
      '</div>'+
      '<div class="card"><div class="tbl-wrap"><table>'+
      '<thead><tr><th>Truck</th><th class="t-r">Trips</th><th class="t-r">Freight</th><th class="t-r">Hire</th>'+
      '<th class="t-r">Expenses</th><th class="t-r">Driver salary</th><th class="t-r">Net</th></tr></thead><tbody>'+
      rows.map(r=>'<tr class="row-link" onclick="truckReport(\''+r.t.id+'\')">'+
        '<td><span class="t-strong num">'+esc(r.t.number)+'</span> '+
        (r.t.type==='market'?'<span class="chip chip-grey">Market</span>':'')+'</td>'+
        '<td class="t-r num">'+r.n+'</td><td class="t-r num">'+money(r.freight)+'</td>'+
        '<td class="t-r num">'+(r.hire?money(r.hire):'—')+'</td><td class="t-r num">'+money(r.exp)+'</td>'+
        '<td class="t-r num">'+(r.sal?money(r.sal):'—')+'</td>'+
        '<td class="t-r num '+(r.net>=0?'money-pos':'money-neg')+'">'+money(r.net)+'</td></tr>').join('')+
      '</tbody></table></div></div>'
      : empty('No truck activity','No trips or expenses recorded for your trucks in this period.','');
  }
  if(sub.tab==='expense'){
    const entries = Object.entries(p.byCat).sort((a,b)=>b[1]-a[1]);
    const tot = p.expense;
    body = entries.length? '<div class="g-wide">'+
      '<div class="card chart-card">'+
        '<h3 class="chart-title">Expense split</h3>'+
        '<div class="chart-sub">'+fdate(sub.from)+' to '+fdate(sub.to)+'</div>'+
        donutChart(entries.map(([c,v])=>({label:c, value:v})),'spent')+
      '</div>'+
      '<div class="card chart-card">'+
        '<h3 class="chart-title">Biggest costs first</h3>'+
        '<div class="chart-sub">Each category against your largest</div>'+
        barList(entries.map(([c,v],i)=>({label:c, value:v, color:SERIES[i%SERIES.length],
          display:money(v)+' · '+Math.round(v/tot*100)+'%'})))+
        '<div class="divide"></div><div class="pl-line pl-total"><span>Total expenses</span>'+
        '<span class="num">'+money(tot)+'</span></div>'+
      '</div>'+
    '</div>'
      : empty('No expenses in this period','Change the date range, or record expenses to see the split.','');
  }
  $('#view').innerHTML = filters + tabs + body;
}
/* ------------------------------------------------------------
   ONE TRUCK, IN FULL
   The truck-wise report gives a net figure per vehicle. Opening
   one shows every line that figure was built from — the trips
   that earned it, the expenses booked to it, and the driver
   wages it carries — all read from the same data the summary
   used, over the same date range, so the parts always add up to
   the total on the report behind it.
   ------------------------------------------------------------ */
function truckBreakdown(truckId, from, to){
  const inR = d => (!from || d>=from) && (!to || d<=to);
  const trips = DB.trips.filter(x=>x.truckId===truckId && inR(x.date))
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const spends = (DB.expenses||[]).filter(e=>e.truckId===truckId && inR(e.date))
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const wages = truckPaySlices(truckId, from, to);
  const freight = trips.reduce((n,t)=>n+num(t.freight),0);
  const hire    = trips.reduce((n,t)=>n+num(t.hire),0);
  const spend   = spends.reduce((n,e)=>n+num(e.amount),0);
  const wage    = wages.reduce((n,w)=>n+w.shown,0);
  return {trips, spends, wages, freight, hire, spend, wage, net: freight-hire-spend-wage};
}

  const t = truckById(truckId); if(!t) return;

  printDoc(
    printHead('Truck statement', t.number, [

      ['Total','','', money(b.spend)])+
    '<h2 class="pr-h2">Driver wages carried</h2>'+
    printTable([{label:'Driver', w:'26%'},{label:'Period on this truck'},{label:'Days', right:true, w:'12%'},
      {label:'Share', right:true, w:'20%'}],
      b.wages.map(w=>[esc(driverName(w.driverId)), fdate(w.cFrom)+' to '+fdate(w.cTo),
        String(w.days), money(w.shown)]),
      ['Total','','', money(b.wage)])+
    printSummary([
      ['Freight earned', money(b.freight)],
      ['Hire paid', money(b.hire)],
      ['Expenses booked', money(b.spend)],
      ['Driver wages', money(b.wage)],
      [(b.net>=0?'Net earned':'Net loss'), money(Math.abs(b.net)), true]
    ])+
    printSign('Driver wages are the share of each payment that falls on the days this driver was assigned to this truck.'),
    fileStem('truck', t.number)
  );
}

/* ============================================================
   DATA HEALTH
   Deleting used to leave tails behind — a party took its trips
   but not their expenses, a truck took its papers but not what
   they cost. Those paths are fixed, but records already broken
   stay broken, and a row pointing at something that no longer
   exists is invisible in the screen that would normally show it.
   This finds them and puts them right.
   ============================================================ */
function dataIssues(){
  const has = (list, id) => !id || (list||[]).some(x=>x.id===id);
  const docIds = new Set();
  DB.trucks.forEach(t=>(t.docs||[]).forEach(d=>docIds.add(d.id)));
  const tripIds = new Set(DB.trips.map(t=>t.id));
  const out = [];
  const add = (key, label, items, fix) => { if(items.length) out.push({key, label, items, fix}); };

  add('expTrip', 'expenses booked to a trip that has been deleted',
    (DB.expenses||[]).filter(e=>e.tripId && !tripIds.has(e.tripId)),
    items=>items.forEach(e=>{ e.tripId=''; }));
  add('expTruck', 'expenses pointing at a vehicle that has been deleted',
    (DB.expenses||[]).filter(e=>e.truckId && !has(DB.trucks, e.truckId)),
    items=>items.forEach(e=>{ e.truckId=''; }));
  add('expShop', 'credit expenses whose shop has been deleted',
    (DB.expenses||[]).filter(e=>e.mode==='Credit' && e.shopId && !has(DB.shops, e.shopId)),
    items=>items.forEach(e=>{ e.shopId=''; e.mode='Cash'; }));
  add('expDoc', 'document costs whose document has been deleted',
    (DB.expenses||[]).filter(e=>e.docId && !docIds.has(e.docId)),
    items=>items.forEach(e=>{ e.docId=''; }));
  add('tripParty', 'trips whose party has been deleted',
    DB.trips.filter(t=>t.partyId && !has(DB.parties, t.partyId)),
    items=>items.forEach(t=>{ t.partyId=''; }));
  add('tripTruck', 'trips whose truck has been deleted',
    DB.trips.filter(t=>t.truckId && !has(DB.trucks, t.truckId)),
    items=>items.forEach(t=>{ t.truckId=''; }));
  add('tripDriver', 'trips whose driver has been deleted',
    DB.trips.filter(t=>t.driverId && !has(DB.drivers, t.driverId)),
    items=>items.forEach(t=>{ t.driverId=''; }));
  add('tripSupplier', 'trips whose supplier has been deleted',
    DB.trips.filter(t=>t.supplierId && !has(DB.suppliers, t.supplierId)),
    items=>items.forEach(t=>{ t.supplierId=''; }));
  add('truckDriver', 'trucks naming a driver who has been deleted',
    DB.trucks.filter(t=>t.driverId && !has(DB.drivers, t.driverId)),
    items=>items.forEach(t=>{ t.driverId=''; }));
  add('ledgerParty', 'ledger entries whose party has been deleted',
    (DB.ledger||[]).filter(l=>l.partyId && !has(DB.parties, l.partyId)),
    items=>{ const ids=new Set(items.map(x=>x.id)); DB.ledger = DB.ledger.filter(l=>!ids.has(l.id)); });
  add('alloc', 'payments allocated to a trip that has been deleted',
    (DB.ledger||[]).filter(l=>(l.alloc||[]).some(a=>!tripIds.has(a.tripId))),
    items=>items.forEach(l=>{ l.alloc = (l.alloc||[]).filter(a=>tripIds.has(a.tripId)); }));
  add('txnDriver', 'driver account entries whose driver has been deleted',
    (DB.driverTxns||[]).filter(t=>!has(DB.drivers, t.driverId)),
    items=>{ const ids=new Set(items.map(x=>x.id)); DB.driverTxns = DB.driverTxns.filter(t=>!ids.has(t.id)); });
  add('assign', 'driver seats on a truck or driver that has been deleted',
    (DB.assign||[]).filter(a=>!has(DB.trucks, a.truckId) || !has(DB.drivers, a.driverId)),
    items=>{ const ids=new Set(items.map(x=>x.id)); DB.assign = DB.assign.filter(a=>!ids.has(a.id)); });
  add('shopLedger', 'shop ledger entries whose shop has been deleted',
    (DB.shopLedger||[]).filter(l=>!has(DB.shops, l.shopId)),
    items=>{ const ids=new Set(items.map(x=>x.id)); DB.shopLedger = DB.shopLedger.filter(l=>!ids.has(l.id)); });
  add('supLedger', 'supplier ledger entries whose supplier has been deleted',
    (DB.supplierLedger||[]).filter(l=>!has(DB.suppliers, l.supplierId)),
    items=>{ const ids=new Set(items.map(x=>x.id)); DB.supplierLedger = DB.supplierLedger.filter(l=>!ids.has(l.id)); });
  add('pods', 'POD photos held for a trip that has been deleted',
    Object.keys(DB.pods||{}).filter(k=>!tripIds.has(k)).map(k=>({id:k})),
    items=>items.forEach(x=>{ podImages(x.id).forEach(p=>dropOriginal(p.origKey)); delete DB.pods[x.id]; }));
  return out;
}

/* ============================================================
   PRINTED DOCUMENTS
   A print is a document, not a screenshot. Everything on screen is
   hidden and a clean statement is built instead: letterhead, title,
   the figures, totals, and a place to sign. Nothing on it is a
   button, a filter or a chip.
   ============================================================ */
function printMeta(){
  const s = DB.settings || {};
  return {
    business: s.business || 'Maa Vandana Logistics',
    lines: [s.address, [s.phone, s.gst && 'GST '+s.gst].filter(Boolean).join('  ·  ')]
             .filter(x=>x && String(x).trim())
  };
}
function printHead(title, subtitle, facts){
  const m = printMeta();
  return '<header class="pr-head">'+
      '<div class="pr-brand">'+
        '<div class="pr-biz">'+esc(m.business)+'</div>'+
        (m.lines.length? '<div class="pr-biz-sub">'+m.lines.map(esc).join('<br>')+'</div>':'')+
      '</div>'+
      '<div class="pr-doc">'+
        '<div class="pr-title">'+esc(title)+'</div>'+
        (subtitle? '<div class="pr-sub">'+esc(subtitle)+'</div>':'')+
        '<div class="pr-issued">Issued '+fdate(today())+'</div>'+
      '</div>'+
    '</header>'+
    (facts && facts.length
      ? '<section class="pr-facts">'+facts.filter(Boolean).map(f=>
          '<div><span>'+esc(f[0])+'</span><b>'+f[1]+'</b></div>').join('')+'</section>'
      : '');
}
function printTable(cols, rows, foot){
  return '<table class="pr-table"><thead><tr>'+
    cols.map(c=>'<th'+(c.right?' class="r"':'')+(c.w?' style="width:'+c.w+'"':'')+'>'+esc(c.label)+'</th>').join('')+
    '</tr></thead><tbody>'+
    (rows.length ? rows.map(r=>'<tr>'+r.map((cell,i)=>
        '<td'+(cols[i]&&cols[i].right?' class="r"':'')+(cols[i]&&cols[i].num?' class="n"':'')+'>'+
        (cell===''||cell==null?'—':cell)+'</td>').join('')+'</tr>').join('')
      : '<tr><td colspan="'+cols.length+'" class="pr-none">Nothing to show for this period.</td></tr>')+
    '</tbody>'+
    (foot? '<tfoot><tr>'+foot.map((cell,i)=>
      '<th'+(cols[i]&&cols[i].right?' class="r"':'')+'>'+(cell||'')+'</th>').join('')+'</tr></tfoot>':'')+
  '</table>';
}
function printSummary(items){
  return '<section class="pr-summary">'+items.filter(Boolean).map(i=>
    '<div'+(i[2]?' class="strong"':'')+'><span>'+esc(i[0])+'</span><b>'+i[1]+'</b></div>').join('')+'</section>';
}
function printSign(note){
  return (note? '<p class="pr-note">'+esc(note)+'</p>' : '')+
    '<section class="pr-sign">'+
      '<div><div class="pr-line"></div><span>Receiver\'s signature</span></div>'+
      '<div class="r"><div class="pr-line"></div><span>For '+esc(printMeta().business)+'</span></div>'+
    '</section>'+
    '<footer class="pr-foot">'+esc(printMeta().business)+' · generated '+fdate(today())+
      ' · this is a computer generated statement</footer>';
}
/* build the document, print it, then put the screen back */
function printDoc(html, name){
  let root = document.getElementById('printRoot');
  if(!root){ root = document.createElement('div'); root.id='printRoot'; document.body.appendChild(root); }
  root.innerHTML = '<article class="pr-page">'+html+'</article>';
  document.body.classList.add('printing');
  /* Save as PDF takes its filename from the document title */
  const wasTitle = document.title;
  if(name) document.title = name;
  const done = ()=>{
    document.body.classList.remove('printing'); root.innerHTML='';
    document.title = wasTitle;
  };
  window.addEventListener('afterprint', done, {once:true});
  setTimeout(()=>{ window.print(); setTimeout(done, 800); }, 60);
}

/* ---------- party statement ---------- */
function printPartyStatement(pid){

  const all = ledgerRows(pid);
  const rows = ledgerFilter(all);
  const view = ledgerViewInfo();
  const bal = partyBalance(pid);
  const billed = all.reduce((s,r)=>s+r.debit,0);
  const paid   = all.reduce((s,r)=>s+r.credit,0);

  const shownC = rows.reduce((s,r)=>s+r.credit,0);
  printDoc(
    printHead('Statement of account', p.name, [
      ['Party', esc(p.name)],
      p.city ? ['City', esc(p.city)] : null,
      p.phone ? ['Phone', esc(p.phone)] : null,
      ['Entries', view.k ? rows.length+' of '+all.length : String(all.length)],
      view.k ? ['Showing', esc(view.label)] : null
    ])+
    printTable(
      [{label:'Date', w:'15%'},{label:'Particulars'},{label:'Debit', right:true, w:'15%'},
       {label:'Credit', right:true, w:'15%'},{label:'Balance', right:true, w:'16%'}],
      rows.map(r=>[ r.date?fdate(r.date):'—',
        esc(r.label)+(r.ref?'<span class="pr-ref">'+esc(r.ref)+'</span>':''),
        r.debit?money(r.debit):'', r.credit?money(r.credit):'', money(r.running) ]),
      [view.k?'Totals shown':'Totals','', money(shownD), money(shownC), money(bal)]
    )+
    printSummary([
      ['Total billed', money(billed)],
      ['Total received', money(paid)],
      [bal>=0?'Balance receivable':'Advance held', money(Math.abs(bal)), true]
    ])+
    printSign('Debit increases what is owed. Credit reduces it. Please confirm the closing balance.'+
      (view.k ? ' This statement lists '+view.short+'; the summary and the closing balance are for the whole account.' : '')),
    fileStem('ledger', p.name)
  );
}

/* ---------- driver account ---------- */
function printDriverStatement(did){
  const d = driverById(did); if(!d) return;
  const view = ledgerViewInfo(null, DRIVER_VIEWS);
  const brk = driverPayBreak(did);
  const txns = DB.driverTxns.filter(t=>t.driverId===did).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  let run = 0;
  const lines = txns.map(t=>{
    run += t.type==='due' ? num(t.amount) : -num(t.amount);
    return {t, running:run, debit: t.type==='due'?num(t.amount):0, credit: t.type!=='due'?num(t.amount):0};
  });
  const shown = ledgerFilter(lines);
  const rows = shown.map(x=>[ fdate(x.t.date),
      ({due:'Salary due', salary:'Salary paid', advance:'Advance paid'})[x.t.type] || 'Payment',
      esc(x.t.note||''), x.debit?money(x.debit):'',
      x.t.type==='salary'?money(x.t.amount):'',
      (x.t.type!=='due' && x.t.type!=='salary')?money(x.t.amount):'',
      money(x.running) ]);
  const due = txns.filter(t=>t.type==='due').reduce((s,t)=>s+num(t.amount),0);
  const out = txns.filter(t=>t.type!=='due').reduce((s,t)=>s+num(t.amount),0);
  const shownD = shown.reduce((a,x)=>a+x.debit,0);
  const shownC = shown.reduce((a,x)=>a+x.credit,0);
  printDoc(
    printHead('Driver account', d.name, [
      ['Driver', esc(d.name)],
      d.licence ? ['Licence', esc(d.licence)] : null,
      d.phone ? ['Phone', esc(d.phone)] : null,
      d.salary ? ['Monthly salary', money(d.salary)] : null,
      view.k ? ['Showing', esc(view.label)] : null,
      view.k ? ['Entries', shown.length+' of '+lines.length] : null
    ])+
    printTable([{label:'Date', w:'13%'},{label:'Entry', w:'16%'},{label:'Note'},
      {label:'Salary due', right:true, w:'13%'},{label:'Salary paid', right:true, w:'13%'},
      {label:'Advance paid', right:true, w:'13%'},{label:'Balance', right:true, w:'13%'}],
      rows, [view.k?'Totals shown':'Totals','','', money(shownD),
        money(shown.filter(x=>x.t.type==='salary').reduce((n,x)=>n+num(x.t.amount),0)),
        money(shown.filter(x=>x.t.type!=='due'&&x.t.type!=='salary').reduce((n,x)=>n+num(x.t.amount),0)),
        money(due-out)])+
    printSummary([
      ['Salary due to date', money(due)],
      ['Total salary paid', money(brk.salary)],
      ['Total advance paid', money(brk.advance)],
      brk.other ? ['Other payments', money(brk.other)] : null,
      ['Total paid', money(brk.paid)],
      [(due-out)>=0?'Balance payable':'Advance recoverable', money(Math.abs(due-out)), true]
    ])+
    printSign('Salary and advance are counted separately and only added together to state the total paid. '+
      'Only money actually paid is counted as an expense in the accounts.'+
      (view.k ? ' This account lists '+view.short+'; the summary and the closing balance cover everything.' : '')),
    fileStem('driver', d.name)
  );
}

  const win = pnl(sub.from, sub.to);
  const series = seriesForRange(sub.from, sub.to);
  const inR = d => (!sub.from || d>=sub.from) && (!sub.to || d<=sub.to);
  const trips = DB.trips.filter(t=>inR(t.date));

  const routes = {};
  trips.forEach(t=>{
    const k = (t.from||'?')+' to '+(t.to||'?');
    routes[k] = routes[k] || {n:0, freight:0, margin:0};
    routes[k].n++; routes[k].freight += tripFreightNet(t); routes[k].margin += tripFreightNet(t)-num(t.hire);
  });
  const routeRows = Object.entries(routes).sort((a,b)=>b[1].margin-a[1].margin).slice(0,8)
    .map(([k,v])=>[esc(k), String(v.n), money(v.freight), money(v.margin), money(v.margin/v.n)]);

  const truckRows = DB.trucks.map(tr=>{
    const ts = trips.filter(t=>t.truckId===tr.id);
    const freight = ts.reduce((s,t)=>s+tripFreightNet(t),0);
    const hire = ts.reduce((s,t)=>s+num(t.hire),0);
    const exp = DB.expenses.filter(e=>e.truckId===tr.id && inR(e.date)).reduce((s,e)=>s+num(e.amount),0);
    return {tr, n:ts.length, freight, net:freight-hire-exp};
  }).filter(r=>r.n||r.net).sort((a,b)=>b.net-a.net)
    .map(r=>[esc(r.tr.number), String(r.n), money(r.freight), money(r.net)]);

  printDoc(
    printHead('Business summary', period, [
      ['Period', period],
      ['Trips', String(win.tripCount)],
      ['Margin', (win.freight? Math.round(win.profit/win.freight*100):0)+'%']
    ])+
    printSummary([
      ['Billed to parties', money(win.freight)],
      ['Total costs', money(win.costs)],
      ['Freight per trip', money(win.tripCount? win.freight/win.tripCount : 0)],
      ['Cost per trip', money(win.tripCount? win.costs/win.tripCount : 0)],
      [(win.profit>=0?'Net profit':'Net loss'), money(Math.abs(win.profit)), true]
    ])+
    '<h2 class="pr-h2">Month by month</h2>'+
    printTable([{label:'Month'},{label:'Trips', right:true, w:'12%'},{label:'Billed', right:true, w:'20%'},
      {label:'Costs', right:true, w:'20%'},{label:'Profit', right:true, w:'20%'}],
      series.map(s=>[esc(s.label), String(s.trips), money(s.freight), money(s.cost), money(s.profit)]),
      ['Total', String(win.tripCount), money(win.freight), money(win.costs), money(win.profit)])+
    '<h2 class="pr-h2">Strongest routes</h2>'+
    printTable([{label:'Route'},{label:'Trips', right:true, w:'11%'},{label:'Billed', right:true, w:'19%'},
      {label:'After hire', right:true, w:'19%'},{label:'Per trip', right:true, w:'17%'}], routeRows)+
    '<h2 class="pr-h2">Earnings by truck</h2>'+
    printTable([{label:'Truck'},{label:'Trips', right:true, w:'14%'},{label:'Billed', right:true, w:'22%'},
      {label:'Net after costs', right:true, w:'24%'}], truckRows)+
    printSign('Net profit is based on the full amount billed, whether or not it has been collected.'),
    fileStem('insights')
  );
}

/* ---------- paperwork outstanding (Deliveries) ---------- */
function printPodList(){
  const rows = DB.trips.filter(t=>['delivered','received'].includes(tripStage(t)))
    .sort((a,b)=>(a.deliveredAt||a.date||'').localeCompare(b.deliveredAt||b.date||''));
  const held = rows.reduce((s,t)=>s+Math.max(0,tripBalance(t)),0);
  printDoc(
    printHead('Paperwork outstanding', 'Delivered trips awaiting POD', [
      ['Trips waiting', String(rows.length)],
      ['Money held up', money(held)]
    ])+
    printTable([{label:'Delivered', w:'13%'},{label:'LR', w:'12%'},{label:'Route'},{label:'Party', w:'20%'},
      {label:'Stage', w:'14%'},{label:'Days', right:true, w:'8%'},{label:'To collect', right:true, w:'15%'}],
      rows.map(t=>{
        const since = daysSince(t.podReceivedAt || t.deliveredAt);
        return [ t.deliveredAt?fdate(t.deliveredAt):'—', esc(t.lr||'—'),
          esc((t.from||'?')+' to '+(t.to||'?')), esc(partyName(t.partyId)),
          stageInfo(tripStage(t)).label, since===null?'—':String(since),
          tripBalance(t)>0?money(tripBalance(t)):'—' ];
      }),
      ['Totals','','','','','', money(held)])+
    printSign('POD not yet submitted to the party. Clearing these is usually the quickest way to unlock a collection.'),
    fileStem('deliveries')
  );
}

/* ---------- profit and loss ---------- */
function printReport(){
  const p = pnl(sub.from, sub.to);
  const period = rangeCaption();
  const costRows = Object.entries(p.byCat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>[esc(c), money(v)]);
  if(p.hire) costRows.unshift(['Hire paid to market trucks', money(p.hire)]);
  if(p.driverSalary)  costRows.push(['Driver salary paid', money(p.driverSalary)]);
  if(p.driverAdvance) costRows.push(['Driver advances paid', money(p.driverAdvance)]);
  if(p.driverOther)   costRows.push(['Other driver payments', money(p.driverOther)]);
  printDoc(
    printHead('Profit and loss statement', period, [
      ['Period', period], ['Trips', String(p.tripCount)]
    ])+
    '<h2 class="pr-h2">Income</h2>'+
    printTable([{label:'Particulars'},{label:'Amount', right:true, w:'24%'}],
      [['Freight on trips', money(p.freightBase)]]
        .concat(p.charges ? [['Charges added to parties', money(p.charges)]] : [])
        .concat(p.deductions ? [['Deductions given to parties', '− '+money(p.deductions)]] : []),
      ['Billed to parties', money(p.freight)])+
    '<h2 class="pr-h2">Costs</h2>'+
    printTable([{label:'Particulars'},{label:'Amount', right:true, w:'24%'}],
      costRows, ['Total costs', money(p.costs)])+
    printSummary([
      ['Billed to parties', money(p.freight)],
      ['Actually collected', money(p.collected)],
      ['Total costs', money(p.costs)],
      [(p.profit>=0?'Net profit':'Net loss'), money(Math.abs(p.profit)), true],
      [(p.actual>=0?'Actual profit':'Actual loss'), money(Math.abs(p.actual)), true]
    ])+
    printSign('Net profit is based on the full amount billed. Actual profit counts only money received.'),
    fileStem('report')
  );
}

/* ------------------------------------------------------------
   DOWNLOAD NAMES
   Export CSV already names its files <what>-<who>-<date>. The
   printed statements now ask the same function for their name, so
   a saved PDF lands beside the CSV of the same record instead of
   whatever the browser tab happened to be called.
   ------------------------------------------------------------ */
const nameSlug = v => String(v||'').replace(/[^a-z0-9]+/gi,'-').toLowerCase();
function fileStem(kind, who){
  return [kind, who ? nameSlug(who) : '', today()].filter(Boolean).join('-');
}

function csvCell(v){ const s = String(v==null?'':v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function download(name, rows){
  const csv = rows.map(r=>r.map(csvCell).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click(); URL.revokeObjectURL(a.href);
  toast('CSV downloaded');
}

         t.material,t.weight,num(t.freight),num(t.advCash),t.fuelQty||'',t.fuelRate||'',num(t.fuelAmt),
         num(t.advance),tripCharges(t),tripDeductions(t),tripFreightNet(t),tripBalance(t),
         num(t.hire),tripStatus(t),stageInfo(tripStage(t)).label,
         t.deliveredAt||'',t.podReceivedAt||'',t.podSubmittedAt||'',
         tripSupplier(t)?supplierName(tripSupplier(t)):'',num(t.hireAdvance),tripSupplierBalance(t),t.notes])));

  if(what==='parties'){

    download(fileStem('expenses')+'.csv', [['Date','Category','Amount','Truck','Paid to','Mode','Details','Trip','On document']]
      .concat(DB.expenses.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>
        [e.date,e.category,num(e.amount),e.truckId?truckName(e.truckId):'',e.paidTo,e.mode,e.note,
         e.tripId?tripLabel(e.tripId):'', e.docId?'Yes':''])));

}

  },

/* ------------------------------------------------------------
   TRUCK PICKER
   The dropdown is still there, but the box above it takes a
   vehicle number straight from the keyboard: type one that
   exists and the truck selects itself.
   ------------------------------------------------------------ */
const plateKey = v => upperTruck(v).replace(/[^A-Z0-9]/g,'');
function findTruckByNumber(v){
  const k = plateKey(v);
  return k ? (DB.trucks.find(t=>plateKey(t.number)===k) || null) : null;
}

/* One field, not two. The box shows the truck you have chosen and takes a
   vehicle number straight from the keyboard; the chevron opens the same
   list the old dropdown held, quick-add included. The id itself lives on a
   hidden input, so everything that reads the field is unchanged. */
function qTruck(id, label, v, extra){
  const t = v ? truckById(v) : null;
  return '<div class="field truck-pick">'+
    '<label for="'+id+'_find">'+label+'</label>'+
    '<div class="combo">'+
      '<input id="'+id+'_find" class="combo-input" type="text" autocomplete="off" role="combobox" '+
        'aria-expanded="false" aria-autocomplete="list" '+
        'placeholder="Type or pick a vehicle number\u2026" value="'+esc(t?t.number:'')+'" '+
        'oninput="comboType(\''+id+'\')" onkeydown="comboKey(\''+id+'\',event)" '+
        'onmousedown="comboOpen(\''+id+'\')" onblur="comboBlur(\''+id+'\')">'+
      '<button type="button" class="combo-chev" tabindex="-1" aria-label="Show every truck" '+
        'onmousedown="event.preventDefault()" onclick="comboToggle(\''+id+'\')">'+
        '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>'+
    '</div>'+
    '<input type="hidden" id="'+id+'" value="'+esc(v||'')+'" '+(extra||'')+'>'+
    '<span class="hint truck-find-note" id="'+id+'_note"></span>'+
  '</div>';
}

/* The list floats above everything, because the modal body scrolls and
   would otherwise cut it off. One panel, lent to whichever field is open. */
let comboOwner = null, comboBox = null, comboIx = 0;
function comboRoot(){
  if(!comboBox){
    comboBox = document.createElement('div');
    comboBox.className = 'combo-list';
    comboBox.setAttribute('role','listbox');
    comboBox.hidden = true;
    document.body.appendChild(comboBox);
  }
  return comboBox;
}
function comboShowing(id){ return comboOwner === id && comboBox && !comboBox.hidden; }
function comboParts(id){
  return {inp:document.getElementById(id+'_find'), hid:document.getElementById(id),
          note:document.getElementById(id+'_note')};
}
/* what the list holds: the fleet, narrowed by whatever has been typed,
   with a way to clear the field and a way to add a truck that is missing */
function comboRows(id){
  const {inp, hid} = comboParts(id);
  const cur = hid ? hid.value : '';
  const chosen = cur ? truckById(cur) : null;
  const typed = inp ? inp.value.trim() : '';
  /* untouched since it was chosen — show the whole fleet, as a dropdown would */
  const q = (chosen && plateKey(typed) === plateKey(chosen.number)) ? '' : typed;
  const key = plateKey(q), text = q.toLowerCase();
  const rows = DB.trucks.filter(t=>!q
      || (key && plateKey(t.number).includes(key))
      || (t.model||'').toLowerCase().includes(text)
      || (t.owner||'').toLowerCase().includes(text))
    .map(t=>({kind:'truck', id:t.id, truck:t}));
  if(cur) rows.unshift({kind:'clear'});
  rows.push({kind:'add'});
  return rows;
}
function comboPaint(id){
  const box = comboRoot(), {hid} = comboParts(id);
  const rows = comboRows(id), cur = hid ? hid.value : '';
  if(comboIx == null || comboIx < 0 || comboIx >= rows.length){
    comboIx = rows.findIndex(r=>r.kind==='truck' && r.id===cur);
    if(comboIx < 0) comboIx = rows.findIndex(r=>r.kind==='truck');
    if(comboIx < 0) comboIx = rows.length-1;
  }
  box.innerHTML =
    (rows.some(r=>r.kind==='truck') ? '' : '<div class="combo-empty">No truck matches that</div>')+
    rows.map((r,i)=>{
      const on = i===comboIx ? ' on' : '';
      const tap = 'onmousedown="event.preventDefault()" ';
      if(r.kind==='clear') return '<button type="button" role="option" class="combo-item combo-clear'+on+'" '+
        tap+'onclick="comboSet(\''+id+'\',\'\')">\u2014 none \u2014</button>';
      if(r.kind==='add') return '<button type="button" role="option" class="combo-item combo-add'+on+'" '+
        tap+'onclick="comboAdd(\''+id+'\')">+ Add New Truck</button>';
      const t = r.truck;
      return '<button type="button" role="option" class="combo-item'+on+(t.id===cur?' sel':'')+'" '+
        tap+'onclick="comboSet(\''+id+'\',\''+t.id+'\')">'+
        '<span class="combo-plate">'+esc(t.number)+'</span>'+
        (t.type==='market'?'<span class="combo-tag">market</span>':'')+
        (t.model?'<span class="combo-sub">'+esc(t.model)+'</span>':'')+
      '</button>';
    }).join('');
  const lit = box.querySelector('.combo-item.on');
  if(lit) lit.scrollIntoView({block:'nearest'});
}
function comboPlace(id){
  const box = comboRoot(), inp = document.getElementById(id+'_find');
  if(!inp) return comboClose();
  const r = inp.getBoundingClientRect();
  box.style.width = Math.round(r.width)+'px';
  box.style.left  = Math.round(r.left)+'px';
  const h = box.offsetHeight || 240;
  let top = r.bottom + 4;
  if(top + h > window.innerHeight - 8) top = (r.top - 4 - h > 8) ? r.top - 4 - h
    : Math.max(8, window.innerHeight - h - 8);
  box.style.top = Math.round(top)+'px';
}
function comboOpen(id, keepIx){
  const box = comboRoot();
  if(!document.getElementById(id+'_find')) return;
  comboOwner = id;
  if(!keepIx) comboIx = null;
  comboPaint(id);
  box.hidden = false;
  comboPlace(id);
  const inp = document.getElementById(id+'_find');
  if(inp) inp.setAttribute('aria-expanded','true');
}
function comboClose(){
  if(comboBox) comboBox.hidden = true;
  if(comboOwner){
    const inp = document.getElementById(comboOwner+'_find');
    if(inp) inp.setAttribute('aria-expanded','false');
  }
  comboOwner = null;
}
function comboToggle(id){
  if(comboShowing(id)) return comboClose();
  const inp = document.getElementById(id+'_find');
  if(inp) inp.focus();
  comboOpen(id);
}
/* a vehicle number typed in full picks its truck without another click */
function comboType(id){
  const {inp, hid} = comboParts(id);
  if(!inp) return;
  const t = findTruckByNumber(inp.value);
  if(hid && t && hid.value !== t.id){
    hid.value = t.id;
    if(typeof afterQuickChange==='function') afterQuickChange(id);
  }
  comboNote(id, t, inp.value);
  comboOpen(id);
}
function comboNote(id, t, typed){
  const {note} = comboParts(id);
  if(!note) return;
  const miss = !t && plateKey(typed||'').length >= 4;
  note.textContent = miss ? 'No truck with that number yet \u2014 pick one from the list or add it' : '';
  note.className = 'hint truck-find-note'+(miss ? ' miss' : '');
}
function comboSet(id, truckId){
  const {inp, hid} = comboParts(id);
  if(!hid) return;
  hid.value = truckId || '';
  const t = truckId ? truckById(truckId) : null;
  if(inp) inp.value = t ? t.number : '';
  comboNote(id, t, '');
  comboClose();
  if(typeof afterQuickChange==='function') afterQuickChange(id);
}
/* the box must never show a number the field is not actually set to */
function comboBlur(id){
  setTimeout(()=>{
    const {inp, hid} = comboParts(id);
    if(!inp || document.activeElement === inp) return;
    if(comboShowing(id)) comboClose();
    const t = hid && hid.value ? truckById(hid.value) : null;
    const typed = inp.value.trim();
    inp.value = t ? t.number : '';
    comboNote(id, t, t ? '' : typed);
  }, 130);
}
function comboAdd(id){
  const inp = document.getElementById(id+'_find');
  const typed = inp ? inp.value.trim() : '';
  comboClose();
  truckForm(null, newId=>comboSet(id, newId), findTruckByNumber(typed) ? '' : typed);
}
function comboKey(id, e){
  const open = comboShowing(id);
  if(e.key==='ArrowDown' || e.key==='ArrowUp'){
    e.preventDefault();
    if(!open) return comboOpen(id);
    const rows = comboRows(id);
    comboIx = ((comboIx||0) + (e.key==='ArrowDown'?1:-1) + rows.length) % rows.length;
    comboOpen(id, true);
    return;
  }
  if(e.key==='Enter' && open){
    e.preventDefault();
    const r = comboRows(id)[comboIx||0];
    if(!r) return;
    if(r.kind==='add') return comboAdd(id);
    comboSet(id, r.kind==='truck' ? r.id : '');
    return;
  }
  if(e.key==='Escape' && open){ e.preventDefault(); comboClose(); }
}
document.addEventListener('mousedown', e=>{
  if(!comboOwner) return;
  if(comboBox && comboBox.contains(e.target)) return;
  if(e.target.closest && e.target.closest('.combo')) return;
  comboClose();
}, true);
window.addEventListener('resize', ()=>{ if(comboOwner) comboPlace(comboOwner); });
window.addEventListener('scroll', e=>{
  if(!comboOwner) return;
  if(comboBox && comboBox.contains(e.target)) return;
  comboPlace(comboOwner);
}, true);

function quickOptions(kind){
  const q = QUICK[kind];
  return [{v:'', t:q.blank}, {v:'__new', t:q.add}].concat(q.opts());
}
function qSelect(id, label, kind, v, extra){
  return fSelect(id, label, quickOptions(kind), v,
    (extra||'')+' onchange="quickPick(\''+id+'\',\''+kind+'\')"');
}
function quickPick(id, kind){
  const el = document.getElementById(id);
  if(!el) return;
  if(el.value !== '__new'){ if(typeof afterQuickChange==='function') afterQuickChange(id); return; }
  el.value = el.dataset.prev || '';
  QUICK[kind].open(newId=>{ refreshQuick(id, kind, newId); });
}
/* rebuild the list and select what was just created */
function refreshQuick(id, kind, newId){
  const el = document.getElementById(id);
  if(!el) return;
  el.innerHTML = quickOptions(kind).map(o=>
    '<option value="'+esc(o.v)+'">'+esc(o.t)+'</option>').join('');
  el.value = newId || '';
  el.dataset.prev = el.value;
  if(typeof afterQuickChange==='function') afterQuickChange(id);
}
/* forms that need to react when a dropdown changes hook in here */
function afterQuickChange(id){
  const el = document.getElementById(id);
  if(el && el.value) clearMissing(id);
  if(/^tx_s\d+$/.test(id) && typeof readTripExpenses==='function') readTripExpenses();
  if(id==='e_mode' || id==='e_shop' || id==='e_truck') toggleShopField();
  if(id==='f_truck' || id==='f_supplier' || id==='f_party') { if(typeof recalcAdvance==='function') recalcAdvance(); }
  if(id==='f_truck' && typeof refreshTripTitle==='function') refreshTripTitle();
}
/* open a creation form on top of whatever is already open */
function stackForm(opts, after){
  modalStack.push({html:$('#modalRoot').innerHTML, vals:snapshotModal(), onOk:modalOnOk, after:after});
  openModal(opts);
}
function alreadyExists(list, field, value, exceptId){
  const v = String(value||'').trim().toLowerCase();
  return (list||[]).find(x=>x.id!==exceptId && String(x[field]||'').trim().toLowerCase()===v);
}

/* ============================================================
   POD IMAGES
   Photos are kept in their own bucket keyed by trip, never inside
   the trip record, so the main data stays small and each trip's
   images sync as their own cloud document.
   ============================================================ */
const POD_MAX = 4;

function podImages(tripId){ return (DB.pods && DB.pods[tripId]) || []; }
function podCount(tripId){ return podImages(tripId).length; }
function podBytes(){
  let n = 0;
  Object.values(DB.pods||{}).forEach(list=>(list||[]).forEach(p=>{ n += (p.data||'').length*0.75; }));
  return n;
}

async function addPodPhoto(tripId, input){
  const files = input.files ? [...input.files] : [];
  input.value = '';
  if(!files.length) return;
  if(lockedStop(DB.trips.find(x=>x.id===tripId))) return;
  const box = document.getElementById('podFiles');
  if(box) box.insertAdjacentHTML('beforeend','<div class="doc-busy" id="podBusy">Shrinking photo…</div>');
  for(const file of files){
    if(podCount(tripId) >= POD_MAX){ toast('Up to '+POD_MAX+' pages per trip'); break; }
    try{
      const data = await shrinkImage(file);
      if(storeUsed() + data.length > STORE_LIMIT){ toast('Storage is nearly full. Remove an old photo first.'); break; }
      const origKey = await keepOriginal(file);
      DB.pods = DB.pods || {};
      DB.pods[tripId] = podImages(tripId).concat([{id:uid(), data, origKey, name:file.name||'POD', addedAt:today()}]);
    }catch(e){ toast(e.message); }
  }
  const busy = document.getElementById('podBusy'); if(busy) busy.remove();

  /* a photo in hand means the POD is back from the driver */
  const t = DB.trips.find(x=>x.id===tripId);
  let noted = '';
  if(t && podCount(tripId) && !t.podReceivedAt){
    t.podReceivedAt = today();
    if(!t.deliveredAt) t.deliveredAt = today();
    noted = ' · marked POD received';
  }
  save();
  toast('POD saved'+noted);
  refreshPodScreen(tripId);
}

function removePodPhoto(tripId, id){
  if(lockedStop(DB.trips.find(x=>x.id===tripId))) return;
  confirmAsk('Remove this POD page?', ()=>{
    dropOriginal((podImages(tripId).find(p=>p.id===id)||{}).origKey);
    DB.pods[tripId] = podImages(tripId).filter(p=>p.id!==id);
    if(!DB.pods[tripId].length) delete DB.pods[tripId];
    save(); refreshPodScreen(tripId); toast('Page removed');
  }, true);
}
function refreshPodScreen(tripId){
  if(tripDraft && tripDraft.id === tripId && repaintTripPane()){ /* refreshed in place */ }
  else if(route==='pod') viewPod();
  else render();
  paintBell();
}
function podFileName(t, i){
  const bits = ['POD', t.lr || fdate(t.date).replace(/ /g,'-'), (t.from||'').split(' (')[0], (t.to||'').split(' (')[0]];
  return bits.filter(Boolean).join('-').replace(/[^A-Za-z0-9-]/g,'')+(i>0?'-'+(i+1):'')+'.jpg';
}
function viewPodImage(tripId, id){
  const t = DB.trips.find(x=>x.id===tripId);
  const list = podImages(tripId);
  const i = list.findIndex(p=>p.id===id);
  const img = list[i]; if(!img) return;
  stackForm({
    title:'POD — '+((t&&t.lr)||'trip'), wide:'xl',
    body:'<img src="'+img.data+'" alt="POD" style="width:100%;border-radius:8px;display:block">'+
      '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">'+
        '<button class="btn btn-primary" onclick="downloadPodPage(\''+tripId+'\',\''+id+'\')">Download this page</button>'+
        (tripLocked(t) ? ''
          : '<button class="btn btn-danger" onclick="closeModal();removePodPhoto(\''+tripId+'\',\''+id+'\')">Remove</button>')+
      '</div>'

function downloadPodPage(tripId, id){
  const t = DB.trips.find(x=>x.id===tripId);
  const list = podImages(tripId);
  const i = list.findIndex(p=>p.id===id);
  if(i<0){ toast('That page is no longer here'); return; }
  saveBest(list[i].origKey, list[i].data, podFileName(t, i));
}
function downloadPod(tripId){
  const t = DB.trips.find(x=>x.id===tripId);
  const list = podImages(tripId);
  if(!list.length){ toast('No POD uploaded for this trip'); return; }
  list.forEach((img,i)=>saveBest(img.origKey, img.data, podFileName(t,i), true));
  toast('Downloading '+plural(list.length,'page')+' at the best quality on file');
}
