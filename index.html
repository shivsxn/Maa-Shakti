/* ============================================================
   TRUCK SUPPLIERS
   The mirror of the party side. Hire on a trip is a debit — what
   you owe goes up. Advances and payments are credits. Every hire
   line is read from the trip itself, never copied, so editing a
   trip or switching it to your own truck corrects the balance
   on its own.
   ============================================================ */
const DEDUCTIONS = ['Commission kept','Shortage','Damage','Late delivery penalty','Other deduction'];

/* which supplier a trip belongs to: the one recorded on it, else the truck's */
function tripSupplier(t){
  if(t.supplierId) return t.supplierId;
  const tr = truckById(t.truckId);
  return (tr && tr.type==='market') ? (tr.supplierId||'') : '';
}
function supplierTrips(sid){
  return DB.trips.filter(t=>num(t.hire)>0 && tripSupplier(t)===sid);
}
function tripSupplierBalance(t){ return num(t.hire) - num(t.hireAdvance); }

function supplierBalance(sid){
  let bal = num((supplierById(sid)||{}).opening);
  supplierTrips(sid).forEach(t=>{ bal += num(t.hire) - num(t.hireAdvance); });
  (DB.supplierLedger||[]).filter(l=>l.supplierId===sid).forEach(l=>{
    bal += l.type==='debit' ? num(l.amount) : -num(l.amount);
  });
  return bal;
}
function allSupplierBalances(){
  const m = {};
  (DB.suppliers||[]).forEach(s=>{ m[s.id] = num(s.opening); });
  DB.trips.forEach(t=>{
    const sid = tripSupplier(t);
    if(num(t.hire)>0 && sid in m) m[sid] += num(t.hire) - num(t.hireAdvance);
  });
  (DB.supplierLedger||[]).forEach(l=>{
    if(l.supplierId in m) m[l.supplierId] += l.type==='debit' ? num(l.amount) : -num(l.amount);
  });
  return m;
}
function totalSupplierPayable(){
  return Object.values(allSupplierBalances()).reduce((s,b)=>s+Math.max(0,b),0);
}
/* hire you owe on trips whose POD has not come back from the driver */
function supplierHeldByPod(sid){
  return supplierTrips(sid).filter(t=>!t.podReceivedAt && !t.podSubmittedAt)
    .reduce((s,t)=>s+Math.max(0, tripSupplierBalance(t)), 0);
}
function totalHeldByPod(){
  return (DB.suppliers||[]).reduce((s,x)=>s+supplierHeldByPod(x.id),0);
}

function supplierLedgerRows(sid){
  const rows = [];
  const s = supplierById(sid);
  if(s && num(s.opening)) rows.push({date:'', label:'Opening balance', ref:'', truck:'N/A',
    debit:num(s.opening)>0?num(s.opening):0, credit:num(s.opening)<0?-num(s.opening):0, kind:'open'});
  supplierTrips(sid).forEach(t=>{
    rows.push({date:t.date, label:'Hire — '+(t.from||'?')+' to '+(t.to||'?'),
      ref:[t.lr?('LR '+t.lr):'', podNoteFor(t)].filter(Boolean).join(' · '),
      truck:truckName(t.truckId), debit:num(t.hire), credit:0, kind:'trip', tripId:t.id});
    if(num(t.hireAdvance)) rows.push({date:t.date, label:'Advance paid at loading',
      ref:t.lr?('LR '+t.lr):'', truck:truckName(t.truckId),
      debit:0, credit:num(t.hireAdvance), kind:'trip', tripId:t.id});
  });
  (DB.supplierLedger||[]).filter(l=>l.supplierId===sid).forEach(l=>{
    rows.push({date:l.date,
      label: l.note || (l.type==='credit' ? 'Payment made to supplier' : (l.reason||'Charge added')),
      ref: [l.reason, l.mode].filter(Boolean).join(' · '),
      truck: l.truckId ? truckName(l.truckId) : 'N/A',
      debit: l.type==='debit' ? num(l.amount) : 0,
      credit: l.type==='credit' ? num(l.amount) : 0,
      kind:'entry', entryId:l.id});
  });
  rows.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  let run = 0;
  rows.forEach(r=>{ run += r.debit - r.credit; r.running = run; });
  return rows;
}
function podNoteFor(t){
  if(t.podSubmittedAt || t.podReceivedAt) return 'POD in hand';
  return t.deliveredAt ? 'POD not received' : 'not delivered yet';
}
/* ============================================================
   DELIVERY AND POD
   A second axis alongside payment. A trip moves in transit →
   delivered → POD received from the driver → POD submitted to
   the party. Each stage carries its own optional date and
   implies the ones before it, so you can jump straight to the
   end without back-filling.
   ============================================================ */
const STAGES = [
  {k:'transit',   label:'In transit',    chip:'chip-grey',  field:null},
  {k:'delivered', label:'Delivered',     chip:'chip-blue',  field:'deliveredAt',   action:'Mark delivered'},
  {k:'received',  label:'POD received',  chip:'chip-amber', field:'podReceivedAt', action:'POD received'},
  {k:'submitted', label:'POD submitted', chip:'chip-green', field:'podSubmittedAt',action:'POD submitted'}
];
const POD_CHASE_DAYS = 7;

function tripStage(t){
  if(t.podSubmittedAt) return 'submitted';
  if(t.podReceivedAt)  return 'received';
  if(t.deliveredAt)    return 'delivered';
  return 'transit';
}
function stageInfo(k){ return STAGES.find(s=>s.k===k) || STAGES[0]; }
function stageChip(t){
  const s = stageInfo(tripStage(t));
  return '<span class="chip '+s.chip+'">'+s.label+'</span>';
}
/* the date a trip reached its current stage */
function stageDate(t){
  const s = stageInfo(tripStage(t));
  return s.field ? t[s.field] : '';
}
function daysSince(d){
  if(!d) return null;
  return Math.round((new Date(today()+'T00:00:00') - new Date(d+'T00:00:00'))/86400000);
}
/* Freight still to come on trips that are delivered but whose POD
   has not gone to the party — money you cannot chase yet. */
function lockedByPod(){
  return DB.trips.filter(t=>{
    const st = tripStage(t);
    return (st==='delivered' || st==='received') && tripBalance(t) > 0;
  }).reduce((s,t)=>s+tripBalance(t),0);
}
function podAlerts(){
  const out = [];
  DB.trips.forEach(t=>{
    const st = tripStage(t);
    if(st==='transit' || st==='submitted') return;
    const since = daysSince(t.podReceivedAt || t.deliveredAt);
    if(since !== null && since >= POD_CHASE_DAYS){
      out.push({tripId:t.id, lr:t.lr, party:partyName(t.partyId),
        route:(t.from||'?')+' → '+(t.to||'?'), stage:st, days:since, amount:tripBalance(t)});
    }
  });
  return out.sort((a,b)=>b.days-a.days);
}

function setStage(id, field, value){
  const t = DB.trips.find(x=>x.id===id); if(!t) return;
  if(lockedStop(t)) return;
  t[field] = value || '';
  /* clearing a stage clears the ones after it, so the chain stays honest */
  const order = ['deliveredAt','podReceivedAt','podSubmittedAt'];
  if(!value){
    const from = order.indexOf(field);
    order.slice(from).forEach(f=>{ t[f]=''; });
  }
  stampCompletion(t);
  save();
  if(tripDraft && tripDraft.id === id && repaintTripPane()){ /* refreshed in place */ }
  else if(route==='pod') viewPod();
  else if(route==='trips') renderTripList();
  else render();
  paintBell();
}
function markStage(id, field){
  if(tripDraft && tripDraft.id === id) saveTripScreen(DB.trips.find(x=>x.id===id), true);
  setStage(id, field, today());
  toast('Updated');
}
/* ============================================================
   TRUCK DOCUMENTS AND EXPIRY ALERTS
   ============================================================ */
const DOC_TYPES = ['Insurance','Pollution Certificate (PUC)','Fitness Certificate','Permit',
  'National Permit','State Permit','Road Tax','Registration Certificate (RC)','Fastag KYC','Other'];
const SOON_DAYS = 30;

function upperTruck(v){ return String(v||'').toUpperCase().replace(/\s+/g,' ').trim(); }

/* Standard Indian plate laid out as UP83 AT 2470.
   Anything that does not fit the pattern is left as typed, just uppercased,
   so BH series, older plates and trailer numbers are never mangled. */
function formatPlate(v){
  const raw = String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const m = raw.match(/^([A-Z]{2})(\d{1,2})([A-Z]{0,3})(\d{1,4})$/);
  if(!m) return upperTruck(v);
  return m[1] + m[2] + (m[3] ? ' ' + m[3] : '') + ' ' + m[4];
}

function migrateTrucks(){
  let changed = false;
  DB.trucks.forEach(t=>{
    const up = formatPlate(t.number);
    if(t.number!==up){ t.number = up; changed = true; }
    if(!t.docs){
      t.docs = [];
      if(t.insurance) t.docs.push({id:uid(), header:'Insurance', expiry:t.insurance, notes:''});
      if(t.fitness)   t.docs.push({id:uid(), header:'Fitness Certificate', expiry:t.fitness, notes:''});
      changed = true;
    }
  });
  if(changed){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const t = new Date(today()+'T00:00:00').getTime();
  const e = new Date(dateStr+'T00:00:00').getTime();
  return Math.round((e-t)/86400000);
}
function docStatus(expiry){
  const d = daysUntil(expiry);
  if(d===null) return {key:'none', label:'No date', chip:'chip-grey', days:null};
  if(d < 0)   return {key:'expired', label:'Expired', chip:'chip-red', days:d};
  if(d <= SOON_DAYS) return {key:'soon', label:'Expiring soon', chip:'chip-amber', days:d};
  return {key:'active', label:'Active', chip:'chip-green', days:d};
}
function docWhen(d){
  if(d===null) return '';
  if(d < 0)  return Math.abs(d)===1 ? 'expired yesterday' : 'expired '+Math.abs(d)+' days ago';
  if(d === 0) return 'expires today';
  if(d === 1) return 'expires tomorrow';
  return 'expires in '+d+' days';
}
/* Alerts are read from the documents themselves, so a renewed date
   simply changes the alert and nothing stale can linger. */
function truckAlerts(){
  const out = [];
  DB.trucks.forEach(t=>(t.docs||[]).forEach(doc=>{
    const st = docStatus(doc.expiry);
    if(st.key==='expired' || st.key==='soon')
      out.push({truckId:t.id, truck:t.number, docId:doc.id, header:doc.header, expiry:doc.expiry, st});
  }));
  return out.sort((a,b)=>(a.st.days||0)-(b.st.days||0));
}
function alertCount(){ return truckAlerts().length + podAlerts().length; }
function urgency(st){
  if(st.key==='expired') return 'Document expired';
  if(st.days<=1)  return 'Final reminder';
  if(st.days<=7)  return 'Urgent';
  if(st.days<=15) return 'Reminder';
  return 'Expiry alert';
}

function paintBell(){

/* ============================================================
   SHOPS
   A shop's debits are read straight from the expenses marked
   "On credit", never copied. So editing, deleting, switching to
   cash or moving an expense to another shop corrects the ledger
   on its own — there is no second copy to fall out of step.
   ============================================================ */
function creditExpenses(shopId){
  return DB.expenses.filter(e=>e.mode==='Credit' && e.shopId===shopId);
}
function shopBalance(id){
  let bal = 0;
  creditExpenses(id).forEach(e=>{ bal += num(e.amount); });
  (DB.shopLedger||[]).filter(l=>l.shopId===id).forEach(l=>{
    bal += l.type==='debit' ? num(l.amount) : -num(l.amount);
  });
  return bal;
}
function allShopBalances(){
  const m = {};
  (DB.shops||[]).forEach(s=>{ m[s.id] = 0; });
  DB.expenses.forEach(e=>{ if(e.mode==='Credit' && e.shopId in m) m[e.shopId] += num(e.amount); });
  (DB.shopLedger||[]).forEach(l=>{
    if(l.shopId in m) m[l.shopId] += l.type==='debit' ? num(l.amount) : -num(l.amount);
  });
  return m;
}
function totalShopPayable(){
  return Object.values(allShopBalances()).reduce((s,b)=>s+Math.max(0,b),0);
}
function shopLedgerRows(id){
  const rows = [];
  creditExpenses(id).forEach(e=>{
    rows.push({date:e.date, label:esc(e.category)+' taken on credit',
      truck: e.truckId ? truckName(e.truckId) : 'N/A',
      ref: [e.paidTo, e.note, e.tripId ? 'Trip '+tripLabel(e.tripId) : ''].filter(Boolean).join(' · '),
      debit:num(e.amount), credit:0, kind:'expense', expenseId:e.id});
  });
  (DB.shopLedger||[]).filter(l=>l.shopId===id).forEach(l=>{
    rows.push({date:l.date,
      label: l.note || (l.type==='credit' ? 'Payment made to shop' : 'Charge added by shop'),
      truck: l.truckId ? truckName(l.truckId) : 'N/A',
      ref: l.mode || '',
      debit: l.type==='debit' ? num(l.amount) : 0,
      credit: l.type==='credit' ? num(l.amount) : 0,
      kind:'entry', entryId:l.id});
  });
  rows.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  let run = 0;
  rows.forEach(r=>{ run += r.debit - r.credit; r.running = run; });
  return rows;
}

/* ============================================================
   ADVANCES — cash plus fuel
   A trip's `advance` field stays the single total that the ledger,
   dues, profit and reports all read, so nothing downstream had to
   change. The parts are kept alongside it.
   ============================================================ */
function tripAdvance(t){
  /* A record restored from an old backup may still carry only the single
     `advance` figure, before the migration has run over it. */
  if(t.advCash===undefined && t.fuelAmt===undefined && t.advance!==undefined) return num(t.advance);
  return num(t.advCash) + num(t.fuelAmt);
}
/* A trip can carry any number of extra lines. A charge adds to what the
   party owes, a deduction takes away from it. Together they turn the
   quoted freight into the amount actually billed. */
function tripLines(t){ return (t && t.lines) || []; }
function tripCharges(t){ return tripLines(t).filter(x=>x.type==='charge').reduce((s,x)=>s+num(x.amount),0); }
function tripDeductions(t){ return tripLines(t).filter(x=>x.type==='deduction').reduce((s,x)=>s+num(x.amount),0); }
/* what the party is actually billed for this trip */
function tripFreightNet(t){ return num(t.freight) + tripCharges(t) - tripDeductions(t); }
/* money already settled against it */
function tripDeducted(t){ return tripAdvance(t); }

/* A payment in the party ledger can be earmarked against particular trips.
   The earmarks live on the payment, so editing or deleting the payment
   puts every trip balance back where it was, with nothing to clean up. */
function allocIndex(){
  const m = {};
  (DB.ledger||[]).forEach(l=>{
    if(l.type!=='credit') return;
    (l.alloc||[]).forEach(a=>{ m[a.tripId] = (m[a.tripId]||0) + num(a.amount); });
  });
  return m;
}
function allocatedTo(tripId, exceptEntry){
  if(!tripId) return 0;
  if(exceptEntry===undefined && IDX.alloc) return IDX.alloc[tripId] || 0;
  let n = 0;
  (DB.ledger||[]).forEach(l=>{
    if(l.type!=='credit' || l.id===exceptEntry) return;
    (l.alloc||[]).forEach(a=>{ if(a.tripId===tripId) n += num(a.amount); });
  });
  return n;
}
/* everything settled against the freight: advance, brokerage, and payments earmarked to it */
function tripSettledTotal(t){ return tripDeducted(t) + allocatedTo(t.id); }
function tripBalance(t){ return tripFreightNet(t) - tripSettledTotal(t); }
/* ------------------------------------------------------------
   COMPLETED TRIPS
   Nothing left to collect and the POD in the party's hands means
   the trip is finished. A finished record should not drift, so it
   marks itself Completed and locks. Both halves are worked out
   from the trip itself rather than stored, so a payment reversed
   or a POD un-submitted opens it again on its own.
   ------------------------------------------------------------ */
function tripCompleted(t){
  return !!(t && t.podSubmittedAt) && tripBalance(t) <= 0;
}
function allowLockedEdits(){ return !!(DB.settings && DB.settings.editLocked); }
function tripLocked(t){ return tripCompleted(t) && !allowLockedEdits(); }
function completedCount(){ return DB.trips.filter(tripCompleted).length; }
/* the day it finished, kept for the record only */
function stampCompletion(t){
  if(!t) return t;
  if(tripCompleted(t)){ if(!t.completedAt) t.completedAt = today(); }
  else if(t.completedAt) t.completedAt = '';
  return t;
}
/* every path that changes a trip asks first */
function lockedStop(t){
  if(!tripLocked(t)) return false;
  toast('This trip is completed and locked. Allow editing in Settings to change it.');
  return true;
}

/* No advance = pending. Some advance = part paid. Nothing left = paid. */
function tripStatus(t){
  const adv = tripSettledTotal(t), fr = tripFreightNet(t);
  if(adv <= 0) return 'pending';
  if(adv >= fr) return 'paid';
  return 'partial';
}
function tripBalanceLabel(t){
  const b = tripBalance(t);
  if(b > 0) return '<span class="money-neg">'+money(b)+'</span>';
  if(b < 0) return '<span class="money-amber">'+money(Math.abs(b))+' over</span>';
  return '<span class="money-pos">Nil</span>';
}
function fuelNote(t){
  if(!num(t.fuelAmt)) return '';
  return num(t.fuelQty) && num(t.fuelRate)
    ? num(t.fuelQty)+' L @ ₹'+num(t.fuelRate)+'/L'
    : 'fuel advance';
}
function migrateAdvances(){
  let changed = false;
  DB.trips.forEach(t=>{
    if(t.advCash===undefined){ t.advCash = num(t.advance); changed = true; }
    if(t.fuelAmt===undefined){ t.fuelAmt = 0; changed = true; }
    if(t.lines===undefined){
      t.lines = [];
      if(num(t.brokerage)) t.lines.push({id:uid(), type:'deduction', label:'Brokerage', amount:num(t.brokerage)});
      t.brokerage = 0;
      changed = true;
    }
    if(t.deliveredAt===undefined){ t.deliveredAt = ''; t.podReceivedAt = ''; t.podSubmittedAt = ''; changed = true; }
    if(t.hireAdvance===undefined){ t.hireAdvance = 0; changed = true; }
    if(t.supplierId===undefined){ t.supplierId = ''; changed = true; }
    const total = tripAdvance(t);
    if(num(t.advance)!==total){ t.advance = total; changed = true; }
    const st = tripStatus(t);
    if(t.status!==st){ t.status = st; changed = true; }
  });
  if(changed){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
}

/* ============================================================
   DRIVER DOCUMENTS
   Photos are shrunk before saving, because a browser only gives
   this app a few megabytes in total. They stay on this device
   (and in your own Drive if sync is on) and go nowhere else.
   ============================================================ */
const DOC_SLOTS = [
  {k:'aadhaarFront', label:'Aadhaar front'},
  {k:'aadhaarBack',  label:'Aadhaar back'},
  {k:'licenceFront', label:'Licence front'}
];
const DOC_MAX_DIM = 1800;      // long edge — enough to read a signed LR or a licence
const DOC_TARGET  = 210*1024;  // aim per photo, before base64 padding
const STORE_LIMIT = 4.6*1024*1024;

let pendingDocs = {};
let pendingDocOrigs = {};

/* ------------------------------------------------------------
   ORIGINALS
   localStorage holds only a few megabytes, so the copy filed with
   a record is always a shrunk one. The untouched upload is kept
   beside it in IndexedDB, which is far roomier, and every download
   reaches for that first — falling back to the shrunk copy only
   when the original is no longer on the device.
   ------------------------------------------------------------ */
const ORIG_DB = 'mvl_originals', ORIG_STORE = 'files';
let origDbPromise = null;
function origDb(){
  if(origDbPromise) return origDbPromise;
  origDbPromise = new Promise((resolve, reject)=>{
    if(!window.indexedDB) return reject(new Error('This browser cannot keep original files.'));
    const req = indexedDB.open(ORIG_DB, 1);
    req.onupgradeneeded = ()=>{
      if(!req.result.objectStoreNames.contains(ORIG_STORE)) req.result.createObjectStore(ORIG_STORE);
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror   = ()=>reject(req.error || new Error('Original file storage is blocked.'));
  }).catch(e=>{ origDbPromise = null; throw e; });
  return origDbPromise;
}
function origTx(mode, fn){
  return origDb().then(db=>new Promise((resolve, reject)=>{
    const tx  = db.transaction(ORIG_STORE, mode);
    const req = fn(tx.objectStore(ORIG_STORE));
    req.onsuccess = ()=>resolve(req.result);
    req.onerror   = ()=>reject(req.error);
  }));
}
/* files it away and hands back the key, or '' if the browser refused */
async function keepOriginal(file){
  if(!file) return '';
  const key = 'o'+uid();
  try{
    await origTx('readwrite', st=>st.put(
      {blob:file, name:file.name||'', type:file.type||'', size:file.size||0, at:today()}, key));
    return key;
  }catch(e){ return ''; }
}
async function readOriginal(key){
  if(!key) return null;
  try{ return (await origTx('readonly', st=>st.get(key))) || null; }
  catch(e){ return null; }
}
function dropOriginal(key){
  if(!key) return;
  origTx('readwrite', st=>st.delete(key)).catch(()=>{});
}
/* every key any record still points at */
function originalKeysInUse(){
  const keys = new Set();
  (DB.drivers||[]).forEach(d=>Object.values(d.origs||{}).forEach(k=>{ if(k) keys.add(k); }));
  Object.values(DB.pods||{}).forEach(list=>(list||[]).forEach(p=>{ if(p.origKey) keys.add(p.origKey); }));
  return keys;
}
/* Photos abandoned in a form that was never saved would sit there for
   ever, so once per start-up anything nothing points at is cleared out. */
async function pruneOriginals(){
  try{
    const all  = await origTx('readonly', st=>st.getAllKeys());
    const used = originalKeysInUse();
    (all||[]).forEach(k=>{ if(!used.has(k)) dropOriginal(k); });
  }catch(e){ /* no store, nothing to tidy */ }
}
function origExt(rec){
  const n = String((rec && rec.name) || '');
  const dot = n.lastIndexOf('.');
  if(dot > 0 && n.length - dot <= 6) return n.slice(dot).toLowerCase();
  return ({'image/png':'.png','image/webp':'.webp','image/heic':'.heic','image/heif':'.heif',
           'image/gif':'.gif','image/tiff':'.tif','application/pdf':'.pdf'})[String((rec&&rec.type)||'').toLowerCase()] || '.jpg';
}
function dataUrlToBlob(u){
  const parts = String(u).split(',');
  const type = (parts[0].match(/data:([^;]+)/) || [,'image/jpeg'])[1];
  const bin  = atob(parts[1] || '');
  const arr  = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type});
}
function saveBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 8000);
}
/* The one download used by every button: original quality when the
   untouched file is still here, the stored copy when it is not. */
async function saveBest(origKey, dataUrl, filename, quiet){
  const rec = await readOriginal(origKey);
  if(rec && rec.blob){
    saveBlob(rec.blob, filename.replace(/\.[A-Za-z0-9]+$/,'') + origExt(rec));
    if(!quiet) toast('Downloaded at original quality');
    return true;
  }
  if(!dataUrl){ if(!quiet) toast('Nothing to download'); return false; }
  saveBlob(dataUrlToBlob(dataUrl), filename);
  if(!quiet) toast('Downloaded');
  return true;
}

function docTotal(){
  let n=0;
  DB.drivers.forEach(d=>DOC_SLOTS.forEach(s=>{ if(d.docs && d.docs[s.k]) n += d.docs[s.k].length*0.75; }));
  return n;
}
function storeUsed(){ try{ return (localStorage.getItem(KEY)||'').length; }catch(e){ return 0; } }
function storePct(){ return Math.min(100, Math.round(storeUsed()/STORE_LIMIT*100)); }
function kb(n){ return Math.round(n/1024)+' KB'; }

/* Shrink on a canvas, stepping quality down until it fits */
function shrinkImage(file){
  return new Promise((resolve, reject)=>{
    if(!/^image\//.test(file.type)) return reject(new Error('That file is not a photo. Use a JPG or PNG.'));
    const fr = new FileReader();
    fr.onerror = ()=>reject(new Error('Could not read that file.'));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('That photo could not be opened.'));
      img.onload = ()=>{
        try{
          const scale = Math.min(1, DOC_MAX_DIM/Math.max(img.width, img.height));
          const cv = document.createElement('canvas');
          cv.width  = Math.round(img.width*scale);
          cv.height = Math.round(img.height*scale);
          const cx = cv.getContext('2d');
          if(!cx || !cv.toDataURL) return resolve(fr.result);   // very old browser: keep as is
          cx.fillStyle = '#fff'; cx.fillRect(0,0,cv.width,cv.height);
          cx.drawImage(img, 0, 0, cv.width, cv.height);
          let q = 0.86, out = cv.toDataURL('image/jpeg', q);
          while(out.length > DOC_TARGET*1.37 && q > 0.5){
            q -= 0.07; out = cv.toDataURL('image/jpeg', q);
          }
          resolve(out);
        }catch(e){ resolve(fr.result); }
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function pickDoc(slot, input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  const tile = document.getElementById('doc_'+slot);
  if(tile) tile.insertAdjacentHTML('beforeend','<div class="doc-busy" id="busy_'+slot+'">Shrinking photo…</div>');
  try{
    const data = await shrinkImage(file);
    const projected = storeUsed() + data.length;
    if(projected > STORE_LIMIT){
      toast('Storage is nearly full. Remove an old photo first.');
    } else {
      pendingDocs[slot] = data;
      pendingDocOrigs[slot] = await keepOriginal(file);
    }
  }catch(e){
    toast(e.message);
  }
  const b = document.getElementById('busy_'+slot); if(b) b.remove();
  paintDocs();
}
function removeDoc(slot){ pendingDocs[slot] = null; pendingDocOrigs[slot] = ''; paintDocs(); }

/* kept for anything that only ever has the stored copy to hand */
function saveImage(dataUrl, filename){
  if(!dataUrl){ toast('Nothing to download'); return; }
  saveBlob(dataUrlToBlob(dataUrl), filename);
  toast('Downloaded');
}
function driverFileName(driver, slot){
  const who = (driver && driver.name ? driver.name : 'driver').replace(/[^A-Za-z0-9]+/g,'-');
  const what = ({aadhaarFront:'aadhaar-front', aadhaarBack:'aadhaar-back', licenceFront:'licence-front'})[slot] || slot;
  return (who+'-'+what).replace(/-+/g,'-').toLowerCase()+'.jpg';
}
function downloadDriverDoc(slot, driverId){
  const d = driverId ? driverById(driverId) : null;
  const data = (d && d.docs && d.docs[slot]) || pendingDocs[slot];
  const key  = (d && d.origs && d.origs[slot]) || pendingDocOrigs[slot];
  saveBest(key, data, driverFileName(d, slot));
}
function downloadAllDriverDocs(driverId){
  const d = driverById(driverId); if(!d || !d.docs) return;
  const have = DOC_SLOTS.filter(s=>d.docs[s.k]);
  if(!have.length){ toast('No documents on file'); return; }
  have.forEach(s=>saveBest((d.origs||{})[s.k], d.docs[s.k], driverFileName(d, s.k), true));
  toast('Downloading '+plural(have.length,'document')+' at the best quality on file');
}

function docTile(slot, label){
  const v = pendingDocs[slot];
  if(v){
    return '<div class="doc filled" id="doc_'+slot+'">'+
      '<div class="doc-label">'+esc(label)+'</div>'+
      '<img class="doc-thumb" src="'+v+'" alt="'+esc(label)+'" onclick="viewDoc(\''+slot+'\',\''+esc(label)+'\')">'+
      '<div class="doc-size">'+kb(v.length*0.75)+'</div>'+
      '<div class="doc-bar">'+
        '<button type="button" onclick="downloadDriverDoc(\''+slot+'\')">Download</button>'+
        '<button type="button" onclick="document.getElementById(\'file_'+slot+'\').click()">Replace</button>'+
        '<button type="button" class="rm" onclick="removeDoc(\''+slot+'\')">Remove</button>'+
      '</div>'+
      '<input type="file" id="file_'+slot+'" accept="image/*" style="display:none" onchange="pickDoc(\''+slot+'\',this)">'+
    '</div>';
  }
  return '<div class="doc" id="doc_'+slot+'">'+
    '<div class="doc-label">'+esc(label)+'</div>'+
    '<div class="doc-drop" onclick="document.getElementById(\'file_'+slot+'\').click()">'+
      '<div class="doc-plus">+</div><div class="doc-hint">Add photo</div></div>'+
    '<input type="file" id="file_'+slot+'" accept="image/*" style="display:none" onchange="pickDoc(\''+slot+'\',this)">'+
  '</div>';
}
function paintDocs(){
  const wrap = document.getElementById('docGrid');
  if(wrap) wrap.innerHTML = DOC_SLOTS.map(s=>docTile(s.k, s.label)).join('');
  const note = document.getElementById('docNote');
  if(note) note.textContent = docCount(pendingDocs)+' of 3 added · '+storePct()+'% of storage used';
}
function docCount(d){ return DOC_SLOTS.filter(s=>d && d[s.k]).length; }

function viewDoc(slot, label){
  const v = pendingDocs[slot] || '';
  if(!v) return;
  const file = (label||'document').replace(/[^A-Za-z0-9]+/g,'-').toLowerCase().replace(/^-|-$/g,'')+'.jpg';
  openModal({
    title: label || 'Document', wide:true,
    body:'<img src="'+v+'" alt="'+esc(label||'')+'" style="width:100%;border-radius:8px;display:block">'+
      '<div style="display:flex;gap:8px;margin-top:12px">'+
        '<button class="btn btn-primary" onclick="saveBest(pendingDocOrigs[\''+slot+'\'], pendingDocs[\''+slot+'\'], \''+file+'\')">Download</button>'+
      '</div>'+
      '<div class="hint" style="margin-top:10px">You get the original file you uploaded whenever it is still on this device.</div>'
  });
}

function allPlaces(){
  const mine = (DB.places||[]);
  const seen = new Set(PLACES.map(x=>x.toLowerCase()));
  const extra = mine.filter(x=>{
    const k=x.toLowerCase();

  });

/* ============================================================

const PRESETS = [
  {k:'month', label:'This month'},
  {k:'last',  label:'Last month'},
  {k:'3m',    label:'3 months'},
  {k:'6m',    label:'6 months'},
  {k:'12m',   label:'12 months'},
  {k:'fy',    label:'Financial year'},
  {k:'all',   label:'All time'}
];
function monthStart(offset){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth()-offset, 1).toISOString().slice(0,10);
}
function rangeFor(k){
  const d = new Date();
  if(k==='month') return [thisMonth()+'-01', today()];
  if(k==='last'){
    const s = monthStart(1);
    return [s, new Date(d.getFullYear(), d.getMonth(), 0).toISOString().slice(0,10)];
  }
  if(k==='3m')  return [monthStart(2), today()];
  if(k==='6m')  return [monthStart(5), today()];
  if(k==='12m') return [monthStart(11), today()];
  if(k==='fy'){
    const y = d.getMonth()>=3 ? d.getFullYear() : d.getFullYear()-1;
    return [y+'-04-01', today()];
  }
  const dates = DB.trips.map(t=>t.date).concat(DB.expenses.map(e=>e.date)).filter(Boolean).sort();
  return [dates[0] || monthStart(5), today()];
}
function setRange(k, target){
  const [f,t] = rangeFor(k);
  sub.from = f; sub.to = t; sub.preset = k;
  rerun(target);
}
function rerun(target){
  (target==='insights' ? viewInsights : viewReports)();
  animateCounts();

/* ============================================================
   CHARTS — hand drawn as SVG so the app stays one offline file
   ============================================================ */
/* Fixed order, never cycled — a series keeps its colour when a filter
   changes how many of them there are. Past eight, fold into Other. */
const SERIES = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)',
                'var(--c5)','var(--c6)','var(--c7)','var(--c8)'];

// Indian short form: 1.2L, 85k — keeps axis labels readable
function shortMoney(n){
  const v = Math.abs(Math.round(num(n)));
  /* 12,500 must read 12.5k, not 13k — axis ticks land on halves */
  const cut = (unit, label) => {
    const r = v/unit;
    return (Math.abs(r - Math.round(r)) < 0.005 ? String(Math.round(r)) : r.toFixed(1)) + label;
  };
  const s = v>=10000000 ? cut(10000000,'Cr')
          : v>=100000   ? cut(100000,'L')
          : v>=1000     ? cut(1000,'k')
          : String(v);
  return (num(n)<0?'-₹':'₹')+s;
}
function monthsBack(n){
  const out=[], d=new Date();
  for(let i=n-1;i>=0;i--){
    const x=new Date(d.getFullYear(), d.getMonth()-i, 1);
    out.push(x.toISOString().slice(0,7));
  }
  return out;
}
function monthLabel(k){
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return M[parseInt(k.slice(5,7),10)-1];
}
function monthlySeries(n){ return seriesFor(monthsBack(n)); }

/* Every month between two dates, so charts follow whatever range is chosen */
function monthsBetween(from, to){
  const out=[];
  let y=parseInt(from.slice(0,4),10), m=parseInt(from.slice(5,7),10);
  const ey=parseInt(to.slice(0,4),10), em=parseInt(to.slice(5,7),10);
  let guard=0;
  while((y<ey || (y===ey && m<=em)) && guard++<400){
    out.push(y+'-'+String(m).padStart(2,'0'));
    m++; if(m>12){ m=1; y++; }
  }
  return out.length? out : [from.slice(0,7)];
}
function seriesFor(keys){
  const multiYear = new Set(keys.map(k=>k.slice(0,4))).size>1;
  return keys.map(k=>{
    const p = pnl(k+'-01', k+'-31');
    return {key:k, label: monthLabel(k)+(multiYear?' '+k.slice(2,4):''),
      freight:p.freight, cost:p.costs, profit:p.profit, trips:p.tripCount};
  });
}
function seriesForRange(from, to){ return seriesFor(monthsBetween(from, to)); }

/* Line chart with two series, drawn left to right on load */
/* Round numbers for the axis: 1, 2, 2.5 or 5 times a power of ten */
function niceStep(rough){
  const p = Math.pow(10, Math.floor(Math.log10(rough || 1)));
  const n = (rough||1) / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}
function lineChart(rows, series, opts={}){
  const W=760, H=opts.height||210, L=58, R=22, T=16, B=38;
  /* The scale is read off every series, and always includes zero, so a
     month that lost money is drawn below the line instead of vanishing. */
  const vals = [];
  rows.forEach(r=>series.forEach(s=>vals.push(num(r[s.key]))));
  const hiRaw = Math.max(0, ...vals);
  const loRaw = Math.min(0, ...vals);
  const step  = niceStep(Math.max(1, hiRaw-loRaw)/4);
  const min   = Math.floor(loRaw/step)*step;
  const max   = Math.max(Math.ceil(hiRaw/step)*step, min+step);
  const dx = rows.length>1 ? (W-L-R)/(rows.length-1) : 0;
  const x = i => L + i*dx;
  const y = v => T + (H-T-B) * (1 - (num(v)-min)/(max-min));
  const zeroY = y(0);
  const uid_ = 'g'+Math.random().toString(36).slice(2,8);
  const plotW = W-L-R;

  let svg = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img">';

  /* a soft wash under the leading series */
  svg += '<defs>';
  series.forEach((s,si)=>{
    if(!s.fill) return;
    svg += '<linearGradient id="'+uid_+si+'" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="'+s.color+'" stop-opacity=".26"/>'+
      '<stop offset="100%" stop-color="'+s.color+'" stop-opacity="0"/></linearGradient>';
  });
  svg += '</defs>';

  /* grid on round numbers, with the zero line picked out */
  const ticks = Math.round((max-min)/step);
  for(let t=0;t<=ticks;t++){
    const v = min + step*t, yy = y(v);
    svg += '<line class="grid-line'+(Math.abs(v)<step/1000?' grid-base':'')+'" x1="'+L+'" y1="'+yy.toFixed(1)+
           '" x2="'+(W-R)+'" y2="'+yy.toFixed(1)+'"/>'+
           '<text class="axis-text" x="'+(L-10)+'" y="'+(yy+3.5).toFixed(1)+'" text-anchor="end">'+shortMoney(v)+'</text>';
  }

  const every = rows.length>13 ? Math.ceil(rows.length/12) : 1;
  rows.forEach((r,i)=>{
    if(i%every && i!==rows.length-1) return;
    const anchor = i===0 ? 'start' : i===rows.length-1 ? 'end' : 'middle';
    svg += '<text class="axis-text" x="'+x(i).toFixed(1)+'" y="'+(H-22)+'" text-anchor="'+anchor+'">'+esc(r.label)+'</text>';
  });

  series.forEach((s,si)=>{
    const pts = rows.map((r,i)=>x(i).toFixed(1)+','+y(r[s.key]).toFixed(1));
    if(s.fill && rows.length>1){
      svg += '<path d="M'+pts.join(' L')+' L'+x(rows.length-1).toFixed(1)+','+zeroY.toFixed(1)+
             ' L'+L+','+zeroY.toFixed(1)+' Z" fill="url(#'+uid_+si+')"/>';
    }
    svg += '<polyline class="'+(s.dash?'series-dashed':'series-line')+'" points="'+pts.join(' ')+
           '" stroke="'+s.color+'" style="animation-delay:'+(si*0.12)+'s"/>';
  });

  /* dots only where they say something: a real figure, or the latest month */
  series.forEach(s=>{
    rows.forEach((r,i)=>{
      if(!num(r[s.key]) && i!==rows.length-1) return;
      svg += '<circle class="series-dot" cx="'+x(i).toFixed(1)+'" cy="'+y(r[s.key]).toFixed(1)+
             '" r="3.6" fill="'+s.color+'"/>';
    });
  });

  /* call out the best month, so the chart says something at a glance */
  const lead = series[0];
  if(lead && rows.length>1){
    let bi = 0;
    rows.forEach((r,i)=>{ if(num(r[lead.key]) > num(rows[bi][lead.key])) bi = i; });
    if(num(rows[bi][lead.key]) > 0){
      const bx = x(bi), by = y(rows[bi][lead.key]);
      const side = bx > W-140 ? -1 : 1;
      svg += '<g class="peak">'+
        '<circle cx="'+bx.toFixed(1)+'" cy="'+by.toFixed(1)+'" r="6.5" fill="none" stroke="'+lead.color+'" stroke-width="1.5" opacity=".55"/>'+
        '<text class="peak-text" x="'+(bx + side*11).toFixed(1)+'" y="'+(by-9).toFixed(1)+
          '" text-anchor="'+(side>0?'start':'end')+'">Best · '+shortMoney(rows[bi][lead.key])+'</text>'+
      '</g>';
    }
  }

  /* hover a month to read every figure for it */
  rows.forEach((r,i)=>{
    const cx = x(i);
    const flip = cx > W - 150;
    const tw = 138, th = 26 + series.length*17;
    const tx = flip ? cx - tw - 10 : cx + 10;
    svg += '<g class="hz">'+
      '<rect x="'+(cx-dx/2).toFixed(1)+'" y="'+T+'" width="'+(dx||plotW).toFixed(1)+'" height="'+(H-T-B)+'" fill="transparent"/>'+
      '<g class="hz-show">'+
        '<line class="hz-line" x1="'+cx.toFixed(1)+'" y1="'+T+'" x2="'+cx.toFixed(1)+'" y2="'+(H-B)+'"/>'+
        series.map(s=>'<circle cx="'+cx.toFixed(1)+'" cy="'+y(r[s.key]).toFixed(1)+'" r="4.6" fill="'+s.color+
          '" stroke="var(--card)" stroke-width="2"/>').join('')+
        '<rect class="hz-box" x="'+tx.toFixed(1)+'" y="'+(T+6)+'" width="'+tw+'" height="'+th+'" rx="8"/>'+
        '<text class="hz-title" x="'+(tx+11)+'" y="'+(T+24)+'">'+esc(r.label)+'</text>'+
        series.map((s,si)=>
          '<text class="hz-key" x="'+(tx+11)+'" y="'+(T+24+17*(si+1))+'">'+esc(s.label)+'</text>'+
          '<text class="hz-val" x="'+(tx+tw-11)+'" y="'+(T+24+17*(si+1))+'" text-anchor="end" fill="'+s.color+'">'+
            shortMoney(r[s.key])+'</text>').join('')+
      '</g></g>';
  });

  svg += '</svg>';

  const legend = '<div class="legend">'+series.map(s=>
    '<span class="legend-item"><span class="legend-key" style="background:'+s.color+'"></span>'+
      esc(s.label)+'</span>').join('')+'</div>';
  return svg + legend;
}

/* Donut with a total in the middle */
function donutChart(items, centreLabel){
  const total = items.reduce((s,i)=>s+num(i.value),0);
  if(!total) return '';
  const S=190, r=68, cx=S/2, cy=S/2, circ=2*Math.PI*r;
  let acc=0;
  let svg='<svg class="chart" viewBox="0 0 '+S+' '+S+'" style="max-width:230px;margin:0 auto" role="img">';
  svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--line-soft)" stroke-width="22"/>';
  svg += '<g transform="rotate(-90 '+cx+' '+cy+')">';
  items.forEach((it,i)=>{
    const frac = num(it.value)/total;
    const len = frac*circ;
    const off = circ - len;
    svg += '<circle class="donut-seg" cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+(it.color||SERIES[i%SERIES.length])+'"'+
      ' stroke-width="22" stroke-dasharray="'+len.toFixed(2)+' '+(circ-len).toFixed(2)+'"'+
      ' style="--circ:'+circ.toFixed(2)+';--off:'+(-acc).toFixed(2)+';animation-delay:'+(i*0.09)+'s">'+
      '<title>'+esc(it.label)+': '+money(it.value)+' ('+Math.round(frac*100)+'%)</title></circle>';
    acc += len;
  });
  svg += '</g>';
  svg += '<text class="donut-hole" x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-size="19" font-weight="600" fill="var(--ink)">'+shortMoney(total)+'</text>'+
         '<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--muted)" letter-spacing="1.2">'+esc((centreLabel||'TOTAL').toUpperCase())+'</text>'+
         '</svg>';
  const legend = '<div style="margin-top:14px">'+items.map((it,i)=>{
    const pct = Math.round(num(it.value)/total*100);
    return '<div style="display:flex;align-items:center;gap:9px;font-size:13px;padding:4px 0">'+
      '<span class="legend-key" style="background:'+(it.color||SERIES[i%SERIES.length])+';height:9px;width:9px;border-radius:50%"></span>'+
      '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(it.label)+'</span>'+
      '<span class="num" style="margin-left:auto;color:var(--muted)">'+money(it.value)+'</span>'+
      '<span class="num" style="width:38px;text-align:right;font-weight:600">'+pct+'%</span></div>';
  }).join('')+'</div>';
  return svg + legend;
}

/* Horizontal bars */
function barList(items, opts={}){
  const max = Math.max(1, ...items.map(i=>Math.abs(num(i.value))));
  return items.map((it,i)=>{
    const pct = Math.abs(num(it.value))/max*100;
    const col = it.color || (opts.color || SERIES[0]);
    const go = it.go ? ' onclick="'+esc(it.go).replace(/&quot;/g,'&#34;')+'" role="button" tabindex="0"'+
      ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();this.click()}"' : '';
    return '<div class="bar-row'+(it.go?' bar-link':'')+'"'+go+'>'+
      '<div class="bar-head"><span class="bar-name">'+esc(it.label)+'</span>'+
        '<span class="bar-val">'+(it.display || money(it.value))+'</span></div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+pct.toFixed(1)+'%;background:'+col+';animation-delay:'+(i*0.06)+'s"></div></div>'+
      (it.note?'<div class="hint" style="margin-top:4px">'+esc(it.note)+'</div>':'')+
    '</div>';
  }).join('');
}

/* Tiny sparkline for the KPI tiles */
function spark(values, color){
  const W=88,H=26,max=Math.max(1,...values.map(Math.abs)),min=Math.min(0,...values);
  const span=(max-min)||1;
  const step=values.length>1?W/(values.length-1):0;
  const pts=values.map((v,i)=>(i*step).toFixed(1)+','+(H-((v-min)/span)*H).toFixed(1));
  return '<svg class="kpi-spark" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" aria-hidden="true">'+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/></svg>';
}

/* KPI tile. Numbers count up once the view settles. */
/* ============================================================
   THE SUMMARY STRIP
   Every list screen used to open on a table. You arrived at a
   thousand cells and had to add them up yourself to learn anything.
   A strip of numbers goes above each one now, built from the same
   card the analysis screens already use, so there is one card in the
   app rather than three that nearly match.

   The numbers are computed from the FILTERED list, not the whole
   book — narrow to one truck and the strip narrows with you, which
   is what makes the filters worth touching.
   ============================================================ */
function summary(cards, cls){
  return '<div class="grid '+(cls||'g4')+' summary rise">'+
    cards.filter(Boolean).map(c=>kpi(c.label, c.value, c)).join('')+'</div>';
}
/* a heading with a count beside it and room for one action */
function sec(title, note, action){
  return '<div class="sec"><span class="sec-h">'+esc(title)+'</span>'+
    (note?'<span class="sec-n">'+note+'</span>':'')+
    (action?'<span class="sec-a">'+action+'</span>':'')+'</div>';
}

function kpi(label, value, opts={}){
  const fmt = opts.fmt||'money';
  /* Render the real figure straight away. The count-up only runs when a
     screen goes through render(); anything drawn on another path — a
     ledger, a refresh after saving — must still show the true number. */
  const shown = fmtBy(fmt, num(value));
  /* A drillable tile hands off to the very filter the list already uses,
     so what opens is the same set the figure was counted from — there is
     no second query to drift out of step. */
  const go = opts.go ? ' onclick="'+esc(opts.go).replace(/&quot;/g,'&#34;')+'" role="button" tabindex="0"'+
      ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();this.click()}"' : '';
  const ic = opts.icon && ICONS[opts.icon]
    ? '<span class="kpi-ic"><svg viewBox="0 0 24 24">'+ICONS[opts.icon]+'</svg></span>' : '';
  return '<div class="kpi'+(opts.go?' kpi-link':'')+
      (opts.tone?' kpi-tone-'+opts.tone:'')+'"'+go+'>'+
    '<div class="kpi-label">'+ic+esc(label)+(opts.go?'<span class="kpi-go">View</span>':'')+'</div>'+
    '<div class="kpi-value'+(opts.tone==='pos'?' money-pos':opts.tone==='neg'?' money-neg':'')+
      '" data-count="'+num(value)+'" data-fmt="'+fmt+'">'+shown+'</div>'+
    '<div class="kpi-foot">'+
      (opts.note?'<span>'+esc(opts.note)+'</span>':'')+
      (opts.trend!=null && isFinite(opts.trend)?'<span class="trend '+(opts.trend>=0?'trend-up':'trend-down')+'">'+
        (opts.trend>=0?'▲':'▼')+' '+Math.abs(Math.round(opts.trend))+'%</span>':'')+
      (opts.spark?spark(opts.spark, opts.sparkColor||'var(--amber)'):'')+
    '</div></div>';
}

function fmtBy(mode, v){
  if(mode==='pct')   return Math.round(v)+'%';
  if(mode==='plain') return Math.round(v).toLocaleString('en-IN');
  if(mode==='one')   return (Math.round(v*10)/10).toLocaleString('en-IN');
  return money(v);
}
/* every screen drawn outside render() ends with this */
function afterDirectRender(){ animateCounts(); paintBell(); clampDates(); }
function animateCounts(){
  const els = document.querySelectorAll('[data-count]');
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  els.forEach(el=>{
    const to = parseFloat(el.dataset.count)||0, mode = el.dataset.fmt||'money';
    if(el.dataset.counted==='1'){ el.textContent = fmtBy(mode,to); return; }
    el.dataset.counted = '1';
    if(still || !window.requestAnimationFrame){ el.textContent = fmtBy(mode,to); return; }
    const t0 = performance.now(), dur = 620;
    (function tick(t){
      const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3);
      el.textContent = fmtBy(mode, to*e);
      if(p<1) requestAnimationFrame(tick); else el.textContent = fmtBy(mode,to);
    })(t0);
  });
}
function pctChange(now, before){
  if(!before) return null;
  return (now-before)/Math.abs(before)*100;
}

function syncReady(){ return FB.state==='on' || FB.state==='syncing'; }
function syncSet(state, message){
  FB.state = state; FB.message = message || '';
  const pill = $('#syncPill'); if(!pill) return;
  if(state==='off'){ pill.hidden = true; return; }
  pill.hidden = false;
  const map = {
    loading:   ['busy', 'Connecting…'],
    signedout: ['',     offlineMode ? 'Offline' : 'Not signed in'],
    syncing:   ['busy', 'Saving…'],
    on:        ['on',   FB.user ? 'Synced' : 'Connected'],
    error:     ['bad',  'Sync problem']
  };
  const [cls, label] = map[state] || ['',''];
  pill.className = 'cloud-pill '+cls;
  pill.innerHTML = '<span class="cloud-dot"></span><span>'+esc(label)+'</span>';
  pill.title = FB.message || label;
  if(route==='settings') viewSettings();
}

async function loadSDK(){
  if(FB.api) return FB.api;
  if(window.__fbSdk){ FB.api = window.__fbSdk; return FB.api; }
  const base = 'https://www.gstatic.com/firebasejs/'+SDK_VER+'/';
  const [app, auth, store] = await Promise.all([
    import(base+'firebase-app.js'),
    import(base+'firebase-auth.js'),
    import(base+'firebase-firestore.js')
  ]);
  FB.api = {...app, ...auth, ...store};
  return FB.api;
}

async function startAuth(){
  if(!FB.cfg){ syncSet('off'); return; }
  try{
    syncSet('loading');
    const api = await loadSDK();
    FB.app  = api.initializeApp(FB.cfg);
    FB.auth = api.getAuth(FB.app);
    /* "Ask every time" keeps the session in memory only, so closing or
       reloading the page signs you out. "Stay signed in" remembers you
       on this device until you sign out yourself. */
    try{
      const mode = FB.keep ? api.browserLocalPersistence : api.inMemoryPersistence;
      if(api.setPersistence && mode) await api.setPersistence(FB.auth, mode);
    }catch(e){}
    try{
      FB.db = api.initializeFirestore(FB.app, {localCache: api.persistentLocalCache
        ? api.persistentLocalCache({tabManager: api.persistentMultipleTabManager && api.persistentMultipleTabManager()})
        : undefined});
    }catch(e){ FB.db = api.getFirestore(FB.app); }
    api.onAuthStateChanged(FB.auth, u=>{
      FB.user = u || null;
      if(u){ hideGate(); afterSignIn(); }
      else { syncSet('signedout'); if(!offlineMode) showGate(); }
    });
  }catch(e){
    syncSet('error', 'Could not reach Firebase. '+(e.message||''));
    showGate();
  }
}

/* ---------- the login screen ---------- */
function showGate(){
  if(!FB.cfg || offlineMode) return;
  const g = $('#authGate'); if(!g) return;
  g.hidden = false;
  paintGate('in');
}
function hideGate(){ const g = $('#authGate'); if(g) g.hidden = true; }
let gateMode = 'in';
function paintGate(mode){
  gateMode = mode || gateMode;
  const g = $('#authGate'); if(!g) return;
  const signup = gateMode==='up';
  g.innerHTML =
  '<div class="gate-card">'+
    '<div class="gate-brand"><div class="brand-badge">MV</div>'+
      '<div><div class="gate-name">'+esc(DB.settings.business||'Maa Vandana Logistics')+'</div>'+
      '<div class="gate-tag">Transport management</div></div></div>'+
    '<h2 class="gate-title">'+(signup?'Create your account':'Sign in to continue')+'</h2>'+
    '<p class="gate-sub">'+(signup
      ? 'Your records are kept in your own Firebase project and reach every device you sign in on.'
      : 'Use the email and password for this business.')+'</p>'+
    '<div class="field"><label for="au_email">Email address</label>'+
      '<input id="au_email" type="email" autocomplete="username" placeholder="you@example.com"></div>'+
    '<div class="field" style="margin-top:11px"><label for="au_pass">Password</label>'+
      '<input id="au_pass" type="password" autocomplete="'+(signup?'new-password':'current-password')+'" '+
      'placeholder="'+(signup?'At least 6 characters':'Your password')+'" onkeydown="if(event.key===\'Enter\')gateSubmit()"></div>'+
    '<div id="gateError" class="gate-error" hidden></div>'+
    '<button class="btn btn-primary gate-go" onclick="gateSubmit()">'+(signup?'Create account':'Sign in')+'</button>'+
    '<button class="btn gate-google" onclick="gateGoogle()">Continue with Google</button>'+
    '<div class="gate-foot">'+
      (signup
        ? 'Already have an account? <a href="#" onclick="event.preventDefault();paintGate(\'in\')">Sign in</a>'
        : 'First time here? <a href="#" onclick="event.preventDefault();paintGate(\'up\')">Create an account</a>'+
          ' · <a href="#" onclick="event.preventDefault();gateReset()">Forgot password</a>')+
    '</div>'+
    '<div class="gate-offline">No internet? '+
      '<a href="#" onclick="event.preventDefault();workOffline()">Work offline on this device</a>'+
      '<div class="hint" style="margin-top:4px">Your records stay on this phone or laptop and go up the next time you sign in.</div>'+
    '</div>'+
  '</div>';
  const f = $('#au_email'); if(f && window.innerWidth>760) f.focus();
}
function gateError(msg){
  const e = $('#gateError'); if(!e) return;
  e.hidden = !msg; e.textContent = msg || '';
}
function friendlyAuth(code, fallback){
  return ({
    'auth/invalid-email':'That email address does not look right.',
    'auth/missing-password':'Enter your password.',
    'auth/weak-password':'Choose a password of at least 6 characters.',
    'auth/email-already-in-use':'That email already has an account. Try signing in instead.',
    'auth/invalid-credential':'Email or password is not correct.',
    'auth/wrong-password':'That password is not correct.',
    'auth/user-not-found':'No account found for that email.',
    'auth/too-many-requests':'Too many attempts. Wait a few minutes and try again.',
    'auth/network-request-failed':'No internet connection. You can keep working offline.',
    'auth/popup-closed-by-user':'The Google window was closed before finishing.',
    'auth/operation-not-allowed':'This sign-in method is switched off in your Firebase project.'
  })[code] || fallback || 'Something went wrong. Please try again.';
}
async function gateSubmit(){
  const email = (val('au_email')||'').trim(), pass = val('au_pass')||'';
  if(!email){ gateError('Enter your email address.'); return; }
  if(!pass){ gateError('Enter your password.'); return; }
  gateError('');
  const btn = $('.gate-go'); if(btn){ btn.disabled = true; btn.textContent = 'Please wait…'; }
  try{
    const api = await loadSDK();
    if(gateMode==='up') await api.createUserWithEmailAndPassword(FB.auth, email, pass);
    else await api.signInWithEmailAndPassword(FB.auth, email, pass);
  }catch(e){
    gateError(friendlyAuth(e.code, e.message));
    if(btn){ btn.disabled = false; btn.textContent = gateMode==='up'?'Create account':'Sign in'; }
  }
}
async function gateGoogle(){
  gateError('');
  try{
    const api = await loadSDK();
    await api.signInWithPopup(FB.auth, new api.GoogleAuthProvider());
  }catch(e){ gateError(friendlyAuth(e.code, e.message)); }
}
async function gateReset(){
  const email = (val('au_email')||'').trim();
  if(!email){ gateError('Type your email above, then press Forgot password.'); return; }
  try{
    const api = await loadSDK();
    await api.sendPasswordResetEmail(FB.auth, email);
    gateError('');
    toast('Password reset link sent to '+email);
  }catch(e){ gateError(friendlyAuth(e.code, e.message)); }
}
let offlineMode = false;
/* Coming back from offline mode, or after signing out. */
async function signInAgain(){
  offlineMode = false;
  if(!FB.cfg){ toast('No Firebase project is configured'); return; }
  if(!FB.auth){ await startAuth(); }      // the library never loaded, try again
  if(FB.auth){ paintGate('in'); showGate(); }
  else { toast('Cannot reach Firebase. Check your internet connection.'); }
}

function workOffline(){
  offlineMode = true;
  hideGate();
  syncSet('signedout', 'Working offline. Sign in from Settings to save to the cloud.');
  toast('Working offline on this device');
}

async function signOutNow(){
  confirmAsk('Sign out? Your records stay in the cloud and come back when you sign in again.', async()=>{
    try{
      if(FB.unsub){ FB.unsub(); FB.unsub = null; }
      const api = await loadSDK();
      await api.signOut(FB.auth);
      offlineMode = false;
      toast('Signed out');
    }catch(e){ toast('Could not sign out: '+e.message); }
  });
}

/* ---------- reading and writing the cloud copy ---------- */
function mainDocRef(){ return FB.api.doc(FB.db, 'users', FB.user.uid, 'app', 'main'); }
function photoDocRef(id){ return FB.api.doc(FB.db, 'users', FB.user.uid, 'photos', id); }
function podDocRef(id){ return FB.api.doc(FB.db, 'users', FB.user.uid, 'pods', id); }

function mainPayload(){
  const copy = JSON.parse(JSON.stringify(DB));
  copy.seeded = true;
  delete copy.pods;              // POD images sync as their own documents
  copy.drivers = (copy.drivers||[]).map(d=>{ const c = {...d}; delete c.docs; return c; });
  copy.updatedAt = DB.updatedAt || new Date().toISOString();
  return copy;
}

async function afterSignIn(){
  try{
    syncSet('syncing');
    const api = FB.api;
    const snap = await api.getDoc(mainDocRef());
    if(snap.exists()){
      const remote = snap.data();
      const localEmpty = DB.trips.length===0 && DB.parties.length===0 &&
                         DB.trucks.length===0 && DB.expenses.length===0;
      const inStep = (remote.updatedAt||'') === (DB.updatedAt||'');
      if(inStep){
        /* already the same copy, nothing to do */
      } else if(localEmpty){
        await applyRemote(remote);          // nothing here to lose
      } else {
        /* Both sides hold records and they differ. Never choose for the
           person — whichever way it went, the other copy would be lost. */
        return askWhichCopy(remote);
      }
    } else {
      await syncPush(true);
      toast('Your records are now in the cloud');
    }
    watchRemote();
    syncSet('on');
  }catch(e){
    syncSet('error', e.message);
    toast('Could not sync: '+e.message);
  }
}

/* live updates from your other device */
function watchRemote(){
  if(FB.unsub) FB.unsub();
  FB.unsub = FB.api.onSnapshot(mainDocRef(), snap=>{
    if(!snap.exists() || FB.applying) return;
    if(snap.metadata && snap.metadata.hasPendingWrites) return;
    const remote = snap.data();
    if((remote.updatedAt||'') > (DB.updatedAt||'')) applyRemote(remote, true);
  }, err=>syncSet('error', err.message));
}

async function loadPods(){
  const out = {};
  try{
    const snaps = await FB.api.getDocs(FB.api.collection(FB.db, 'users', FB.user.uid, 'pods'));
    snaps.forEach(s=>{ const pages = s.data().pages || []; if(pages.length) out[s.id] = pages; });
  }catch(e){}
  return out;
}
async function loadPhotos(){
  const out = {};
  try{
    const snaps = await FB.api.getDocs(FB.api.collection(FB.db, 'users', FB.user.uid, 'photos'));
    snaps.forEach(s=>{ out[s.id] = s.data().docs || {}; });
  }catch(e){}
  return out;
}

async function applyRemote(remote, quiet){
  FB.applying = true;
  const photos = await loadPhotos();
  const pods = await loadPods();
  const merged = Object.assign(JSON.parse(JSON.stringify(BLANK)), remote);
  merged.pods = pods;
  merged.seeded = true;      // a cloud copy is real data, never re-seed over it
  merged.drivers = (merged.drivers||[]).map(d=>({...d, docs: photos[d.id] || {}}));
  DB = merged;
  reindex(); buildPlaceList(); buildDocTypeList();
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){}
  applyBrand(); render();
  FB.applying = false;
  if(quiet) toast('Updated from your other device');
}

let pendingRemote = null;
function askWhichCopy(remote){
  pendingRemote = remote;
  const count = o => (o.trips||[]).length+' trips, '+(o.parties||[]).length+' parties, '+
                     (o.expenses||[]).length+' expenses';
  syncSet('on');
  openModal({
    title:'Two copies found',
    body:'<p style="margin:0 0 14px;font-size:14.5px">The cloud copy and this device do not match. Which should be kept?</p>'+
      '<div class="card card-pad" style="margin-bottom:10px"><div class="stat-label">In the cloud</div>'+
      '<div style="margin-top:5px">'+esc(count(remote))+'</div>'+
      '<div class="hint">Last saved '+(remote.updatedAt?fdate(remote.updatedAt.slice(0,10)):'date unknown')+'</div>'+
      '<button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="useCloudCopy()">Use the cloud copy</button></div>'+
      '<div class="card card-pad"><div class="stat-label">On this device</div>'+
      '<div style="margin-top:5px">'+esc(count(DB))+'</div>'+
      '<div class="hint">Last saved '+(DB.updatedAt?fdate(DB.updatedAt.slice(0,10)):'date unknown')+'</div>'+
      '<button class="btn btn-sm" style="margin-top:10px" onclick="useDeviceCopy()">Keep this device</button></div>'+
      '<div class="note" style="margin-top:12px">Nothing is overwritten until you choose. Download a backup from Settings if you are unsure.</div>'
  });
}
async function useCloudCopy(){
  if(!pendingRemote) return closeModal();
  const r = pendingRemote; pendingRemote = null; closeModal();
  await applyRemote(r); watchRemote(); syncSet('on'); toast('Now using the cloud copy');
}
async function useDeviceCopy(){
  pendingRemote = null; closeModal();
  DB.updatedAt = new Date().toISOString();
  await syncPush(true); watchRemote(); toast('Kept this device and sent it up');
}

async function syncPush(now){
  if(!FB.user || !FB.db) return;
  clearTimeout(FB.pushTimer);
  if(!now){ FB.pushTimer = setTimeout(()=>syncPush(true), 2500); return; }
  try{
    syncSet('syncing');
    const api = FB.api;
    await api.setDoc(mainDocRef(), mainPayload());
    for(const d of (DB.drivers||[])){
      const docs = d.docs || {};
      const stamp = JSON.stringify(Object.keys(docs).sort())+':'+Object.values(docs).reduce((n,v)=>n+(v?v.length:0),0);
      if(FB.lastPhoto[d.id] === stamp) continue;
      await api.setDoc(photoDocRef(d.id), {docs});
      FB.lastPhoto[d.id] = stamp;
    }
    for(const tripId of Object.keys(DB.pods||{})){
      const list = DB.pods[tripId] || [];
      const stamp = list.map(p=>p.id).join(',')+':'+list.reduce((n,p)=>n+(p.data?p.data.length:0),0);
      if(FB.lastPod[tripId] === stamp) continue;
      await api.setDoc(podDocRef(tripId), {pages:list});
      FB.lastPod[tripId] = stamp;
    }
    FB.lastSync = new Date().toISOString();
    localStorage.setItem('mvl_last_sync', FB.lastSync);
    syncSet('on');
  }catch(e){
    syncSet('error', e.message);
  }
}

/* ---------- settings ---------- */
const RULES = "rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /users/{uid}/{document=**} {\n      allow read, write: if request.auth != null && request.auth.uid == uid;\n    }\n  }\n}";

function syncPanel(){
  const s = FB.state;
  const chip = {
    off:'<span class="chip chip-grey">Not set up</span>',
    loading:'<span class="chip chip-amber">Connecting…</span>',
    signedout:'<span class="chip chip-amber">Not signed in</span>',

    on:'<span class="chip chip-green">Signed in</span>',

  }[s] || '';
  const cfg = FB.cfg || {};
  return '<div class="card card-pad" style="margin-bottom:16px">'+
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">'+
      '<h3 class="card-title" style="margin:0">Login and cloud storage</h3>'+chip+'</div>'+
    '<div class="field full" style="margin-bottom:16px"><label>When you open the app</label>'+
      '<div class="seg">'+
        '<input type="radio" name="keepIn" id="keepIn0" value="0"'+(FB.keep?'':' checked')+
          ' onchange="setKeepSignedIn(0)"><label for="keepIn0">Ask for my password</label>'+
        '<input type="radio" name="keepIn" id="keepIn1" value="1"'+(FB.keep?' checked':'')+
          ' onchange="setKeepSignedIn(1)"><label for="keepIn1">Keep me signed in</label>'+
      '</div>'+
      '<span class="hint">'+(FB.keep
        ? 'This device stays signed in until you sign out. Convenient on your own phone.'
        : 'You will type your email and password each time the app opens. Safer on a shared computer.')+
      '</span></div>'+
    (FB.user
      ? '<p class="hint" style="margin:0 0 14px">Signed in as <b>'+esc(FB.user.email||'your account')+'</b>. '+
        'Every change is saved to your Firebase project and reaches your other devices within a few seconds.</p>'+
        (FB.lastSync? '<div class="hint" style="margin-bottom:12px">Last saved '+fdate(FB.lastSync.slice(0,10))+
          ' at '+FB.lastSync.slice(11,16)+'</div>':'')+
        '<div style="display:flex;gap:9px;flex-wrap:wrap">'+
          '<button class="btn" onclick="syncPush(true);toast(\'Saving now\')">Sync now</button>'+
          '<button class="btn btn-danger" onclick="signOutNow()">Sign out</button>'+
        '</div>'
      : '<p class="hint" style="margin:0 0 14px;max-width:600px">'+
        (offlineMode
          ? 'Working offline on this device. Your records are safe here and will go up the moment you sign in.'
          : 'Sign in with your email and your records live in your Firebase project instead of only on this device.')+
        '</p>'+
        '<div style="display:flex;gap:9px;flex-wrap:wrap">'+
          '<button class="btn btn-primary" onclick="signInAgain()">Sign in</button>'+
        '</div>')+
    (FB.message ? '<div class="note" style="margin-top:12px">'+esc(FB.message)+'</div>' : '')+
    '<div class="divide"></div>'+
    '<div class="sec-title" style="margin-top:0">Firebase project</div>'+
    '<p class="hint" style="margin:0 0 12px;max-width:600px">This app is already pointed at your project '+
      '<b>'+esc((FB.cfg&&FB.cfg.projectId)||'—')+'</b>, so there is nothing to set up on a new phone or laptop. '+
      'Just open the web address and sign in.</p>'+
    '<details style="margin-bottom:12px"><summary class="hint" style="cursor:pointer">Use a different project</summary>'+
      '<div class="field" style="margin-top:10px"><label for="fb_cfg">Config from Firebase</label>'+
      '<textarea id="fb_cfg" style="min-height:110px;font-family:var(--mono);font-size:12.5px" '+
      'placeholder=\'{ "apiKey": "…", "projectId": "…" }\'></textarea>'+
      '<span class="hint">Only needed if you move to another Firebase project.</span></div>'+
      '<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:10px">'+
        '<button class="btn" onclick="saveFbConfig()">Save and reconnect</button>'+
        '<button class="btn btn-danger" onclick="clearFbConfig()">Reset to the built-in project</button>'+
      '</div>'+
    '</details>'+
    '<div class="divide"></div>'+
    '<div class="sec-title" style="margin-top:0">Security rules in Firestore</div>'+
    '<p class="hint" style="margin:0 0 10px">Already published. Keep a copy in case you ever rebuild the project.</p>'+
    '<pre class="rules">'+esc(RULES)+'</pre>'+
    '<button class="btn btn-sm" onclick="copyRules()">Copy rules</button>'+
  '</div>';
}
function setKeepSignedIn(v){
  FB.keep = !!Number(v);
  localStorage.setItem('mvl_keep_signed_in', FB.keep?'1':'0');
  viewSettings();
  toast(FB.keep ? 'This device will stay signed in' : 'You will be asked for your password each time');
}

function saveFbConfig(){
  const raw = (val('fb_cfg')||'').trim();
  if(!raw){ toast('Paste the config from Firebase first'); return; }
  let cfg = null;
  try{
    const cleaned = raw.replace(/^[\s\S]*?firebaseConfig\s*=\s*/,'').replace(/;\s*$/,'')
      .replace(/([{,]\s*)([A-Za-z0-9_]+)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,(\s*[}\]])/g,'$1');
    cfg = JSON.parse(cleaned);
  }catch(e){ toast('That does not look like a Firebase config. Copy the whole block including the braces.'); return; }
  if(!cfg.apiKey || !cfg.projectId){ toast('The config needs at least apiKey and projectId'); return; }
  FB.cfg = cfg;
  localStorage.setItem('mvl_fb_cfg', JSON.stringify(cfg));
  toast('Saved. Connecting to Firebase…');
  location.reload();
}
function clearFbConfig(){
  confirmAsk('Go back to the built-in project? Your records stay on this device and in the cloud.', ()=>{
    localStorage.removeItem('mvl_fb_cfg');
    localStorage.removeItem('mvl_last_sync');
    location.reload();
  }, true);
}
function copyRules(){
  if(navigator.clipboard) navigator.clipboard.writeText(RULES).then(()=>toast('Rules copied'), ()=>toast('Select the text and copy it'));
  else toast('Select the text above and copy it');
}

reindex();
buildPlaceList();
buildDocTypeList();
migrateAdvances();
migrateTrucks();
migrateAssignments();
/* Sample data is only ever created on a device with no cloud project, and
   only on the very first run. Otherwise a blank device could seed itself and
   then overwrite real records in the cloud. Load it by hand from Settings. */
if(!DB.seeded && DB.trips.length===0 && !FB.cfg){ seed(); save(); }
if(!DB.seeded){ DB.seeded = true; try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
applyTheme(currentTheme());
applyBrand();
render();
startAuth();
buildDocTypeList();
setTimeout(pruneOriginals, 3000);

window.addEventListener('online', ()=>{ if(syncReady()) syncPush(true); });
